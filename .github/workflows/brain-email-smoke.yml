name: Brain Email Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-smoke:
    runs-on: ubuntu-latest
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      BRAIN_ALERT_TO: ${{ secrets.BRAIN_ALERT_TO }}
      BRAIN_EMAIL_INBOX_ID: omar-enserat1985@agentmail.to
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret configuration without exposing values
        run: |
          test -n "$AGENTMAIL_API_KEY"
          test -n "$BRAIN_ALERT_TO"
          test -n "$BRAIN_EMAIL_INBOX_ID"
          echo "EMAIL_CONFIGURATION=READY"

      - name: Send controlled smoke email
        run: |
          python - <<'PY'
          import os
          from brain_v12.brain.email_gateway import AgentMailGateway

          gateway = AgentMailGateway(
              api_key=os.environ["AGENTMAIL_API_KEY"],
              inbox_id=os.environ["BRAIN_EMAIL_INBOX_ID"],
          )
          result = gateway.send(
              to=os.environ["BRAIN_ALERT_TO"],
              subject="Brain CI — email smoke verified",
              text=(
                  "Brain CI email smoke test completed.\\n\\n"
                  "This message proves the configured AgentMail gateway can "
                  "send through the Brain email adapter.\\n"
                  "Secrets are not included in source code or logs."
              ),
          )
          print("EMAIL_SEND_VERIFIED=1")
          print("MESSAGE_ID_PRESENT=", bool(result.message_id))
          print("THREAD_ID_PRESENT=", bool(result.thread_id))
          PY
