name: Brain Cloud Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/omarenserat1980/mysimpleproject-brain-cloud

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Brain Cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish image reference
        run: |
          echo "Brain Cloud image:"
          echo "${IMAGE_NAME}:${GITHUB_SHA}"
