name: Brain Capability Fabric

on:
  push:
    paths:
      - "brain_v12/brain/capability_fabric.py"
      - "brain_v12/brain/execution_verifier.py"
      - "brain_v12/brain/health_probe.py"
      - "brain_v12/brain/capability_catalog.py"
      - "brain_v12/brain/autonomy_policy.py"
      - "brain_v12/business/commercial_execution_gate.py"
      - "brain_v12/tests/test_commercial_execution_gate.py"
      - "brain_v12/brain/master_verification_gate.py"
      - "brain_v12/brain/verification_policies.py"
      - "brain_v12/tests/test_capability_fabric.py"
      - "brain_v12/tests/test_capability_health_integration.py"
      - "brain_v12/tests/test_health_probe.py"
      - "brain_v12/tests/test_capability_catalog.py"
      - "brain_v12/tests/test_execution_verifier.py"
      - "brain_v12/tests/test_artifact_verification.py"
      - "brain_v12/tests/test_master_verification_gate.py"
      - "brain_v12/tests/test_verification_policies.py"
      - "brain_v12/docs/BRAIN_CAPABILITY_FABRIC.md"
      - ".github/workflows/brain-capability-fabric.yml"
  workflow_dispatch:

concurrency:
  group: brain-brain-capability-fabric-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q brain_v12/brain/capability_fabric.py brain_v12/brain/execution_verifier.py brain_v12/brain/health_probe.py brain_v12/brain/capability_catalog.py brain_v12/brain/autonomy_policy.py brain_v12/business/commercial_execution_gate.py brain_v12/brain/master_verification_gate.py brain_v12/brain/verification_policies.py
      - name: Unit tests
        run: python -m unittest -v brain_v12.tests.test_capability_fabric brain_v12.tests.test_capability_health_integration brain_v12.tests.test_health_probe brain_v12.tests.test_capability_catalog brain_v12.tests.test_execution_verifier brain_v12.tests.test_artifact_verification brain_v12.tests.test_master_verification_gate brain_v12.tests.test_verification_policies
