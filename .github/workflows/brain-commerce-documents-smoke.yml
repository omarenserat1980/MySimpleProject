name: BRAIN Commerce Documents Smoke

on:
  push:
    branches: [feat/brain-commerce-invoice-receipt]
    paths:
      - 'brain_v12/brain/commerce_documents.py'
      - 'brain_v12/tests/test_commerce_documents.py'
      - 'brain_v12/brain/commerce_api.py'
      - '.github/workflows/brain-commerce-documents-smoke.yml'
  pull_request:
    paths:
      - 'brain_v12/brain/commerce_documents.py'
      - 'brain_v12/tests/test_commerce_documents.py'
      - 'brain_v12/brain/commerce_api.py'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest brain_v12.tests.test_commerce_documents -v
