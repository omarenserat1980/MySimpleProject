name: Brain Factory - Single Production Path

on:
  push:
    branches: [main]
    paths:
      - "cloud/last_light_movie.py"
      - "brain_v12/brain/open_source_runtime.py"
      - "brain_v12/brain/autonomy_control_plane.py"
      - ".github/workflows/last-light-no-pay.yml"
  workflow_dispatch:

concurrency:
  group: brain-factory-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check Pillow

      - name: Initialize Brain control-plane job
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.autonomy_control_plane import ControlPlane
          cp=ControlPlane("brain6_artifacts/control_plane")
          job=cp.create("film:last-light",["probe","plan","render","verify","manifest"],max_attempts=3,budget=5)
          job=cp.start_attempt(job)
          Path("brain6_artifacts/control_plane_job.json").write_text(json.dumps(job,ensure_ascii=False,indent=2))
          print(json.dumps(job,ensure_ascii=False))
          PY

      - name: Probe optional runtime
        run: python brain_v12/brain/open_source_runtime.py

      - name: Checkpoint probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.autonomy_control_plane import ControlPlane
          cp=ControlPlane("brain6_artifacts/control_plane")
          job=json.loads(Path("brain6_artifacts/control_plane_job.json").read_text())
          job=cp.checkpoint(job,1,{"runtime_probe":"completed"})
          Path("brain6_artifacts/control_plane_job.json").write_text(json.dumps(job,ensure_ascii=False,indent=2))
          PY

      - name: Select available runtime backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.open_source_orchestrator import plan
          status=json.loads(Path("brain6_artifacts/open_source_runtime_status.json").read_text())
          result={"tasks":plan(["local_reasoning","video_generation","semantic_memory"],status),
                  "fallback":"local_python_ffmpeg_renderer"}
          Path("brain6_artifacts/film_runtime_plan.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY

      - name: Render film
        run: |
          rm -rf /tmp/last-light
          python cloud/last_light_movie.py --output /tmp/last-light --seconds 12 --fps 12

      - name: Verify MP4 and streams
        run: |
          test -s /tmp/last-light/last_light_city.mp4
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_type,codec_name,width,height             -of json /tmp/last-light/last_light_city.mp4 | tee /tmp/last-light/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/last-light/ffprobe.json").read_text())
          streams=data.get("streams",[])
          assert any(s.get("codec_type")=="video" for s in streams), "missing video stream"
          assert any(s.get("codec_type")=="audio" for s in streams), "missing audio stream"
          fmt=data.get("format",{})
          assert float(fmt.get("duration",0))>0, "invalid duration"
          assert int(fmt.get("size",0))>0, "empty MP4"
          Path("/tmp/last-light/VERIFIED_COMPLETED").write_text("verified\n")
          PY

      - name: Checkpoint verified production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.autonomy_control_plane import ControlPlane
          cp=ControlPlane("brain6_artifacts/control_plane")
          job=json.loads(Path("brain6_artifacts/control_plane_job.json").read_text())
          job=cp.checkpoint(job,4,{"mp4_verified":True})
          Path("brain6_artifacts/control_plane_job.json").write_text(json.dumps(job,ensure_ascii=False,indent=2))
          PY

      - name: Build production manifest
        run: |
          cat > /tmp/last-light/film_manifest.json <<'JSON'
          {
            "title": "آخر ضوء في المدينة",
            "status": "VERIFIED_COMPLETED",
            "renderer": "Python/Pillow + FFmpeg",
            "resolution": "16:9",
            "source": "Brain Factory - Single Production Path",
            "control_plane": "enabled"
          }
          JSON

      - name: Finalize control-plane job
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.autonomy_control_plane import ControlPlane
          cp=ControlPlane("brain6_artifacts/control_plane")
          job=json.loads(Path("brain6_artifacts/control_plane_job.json").read_text())
          job=cp.checkpoint(job,5,{"manifest":"completed"})
          Path("brain6_artifacts/control_plane_job.json").write_text(json.dumps(job,ensure_ascii=False,indent=2))
          PY

      - name: Upload verified production
        uses: actions/upload-artifact@v4
        with:
          name: brain-factory-last-light-verified
          path: |
            /tmp/last-light/last_light_city.mp4
            /tmp/last-light/ffprobe.json
            /tmp/last-light/film_manifest.json
            /tmp/last-light/VERIFIED_COMPLETED
            brain6_artifacts/open_source_runtime_status.json
            brain6_artifacts/film_runtime_plan.json
            brain6_artifacts/control_plane_job.json
            brain6_artifacts/control_plane/events.jsonl
          if-no-files-found: error
