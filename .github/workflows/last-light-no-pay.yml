name: Last Light In The City - No Pay Production

on:
  push:
    branches: [main]
    paths:
      - "cloud/last_light_movie.py"
      - ".github/workflows/last-light-no-pay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check Pillow
      - name: Render 16:9 film locally
        run: python cloud/last_light_movie.py --output /tmp/last-light --seconds 12 --fps 12
      - name: Verify final MP4
        run: |
          test -s /tmp/last-light/last_light_city.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json /tmp/last-light/last_light_city.mp4
      - name: Upload film artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-light-in-the-city-mp4
          path: /tmp/last-light/last_light_city.mp4
          if-no-files-found: error
