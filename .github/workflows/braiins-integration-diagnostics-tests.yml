name: Braiins Integration Diagnostics Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'brain_v12/business/braiins_integration_diagnostics.py'
      - 'brain_v12/business/test_braiins_integration_diagnostics.py'
      - '.github/workflows/braiins-integration-diagnostics-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  braiins-diagnostics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile diagnostics and tests
        run: |
          python -m py_compile \
            brain_v12/business/braiins_integration_diagnostics.py \
            brain_v12/business/test_braiins_integration_diagnostics.py
      - name: Run read-only diagnostics tests
        run: python -m pytest -q brain_v12/business/test_braiins_integration_diagnostics.py
