name: Brain Cloud Runtime Build

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'brain_v7/**'
      - '.github/workflows/cloud-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile cloud/brain_cloud.py
      - name: Validate Dockerfile
        run: test -s cloud/Dockerfile
      - name: Validate compose
        run: docker compose -f cloud/docker-compose.yml config
      - name: Install Brain Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r brain_v7/requirements.txt
          python -m pip install --disable-pip-version-check -r cloud/requirements.txt
      - name: Prepare CI runtime state
        run: mkdir -p "$GITHUB_WORKSPACE/.brain_state"
      - name: Set CI runtime paths
        run: |
          echo "BRAIN_STATE_DIR=$GITHUB_WORKSPACE/.brain_state" >> "$GITHUB_ENV"
          echo "FACTORY_OUTPUT_DIR=$GITHUB_WORKSPACE/cinematic_output" >> "$GITHUB_ENV"
      - name: Validate factory and control plane imports
        env:
          PYTHONPATH: .
        run: python -c "import brain_v7.braincore_v2.background_factory_worker; import cloud.goal_engine; import cloud.api_server"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Brain control plane tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q cloud/test_api_server.py
      - name: Compile all Brain cloud code
        run: python -m compileall -q cloud brain_v7
      - name: Dependency audit
        run: python -m pip install --disable-pip-version-check pip-audit && python -m pip_audit -r brain_v7/requirements.txt
      - name: Build cloud runtime image
        run: docker build --pull -f cloud/Dockerfile -t brain-cloud-ci:latest .
      - name: Runtime container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name brain-cloud-ci \\
            -p 18000:8000 \\
            -e BRAIN_GOAL_EXECUTE=0 \\
            -e BRAIN_CONTROL_TOKEN=ci-test-token \\
            -e FACTORY_ONE_SHOT=1 \\
            -e FACTORY_ALLOW_LOCAL_FALLBACK=1 \\
            -e FACTORY_ALLOW_PRODUCTION=0 \\
            -e BRAIN_CLOUD_SKIP_FACTORY=1 \\
            brain-cloud-ci:latest
          cleanup() { docker logs brain-cloud-ci || true; docker stop brain-cloud-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null; then
              curl -fsS http://127.0.0.1:18000/readyz >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Runtime container did not become healthy"
          exit 1
