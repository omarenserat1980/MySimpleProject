name: Brain AI Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'brain_v12/brain/**'
      - 'brain_v12/github_control_plane.py'
      - 'brain_v12/brain/brain_ai_api.py'
      - 'brain_v12/app.py'
      - 'brain_v12/tests/test_brain_ai*.py'
      - 'brain_v12/tests/test_windows_server_network_contract.py'
      - 'brain_v12/tests/test_windows_native_executor.py'
      - 'brain_v12/tests/test_windows_native_gateway.py'
      - 'brain_v12/brain/windows_real_boot_qemu_adapter.py'
      - 'brain_v12/tests/test_windows_real_boot_qemu_adapter.py'
      - 'brain_v12/tests/test_chatgpt_tool_bridge.py'
      - 'brain_v12/tests/test_chatgpt_host_gateway.py'
      - 'brain_v12/tests/test_chat_session_api.py'
      - 'brain_v12/tests/test_autonomous_supervisor.py'
      - 'brain_v12/tests/test_streaming_api.py'
      - 'brain_v12/tests/test_model_providers.py'
      - 'brain_v12/tests/test_model_router_providers.py'
      - 'brain_v12/tests/test_honda_cloud_components.py'
      - 'docs/BRAIN_AI_GEMINI_LIKE_ARCHITECTURE.md'
      - '.github/workflows/brain-ai-core.yml'
  push:
    branches: [main]
    paths:
      - 'brain_v12/brain/**'
      - 'brain_v12/github_control_plane.py'
      - 'brain_v12/brain/brain_ai_api.py'
      - 'brain_v12/app.py'
      - 'brain_v12/tests/test_brain_ai*.py'
      - 'brain_v12/tests/test_windows_server_network_contract.py'
      - 'brain_v12/tests/test_windows_native_executor.py'
      - 'brain_v12/tests/test_windows_native_gateway.py'
      - 'brain_v12/tests/test_chatgpt_tool_bridge.py'
      - 'brain_v12/tests/test_chatgpt_host_gateway.py'
      - 'brain_v12/tests/test_chat_session_api.py'
      - 'brain_v12/tests/test_autonomous_supervisor.py'
      - 'brain_v12/tests/test_streaming_api.py'
      - 'brain_v12/tests/test_model_providers.py'
      - 'brain_v12/tests/test_model_router_providers.py'
      - 'docs/BRAIN_AI_GEMINI_LIKE_ARCHITECTURE.md'
      - '.github/workflows/brain-ai-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Brain AI test dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s brain_v12/tests -p 'test_brain_ai*.py' -v
      - run: python -m unittest brain_v12.tests.test_success_bot -v
      - name: Run Windows Server network trust contract tests
        run: python -m unittest brain_v12.tests.test_windows_server_network_contract -v
      - name: Run native Windows executor contract tests
        run: python -m unittest brain_v12.tests.test_windows_native_executor brain_v12.tests.test_windows_native_gateway -v
      - name: Run Windows real-boot QEMU adapter regression tests
        run: python -m unittest brain_v12.tests.test_windows_real_boot_qemu_adapter -v
      - name: Run Supervisor solution and verification tests
        run: python -m unittest brain_v12.tests.test_problem_solver brain_v12.brain.test_solution_engine -v
      - run: python -m unittest brain_v12.tests.test_chatgpt_tool_bridge brain_v12.tests.test_chatgpt_host_gateway brain_v12.tests.test_chat_session_api brain_v12.tests.test_autonomous_supervisor brain_v12.tests.test_streaming_api brain_v12.tests.test_model_providers brain_v12.tests.test_model_router_providers -v
      - name: Run Honda cloud component safety tests
        run: python -m unittest brain_v12.tests.test_honda_cloud_components -v
