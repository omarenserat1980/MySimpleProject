name: Brain Mining Evidence Validation Test

on:
  pull_request:
    paths:
      - "brain_v12/brain/brain_owned_mining_contract.py"
      - "brain_v12/tests/test_mining_evidence_validation.py"
      - ".github/workflows/brain-mining-evidence-validation-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mining-evidence-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic evidence validation tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest brain_v12.tests.test_mining_evidence_validation -v
