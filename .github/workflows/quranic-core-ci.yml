name: quranic-core-ci

on:
  push:
    branches: [main, feat/quranic-memory-paths-safe-integration-20261011]
    paths:
      - "brain_v12/brain/quranic_core/**"
      - "brain_v12/test_quranic_*.py"
      - "tools/verify_quranic_memory_paths.py"
      - ".github/workflows/quranic-core-ci.yml"
  pull_request:
    paths:
      - "brain_v12/brain/quranic_core/**"
      - "brain_v12/test_quranic_*.py"
      - "tools/verify_quranic_memory_paths.py"
      - ".github/workflows/quranic-core-ci.yml"

concurrency:
  group: quranic-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: brain_v12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx
      - name: Run Quranic Core tests
        run: python -m pytest brain_v12/test_quranic_core.py brain_v12/test_quranic_core_adapters.py brain_v12/test_quranic_orchestrator.py brain_v12/test_quranic_provenance.py brain_v12/test_quranic_graph_publication.py brain_v12/test_quranic_research_packet.py brain_v12/test_quranic_memory_guidance.py -q
      - name: Run memory path smoke check
        run: python tools/verify_quranic_memory_paths.py
