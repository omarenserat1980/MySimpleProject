name: Brain Open Source Runtime - Safe Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */12 * * *"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/open_source_runtime.py"
      - "brain_v12/brain/open_source_adapters.py"
      - "brain_v12/brain/open_source_orchestrator.py"
      - "brain_v12/tests/test_open_source_runtime.py"
      - "brain_v12/tests/test_open_source_orchestrator.py"
      - ".github/workflows/brain-open-source-runtime.yml"

concurrency:
  group: brain-open-source-runtime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRAIN_OSS_AUTOSTART: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run runtime safety tests
        run: python -m unittest discover -s brain_v12/tests -p 'test_open_source_*.py' -v
      - name: Probe optional runtime
        run: python brain_v12/brain/open_source_runtime.py
      - name: Validate safe policy
        run: |
          python - <<'PY'
          import json
          d=json.load(open("brain6_artifacts/open_source_runtime_status.json",encoding="utf-8"))
          assert d["autostart_enabled"] is False
          assert d["policy"]["download_models"] is False
          assert d["policy"]["core_brain_requires_oss"] is False
          print("Safe runtime policy validated.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brain-open-source-runtime-status
          path: brain6_artifacts/open_source_runtime_status.json
          retention-days: 30
