name: Brain 6 - Opportunity Factory

on:
  workflow_dispatch:
    inputs:
      live_search:
        description: "Run live public opportunity discovery"
        required: true
        type: boolean
        default: true
      execute_deliverables:
        description: "Build and validate local deliverable catalog"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "15 */6 * * *"
  push:
    paths:
      - "brain_v7/braincore_v2/revenue_engine.py"
      - "brain_v7/braincore_v2/self_executable_opportunities.py"
      - "brain_v7/braincore_v2/api_executable_opportunities.py"
      - "brain_v7/braincore_v2/revenue_target_engine.py"
      - "brain_v7/braincore_v2/opportunity_intake.py"
      - "brain_v12/brain/income_engine.py"
      - "brain_v12/brain/live_opportunity_researcher.py"
      - ".github/scripts/run_opportunity_factory.py"
      - ".github/workflows/brain6-opportunity-factory.yml"

permissions:
  contents: read

concurrency:
  group: brain6-opportunity-factory
  cancel-in-progress: false

jobs:
  discover-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      FACTORY_REQUIRE_REAL_MEDIA: "1"
      LIVE_SEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.live_search || 'true' }}
      EXECUTE_DELIVERABLES: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_deliverables || 'true' }}
      OPPORTUNITY_MAX_AGE_HOURS: "72"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile opportunity system
        run: |
          python -m py_compile             .github/scripts/run_opportunity_factory.py             brain_v7/braincore_v2/revenue_engine.py             brain_v7/braincore_v2/self_executable_opportunities.py             brain_v7/braincore_v2/api_executable_opportunities.py             brain_v7/braincore_v2/revenue_target_engine.py             brain_v7/braincore_v2/opportunity_intake.py             brain_v7/braincore_v2/financial_intelligence.py             brain_v12/brain/income_engine.py             brain_v12/brain/live_opportunity_researcher.py             brain_v12/brain/memory.py

      - name: Run opportunity regression tests
        run: |
          python -m pytest -q             brain_v12/tests/test_income_engine.py             brain_v12/tests/test_income_lifecycle.py

      - name: Run live opportunity factory
        run: python .github/scripts/run_opportunity_factory.py

      - name: Validate generated evidence artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "opportunity_catalog.json",
              "live_discovery.json",
              "lifecycle_refresh.json",
              "opportunity_report.json",
          ]
          root = Path("brain6_artifacts")
          for name in required:
              path = root / name
              assert path.is_file(), f"missing artifact: {name}"
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"invalid JSON object: {name}"

          report = json.loads((root / "opportunity_report.json").read_text(encoding="utf-8"))
          snapshot = report["snapshot"]
          assert float(snapshot.get("verified_revenue_jod", 0) or 0) >= 0
          print("Brain 6 artifact validation: PASS")
          PY

      - name: Upload opportunity factory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brain6-opportunity-factory
          path: brain6_artifacts/
          retention-days: 30
