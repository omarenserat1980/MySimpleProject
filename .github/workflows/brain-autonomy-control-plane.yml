name: Brain Autonomy Control Plane - Verify

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/autonomy_control_plane.py"
      - "brain_v12/tests/test_autonomy_control_plane.py"
      - ".github/workflows/brain-autonomy-control-plane.yml"

concurrency:
  group: brain-autonomy-control-plane
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test control plane
        run: python -m unittest brain_v12.tests.test_autonomy_control_plane -v
      - name: Smoke test resume semantics
        run: |
          python - <<'PY'
          from brain_v12.brain.autonomy_control_plane import ControlPlane
          cp=ControlPlane("/tmp/brain-control-plane")
          j=cp.create("smoke",["a","b"],max_attempts=2,budget=2)
          j=cp.start_attempt(j)
          j=cp.checkpoint(j,1,{"verified":True})
          assert j["step_index"] == 1 and j["status"] == "ready"
          assert cp.can_run(j,external=True)[0] is False
          print("CONTROL_PLANE_VERIFIED")
          PY
