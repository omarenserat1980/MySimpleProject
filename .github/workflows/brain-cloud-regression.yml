name: Brain Cloud Regression Gate

on:
  push:
    paths:
      - "brain_v12/ai_fabric/intelligence.py"
      - "brain_v12/tests/test_ai_fabric_v3_loop.py"
      - "brain_v12/tests/test_device_bridge.py"
      - ".github/workflows/brain-cloud-regression.yml"
  pull_request:
    paths:
      - "brain_v12/ai_fabric/intelligence.py"
      - "brain_v12/tests/test_ai_fabric_v3_loop.py"
      - "brain_v12/tests/test_device_bridge.py"
      - ".github/workflows/brain-cloud-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Brain dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Fabric learning regression
        run: python -m unittest brain_v12.tests.test_ai_fabric_v3_loop -v
      - name: Run DeviceBridge regression
        run: python -m unittest brain_v12.tests.test_device_bridge -v
