name: Brain Execution Coordinator

on:
  push:
    paths:
      - "brain_v12/brain/control_plane.py"
      - "brain_v12/brain/task_engine.py"
      - "brain_v12/brain/execution_coordinator.py"
      - "brain_v12/tests/test_execution_coordinator.py"
      - ".github/workflows/brain-execution-coordinator.yml"
  pull_request:
    paths:
      - "brain_v12/brain/control_plane.py"
      - "brain_v12/brain/task_engine.py"
      - "brain_v12/brain/execution_coordinator.py"
      - "brain_v12/tests/test_execution_coordinator.py"
      - ".github/workflows/brain-execution-coordinator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q brain_v12/brain brain_v12/tests
      - name: Coordinator contract
        run: python -m unittest brain_v12.tests.test_execution_coordinator -v
      - name: Evidence
        run: |
          mkdir -p brain-artifacts
          printf '%s\n' "BRAIN_EXECUTION_COORDINATOR_VERIFIED" > brain-artifacts/EXECUTION_COORDINATOR_VERIFIED.txt
          test -s brain-artifacts/EXECUTION_COORDINATOR_VERIFIED.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-execution-coordinator-verified
          path: brain-artifacts/EXECUTION_COORDINATOR_VERIFIED.txt
