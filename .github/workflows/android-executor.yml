name: Build Android Executor
on:
  push:
    paths: ["android_executor/**", ".github/workflows/android-executor.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-android-executor-debug
          path: android_executor/app/build/outputs/apk/debug/app-debug.apk
