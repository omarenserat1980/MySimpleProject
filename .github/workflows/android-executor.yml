name: Build Android Executor

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-executor.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Run Android emulator smoke test'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.9
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          gradle --no-daemon --stacktrace projects

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/android-executor-build.log
      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt
          grep -q "package: name=" /tmp/apk-badging.txt
          head -n 5 /tmp/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-android-executor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Emulator smoke test
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run APK smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: '-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect'
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.brain.hondaconnect/.BrainCloudActivity
            sleep 5
            adb shell pidof com.brain.hondaconnect
            adb shell dumpsys activity activities | grep -q 'com.brain.hondaconnect'
