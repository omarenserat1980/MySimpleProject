name: Brain Emulator Cloud Readiness Checks

on:
  pull_request:
    paths:
      - "tools/brain_emulator_project_audit.py"
      - "tools/install_windows_boot_prerequisites.sh"
      - "brain_v12/tools/brain_emulator_agent.py"
      - "brain_v12/tests/test_brain_emulator_project_audit.py"
      - "docs/BRAIN_EMULATOR_WINDOWS_CLOUD_BOOT.md"
      - ".github/workflows/brain-emulator-cloud-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: |
          python -m py_compile \
            tools/brain_emulator_project_audit.py \
            brain_v12/tools/brain_emulator_agent.py \
            brain_v12/tests/test_brain_emulator_project_audit.py
      - name: Run audit tests
        run: PYTHONPATH=. python -m unittest brain_v12.tests.test_brain_emulator_project_audit -v
      - name: Validate installer shell syntax
        run: bash -n tools/install_windows_boot_prerequisites.sh
