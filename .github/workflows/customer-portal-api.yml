name: Customer Portal API Verification

on:
  push:
    paths:
      - "cloud/api_server.py"
      - "cloud/test_api_server.py"
      - "cloud/commercial_governance.py"
      - "cloud/test_commercial_governance.py"
      - "cloud/public_identity_policy.py"
      - "cloud/test_public_identity_policy.py"
      - "cloud/web/app.js"
      - "brain_v12/business/customer_governance.py"
      - "docs/CUSTOMER_PORTAL_API_CONTRACT.md"
      - "PUBLIC_IDENTITY_AND_LIMITED_LIABILITY_POLICY.md"
      - ".github/workflows/customer-portal-api.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python -m pip install -r cloud/requirements.txt
      - name: Python syntax
        run: python -m compileall -q cloud brain_v12/business/customer_governance.py
      - name: Customer Portal, commercial governance and identity policy tests
        run: python -m pytest -q cloud/test_api_server.py cloud/test_commercial_governance.py cloud/test_public_identity_policy.py
      - name: Browser JavaScript syntax
        run: node --check cloud/web/app.js
