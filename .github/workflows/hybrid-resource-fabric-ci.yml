name: Hybrid Resource Fabric CI

on:
  push:
    branches:
      - "brain/hybrid-resource-fabric-*"
    paths:
      - "brain_v12/brain/hybrid_resource_fabric.py"
      - "brain_v12/brain/resource_manager.py"
      - "brain_v12/brain/virtual_datacenter.py"
      - "brain_v12/brain/device_cloud_federation.py"
      - "brain_v12/brain/virtual_task_queue.py"
      - "brain_v12/tests/test_hybrid_resource_fabric.py"
      - "brain_v12/tests/test_hybrid_resource_fabric_integration.py"
      - ".github/workflows/hybrid-resource-fabric-ci.yml"
  pull_request:
    paths:
      - "brain_v12/brain/hybrid_resource_fabric.py"
      - "brain_v12/brain/resource_manager.py"
      - "brain_v12/tests/test_hybrid_resource_fabric.py"
      - ".github/workflows/hybrid-resource-fabric-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-fabric-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed module and tests
        run: python -m py_compile brain_v12/brain/hybrid_resource_fabric.py brain_v12/brain/resource_manager.py brain_v12/brain/virtual_task_queue.py brain_v12/brain/virtual_datacenter.py brain_v12/brain/device_cloud_federation.py brain_v12/tests/test_hybrid_resource_fabric.py brain_v12/tests/test_hybrid_resource_fabric_integration.py
      - name: Run deterministic resource fabric tests
        run: python -m unittest brain_v12.tests.test_hybrid_resource_fabric brain_v12.tests.test_hybrid_resource_fabric_integration -v
