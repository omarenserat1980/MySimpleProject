name: Linux Hosted Runner Smoke Test

on:
  push:
    paths:
      - ".github/workflows/linux-runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a

      - name: Verify software runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v bash
          command -v python3
          python3 --version
          echo "LINUX_HOSTED_RUNNER_SMOKE=PASS"
          echo "HARDWARE_DEPENDENCY=NONE"
