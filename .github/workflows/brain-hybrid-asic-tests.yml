name: Brain Hybrid ASIC Offline Tests

on:
  push:
    branches: [brain-hybrid-asic]
    paths:
      - "brain_v12/brain/gen_physical_proof.py"
      - "brain_v12/brain/gen_attestation_verifier.py"
      - "brain_v12/brain/gen_challenge_registry.py"
      - "brain_v12/brain/gen_challenge_sqlite.py"
      - "brain_v12/brain/device_plugins.py"
      - "brain_v12/brain/gen_attestation_verifier.py"
      - "brain_v12/brain/gen_challenge_registry.py"
      - "brain_v12/tests/test_gen_physical_proof.py"
      - "brain_v12/tests/test_gen_attestation_verifier.py"
      - "brain_v12/tests/test_gen_challenge_registry.py"
      - "brain_v12/tests/test_gen_challenge_sqlite.py"
      - "brain_v12/tests/test_device_plugins.py"
      - ".github/workflows/brain-hybrid-asic-tests.yml"
  pull_request:
    paths:
      - "brain_v12/brain/gen_physical_proof.py"
      - "brain_v12/brain/device_plugins.py"
      - "brain_v12/tests/test_gen_physical_proof.py"
      - "brain_v12/tests/test_device_plugins.py"
      - "brain_v12/tests/test_gen_attestation_verifier.py"
      - "brain_v12/tests/test_gen_challenge_registry.py"
      - ".github/workflows/brain-hybrid-asic-tests.yml"

permissions:
  contents: read

jobs:
  offline-proof-and-plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier test dependency
        run: python -m pip install cryptography
      - name: Run GEN proof tests
        run: python -m unittest brain_v12.tests.test_gen_physical_proof -v
      - name: Run signed GEN attestation verifier tests
        run: python -m unittest brain_v12.tests.test_gen_attestation_verifier -v
      - name: Run GEN challenge registry tests
        run: python -m unittest brain_v12.tests.test_gen_challenge_registry -v
      - name: Run persistent GEN challenge tests
        run: python -m unittest brain_v12.tests.test_gen_challenge_sqlite -v
      - name: Run device plugin contract tests
        run: python -m unittest brain_v12.tests.test_device_plugins -v
