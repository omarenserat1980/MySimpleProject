name: Brain V12 GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "brain_v12/web/**"
      - ".github/workflows/brain-v12-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          test -s brain_v12/web/index.html
          cp brain_v12/web/index.html _site/index.html
          test -s _site/index.html
          grep -qi '<html' _site/index.html
          grep -q 'العقل الإلكتروني' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
