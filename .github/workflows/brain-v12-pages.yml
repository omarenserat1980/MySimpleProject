name: Brain V12 GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "brain_v12/web/**"
      - "scripts/validate-pages.sh"
      - ".github/workflows/brain-v12-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and assemble site
        shell: bash
        run: |
          chmod +x scripts/validate-pages.sh
          ./scripts/validate-pages.sh brain_v12/web _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
