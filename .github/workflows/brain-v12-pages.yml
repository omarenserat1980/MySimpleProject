name: Brain V12 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/web/**"
      - "scripts/validate-pages.sh"
      - ".github/workflows/brain-v12-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_ROOT: brain_v12/web
  SITE_OUT: _site

jobs:
  validate:
    name: Validate and package Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Validate and assemble site
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate-pages.sh
          ./scripts/validate-pages.sh "$SITE_ROOT" "$SITE_OUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_OUT }}

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke test
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 20 -o /tmp/brain-pages.html "$PAGE_URL"; then
              break
            fi
            echo "Page not ready yet (attempt $attempt/5)"
            sleep 5
          done
          test -s /tmp/brain-pages.html
          grep -qi "<html" /tmp/brain-pages.html
          grep -q "العقل الإلكتروني" /tmp/brain-pages.html
          echo "GitHub Pages smoke test: OK"
