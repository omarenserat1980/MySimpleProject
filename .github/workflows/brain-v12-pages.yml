name: Brain V12 GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "brain_v12/web/**"
      - "scripts/validate-pages.sh"
      - ".github/workflows/brain-v12-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pages site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and assemble site
        shell: bash
        run: |
          chmod +x scripts/validate-pages.sh
          ./scripts/validate-pages.sh brain_v12/web _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    name: Deploy Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
