name: Brain V12 Web UI Check
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "brain_v12/web/**"
      - ".github/workflows/brain-v12-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          test -s brain_v12/web/index.html
          cp brain_v12/web/index.html _site/index.html
          grep -q '<html' _site/index.html
          grep -q 'العقل الإلكتروني' _site/index.html
      - name: Upload validated UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-v12-web-ui
          path: _site
          if-no-files-found: error
