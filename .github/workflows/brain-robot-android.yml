name: Brain Robot Android App CI

on:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/brain-robot-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/brain-robot-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build Brain Robot debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Brain Robot APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-robot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
