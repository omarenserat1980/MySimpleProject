name: BRAIN GitHub Brain Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/brain_git/**"
      - "brain_v12/brain/**"
      - ".github/workflows/brain-github-brain-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Brain Git contract
        run: |
          test -f brain_v12/brain_git/compose.yml
          test -f brain_v12/brain_git/policy.json
          test -f brain_v12/brain_git/SECURITY.md
          test -f brain_v12/brain_git/ARCHITECTURE.md
          python - <<'PY'
          import json
          p=json.load(open("brain_v12/brain_git/policy.json"))
          assert p["authority"]=="BRAIN_GIT_PRIMARY"
          assert p["external_sync_default"]=="DISABLED"
          assert p["public_exposure_default"]=="DISABLED"
          print("BRAIN_GIT_CONTRACT=VERIFIED")
          PY
      - name: Brain Git and control-plane unit tests
        run: |
          python -m unittest brain_v12.brain_git.test_service brain_v12.brain_git.test_workflow_engine -v
          python -m unittest brain_v12.brain.test_control_plane brain_v12.brain.test_film_completion_gate -v
      - name: Compile Brain control plane
        run: python -m compileall -q brain_v12/brain
      - name: Supervisor smoke
        run: python -m brain_v12.brain.brain_supervisor
      - name: Independence rule
        run: |
          ! grep -R "BRAIN_GITHUB_TOKEN\|GITHUB_TOKEN\|GH_TOKEN" -n brain_v12/brain_git || true
          echo "GITHUB_BRAIN_PHASE=BOOTSTRAP_VERIFIED"
