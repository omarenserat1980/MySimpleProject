name: Golden Mission Loop Tests

on:
  pull_request:
    branches:
      - main
      - feature/synthetic-customer-proposal-gate
    paths:
      - "brain_v12/brain/golden_mission.py"
      - "brain_v12/brain/golden_mission_worker.py"
      - "brain_v12/golden_mission_api.py"
      - "brain_v12/brain/synthetic_customer.py"
      - "brain_v12/tests/test_golden_mission*.py"
      - "brain_v12/tests/test_synthetic_customer*.py"
      - "brain_v12/app.py"
      - ".github/workflows/golden-mission-loop-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-mission-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRAIN_CONTROL_KEY: test-control-key
      BRAIN_EVIDENCE_DB: /tmp/brain-golden-evidence/evidence.db
      BRAIN_GOLDEN_MISSION_DB: /tmp/brain-golden-missions.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile brain_v12/brain/golden_mission.py brain_v12/brain/golden_mission_worker.py brain_v12/golden_mission_api.py brain_v12/brain/synthetic_customer.py brain_v12/app.py
      - name: Run Golden Mission and Synthetic Customer tests
        run: |
          python -m pytest -q brain_v12/tests/test_golden_mission.py brain_v12/tests/test_golden_mission_api.py brain_v12/tests/test_synthetic_customer.py brain_v12/tests/test_synthetic_customer_api.py
