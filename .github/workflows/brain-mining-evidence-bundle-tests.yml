name: Brain Mining Evidence Bundle Integrity Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/mining_evidence_bundle.py"
      - "brain_v12/tests/test_mining_evidence_bundle.py"
      - ".github/workflows/brain-mining-evidence-bundle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-integrity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile verifier and tests
        run: python -m py_compile brain_v12/brain/mining_evidence_bundle.py brain_v12/tests/test_mining_evidence_bundle.py
      - name: Run verifier tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_mining_evidence_bundle -v
      - name: Assert evidence boundary
        run: |
          echo "Local file integrity is not independent mining proof."
          echo "No miner, pool, wallet, or paid infrastructure is activated."
