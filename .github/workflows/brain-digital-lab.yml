name: Brain Digital Lab

on:
  pull_request:
    branches: [main, feature/brain-digital-lab-universal-governance]
    paths:
      - 'brain_v12/digital_lab/**'
      - 'brain_v12/tests/test_digital_lab_*.py'
      - '.github/workflows/brain-digital-lab.yml'
  push:
    branches: [main]
    paths:
      - 'brain_v12/digital_lab/**'
      - 'brain_v12/tests/test_digital_lab_*.py'
      - '.github/workflows/brain-digital-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-validation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run all Brain Digital Lab tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q brain_v12/tests/test_digital_lab_*.py
      - name: Validate discovery CLI entry point
        env:
          PYTHONPATH: .
        run: python -m brain_v12.digital_lab.discover_assets --help
      - name: Validate inventory validator CLI entry point
        env:
          PYTHONPATH: .
        run: python -m brain_v12.digital_lab.validate_inventory --help
      - name: Generate repository metadata inventory
        env:
          PYTHONPATH: .
        run: python -m brain_v12.digital_lab.discover_assets --root . --output "$RUNNER_TEMP/brain-digital-lab-inventory.json"
      - name: Validate generated inventory structure
        env:
          PYTHONPATH: .
        run: python -m brain_v12.digital_lab.validate_inventory "$RUNNER_TEMP/brain-digital-lab-inventory.json"
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-digital-lab-inventory
          path: ${{ runner.temp }}/brain-digital-lab-inventory.json
          if-no-files-found: error
          retention-days: 14
