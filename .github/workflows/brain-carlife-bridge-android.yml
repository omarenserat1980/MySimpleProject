name: Electronic Brain CarLife Bridge Android

on:
  push:
    branches:
      - brain/honda-android-network-sqlite
    paths:
      - "app/**"
      - "android_executor/carlife-md/upstream/LibSource/include/**"
      - "android_executor/carlife-md/native/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/brain-carlife-bridge-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "android_executor/carlife-md/upstream/LibSource/include/**"
      - "android_executor/carlife-md/native/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/brain-carlife-bridge-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-carlife-bridge-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native build tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Prepare Android native dependency closure
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          bash android_executor/carlife-md/scripts/prepare-android-jni-libs.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaConnectBrain-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
