name: Electronic Brain CarLife Bridge Android

on:
  push:
    branches:
      - brain/honda-android-network-sqlite
    paths:
      - "app/**"
      - "android_executor/carlife-md/upstream/LibSource/include/**"
      - "android_executor/carlife-md/**"
      - "android_executor/carlife-md/native/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/brain-carlife-bridge-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "android_executor/carlife-md/upstream/LibSource/include/**"
      - "android_executor/carlife-md/native/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/brain-carlife-bridge-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-carlife-bridge-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native build tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Run CarLife MD protocol inventory tests
        run: python3 android_executor/carlife-md/tests/test_protocol_inventory.py
      - name: Prepare Android native dependency closure
        run: |
          sudo apt-get update
          bash android_executor/carlife-md/scripts/prepare-android-jni-libs.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "Native entries packaged in APK:"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' || true
          for name in libbraincarlife_jni.so libcarlifevehicle.so libc++_shared.so libiconv.so libicudata.so libicuuc.so libxml2.so libz.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$name" || { echo "Missing packaged library: $name" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/apk-native"
          unzip -o "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/apk-native" >/dev/null
          for library in "$RUNNER_TEMP"/apk-native/lib/arm64-v8a/*.so; do
            readelf -h "$library" >/dev/null
            readelf -d "$library" | grep -q 'GNU_HASH\|HASH' || { echo "Missing hash table: $library" >&2; exit 1; }
          done
          JNI="$RUNNER_TEMP/apk-native/lib/arm64-v8a/libbraincarlife_jni.so"
          VEHICLE="$RUNNER_TEMP/apk-native/lib/arm64-v8a/libcarlifevehicle.so"
          SYMBOL='_ZN12CCarLifeLibH11CCarLifeLib14carLifeLibInitEv'
          readelf -d "$JNI" | grep 'libcarlifevehicle.so'
          for pair in "libcarlifevehicle.so:libz.so" "libcarlifevehicle.so:libxml2.so" "libxml2.so:libz.so" "libxml2.so:libicuuc.so" "libicuuc.so:libicudata.so"; do
            parent="${pair%%:*}"; dependency="${pair#*:}"
            readelf -d "$RUNNER_TEMP/apk-native/lib/arm64-v8a/$parent" | grep -F "[$dependency]" >/dev/null
            test -s "$RUNNER_TEMP/apk-native/lib/arm64-v8a/$dependency"
          done
          nm -D --undefined-only "$JNI" | grep -F "$SYMBOL"
          nm -D --defined-only "$VEHICLE" | grep -F "$SYMBOL"
          sha256sum "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaConnectBrain-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
