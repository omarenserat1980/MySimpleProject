name: synthetic-customer-smoke

on:
  push:
    branches:
      - "feature/synthetic-customer-proposal-gate"
  workflow_dispatch:

jobs:
  synthetic-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -q pytest fastapi pydantic
      - name: Compile Synthetic Customer
        run: python -m compileall -q brain_v12/brain/synthetic_customer.py brain_v12/synthetic_customer_api.py
      - name: Run Synthetic Customer tests
        run: python -m pytest -q brain_v12/tests/test_synthetic_customer.py
