name: ASIC Identity Evidence Tool Tests
on:
  pull_request:
    paths:
      - "brain_v12/tools/asic_identity_evidence_v2.py"
      - "brain_v12/tests/test_asic_identity_evidence.py"
      - ".github/workflows/asic-identity-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asic-identity-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile collector
        run: python -m py_compile brain_v12/tools/asic_identity_evidence_v2.py
      - name: Run fail-closed unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_asic_identity_evidence -v
      - name: Smoke test keeps physical identity unverified without evidence
        run: |
          set +e
          python3 brain_v12/tools/asic_identity_evidence_v2.py > report.json
          code=$?
          set -e
          test "$code" -eq 2
          python3 -c "import json; r=json.load(open('report.json')); assert r['status']=='PHYSICAL_IDENTITY_UNVERIFIED'; assert r['collector']['read_only'] is True"
