name: Brain Free Cloud Capacity Gate

on:
  pull_request:
    paths:
      - "brain_v12/brain/cloud_capacity_gate.py"
      - "brain_v12/tests/test_cloud_capacity_gate.py"
      - ".github/workflows/brain-free-cloud-capacity-gate.yml"
  push:
    branches:
      - main
      - "feat/brain-free-cloud-capacity-gate"
    paths:
      - "brain_v12/brain/cloud_capacity_gate.py"
      - "brain_v12/tests/test_cloud_capacity_gate.py"
      - ".github/workflows/brain-free-cloud-capacity-gate.yml"

permissions:
  contents: read

jobs:
  test-free-capacity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile component
        run: python -m py_compile brain_v12/brain/cloud_capacity_gate.py
      - name: Run gate tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q brain_v12/tests/test_cloud_capacity_gate.py
