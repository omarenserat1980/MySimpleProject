name: Brain Actions Plugin Test Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Plugin test
        run: python -m unittest brain_v12.tests.test_brain_autopilot_plugin -v
