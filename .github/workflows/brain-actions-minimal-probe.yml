name: Brain Actions Manifest Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manifest
        run: python -c "import json; json.load(open('plugins/brain-autopilot/plugin.json', encoding='utf-8')); print('plugin.json: valid')"
