name: Brain Cloud Web
on:
  push:
    branches: [main]
    paths:
      - "cloud/web/**"
      - "platform.html"
      - "games-store.html"
      - "brain_v12/web/platform.html"
      - "brain_v12/web/brain-app-v2/**"
      - "brain_v12/web/brain-chat/**"
      - "docs/cinema.html"
      - "docs/movies.html"
      - "docs/catalog.json"
      - "docs/studio/**"
      - ".github/workflows/brain-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: brain-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build static Brain Web payload
        env:
          BRAIN_API_ORIGIN: ${{ secrets.BRAIN_API_ORIGIN }}
        run: |
          rm -rf _site
          mkdir -p _site/brain-app-v2 _site/brain-chat
          cp -a cloud/web/. _site/
          cp platform.html _site/platform.html
          cp games-store.html _site/games-store.html
          mkdir -p _site/brain_v12/web _site/marketing _site/customer-portal
          cp -a brain_v12/web/. _site/brain_v12/web/
          cp -a marketing/. _site/marketing/
          cp -a customer-portal/. _site/customer-portal/
          cp -a brain_v12/web/brain-app-v2/. _site/brain-app-v2/
          cp -a brain_v12/web/brain-chat/. _site/brain-chat/
          cp docs/cinema.html _site/cinema.html
          cp docs/movies.html _site/movies.html
          cp docs/catalog.json _site/catalog.json
          mkdir -p _site/assets
          python - <<'PY'
          import json, os
          from pathlib import Path
          origin = os.environ.get("BRAIN_API_ORIGIN", "").strip().rstrip("/")
          if origin and not origin.startswith("https://"):
              raise SystemExit("BRAIN_API_ORIGIN must use HTTPS")
          Path("_site/brain-app-v2/config.json").write_text(
              json.dumps({"api_base": origin}, ensure_ascii=False),
              encoding="utf-8",
          )
          Path("_site/brain-chat/config.js").write_text(
              "window.BRAIN_API_BASE = " + json.dumps(origin, ensure_ascii=False) + ";\n",
              encoding="utf-8",
          )
          if not Path("_site/platform.html").is_file():
              raise SystemExit("Unified Brain platform entry point is missing from artifact")
          if not Path("_site/games-store.html").is_file():
              raise SystemExit("BRAIN Games storefront is missing from Pages artifact")
          if not Path("_site/index.html").is_file():
              raise SystemExit("Pages root entry point is missing from artifact")
          if not Path("_site/movies.html").is_file():
              raise SystemExit("Movies catalog entry point is missing from Pages artifact")
          if not Path("_site/cinema.html").is_file():
              raise SystemExit("Cinema entry point is missing from Pages artifact")
          if not Path("_site/brain-chat/index.html").is_file():
              raise SystemExit("Brain Chat entry point is missing from Pages artifact")
          if not Path("_site/brain-chat/config.js").is_file():
              raise SystemExit("Brain Chat runtime configuration was not generated")
          if "\\n" in Path("_site/brain-chat/config.js").read_text(encoding="utf-8"):
              raise SystemExit("Brain Chat config contains a literal backslash-n")
          # Verify every local platform link resolves inside the Pages artifact.
          from html.parser import HTMLParser
          class LinkParser(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href and not href.startswith(("#","http://","https://","mailto:")): self.hrefs.append(href.split("#",1)[0].split("?",1)[0])
          parser=LinkParser(); parser.feed(Path("_site/platform.html").read_text(encoding="utf-8"))
          for href in parser.hrefs:
              target=(Path("_site")/href.lstrip("/")).resolve()
              root=Path("_site").resolve()
              if not str(target).startswith(str(root)):
                  raise SystemExit(f"Platform link escapes Pages artifact: {href}")
              if not target.is_file() and not (target.is_dir() and (target/"index.html").is_file()):
                  raise SystemExit(f"Broken platform link: {href}")
          print(f"Platform link validation: OK ({len(parser.hrefs)} local links)")
          config = json.loads(Path("_site/brain-app-v2/config.json").read_text(encoding="utf-8"))
          if "api_base" not in config:
              raise SystemExit("Brain app config is missing api_base")
          print("BRAIN_API_ORIGIN_STATE=" + ("configured" if origin else "not configured"))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## Brain Pages build\n")
                  stream.write("- Brain API origin: " + ("configured" if origin else "not configured; the deployed UI will show the backend as disconnected until an API origin is supplied") + "\n")
                  stream.write("- Brain Chat artifact: present\n")
          PY
      - name: Validate Pages payload
        run: |
          test -f _site/index.html
          test -f _site/platform.html
          test -f _site/games-store.html
          test -f _site/marketing/index.html
          test -f _site/customer-portal/index.html
          test -f _site/brain_v12/web/index.html
          test -f _site/brain-chat/index.html
          test -f _site/cinema.html
          test -f _site/movies.html
          cp -r docs/studio _site/studio
          test -f _site/studio/storyboard.html
          test -f _site/studio/index.html
          test -f _site/studio/app.js
          test -f _site/studio/studio.css
          test -f _site/catalog.json
          test -f _site/brain-chat/config.js
          test -f _site/brain-app-v2/config.json
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("_site/brain-app-v2/config.json").read_text(encoding="utf-8"))
          assert "api_base" in config
          js = Path("_site/brain-chat/config.js").read_text(encoding="utf-8")
          assert "\\n" not in js
          assert js.startswith("window.BRAIN_API_BASE = ")
          print("Pages payload validation: OK")
          PY
      # Unique naming avoids stale-artifact collisions when a workflow attempt is rerun.
      - uses: actions/upload-pages-artifact@v4
        with:
          name: brain-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: brain-pages-${{ github.run_id }}-${{ github.run_attempt }}
