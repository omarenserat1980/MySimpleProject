name: Brain Cloud Web
on:
  push:
    branches: [main]
    paths:
      - "cloud/web/**"
      - "brain_v12/web/brain-app-v2/**"
      - "brain_v12/web/brain-chat/**"
      - ".github/workflows/brain-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build static Brain Web payload
        env:
          BRAIN_API_ORIGIN: ${{ secrets.BRAIN_API_ORIGIN }}
        run: |
          rm -rf _site
          mkdir -p _site/brain-app-v2 _site/brain-chat
          cp -a cloud/web/. _site/
          cp -a brain_v12/web/brain-app-v2/. _site/brain-app-v2/
          cp -a brain_v12/web/brain-chat/. _site/brain-chat/
          python - <<'PY'
          import json, os
          from pathlib import Path
          origin = os.environ.get("BRAIN_API_ORIGIN", "").strip().rstrip("/")
          if origin and not origin.startswith("https://"):
              raise SystemExit("BRAIN_API_ORIGIN must use HTTPS")
          Path("_site/brain-app-v2/config.json").write_text(
              json.dumps({"api_base": origin}, ensure_ascii=False),
              encoding="utf-8",
          )
          Path("_site/brain-chat/config.js").write_text(
              "window.BRAIN_API_BASE = " + json.dumps(origin, ensure_ascii=False) + ";\n",
              encoding="utf-8",
          )
          if not Path("_site/brain-chat/index.html").is_file():
              raise SystemExit("Brain Chat entry point is missing from Pages artifact")
          if not Path("_site/brain-chat/config.js").is_file():
              raise SystemExit("Brain Chat runtime configuration was not generated")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## Brain Pages build\n")
                  stream.write("- Brain API origin: " + ("configured" if origin else "not configured; the deployed UI will show the backend as disconnected until an API origin is supplied") + "\n")
                  stream.write("- Brain Chat artifact: present\n")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
