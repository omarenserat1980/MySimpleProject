name: Honda CONNECT App Manager

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: App ID from honda_connect_manager/apps.json
        required: true
        default: youtube
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app manifest
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          python3 - <<'PY'
          import json, os
          data=json.load(open("honda_connect_manager/apps.json", encoding="utf-8"))
          app_id=os.environ["APP_ID"]
          ids={a["id"] for a in data["apps"]}
          if app_id not in ids:
              raise SystemExit(f"Unknown app_id: {app_id}")
          app=next(a for a in data["apps"] if a["id"]==app_id)
          print(json.dumps(app, ensure_ascii=False, indent=2))
          print("Source:", app.get("source") or "NOT_CONFIGURED")
          PY
