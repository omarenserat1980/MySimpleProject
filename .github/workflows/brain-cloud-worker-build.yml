name: Brain Cloud Worker Build
on:
  push:
    paths: [brain_v12/cloud_worker/**, .github/workflows/brain-cloud-worker-build.yml]
  pull_request:
    paths: [brain_v12/cloud_worker/**, .github/workflows/brain-cloud-worker-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build brain_v12/cloud_worker/BrainCloudWorker.csproj --configuration Release
      - name: Worker runtime self-test
        run: dotnet run --project brain_v12/cloud_worker/BrainCloudWorker.csproj -- --self-test
      - name: Build Docker host image
        run: docker build -f brain_v12/cloud_worker/Dockerfile -t brain-cloud-worker:ci .
      - name: Smoke-test health, authentication, and honest execution status
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f brain-cloud-worker-smoke brain-cloud-worker-auth-smoke brain-cloud-worker-capacity-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Missing secret must disable command intake.
          docker run --rm -d --name brain-cloud-worker-smoke -p 127.0.0.1:18080:8080 brain-cloud-worker:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          last_error = None
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as response:
                      body = json.load(response)
                      assert response.status == 200 and body.get("ok") is True, body
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"worker health did not become ready: {last_error}")

          request = urllib.request.Request(
              base + "/api/brain/command",
              data=json.dumps({"command": "safe-auth-smoke-test"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, f"expected HTTP 503 without configured key, got {exc.code}"
              assert "COMMAND_AUTH_NOT_CONFIGURED" in exc.read().decode(errors="replace")
          else:
              raise SystemExit("SECURITY FAILURE: command endpoint allowed requests without configured auth")
          print("BRAIN_WORKER_HEALTH=PASS")
          print("BRAIN_WORKER_MISSING_KEY=BLOCKED")
          PY
          docker rm -f brain-cloud-worker-smoke >/dev/null

          # With a configured key, unauthenticated requests must be rejected,
          # and authenticated requests must honestly report that execution is not wired yet.
          docker run --rm -d --name brain-cloud-worker-auth-smoke -p 127.0.0.1:18081:8080 -e BRAIN_CLOUD_API_KEY=ci-test-only-key brain-cloud-worker:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18081"
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("authenticated worker did not become ready")

          body = json.dumps({"command": "safe-auth-smoke-test"}).encode()
          def post(headers):
              request = urllib.request.Request(
                  base + "/api/brain/command", data=body,
                  headers={"Content-Type": "application/json", **headers}, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=3) as response:
                      return response.status, response.read().decode(errors="replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode(errors="replace")

          status, _ = post({})
          assert status == 401, f"expected HTTP 401 without header, got {status}"
          status, payload = post({"X-Brain-Api-Key": "ci-test-only-key"})
          assert status == 501, f"expected HTTP 501 until execution queue is connected, got {status}: {payload}"
          assert "COMMAND_EXECUTION_NOT_CONNECTED" in payload, payload
          assert "No command was executed" in payload, payload
          print("BRAIN_WORKER_WRONG_OR_MISSING_KEY=BLOCKED")
          print("BRAIN_WORKER_EXECUTION_STATUS=HONESTLY_NOT_CONNECTED")

          # Bounded task API: auth, idempotency, allow-list, and status lookup.
          def task_request(method, path, payload=None, headers=None):
              data = None if payload is None else json.dumps(payload).encode()
              request_headers = {"X-Brain-Api-Key": "ci-test-only-key", **(headers or {})}
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
              request = urllib.request.Request(base + path, data=data, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=3) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode(errors="replace"))

          # No API key must block task creation.
          unauth = urllib.request.Request(
              base + "/api/tasks",
              data=json.dumps({"taskType": "health_check", "arguments": {"probe": "ci"}}).encode(),
              headers={"Content-Type": "application/json", "Idempotency-Key": "ci-unauth"},
              method="POST")
          try:
              urllib.request.urlopen(unauth, timeout=3)
              raise SystemExit("SECURITY FAILURE: unauthenticated task submission accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for unauthenticated task submission, got {exc.code}"

          # An incorrect API key must also block task creation.
          wrong_key = urllib.request.Request(
              base + "/api/tasks",
              data=json.dumps({"taskType": "health_check", "arguments": {"probe": "ci"}}).encode(),
              headers={"Content-Type": "application/json", "Idempotency-Key": "ci-wrong-key",
                       "X-Brain-Api-Key": "incorrect-ci-key"},
              method="POST")
          try:
              urllib.request.urlopen(wrong_key, timeout=3)
              raise SystemExit("SECURITY FAILURE: task accepted with incorrect API key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for incorrect API key, got {exc.code}"

          # Authenticated requests still need an idempotency key.
          status_missing_key, missing_key = task_request(
              "POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"probe": "ci"}})
          assert status_missing_key == 400 and missing_key.get("error") == "IDEMPOTENCY_KEY_REQUIRED", (
              status_missing_key, missing_key)
          print("BRAIN_TASK_API_WRONG_KEY=BLOCKED")
          print("BRAIN_TASK_API_IDEMPOTENCY_REQUIRED=PASS")

          status, _ = task_request("POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"probe": "ci"}},
              {"Idempotency-Key": "ci-task-1"})
          assert status == 202, f"expected 202 for new task, got {status}"
          status2, duplicate = task_request("POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"probe": "ci"}},
              {"Idempotency-Key": "ci-task-1"})
          assert status2 == 200 and duplicate.get("duplicate") is True, (status2, duplicate)
          task_id = duplicate["task"]["taskId"]

          # Status reads are protected by the same API key as task writes.
          unauth_status = urllib.request.Request(base + "/api/tasks/" + task_id, method="GET")
          try:
              urllib.request.urlopen(unauth_status, timeout=3)
              raise SystemExit("SECURITY FAILURE: task status exposed without API key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for unauthenticated status lookup, got {exc.code}"

          wrong_key_status = urllib.request.Request(
              base + "/api/tasks/" + task_id,
              headers={"X-Brain-Api-Key": "incorrect-ci-key"}, method="GET")
          try:
              urllib.request.urlopen(wrong_key_status, timeout=3)
              raise SystemExit("SECURITY FAILURE: task status exposed with incorrect API key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for incorrect-key status lookup, got {exc.code}"

          status_unknown, unknown = task_request("GET", "/api/tasks/missingtask123")
          assert status_unknown == 404 and unknown.get("error") == "TASK_NOT_FOUND", (status_unknown, unknown)
          print("BRAIN_TASK_STATUS_UNAUTHENTICATED=BLOCKED")
          print("BRAIN_TASK_STATUS_WRONG_KEY=BLOCKED")
          print("BRAIN_TASK_STATUS_UNKNOWN_ID=404")

          # Queue capacity telemetry must be authenticated and must not imply execution.
          unauth_queue = urllib.request.Request(base + "/api/tasks/queue-status", method="GET")
          try:
              urllib.request.urlopen(unauth_queue, timeout=3)
              raise SystemExit("SECURITY FAILURE: queue status exposed without API key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for unauthenticated queue status, got {exc.code}"

          wrong_key_queue = urllib.request.Request(
              base + "/api/tasks/queue-status",
              headers={"X-Brain-Api-Key": "incorrect-ci-key"}, method="GET")
          try:
              urllib.request.urlopen(wrong_key_queue, timeout=3)
              raise SystemExit("SECURITY FAILURE: queue status exposed with incorrect API key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected HTTP 401 for incorrect-key queue status, got {exc.code}"

          queue_status, queue_payload = task_request("GET", "/api/tasks/queue-status")
          assert queue_status == 200 and queue_payload.get("ok") is True, (queue_status, queue_payload)
          capacity = queue_payload.get("capacity", {})
          assert capacity.get("total", 0) >= 1, capacity
          assert capacity.get("maxRecords", 0) >= capacity.get("total", 0), capacity
          assert capacity.get("remaining", -1) == capacity.get("maxRecords", 0) - capacity.get("total", 0), capacity
          assert queue_payload.get("execution_enabled_by_this_endpoint") is False, queue_payload
          print("BRAIN_QUEUE_STATUS_UNAUTHENTICATED=BLOCKED")
          print("BRAIN_QUEUE_STATUS_WRONG_KEY=BLOCKED")
          print("BRAIN_QUEUE_STATUS_AUTHENTICATED=PASS")
          print("BRAIN_QUEUE_STATUS_EXECUTION_DISABLED=PASS")


          status3, conflict = task_request("POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"probe": "different"}},
              {"Idempotency-Key": "ci-task-1"})
          assert status3 == 409 and conflict.get("error") == "IDEMPOTENCY_KEY_PAYLOAD_CONFLICT", (status3, conflict)

          status4, rejected = task_request("POST", "/api/tasks",
              {"taskType": "shell", "arguments": {"cmd": "echo unsafe"}},
              {"Idempotency-Key": "ci-task-unsafe"})
          assert status4 == 400 and rejected.get("error") == "INVALID_TASK_REQUEST", (status4, rejected)

          # The hosted bounded consumer should finish the allow-listed task.
          # Poll rather than assuming the initial state, which is inherently racy.
          detail = None
          for _ in range(15):
              status5, detail = task_request("GET", "/api/tasks/" + task_id)
              assert status5 == 200 and detail["task"]["taskId"] == task_id, (status5, detail)
              if detail["task"]["status"] == "succeeded":
                  break
              if detail["task"]["status"] in ("failed", "cancelled"):
                  raise SystemExit(f"bounded task did not succeed: {detail}")
              time.sleep(1)
          assert detail["task"]["status"] == "succeeded", f"bounded consumer did not complete task: {detail}"
          result = json.loads(detail["task"]["resultJson"])
          assert result.get("task_type") == "health_check", result
          assert result.get("evidence_level") == "LOCAL_QUEUE_CHECK_ONLY", result
          assert result.get("external_runtime_verified") is False, result
          print("BRAIN_TASK_API_AUTH=PASS")
          print("BRAIN_TASK_API_IDEMPOTENCY=PASS")
          print("BRAIN_TASK_API_ALLOWLIST=PASS")
          print("BRAIN_TASK_API_STATUS_LOOKUP=PASS")
          print("BRAIN_BOUNDED_CONSUMER_HEALTH_E2E=PASS")

          # Simulation status must never be reported as real mining or revenue.
          status6, submitted_sim = task_request("POST", "/api/tasks",
              {"taskType": "simulation_status", "arguments": {"probe": "ci-simulation"}},
              {"Idempotency-Key": "ci-job-sim-1"})
          assert status6 == 202, f"expected 202 for simulation task, got {status6}: {submitted_sim}"
          simulation_id = submitted_sim["task"]["taskId"]
          simulation_detail = None
          for _ in range(15):
              status7, simulation_detail = task_request("GET", "/api/tasks/" + simulation_id)
              assert status7 == 200 and simulation_detail["task"]["taskId"] == simulation_id, (status7, simulation_detail)
              if simulation_detail["task"]["status"] == "succeeded":
                  break
              if simulation_detail["task"]["status"] in ("failed", "cancelled"):
                  raise SystemExit(f"simulation task did not succeed: {simulation_detail}")
              time.sleep(1)
          assert simulation_detail["task"]["status"] == "succeeded", f"simulation consumer did not complete task: {simulation_detail}"
          simulation_result = json.loads(simulation_detail["task"]["resultJson"])
          assert simulation_result.get("mode") == "SIMULATOR", simulation_result
          assert simulation_result.get("network_access_performed") is False, simulation_result
          assert simulation_result.get("real_mining_verified") is False, simulation_result
          assert simulation_result.get("accepted_shares_verified") is False, simulation_result
          assert simulation_result.get("revenue_verified") is False, simulation_result
          assert simulation_result.get("evidence_level") == "SIMULATION_STATUS_ONLY", simulation_result
          print("BRAIN_BOUNDED_CONSUMER_SIMULATION_E2E=PASS")
          PY
          docker logs brain-cloud-worker-auth-smoke

          # Isolated low-capacity instance: prove HTTP 503 behavior without touching any deployment.
          docker run --rm -d --name brain-cloud-worker-capacity-smoke \
            -p 127.0.0.1:18081:8080 \
            -e BRAIN_CLOUD_API_KEY=ci-capacity-only-key \
            -e BRAIN_TASK_QUEUE_MAX_RECORDS=2 \
            -e BRAIN_TASK_QUEUE_PATH=/tmp/brain-capacity-test.json \
            brain-cloud-worker:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18081"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("capacity smoke container did not become healthy")

          def request(method, path, payload=None, key=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"X-Brain-Api-Key": "ci-capacity-only-key"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              if key:
                  headers["Idempotency-Key"] = key
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=3) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode(errors="replace"))

          for n in (1, 2):
              status, payload = request("POST", "/api/tasks",
                  {"taskType": "health_check", "arguments": {"capacity_test": n}},
                  "capacity-e2e-" + str(n))
              assert status == 202, (status, payload)

          status, full = request("POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"capacity_test": 3}},
              "capacity-e2e-3")
          assert status == 503 and full.get("error") == "TASK_QUEUE_CAPACITY_REACHED", (status, full)

          # Idempotent retry for an existing record remains safe even when full.
          status, duplicate = request("POST", "/api/tasks",
              {"taskType": "health_check", "arguments": {"capacity_test": 1}},
              "capacity-e2e-1")
          assert status == 200 and duplicate.get("duplicate") is True, (status, duplicate)

          status, snapshot = request("GET", "/api/tasks/queue-status")
          assert status == 200, (status, snapshot)
          capacity = snapshot["capacity"]
          assert capacity["total"] == 2 and capacity["maxRecords"] == 2, capacity
          assert capacity["remaining"] == 0 and capacity["atCapacity"] is True, capacity
          print("BRAIN_QUEUE_CAPACITY_HTTP_503=PASS")
          print("BRAIN_QUEUE_CAPACITY_IDEMPOTENCY_AT_LIMIT=PASS")
          print("BRAIN_QUEUE_CAPACITY_STATUS_AT_LIMIT=PASS")
          PY
          docker logs brain-cloud-worker-capacity-smoke
