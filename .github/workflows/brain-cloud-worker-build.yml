name: Brain Cloud Worker Build
on:
  push:
    paths: [brain_v12/cloud_worker/**, .github/workflows/brain-cloud-worker-build.yml]
  pull_request:
    paths: [brain_v12/cloud_worker/**, .github/workflows/brain-cloud-worker-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build brain_v12/cloud_worker/BrainCloudWorker.csproj --configuration Release
      - name: Worker runtime self-test
        run: dotnet run --project brain_v12/cloud_worker/BrainCloudWorker.csproj -- --self-test
      - name: Build Docker host image
        run: docker build -f brain_v12/cloud_worker/Dockerfile -t brain-cloud-worker:ci .
      - name: Smoke-test health and fail-closed command authentication
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name brain-cloud-worker-smoke -p 127.0.0.1:18080:8080 brain-cloud-worker:ci
          cleanup() { docker rm -f brain-cloud-worker-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          last_error = None
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as response:
                      body = json.load(response)
                      assert response.status == 200, f"health HTTP {response.status}"
                      assert body.get("ok") is True, f"health not ok: {body}"
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"worker health did not become ready: {last_error}")

          request = urllib.request.Request(
              base + "/api/brain/command",
              data=json.dumps({"command": "safe-auth-smoke-test"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, f"expected fail-closed HTTP 503, got {exc.code}"
              payload = exc.read().decode(errors="replace")
              assert "COMMAND_AUTH_NOT_CONFIGURED" in payload, payload
          else:
              raise SystemExit("SECURITY FAILURE: command endpoint accepted a request without configured auth")
          print("BRAIN_WORKER_HEALTH=PASS")
          print("BRAIN_WORKER_COMMAND_AUTH_FAIL_CLOSED=PASS")
          PY
          docker logs brain-cloud-worker-smoke
