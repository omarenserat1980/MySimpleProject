name: BRAIN Release Gate
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r cloud/requirements.txt pytest

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Verify Windows Cloud secret readiness gate
        run: |
          python -m pytest -q brain_v12/tests/test_windows_cloud_secret_gate.py brain_v12/tests/test_secret_control.py

      - name: Run release gate
        run: |
          python -c "from cloud.release_gate import ReleaseGate; import json; print(json.dumps(ReleaseGate().run(), indent=2))"
          test -s .brain_state/release_gate/release_gate.json

      - name: Validate gate evidence schema
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".brain_state/release_gate/release_gate.json")
          d = json.loads(path.read_text())
          assert d.get("status") in {"RELEASE_ALLOWED", "RELEASE_BLOCKED"}
          assert d.get("gates")
          assert d.get("evidence_contract", {}).get("release_requires_runtime_evidence") is True
          print("release gate evidence schema: OK")
          PY

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-release-gate-evidence
          path: .brain_state/release_gate/release_gate.json

      - name: Block release when gate fails
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          d = json.loads(Path(".brain_state/release_gate/release_gate.json").read_text())
          print("BRAIN RELEASE STATUS:", d["status"])
          sys.exit(0 if d["status"] == "RELEASE_ALLOWED" else 1)
          PY
