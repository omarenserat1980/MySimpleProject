name: Brain Authorization - Fail Closed and Economic Safety

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/authorization_gate.py"
      - "brain_v12/brain/payout_planner.py"
      - "brain_v12/tests/test_authorization_and_payout.py"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest brain_v12.tests.test_authorization_and_payout -v
