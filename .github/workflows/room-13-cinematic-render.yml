name: room-13-cinematic-render
# Brain launch channel: this workflow is intentionally push-triggerable for immediate Brain execution.
on:
  workflow_dispatch:
    inputs:
      brain_command:
        description: "Brain launch command"
        required: true
        default: "\\AUTO1000"
        type: string
      auto_confirm:
        description: "Automatically approve internal confirmations"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "brain_v12/movie_summary_factory/jobs/room-13-horror-10m-cinematic-v3.json"
      - "brain_v12/movie_summary_factory/render_room13_animatic.py"
      - "brain_v12/movie_summary_factory/room13_qc.py"
      - "brain_v12/movie_summary_factory/test_room13_pipeline.py"
      - "brain_v12/brain_ffmpeg.py"
      - "brain_v12/media_engine.py"
      - ".github/workflows/room-13-cinematic-render.yml"
permissions:
  contents: read

concurrency:
  group: room-13-cinematic-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install Arabic font only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core
      - name: Build Brain-native FFmpeg toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config yasm nasm libx264-dev libfreetype6-dev libfontconfig1-dev
          rm -rf /tmp/ffmpeg-brain-src
          git clone --depth 1 --branch n8.0.1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-brain-src
          cd /tmp/ffmpeg-brain-src
          ./configure --prefix="$GITHUB_WORKSPACE/brain_v12/bin" --bindir="$GITHUB_WORKSPACE/brain_v12/bin" --enable-gpl --enable-libx264 --enable-libfreetype --enable-libfontconfig --disable-debug --disable-doc
          make -j"$(nproc)"
          make install
          test -x "$GITHUB_WORKSPACE/brain_v12/bin/ffmpeg"
          test -x "$GITHUB_WORKSPACE/brain_v12/bin/ffprobe"
          "$GITHUB_WORKSPACE/brain_v12/bin/ffmpeg" -version | head -n 1
          "$GITHUB_WORKSPACE/brain_v12/bin/ffprobe" -version | head -n 1
      - name: Verify Brain media toolchain
        run: |
          python - <<'PY'
          from brain_v12 import brain_ffmpeg
          import json
          d = brain_ffmpeg.diagnostics()
          print(json.dumps(d, ensure_ascii=False, indent=2))
          assert d["ffmpeg"]["ok"], d["ffmpeg"]
          assert d["ffprobe"]["ok"], d["ffprobe"]
          PY
      - name: Room 13 deterministic tests
        run: python -m unittest brain_v12.movie_summary_factory.test_room13_pipeline -v
      - name: Brain Cloud preflight QC
        run: python brain_v12/movie_summary_factory/room13_qc.py
      - name: Render Room 13 animatic
        run: |
          set -o pipefail
          python brain_v12/movie_summary_factory/render_room13_animatic.py | tee room13-render.log
      - name: Brain Cloud final QC
        if: always()
        run: python brain_v12/movie_summary_factory/room13_qc.py
      - name: Report render progress
        if: always()
        run: |
          echo "## Room 13 render progress" >> "$GITHUB_STEP_SUMMARY"
          if [ -f brain_v12/web/media/engine/room-13-progress.json ]; then
            cat brain_v12/web/media/engine/room-13-progress.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "progress file unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f room13-render.log ]; then
            tail -n 12 room13-render.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate Brain production plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("brain_v12/movie_summary_factory/jobs/room-13-horror-10m-cinematic-v3.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["beats"]) == 8, "expected 8 beats"
          assert len(d["shots"]) == 32, "expected 32 shots"
          assert all(s.get("voice") and s.get("subtitle") and s.get("transition") for s in d["shots"])
          assert all(s.get("duration_s",0) > 0 for s in d["shots"])
          print("ROOM_13_PLAN_QC=PASS")
          PY
      - name: Probe output with Brain FFprobe
        run: |
          python - <<'PY'
          import json, subprocess
          from brain_v12 import brain_ffmpeg
          probe = subprocess.run([
              brain_ffmpeg.ffprobe(), "-v", "error",
              "-show_entries", "format=duration,size",
              "-show_entries", "stream=codec_name,width,height,r_frame_rate",
              "-of", "json",
              "brain_v12/web/media/engine/room-13-horror-10m-animatic.mp4"
          ], check=True, text=True, capture_output=True)
          print(probe.stdout)
          PY
      - name: Render status
        if: success()
        run: |
          echo "ROOM_13_RENDER_STATUS=COMPLETED" >> "$GITHUB_STEP_SUMMARY"
          echo "ROOM_13_RENDER_PERCENT=100" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Room 13 QC and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-13-render-qc
          path: |
            brain_v12/web/media/engine/room-13-progress.json
            brain_v12/web/media/engine/room-13-qc.json
            room13-render.log
          if-no-files-found: warn
      - name: Upload MP4 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: room-13-horror-10m-animatic
          path: brain_v12/web/media/engine/room-13-horror-10m-animatic.mp4
          if-no-files-found: error
