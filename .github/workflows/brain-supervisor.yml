name: Brain Supervisor - Autonomy and Economic Safety

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Brain Cloud Runner"
        required: false
        default: "tests"
        type: string
  workflow_run:
    workflows: ["BRAIN 120 Minute Cinema"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/brain_supervisor.py"
      - "brain_v12/brain/economic_ledger.py"
      - "brain_v12/tests/test_brain_supervisor.py"
      - "brain_v12/tests/test_economic_ledger.py"
      - ".github/workflows/brain-supervisor.yml"
      - "brain_v12/brain/repair_engine.py"
      - "brain_v12/brain/test_repair_engine.py"
      - ".github/workflows/brain-workflow-watchdog.yml"

concurrency:
  group: brain-supervisor
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch_cloud_task:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Brain Cloud Runner
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          task=os.environ.get("TASK","tests").strip().lower()
          payload=json.dumps({"ref":"main","inputs":{"task":task}}).encode()
          req=urllib.request.Request(
              "https://api.github.com/repos/omarenserat1980/MySimpleProject/actions/workflows/brain-github-cloud.yml/dispatches",
              data=payload,
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28",
                       "Content-Type":"application/json"},
              method="POST")
          with urllib.request.urlopen(req) as resp:
              print("BRAIN_CLOUD_DISPATCHED", resp.status, task)
          PY

  health_and_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Brain Supervisor and Device Bridge
        run: |
          python -m py_compile brain_v12/brain/brain_supervisor.py
          python -m py_compile brain_v12/brain/device_bridge.py
      - name: Supervisor simulation
        run: python -m brain_v12.brain.brain_supervisor
      - name: Verify bounded autonomy
        run: |
          grep -q "max_cycles" brain_v12/brain/brain_supervisor.py
          grep -q "repair_and_retry" brain_v12/brain/brain_supervisor.py
          grep -q "recover_stale" brain_v12/brain/device_bridge.py
          echo "BRAIN_AUTONOMY_CONTRACT=VERIFIED"

  self_heal:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose failed cinematic run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "=== BRAIN SUPERVISOR: FAILURE DETECTED ==="
          gh run view "$RUN_ID" --json status,conclusion,jobs,headSha
          gh run view "$RUN_ID" --log-failed > supervisor-failure.log || true
          echo "=== FAILURE CLASSIFICATION ==="
          if grep -Eqi "No such file|not found|No input|cannot open" supervisor-failure.log; then
            echo "FAILURE_CLASS=INPUT_OR_ARTIFACT"
          elif grep -Eqi "ffmpeg|ffprobe|filter|concat|codec|mux" supervisor-failure.log; then
            echo "FAILURE_CLASS=MEDIA_PIPELINE"
          elif grep -Eqi "timeout|timed out|runner|queued" supervisor-failure.log; then
            echo "FAILURE_CLASS=EXECUTION_INFRA"
          elif grep -Eqi "python|Traceback|Exception|SyntaxError|ModuleNotFoundError" supervisor-failure.log; then
            echo "FAILURE_CLASS=CODE_OR_DEPENDENCY"
          else
            echo "FAILURE_CLASS=UNKNOWN"
          fi
          grep -E "ERROR|Error|FAILED|failure|Traceback|Exception" supervisor-failure.log | tail -100 || true
      - name: Bounded recovery rerun
        if: ${{ github.event.workflow_run.run_attempt < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "BRAIN_SUPERVISOR_RECOVERY=RERUN_FAILED_JOBS"
          echo "RUN_ID=$RUN_ID"
          echo "RUN_ATTEMPT=$RUN_ATTEMPT"
          gh run rerun "$RUN_ID" --failed
      - name: Recovery limit evidence
        if: ${{ github.event.workflow_run.run_attempt >= 3 }}
        run: |
          set -euo pipefail
          echo "BRAIN_SUPERVISOR_RECOVERY=BLOCKED_ATTEMPT_LIMIT"
          echo "RUN_ID=${{ github.event.workflow_run.id }}"
          echo "RUN_ATTEMPT=${{ github.event.workflow_run.run_attempt }}"
      - name: Hand off recovery to global Brain watchdog
        run: |
          set -euo pipefail
          mkdir -p brain6_artifacts/supervisor
          echo "BRAIN_SUPERVISOR_ACTION=FAILURE_CLASSIFIED" > brain6_artifacts/supervisor/handoff.txt
          echo "BRAIN_SUPERVISOR_RECOVERY=GLOBAL_WORKFLOW_WATCHDOG" >> brain6_artifacts/supervisor/handoff.txt
          echo "BRAIN_SUPERVISOR_POLICY=BOUNDED_AUTONOMOUS_RECOVERY" >> brain6_artifacts/supervisor/handoff.txt
          echo "RUN_ID=${{ github.event.workflow_run.id }}" >> brain6_artifacts/supervisor/handoff.txt
      - name: Record supervisor evidence
        run: |
          mkdir -p brain6_artifacts/supervisor
          printf '%s\n' "FAILURE_DETECTED" "ACTION=RERUN_FAILED_JOBS" "RUN_ID=${{ github.event.workflow_run.id }}" > brain6_artifacts/supervisor/evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: brain-supervisor-evidence-${{ github.event.workflow_run.id }}
          path: brain6_artifacts/supervisor/evidence.txt
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest brain_v12.tests.test_brain_supervisor brain_v12.tests.test_economic_ledger brain_v12.brain.test_repair_engine -v
      - name: Supervisor smoke test
        run: python -m brain_v12.brain.brain_supervisor
      - name: Economic ledger smoke test
        run: python -m brain_v12.brain.economic_ledger
      - name: Verify safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("brain6_artifacts/economy/ledger.jsonl")
          # The smoke test does not create a verified receipt; therefore no
          # revenue can be inferred from an empty ledger.
          assert not p.exists() or p.read_text(encoding="utf-8").strip() == ""
          print("Economic safety invariant verified.")
          PY
