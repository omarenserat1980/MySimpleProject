name: Brain Short Video Factory CI

on:
  workflow_dispatch:
  push:
    paths:
      - "brain_v12/short_video_factory.py"
      - "brain_v12/tests/test_short_video_factory.py"
      - "brain_v12/tests/test_short_video_api.py"
      - "brain_v12/tests/test_youtube_publisher.py"
      - "brain_v12/brain/youtube_publisher.py"
      - "brain_v12/brain/youtube_oauth.py"
      - "brain_v12/app.py"
      - "brain_v12/media_engine.py"
      - ".github/workflows/brain-short-video-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Brain Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Configure Brain media toolchain
        run: |
          echo "BRAIN_FFMPEG_BIN=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "BRAIN_FFPROBE_BIN=/usr/bin/ffprobe" >> "$GITHUB_ENV"
          /usr/bin/ffmpeg -version | head -n 1
          /usr/bin/ffprobe -version | head -n 1
      - name: Compile Brain
        run: python -m compileall -q brain_v12
      - name: Short video factory tests
        run: python -m unittest brain_v12.tests.test_short_video_factory brain_v12.tests.test_short_video_api -v
      - name: YouTube publisher tests
        run: python -m unittest brain_v12.tests.test_youtube_publisher -v
      - name: Media engine tests
        run: python -m unittest brain_v12.tests.test_media_engine -v
      - name: Independent verification gate
        env:
          BRAIN_GATE_PYTEST: "0"
        run: python brain_v12/self_healing/verification_gate.py

