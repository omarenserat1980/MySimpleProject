name: Universal Design Factory Gate

on:
  pull_request:
    paths:
      - 'prompts/universal_design_factory/**'
      - 'brain_v12/design_factory/**'
      - 'docs/design/**'
      - 'schemas/design_task.schema.json'
      - 'tests/design_factory/**'
      - '.github/workflows/universal-design-factory.yml'
  push:
    branches: [main]
    paths:
      - 'prompts/universal_design_factory/**'
      - 'brain_v12/design_factory/**'
      - 'docs/design/**'
      - 'schemas/design_task.schema.json'
      - 'tests/design_factory/**'
      - '.github/workflows/universal-design-factory.yml'

permissions:
  contents: read

jobs:
  design-factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile design factory modules
        run: python -m compileall -q brain_v12/design_factory tests/design_factory
      - name: Run design factory tests
        run: python -m unittest discover -s tests/design_factory -v
      - name: Validate task schema JSON
        run: python -m json.tool schemas/design_task.schema.json > /dev/null
