name: Brain Device Link Agent CI

on:
  push:
    branches:
      - brain-device-link-agent
  pull_request:
    paths:
      - 'brain_v12/tools/brain_device_link.py'
      - 'brain_v12/tests/test_brain_device_link.py'
      - '.github/workflows/brain-device-link-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile device link agent
        run: python -m py_compile brain_v12/tools/brain_device_link.py
      - name: Test device link metadata
        run: python -m unittest brain_v12.tests.test_brain_device_link -v
