name: BRAIN Commerce Reversals Smoke

on:
  push:
    branches: [feat/brain-refund-dispute-reversal]
    paths:
      - "brain_v12/brain/commerce_reversals.py"
      - "brain_v12/tests/test_commerce_reversals.py"
      - "brain_v12/brain/commerce_api.py"
      - ".github/workflows/brain-commerce-reversals-smoke.yml"
  pull_request:
    paths:
      - "brain_v12/brain/commerce_reversals.py"
      - "brain_v12/tests/test_commerce_reversals.py"
      - "brain_v12/brain/commerce_api.py"
      - ".github/workflows/brain-commerce-reversals-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest brain_v12.tests.test_commerce_reversals -v
