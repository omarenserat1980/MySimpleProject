name: Brain Cinema - Publish Film Page
on:
  workflow_run:
    workflows: ["Brain Factory - Single Production Path"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production artifact
        shell: bash
        run: |
          if [ "\${{ github.event_name }}" = "workflow_run" ]; then echo "Artifact will be downloaded from the verified production run."; else test -s docs/assets/last_light_city.mp4; fi
      - name: Prepare cinema metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/film.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for k in ('render','video','audio','verification','web'): d['status'][k]='ready'
          d['status']['self_healing']='not_run'
          d['build']={'workflow':'Brain Cinema - Publish Film Page','source':'Last Light In The City - No Pay Production'}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Download verified film artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: brain-factory-last-light-verified
          path: docs/assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify production master
        run: |
          test -s docs/assets/last_light_city.mp4
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of json docs/assets/last_light_city.mp4 > /tmp/film-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/film-probe.json').read_text())
          streams=d.get('streams',[])
          assert streams and streams[0].get('codec_name'), 'video stream missing'
          assert float(streams[0].get('duration') or 0) > 0, 'video duration missing'
          print('published artifact verified')
          PY
          cp docs/assets/last_light_city.mp4 /tmp/brain-last-light-master.mp4
          ffmpeg -y -loglevel error -i docs/assets/last_light_city.mp4 -t 20 -vf "scale=854:-2" -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart docs/assets/last_light_city_preview.mp4
          test -s docs/assets/last_light_city_preview.mp4
          rm -f docs/assets/last_light_city.mp4 docs/assets/ffprobe.json docs/assets/film_manifest.json docs/assets/VERIFIED_COMPLETED

      - name: Upload private production master artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-cinema-master-private
          path: /tmp/brain-last-light-master.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload public cinema preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-cinema-preview
          path: docs/assets/last_light_city_preview.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Verify web package
        run: |
          test -s docs/index.html
          test -s docs/film.json
          test -s docs/assets/poster.svg
          test -s docs/assets/last_light_city_preview.mp4
          if [ -e docs/assets/last_light_city.mp4 ]; then echo "::error::Paid master must never be published under docs/assets"; exit 1; fi
      - name: Commit generated metadata
        shell: bash
        run: |
          git config user.name 'Brain Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/film.json
          git diff --cached --quiet || git commit -m 'chore: update Brain Cinema production status'
          git push

  deploy:
    needs: publish
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: brain-cinema-preview
          path: docs/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
