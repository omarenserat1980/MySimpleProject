name: Brain Digital Mining Node Preflight Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/digital_mining_node.py"
      - "brain_v12/tests/test_digital_mining_node.py"
      - ".github/workflows/brain-digital-mining-node-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-digital-mining-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile preflight and tests
        run: python -m py_compile brain_v12/brain/digital_mining_node.py brain_v12/tests/test_digital_mining_node.py
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_digital_mining_node -v
      - name: State evidence boundary
        run: |
          echo "CI validates only source and unit tests."
          echo "It does not verify a physical node, live mining, pool shares, or revenue."
