name: Cloud Executor Attestation Status Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/cloud_executor_attestation_api.py"
      - "brain_v12/tests/test_cloud_executor_attestation_status.py"
      - ".github/workflows/cloud-executor-attestation-status-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/cloud_executor_attestation_api.py"
      - "brain_v12/tests/test_cloud_executor_attestation_status.py"
      - ".github/workflows/cloud-executor-attestation-status-tests.yml"

permissions:
  contents: read

jobs:
  attestation-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest fastapi pydantic cryptography
      - run: python -m pytest brain_v12/tests/test_cloud_executor_attestation_status.py -q
