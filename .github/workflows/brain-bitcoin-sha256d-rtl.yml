name: Brain Bitcoin SHA256d RTL Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'brain_v12/asic/rtl/brain_sha256_compress.sv'
      - 'brain_v12/asic/rtl/brain_sha256d_256.sv'
      - 'brain_v12/asic/rtl/tb_brain_sha256d_256.sv'
      - '.github/workflows/brain-bitcoin-sha256d-rtl.yml'
  push:
    branches: [feat/bitcoin-sha256d-primitive]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha256d-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install open-source RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile SHA256d primitive and dependencies
        run: iverilog -g2012 -s tb_brain_sha256d_256 -o /tmp/brain_sha256d.vvp brain_v12/asic/rtl/brain_sha256_compress.sv brain_v12/asic/rtl/brain_sha256d_256.sv brain_v12/asic/rtl/tb_brain_sha256d_256.sv
      - name: Run independent SHA256d known-vector test
        run: vvp /tmp/brain_sha256d.vvp
