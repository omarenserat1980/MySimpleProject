name: Brain Cloud Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Brain V12 dependencies
        run: python -m pip install -r brain_v12/requirements.txt
      - name: Compile Brain
        run: python -m compileall -q brain_v12 cloud
      - name: Validate Brain Chat
        run: python -m pytest -q brain_v12/tests/test_brain_chat_contract.py
      - name: Validate Cloud supervisor syntax
        run: python -m py_compile cloud/brain_cloud.py cloud/api_server.py
