name: Electronic Brain Cinematic Factory

on:
  push:
    paths:
      - "production/REQUEST.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Film duration in seconds"
        required: true
        default: "60"
      resume:
        description: "Resume verified shots from previous state"
        required: true
        type: boolean
        default: true
      brain_runtime_minutes:
        description: "Brain autonomous test window (minutes)"
        required: true
        type: choice
        default: "5"
        options: ["5","10","15","20","30","60","120","180","240","300","360"]

permissions:
  contents: read
  actions: read

concurrency:
  group: electronic-brain-cinematic-production
  cancel-in-progress: true

jobs:
  cinematic-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FACTORY_ALLOW_PRODUCTION: "1"
      FACTORY_MODEL_ROUTER: "1"
      FACTORY_MODEL: "auto"
      FACTORY_DURATION_SECONDS: ${{ inputs.duration || '60' }}
      FACTORY_ALLOW_YOUTUBE_PUBLISH: "0"
      FACTORY_MIN_QUALITY: "0.82"
      MEDIA_PROVIDER_URL: ${{ secrets.MEDIA_PROVIDER_URL }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
      COMFYUI_WORKFLOW_JSON: ${{ secrets.COMFYUI_WORKFLOW_JSON }}
      FAL_MODEL: "fal-ai/kling-video/v3/pro/text-to-video"
      FAL_SHOT_DURATION: "5"
      FAL_GENERATE_AUDIO: "1"
      FAL_VISION_QC: "1"
      FACTORY_OUTPUT_DIR: "cinematic_output"
      MEDIA_PROVIDER_API_KEY: ${{ secrets.MEDIA_PROVIDER_API_KEY }}
      MEDIA_PROVIDER_TIMEOUT_SECONDS: "900"
      MEDIA_PROVIDER_POLL_SECONDS: "4"
      MEDIA_PROVIDER_MAX_POLLS: "120"
      FACTORY_SPEED_MODE: "max"
      FACTORY_MAX_CONCURRENCY: "12"
      FACTORY_RENDER_CONCURRENCY: "12"
      FACTORY_ADAPTIVE_CONCURRENCY: "1"
      FACTORY_ONE_SHOT: "1"
      BRAIN_MAX_ITERATIONS: "1000000"
      BRAIN_MAX_RUNTIME_SECONDS: "300"
      FACTORY_REQUIRE_REAL_MEDIA: "1"
      FACTORY_ALLOW_LOCAL_FALLBACK: "1"
      FACTORY_EMERGENCY_LOCAL_FALLBACK: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Electronic Brain
        uses: actions/checkout@v4

      - name: Configure Brain autonomy window
        run: |
          set -euo pipefail
          minutes="${{ inputs.brain_runtime_minutes || '5' }}"
          case "$minutes" in
            5) seconds=300;; 10) seconds=600;; 15) seconds=900;; 20) seconds=1200;;
            30) seconds=1800;; 60) seconds=3600;; 120) seconds=7200;; 180) seconds=10800;;
            240) seconds=14400;; 300) seconds=18000;; 360) seconds=21600;;
            *) echo "::error::Unsupported Brain runtime: $minutes minutes"; exit 1;;
          esac
          echo "BRAIN_MAX_RUNTIME_SECONDS=$seconds" >> "$GITHUB_ENV"
          echo "BRAIN_MAX_ITERATIONS=1000000" >> "$GITHUB_ENV"

      - name: Load production request duration
        run: |
          python - <<'PY'
          import json, os
          with open("production/REQUEST.json", encoding="utf-8") as fh:
              req=json.load(fh)
          duration=max(1,min(600,int(req.get("duration_seconds",60))))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"FACTORY_DURATION_SECONDS={duration}\n")
          print(f"FACTORY_DURATION_SECONDS={duration}")
          PY

      - name: Restore factory checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          run_id="$(gh run list --workflow electronic-brain-cinematic.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --name cinematic-factory-state --dir .factory_resume || true
            if [ -f .factory_resume/.factory_state.json ]; then cp .factory_resume/.factory_state.json .factory_state.json; fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Install factory dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f brain_v7/requirements.txt ]; then pip install -r brain_v7/requirements.txt; fi

      - name: Preflight free media backend
        run: |
          set -euo pipefail
          if [ -z "$FAL_KEY" ] && [ -z "$MEDIA_PROVIDER_URL" ] && [ -z "$COMFYUI_URL" ] && [ "$FACTORY_ALLOW_LOCAL_FALLBACK" != "1" ]; then
            echo "::error::No free media backend configured."
            exit 1
          fi
          echo "Free-only media profile enabled."

      - name: Run Code Self-Healer
        run: |
          set -euo pipefail
          python -m brain_v7.braincore_v2.code_self_healer | tee code_self_healer_stdout.json
          test -s code_self_healer_report.json

      - name: Validate cinematic brain modules
        run: |
          python -m compileall -q brain_v7/braincore_v2
          python -m compileall -q brain_v12
          python -m pytest -q brain_v7/braincore_v2/test_factory_repair_app.py brain_v7/braincore_v2/test_code_self_healer.py

      - name: Run Factory Repair App
        run: |
          set -euo pipefail
          FACTORY_REPAIR_100=1 python -m brain_v7.braincore_v2.factory_repair_app | tee factory_repair_stdout.json
          test -s factory_repair_100_report.json
          python - <<'PY'
          import json, os
          report=json.load(open("factory_repair_100_report.json",encoding="utf-8"))
          status=report.get("status")
          if status=="REPAIR_LIMIT_REACHED":
              raise SystemExit("SELF_HEALING_FAILED: 100 repair cycles exhausted")
          history=report.get("history") or []
          route=(history[-1].get("diagnosis") or {}).get("recommended_route") if history else None
          if route and route != "configuration_required":
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
                  fh.write(f"FACTORY_MEDIA_ROUTE={route}\n")
              print(f"Persisted FACTORY_MEDIA_ROUTE={route}")
          print(json.dumps({"status":status,"cycles_completed":report.get("cycles_completed"),"route":route},ensure_ascii=False))
          PY

      - name: Run Electronic Brain Cinematic Factory
        run: |
          set -o pipefail
          python -m brain_v7.braincore_v2.background_factory_worker | tee factory_result.json

      - name: Verify final film artifact and content
        if: success()
        run: |
          set -euo pipefail
          test -f cinematic_output/final.mp4
          test -s cinematic_output/final.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json cinematic_output/final.mp4 > final_probe.json
          python - <<'PY'
          import json, subprocess, re
          data=json.load(open("final_probe.json"))
          duration=float(data["format"].get("duration") or 0)
          streams=data.get("streams") or []
          video=next((s for s in streams if s.get("codec_type")=="video"),None)
          audio=next((s for s in streams if s.get("codec_type")=="audio"),None)
          if not video or not audio or duration < 1 or video.get("width",0)<640 or video.get("height",0)<360:
              raise SystemExit("FINAL_QC_FAILED: missing valid video/audio content")
          r=subprocess.run(["ffmpeg","-v","info","-i","cinematic_output/final.mp4","-vf","blackdetect=d=0.5:pix_th=0.98","-an","-f","null","-"],capture_output=True,text=True,timeout=180)
          black=sum(float(x) for x in re.findall(r"black_duration:([0-9.]+)",r.stderr or ""))
          ratio=black/duration
          print(f"duration={duration:.2f}s black_ratio={ratio:.3f}")
          if ratio >= 0.90:
              raise SystemExit("FINAL_QC_FAILED: final.mp4 is effectively black/empty")
          PY

      - name: Save resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-factory-state
          path: |
            .factory_state.json
            task_stack.json
            world_state.json
            cinematic_manifest.json
            cinematic_project_manifest.json
            factory_result.json
            cinema_engine_v6_manifest.json
            factory_repair_100_report.json
            factory_repair_stdout.json
            code_self_healer_report.json
            code_self_healer_stdout.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload final film
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-film
          path: "**/final.mp4"
          if-no-files-found: ignore
          retention-days: 30
