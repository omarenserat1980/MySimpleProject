name: Electronic Brain Cinematic Factory

on:
  push:
    paths:
      - "production/REQUEST.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Film duration in seconds"
        required: true
        default: "60"
      resume:
        description: "Resume verified shots from previous state"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Never let two cinematic production runs compete for the same provider,
# checkpoint, or output directory.
concurrency:
  group: electronic-brain-cinematic-production
  cancel-in-progress: true

jobs:
  cinematic-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FACTORY_ALLOW_PRODUCTION: "1"
      FACTORY_MODEL_ROUTER: "1"
      FACTORY_MODEL: "auto"
      FACTORY_DURATION_SECONDS: ${{ inputs.duration || '60' }}
      FACTORY_ALLOW_YOUTUBE_PUBLISH: "0"
      FACTORY_MIN_QUALITY: "0.82"
      MEDIA_PROVIDER_URL: ${{ secrets.MEDIA_PROVIDER_URL }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_MODEL: "fal-ai/kling-video/v3/pro/text-to-video"
      FAL_SHOT_DURATION: "5"
      FAL_GENERATE_AUDIO: "1"
      FAL_VISION_QC: "1"
      FACTORY_OUTPUT_DIR: "cinematic_output"
      MEDIA_PROVIDER_API_KEY: ${{ secrets.MEDIA_PROVIDER_API_KEY }}
      MEDIA_PROVIDER_TIMEOUT_SECONDS: "900"
      MEDIA_PROVIDER_POLL_SECONDS: "4"
      MEDIA_PROVIDER_MAX_POLLS: "120"
      FACTORY_SPEED_MODE: "max"
      FACTORY_MAX_CONCURRENCY: "12"
      FACTORY_RENDER_CONCURRENCY: "12"
      FACTORY_ADAPTIVE_CONCURRENCY: "1"
      FACTORY_ONE_SHOT: "1"
      # Pass the ephemeral GitHub Actions token to Python code that calls the GitHub API.
      # This fixes 401 Requires authentication without storing a PAT in the repository.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Electronic Brain
        uses: actions/checkout@v4

      - name: Load production request duration
        run: |
          python - <<'PY'
          import json, os
          p = "production/REQUEST.json"
          with open(p, "r", encoding="utf-8") as fh:
              req = json.load(fh)
          duration = int(req.get("duration_seconds", 60))
          duration = max(1, min(600, duration))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"FACTORY_DURATION_SECONDS={duration}\n")
          print(f"FACTORY_DURATION_SECONDS={duration}")
          PY
      - name: Restore factory checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          run_id="$(gh run list --workflow electronic-brain-cinematic.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --name cinematic-factory-state --dir .factory_resume || true
            if [ -f .factory_resume/.factory_state.json ]; then cp .factory_resume/.factory_state.json .factory_state.json; fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Install factory dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f brain_v7/requirements.txt ]; then pip install -r brain_v7/requirements.txt; fi
          pip install fal-client

      - name: Validate cinematic brain modules
        run: |
          python -m compileall -q brain_v7/braincore_v2
          python -m compileall -q brain_v12

      - name: Run Electronic Brain Cinematic Factory
        run: |
          set -o pipefail
          python -m brain_v7.braincore_v2.background_factory_worker | tee factory_result.json

      - name: Verify final film artifact
        if: success()
        run: |
          test -f cinematic_output/final.mp4
          test -s cinematic_output/final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 cinematic_output/final.mp4

      - name: Save resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-factory-state
          path: |
            .factory_state.json
            task_stack.json
            world_state.json
            cinematic_manifest.json
            cinematic_project_manifest.json
            factory_result.json
            cinema_engine_v6_manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload final film
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-film
          path: "**/final.mp4"
          if-no-files-found: ignore
          retention-days: 30
