name: Brain Plugin Verification

on:
  push:
    paths:
      - "plugins/brain-autopilot/**"
      - "brain_v12/tests/test_brain_autopilot_plugin.py"
      - ".github/workflows/brain-plugin-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q brain_v12/tests
      - name: Plugin test
        run: python -m unittest brain_v12.tests.test_brain_autopilot_plugin -v
      - name: Manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("plugins/brain-autopilot/plugin.json").read_text(encoding="utf-8"))
          assert data["name"] == "brain-autopilot"
          print("plugin manifest valid")
          PY
      - name: Evidence
        run: |
          mkdir -p brain-artifacts
          printf '%s\n' "BRAIN_PLUGIN_AUTOPILOT_VERIFIED" > brain-artifacts/PLUGIN_VERIFIED.txt
          test -s brain-artifacts/PLUGIN_VERIFIED.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-plugin-autopilot-verified
          path: brain-artifacts/PLUGIN_VERIFIED.txt
