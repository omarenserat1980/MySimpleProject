name: Brain Security Hardening

on:
  workflow_dispatch:
  push:
    paths:
      - "brain_v12/**"
      - "cloud/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: brain-security-hardening
  cancel-in-progress: true

jobs:
  defensive-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q brain_v12 cloud
      - name: Security unit tests
        run: PYTHONPATH=. python -m pytest -q brain_v12/tests/test_security_guard.py brain_v12/tests/test_security_hardening.py brain_v12/tests/test_founder_identity_protection.py brain_v12/tests/test_legal_handoff.py
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.pyc' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}|sk-[A-Za-z0-9_-]{12,})' .; then
            echo "SECURITY_SECRET_SCAN=FAILED"
            exit 1
          fi
          echo "SECURITY_SECRET_SCAN=PASS"
      - name: Security policy evidence
        run: |
          test -s docs/BRAIN_SECURITY_HARDENING.md
          echo "SECURITY_POLICY=VERIFIED"
          echo "AUTONOMY_SECURITY_BOUNDARY=VERIFIED"
