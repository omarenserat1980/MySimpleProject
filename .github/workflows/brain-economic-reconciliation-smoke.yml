name: BRAIN Economic Reconciliation Smoke

on:
  push:
    branches: [feat/brain-economic-ledger-reconciliation]
    paths:
      - "brain_v12/brain/economic_reconciliation.py"
      - "brain_v12/tests/test_economic_reconciliation.py"
      - "brain_v12/app.py"
      - ".github/workflows/brain-economic-reconciliation-smoke.yml"
  pull_request:
    paths:
      - "brain_v12/brain/economic_reconciliation.py"
      - "brain_v12/tests/test_economic_reconciliation.py"
      - "brain_v12/app.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest brain_v12.tests.test_economic_reconciliation -v
