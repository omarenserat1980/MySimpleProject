name: Brain AI Live API Smoke

on:
  pull_request:
    paths:
      - "brain_v12/app.py"
      - "brain_v12/brain/brain_ai.py"
      - "brain_v12/brain/brain_ai_api.py"
      - "brain_v12/brain/brain_gpt_20_layer_*.py"
      - "brain_v12/brain/chat_session_store.py"
      - "requirements.txt"
      - ".github/workflows/brain-ai-live-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-ai-live-api-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Start Brain API and verify live layer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn brain_v12.app:app --host 127.0.0.1 --port 8012 > /tmp/brain-ai-live-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 \
              http://127.0.0.1:8012/api/brain-ai/layers/status \
              --output /tmp/brain-ai-layer-status.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/brain-ai-live-smoke.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/brain-ai-live-smoke.log
            echo "Brain API did not serve the layer status endpoint within 30 seconds." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/brain-ai-layer-status.json").read_text())
          assert payload.get("architecture_layers") == 20, payload
          assert len(payload.get("layers", [])) == 20, payload
          assert payload.get("execution_performed") is False, payload
          assert payload.get("ready") is False, "Unwired layers must not be reported ready"
          assert payload.get("status") == "INTEGRATION_INCOMPLETE", payload
          print("LIVE_API_SMOKE=PASS")
          print("architecture_layers=20")
          print("runtime_status=INTEGRATION_INCOMPLETE (honest fail-closed status)")
          print("execution_performed=false")
          PY
