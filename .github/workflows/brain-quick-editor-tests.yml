name: brain-quick-editor-tests

on:
  push:
    paths:
      - 'brain_v12/app.py'
      - 'brain_v12/web/quick-editor.html'
      - 'brain_v12/tests/test_quick_editor.py'
      - 'brain_v12/requirements.txt'
      - '.github/workflows/brain-quick-editor-tests.yml'
  pull_request:
    paths:
      - 'brain_v12/app.py'
      - 'brain_v12/web/quick-editor.html'
      - 'brain_v12/tests/test_quick_editor.py'
      - 'brain_v12/requirements.txt'

permissions:
  contents: read

jobs:
  quick-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r brain_v12/requirements.txt
      - name: Compile
        run: python -m compileall -q brain_v12
      - name: Quick Editor tests
        run: python -m unittest brain_v12.tests.test_quick_editor -v
      - name: Validate UI
        run: python - <<'PY'
          from pathlib import Path
          p=Path("brain_v12/web/quick-editor.html")
          text=p.read_text(encoding="utf-8")
          required=["/api/quick-editor/read","/api/quick-editor/validate","/api/quick-editor/write","BRAIN Quick Editor"]
          missing=[x for x in required if x not in text]
          raise SystemExit("Missing UI contracts: "+", ".join(missing) if missing else 0)
          PY
