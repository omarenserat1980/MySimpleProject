name: Bitcoin SHA-256 compression RTL
on:
  pull_request:
    paths:
      - "brain_v12/brain/rtl_simulator_adapter.py"
      - "brain_v12/brain/asic_resource_adapter.py"
      - "brain_v12/brain/asic_simulator_api.py"
      - "brain_v12/brain/brain_mcp.py"
      - "brain_v12/web/brain-chat-simulator.html"
      - "brain_v12/tests/test_rtl_simulator_adapter.py"
      - "brain_v12/tests/test_asic_resource_adapter.py"
      - "brain_v12/asic/rtl/sha256_compress.sv"
      - "brain_v12/asic/rtl/tb_sha256_compress.sv"
      - "brain_v12/asic/rtl/sha256d_header_hash.sv"
      - "brain_v12/asic/rtl/tb_sha256d_header_hash.sv"
      - "brain_v12/asic/rtl/bitcoin_pow_target_check.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_pow_target_check.sv"
      - "brain_v12/asic/rtl/bitcoin_nonce_sweep.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_nonce_sweep.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_genesis_nonce_search.sv"
      - "docs/BITCOIN_SHA256_COMPRESSION_RTL.md"
      - "brain_v12/asic/tools/benchmark_sha256d.py"
      - "brain_v12/asic/tests/test_benchmark_sha256d.py"
      - ".github/workflows/bitcoin-sha256-rtl.yml"
  push:
    branches:
      - "feat/bitcoin-sha256-compress-rtl"
      - "brain-sha256d-evidence-benchmark"
    paths:
      - "brain_v12/brain/rtl_simulator_adapter.py"
      - "brain_v12/brain/asic_resource_adapter.py"
      - "brain_v12/brain/asic_simulator_api.py"
      - "brain_v12/brain/brain_mcp.py"
      - "brain_v12/tests/test_rtl_simulator_adapter.py"
      - "brain_v12/tests/test_asic_resource_adapter.py"
      - "brain_v12/asic/rtl/sha256_compress.sv"
      - "brain_v12/asic/rtl/tb_sha256_compress.sv"
      - "brain_v12/asic/rtl/sha256d_header_hash.sv"
      - "brain_v12/asic/rtl/tb_sha256d_header_hash.sv"
      - "brain_v12/asic/rtl/bitcoin_pow_target_check.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_pow_target_check.sv"
      - "brain_v12/asic/rtl/bitcoin_nonce_sweep.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_nonce_sweep.sv"
      - "brain_v12/asic/rtl/tb_bitcoin_genesis_nonce_search.sv"
      - "docs/BITCOIN_SHA256_COMPRESSION_RTL.md"
      - "brain_v12/asic/tools/benchmark_sha256d.py"
      - "brain_v12/asic/tests/test_benchmark_sha256d.py"
      - ".github/workflows/bitcoin-sha256-rtl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha256-compression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V
      - name: Compile and verify compression against known digest
        run: |
          set -euo pipefail
          mkdir -p artifacts/sha256-rtl
          iverilog -g2012 -Wall -s tb_sha256_compress -o artifacts/sha256-rtl/tb.vvp brain_v12/asic/rtl/sha256_compress.sv brain_v12/asic/rtl/tb_sha256_compress.sv
          vvp artifacts/sha256-rtl/tb.vvp | tee artifacts/sha256-rtl/simulation.log
          grep -q ALL_SHA256_RTL_TESTS_PASSED artifacts/sha256-rtl/simulation.log
          iverilog -g2012 -Wall -s tb_sha256d_header_hash -o artifacts/sha256-rtl/sha256d.vvp brain_v12/asic/rtl/sha256_compress.sv brain_v12/asic/rtl/sha256d_header_hash.sv brain_v12/asic/rtl/tb_sha256d_header_hash.sv
          vvp artifacts/sha256-rtl/sha256d.vvp | tee artifacts/sha256-rtl/sha256d-simulation.log
          grep -q ALL_SHA256D_HEADER_RTL_TESTS_PASSED artifacts/sha256-rtl/sha256d-simulation.log
          iverilog -g2012 -Wall -s tb_bitcoin_pow_target_check -o artifacts/sha256-rtl/target-check.vvp brain_v12/asic/rtl/bitcoin_pow_target_check.sv brain_v12/asic/rtl/tb_bitcoin_pow_target_check.sv
          vvp artifacts/sha256-rtl/target-check.vvp | tee artifacts/sha256-rtl/target-check-simulation.log
          grep -q ALL_BITCOIN_TARGET_CHECK_TESTS_PASSED artifacts/sha256-rtl/target-check-simulation.log
          iverilog -g2012 -Wall -s tb_bitcoin_nonce_sweep -o artifacts/sha256-rtl/nonce-sweep.vvp brain_v12/asic/rtl/sha256_compress.sv brain_v12/asic/rtl/sha256d_header_hash.sv brain_v12/asic/rtl/bitcoin_pow_target_check.sv brain_v12/asic/rtl/bitcoin_nonce_sweep.sv brain_v12/asic/rtl/tb_bitcoin_nonce_sweep.sv
          vvp artifacts/sha256-rtl/nonce-sweep.vvp | tee artifacts/sha256-rtl/nonce-sweep-simulation.log
          grep -q ALL_NONCE_SWEEP_TESTS_PASSED artifacts/sha256-rtl/nonce-sweep-simulation.log
          iverilog -g2012 -Wall -s tb_bitcoin_genesis_nonce_search -o artifacts/sha256-rtl/genesis-search.vvp brain_v12/asic/rtl/sha256_compress.sv brain_v12/asic/rtl/sha256d_header_hash.sv brain_v12/asic/rtl/bitcoin_pow_target_check.sv brain_v12/asic/rtl/bitcoin_nonce_sweep.sv brain_v12/asic/rtl/tb_bitcoin_genesis_nonce_search.sv
          vvp artifacts/sha256-rtl/genesis-search.vvp | tee artifacts/sha256-rtl/genesis-search-simulation.log
          grep -q ALL_GENESIS_NONCE_SEARCH_TESTS_PASSED artifacts/sha256-rtl/genesis-search-simulation.log
      - name: Test Brain RTL adapter and evidence contract
        run: |
          set -euo pipefail
          python3 -m pip install pytest
          python3 -m pytest -q brain_v12/tests/test_rtl_simulator_adapter.py brain_v12/tests/test_asic_resource_adapter.py
          python3 - <<'PY'
          from brain_v12.brain.rtl_simulator_adapter import run_sha256d_rtl_self_test
          result = run_sha256d_rtl_self_test(timeout_seconds=20)
          assert result.get("status") == "VERIFIED", result
          assert result.get("rtl_executed") is True, result
          assert result.get("evidence_status") == "RTL_SIMULATION_VERIFIED", result
          assert result.get("physical_asic_executed") is False, result
          print("BRAIN_RTL_ADAPTER_E2E_VERIFIED", result["known_answer"])
          PY
      - name: Benchmark host CPU SHA256d baseline (not mining hardware)
        run: |
          set -euo pipefail
          mkdir -p artifacts/sha256-rtl
          python3 -m unittest brain_v12/asic/tests/test_benchmark_sha256d.py
          python3 brain_v12/asic/tools/benchmark_sha256d.py --count 10000 | tee artifacts/sha256-rtl/host-cpu-sha256d-benchmark.json
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/sha256-rtl/host-cpu-sha256d-benchmark.json").read_text())
          print("## Host CPU SHA256d software baseline")
          print(f"- Median: **{result['median_hashes_per_second']} hashes/s**")
          print(f"- Samples: {result['repeats']} × {result['hashes_per_sample']} hashes")
          print("- Scope: host CPU software only; not RTL, ASIC, live mining, or revenue evidence.")
          PY
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-sha256-rtl-evidence
          path: artifacts/sha256-rtl/
          if-no-files-found: warn
