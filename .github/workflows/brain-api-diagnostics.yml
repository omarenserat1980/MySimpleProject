name: Brain API Diagnostics

on:
  push:
    branches:
      - brain/simulated-api-diagnostics
  pull_request:
    paths:
      - "brain_v12/brain/api_failure_simulator.py"
      - "brain_v12/tools/brain_runtime_launcher.sh"
      - "brain_v12/tests/test_api_failure_simulator.py"
      - "brain_v12/tests/test_runtime_launcher_static.py"

permissions:
  contents: read

jobs:
  simulation-and-launcher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check launcher syntax
        run: bash -n brain_v12/tools/brain_runtime_launcher.sh
      - name: Run simulation and launcher tests
        run: |
          python -m unittest -v \
            brain_v12.tests.test_api_failure_simulator \
            brain_v12.tests.test_runtime_launcher_static
