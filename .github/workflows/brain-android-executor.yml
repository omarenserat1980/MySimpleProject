name: Brain Android Executor CI

on:
  push:
    paths:
      - "android_executor/**"
  pull_request:
    paths:
      - "android_executor/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_executor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-android-executor-debug
          path: android_executor/app/build/outputs/apk/debug/app-debug.apk
