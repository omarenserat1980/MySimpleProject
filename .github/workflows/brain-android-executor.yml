name: Brain Android Executor CI

on:
  push:
    paths:
      - "android_executor/**"
      - ".github/workflows/brain-android-executor.yml"
  pull_request:
    paths:
      - "android_executor/**"
      - ".github/workflows/brain-android-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_executor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Verify Gradle configuration
        run: gradle --no-daemon help
      - name: Compile Kotlin sources
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-android-executor-debug
          path: android_executor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
