name: Open-source Tool Discovery Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/open_source_registry.py"
      - "brain_v12/tests/test_open_source_registry.py"
      - "brain_v12/app.py"
      - ".github/workflows/open-source-tool-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install "httpx<0.28"
      - name: Compile registry, API, and tests
        run: python -m py_compile brain_v12/brain/open_source_registry.py brain_v12/app.py brain_v12/tests/test_open_source_registry.py
      - name: Run mocked registry tests
        run: python -m unittest brain_v12.tests.test_open_source_registry -v
