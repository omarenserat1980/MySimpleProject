name: BRAIN PayPal Sandbox Adapter Tests

on:
  pull_request:
    paths:
      - "brain/provider_hub/paypal_adapter.py"
      - "brain/provider_hub/test_paypal_adapter.py"
      - ".github/workflows/brain-paypal-sandbox.yml"
  push:
    branches: ["feat/paypal-sandbox-adapter"]
    paths:
      - "brain/provider_hub/paypal_adapter.py"
      - "brain/provider_hub/test_paypal_adapter.py"
      - ".github/workflows/brain-paypal-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paypal-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated PayPal adapter tests
        run: python -m unittest brain.provider_hub.test_paypal_adapter -v
      - name: Record verification boundary
        run: |
          echo "PAYPAL_ADAPTER_UNIT_TESTS=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "NETWORK_SANDBOX_TRANSACTION=NOT_PERFORMED" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_PAYMENT=NOT_PERFORMED" >> "$GITHUB_STEP_SUMMARY"
