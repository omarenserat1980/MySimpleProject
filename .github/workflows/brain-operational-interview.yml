name: Brain Operational Interview

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud/brain_interview.py"
      - "cloud/brain_self_assessment.py"
      - "cloud/test_brain_interview.py"

permissions:
  contents: read

jobs:
  interview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run interview tests
        run: python -m pytest -q cloud/test_brain_interview.py
      - name: Generate Brain interview report
        run: python -m cloud.brain_interview > brain-interview-report.json
      - name: Upload interview evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-operational-interview
          path: brain-interview-report.json
