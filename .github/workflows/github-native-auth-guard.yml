name: Brain GitHub Native Auth Guard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify built-in GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY" >/tmp/repo.json
          python -c 'import json; d=json.load(open("/tmp/repo.json")); assert d["full_name"]==__import__("os").environ["GITHUB_REPOSITORY"]; print("GITHUB_TOKEN_AUTH=PASS")'
      - name: Verify Brain auth helper
        run: python brain_v12/auth/github_native_auth.py