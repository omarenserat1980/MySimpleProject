name: Brain Bitcoin 80-byte Header SHA256d RTL Gate

on:
  push:
    branches:
      - feat/bitcoin-header-sha256d
  pull_request:
    branches:
      - main
      - feat/bitcoin-sha256d-primitive
    paths:
      - "brain_v12/asic/rtl/brain_sha256_compress.sv"
      - "brain_v12/asic/rtl/brain_bitcoin_header_sha256d.sv"
      - "brain_v12/asic/rtl/tb_brain_bitcoin_header_sha256d.sv"
      - ".github/workflows/brain-bitcoin-header-sha256d-rtl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-sha256d-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install open-source RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile Bitcoin header SHA256d RTL
        run: |
          iverilog -g2012 -s tb_brain_bitcoin_header_sha256d -o /tmp/brain-header-sha256d.vvp \
            brain_v12/asic/rtl/brain_sha256_compress.sv \
            brain_v12/asic/rtl/brain_bitcoin_header_sha256d.sv \
            brain_v12/asic/rtl/tb_brain_bitcoin_header_sha256d.sv
      - name: Verify Bitcoin genesis block header vector
        run: vvp /tmp/brain-header-sha256d.vvp
