name: Windows Server 2025 Simulation Factory

on:
  push:
    branches:
      - main
    paths:
      - "brain_v12/brain/windows_server_2025_simulation_factory.py"
      - "brain_v12/brain/windows_server_2025_simulation_progress.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_progress.py"
      - "brain_v12/brain/windows_server_2025_simulation_api.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_factory.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_api.py"
      - "brain_v12/app.py"
      - "brain_v12/web/windows_server_2025_simulation.html"
      - ".github/workflows/windows-server-2025-simulation-factory.yml"
      - "docs/WINDOWS_SERVER_2025_SIMULATION_FACTORY.md"
  pull_request:
    paths:
      - "brain_v12/brain/windows_server_2025_simulation_factory.py"
      - "brain_v12/brain/windows_server_2025_simulation_progress.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_progress.py"
      - "brain_v12/brain/windows_server_2025_simulation_api.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_factory.py"
      - "brain_v12/tests/test_windows_server_2025_simulation_api.py"
      - "brain_v12/app.py"
      - "brain_v12/web/windows_server_2025_simulation.html"
      - ".github/workflows/windows-server-2025-simulation-factory.yml"
      - "docs/WINDOWS_SERVER_2025_SIMULATION_FACTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.100" "pydantic>=1.10"
      - name: Compile simulator and API
        run: |
          python -m py_compile \
            brain_v12/brain/windows_server_2025_simulation_factory.py \
            brain_v12/brain/windows_server_2025_simulation_progress.py \
            brain_v12/tests/test_windows_server_2025_simulation_progress.py \
            brain_v12/brain/windows_server_2025_simulation_api.py \
            brain_v12/tests/test_windows_server_2025_simulation_factory.py \
            brain_v12/tests/test_windows_server_2025_simulation_api.py \
            brain_v12/app.py
      - name: Run isolated simulation tests
        run: |
          PYTHONPATH=. python -m unittest \
            brain_v12.tests.test_windows_server_2025_simulation_factory \
            brain_v12.tests.test_windows_server_2025_simulation_progress \
            brain_v12.tests.test_windows_server_2025_simulation_api -v
      - name: Generate synthetic boot evidence report
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.windows_server_2025_simulation_factory import (
              simulate_windows_server_2025, render_markdown_report,
          )
          report = simulate_windows_server_2025("success")
          assert report.get("status") == "SIMULATED_BOOT_SUCCESS", report.get("status")
          assert report.get("execution_mode") == "SIMULATION_ONLY"
          assert report.get("real_windows_boot_verified") is False
          assert report.get("implementation_progress", {}).get("percent") == 30
          assert report["implementation_progress"].get("real_windows_boot_verified") is False
          print("SIMULATION_IMPLEMENTATION_PROGRESS=30%")
          verification = report.get("verification") or {}
          assert verification.get("ok") is True, verification
          Path("artifacts/windows-server-2025-simulated-boot.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          Path("artifacts/windows-server-2025-simulated-boot.md").write_text(
              render_markdown_report(report), encoding="utf-8"
          )
          print("SIMULATED_BOOT_SUCCESS")
          print("SIMULATION_ONLY_BOUNDARY=PASS")
          print("REAL_WINDOWS_BOOT_VERIFIED=false")
          print("REPORTS=artifacts/windows-server-2025-simulated-boot.{json,md}")
          PY
      - name: Generate synthetic scenario matrix
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from brain_v12.brain.windows_server_2025_simulation_factory import (
              SCENARIOS, simulate_windows_server_2025,
          )
          rows = []
          for scenario in sorted(SCENARIOS):
              report = simulate_windows_server_2025(scenario)
              assert report.get("execution_mode") == "SIMULATION_ONLY", scenario
              assert report.get("real_windows_boot_verified") is False, scenario
              assert report.get("side_effects_performed") is False, scenario
              assert report.get("external_resources_created") is False, scenario
              rows.append({
                  "scenario_id": scenario,
                  "status": report.get("status"),
                  "reason_code": report.get("reason_code"),
                  "recovery_status": report.get("recovery_status"),
                  "verification_ok": (report.get("verification") or {}).get("ok"),
                  "execution_mode": report.get("execution_mode"),
                  "real_windows_boot_verified": report.get("real_windows_boot_verified"),
              })
          matrix = {
              "schema": "electronic-brain.windows-server-2025-scenario-matrix.v1",
              "execution_mode": "SIMULATION_ONLY",
              "real_windows_boot_verified": False,
              "scenario_count": len(rows),
              "scenarios": rows,
          }
          Path("artifacts/windows-server-2025-scenario-matrix.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          lines = [
              "# Windows Server 2025 — Synthetic Scenario Matrix",
              "",
              "**Execution mode:** SIMULATION_ONLY",
              "**Real Windows boot verified:** false",
              f"**Scenarios evaluated:** {len(rows)}",
              "",
              "| Scenario | Result | Reason | Evidence chain verified |",
              "|---|---|---|---|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['scenario_id']} | {row['status']} | "
                  f"{row['reason_code'] or '—'} | {row['verification_ok']} |"
              )
          lines += ["", "All rows are software-model outcomes, not real Windows execution."]
          Path("artifacts/windows-server-2025-scenario-matrix.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print(f"SCENARIO_MATRIX_COUNT={len(rows)}")
          print("SIMULATION_ONLY_BOUNDARY=PASS")
          PY
      - name: Upload synthetic evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-2025-simulation-evidence
          path: artifacts/windows-server-2025-*
          if-no-files-found: error
          retention-days: 30
      - name: Verify simulation-only source boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("brain_v12/brain/windows_server_2025_simulation_factory.py").read_text()
          api = Path("brain_v12/brain/windows_server_2025_simulation_api.py").read_text()
          forbidden = ("subprocess.", "Popen(", "os.system(", "requests.", "httpx.", "boto3.", "azure.mgmt")
          assert not any(token in source for token in forbidden), "simulator has an external execution/network call"
          assert 'real_windows_boot_verified": False' in source
          assert '"SIMULATION_ONLY"' in source
          assert "require_control_key(request)" in api
          assert "windows-server-2025-real-boot" in source
          print("SIMULATION_ONLY_BOUNDARY=PASS")
          PY
