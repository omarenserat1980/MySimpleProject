name: Autonomous Pipeline Hosted Runner Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/autonomous-pipeline-runner-gate.yml"

permissions:
  contents: read

jobs:
  runner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hosted runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v bash
          command -v python3
          python3 --version
          echo "BRAIN_EXECUTION_MODE=GITHUB_HOSTED_SOFTWARE"
          echo "AUTONOMOUS_PIPELINE_RUNNER_GATE=PASS"

      - name: Upload gate evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "runner_environment=$RUNNER_ENVIRONMENT" \
            "runner_os=$RUNNER_OS" \
            "runner_arch=$RUNNER_ARCH" \
            "hardware_dependency=NONE" \
            "autonomous_pipeline_runner_gate=PASS" \
            > runner-gate-evidence.txt
          cat runner-gate-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-pipeline-hosted-runner-gate
          path: runner-gate-evidence.txt
          if-no-files-found: error
