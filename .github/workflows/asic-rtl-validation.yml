name: ASIC RTL validation and cloud worker

on:
  pull_request:
    paths:
      - "brain_v12/asic/**"
      - ".github/workflows/asic-rtl-validation.yml"
  push:
    branches:
      - "feature/advanced-asic-prototype"
    paths:
      - "brain_v12/asic/**"
      - ".github/workflows/asic-rtl-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-simulation-and-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source RTL tools on the ephemeral runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V

      - name: Compile and run legacy ASIC core self-test
        run: |
          set -euo pipefail
          mkdir -p artifacts/asic
          iverilog -g2012 -Wall -s tb_brain_asic_core \
            -o artifacts/asic/brain_asic_tb.vvp \
            brain_v12/asic/rtl/brain_asic_core.sv \
            brain_v12/asic/rtl/tb_brain_asic_core.sv
          vvp artifacts/asic/brain_asic_tb.vvp | tee artifacts/asic/rtl-simulation.log
          grep -q "ALL_RTL_TESTS_PASSED" artifacts/asic/rtl-simulation.log

      - name: Compile and run Bitcoin SHA-256 compression vector
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_brain_sha256_compress \
            -o artifacts/asic/sha256-compress.vvp \
            brain_v12/asic/rtl/brain_sha256_compress.sv \
            brain_v12/asic/rtl/tb_brain_sha256_compress.sv
          vvp artifacts/asic/sha256-compress.vvp | tee artifacts/asic/sha256-compress.log
          grep -q "PASS: SHA-256 empty-message compression vector" artifacts/asic/sha256-compress.log

      - name: Compile and run Bitcoin genesis SHA256d header vector
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_brain_bitcoin_header_sha256d \
            -o artifacts/asic/bitcoin-header-sha256d.vvp \
            brain_v12/asic/rtl/brain_sha256_compress.sv \
            brain_v12/asic/rtl/brain_bitcoin_header_sha256d.sv \
            brain_v12/asic/rtl/tb_brain_bitcoin_header_sha256d.sv
          vvp artifacts/asic/bitcoin-header-sha256d.vvp | tee artifacts/asic/bitcoin-header-sha256d.log
          grep -q "PASS: Bitcoin genesis 80-byte header SHA256d vector" artifacts/asic/bitcoin-header-sha256d.log

      - name: Compile and run Bitcoin target-comparator vectors
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_brain_bitcoin_target_check \
            -o artifacts/asic/bitcoin-target-check.vvp \
            brain_v12/asic/rtl/brain_bitcoin_target_check.sv \
            brain_v12/asic/rtl/tb_brain_bitcoin_target_check.sv
          vvp artifacts/asic/bitcoin-target-check.vvp | tee artifacts/asic/bitcoin-target-check.log
          grep -q "PASS: Bitcoin digest byte order and target comparator vectors" artifacts/asic/bitcoin-target-check.log

      - name: Compile and run bounded Bitcoin nonce-search tests
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_brain_bitcoin_nonce_search \
            -o artifacts/asic/bitcoin-nonce-search.vvp \
            brain_v12/asic/rtl/brain_sha256_compress.sv \
            brain_v12/asic/rtl/brain_bitcoin_header_sha256d.sv \
            brain_v12/asic/rtl/brain_bitcoin_target_check.sv \
            brain_v12/asic/rtl/brain_bitcoin_nonce_search.sv \
            brain_v12/asic/rtl/tb_brain_bitcoin_nonce_search.sv
          vvp artifacts/asic/bitcoin-nonce-search.vvp | tee artifacts/asic/bitcoin-nonce-search.log
          grep -q "PASS: bounded nonce search finds Bitcoin genesis header in one attempt" artifacts/asic/bitcoin-nonce-search.log
          grep -q "PASS: bounded nonce search stops after three unsuccessful attempts" artifacts/asic/bitcoin-nonce-search.log
          grep -q "PASS: nonce wrap boundary is handled within the configured attempt bound" artifacts/asic/bitcoin-nonce-search.log
          grep -q "PASS: zero-attempt request completes without hashing a nonce" artifacts/asic/bitcoin-nonce-search.log

      - name: Prepare Python software-model worker
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cloud ASIC worker — run software simulator regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          mkdir -p artifacts/asic
          python -m pytest brain_v12/tests/test_asic_hardware_simulator.py -q \
            | tee artifacts/asic/software-simulator-tests.log
          grep -Eq "[0-9]+ passed" artifacts/asic/software-simulator-tests.log

      - name: Synthesize legacy ASIC core with Yosys
        run: |
          set -euo pipefail
          yosys -p 'read_verilog -sv brain_v12/asic/rtl/brain_asic_core.sv; hierarchy -top brain_asic_core; proc; opt; check; stat; write_json artifacts/asic/brain_asic_core.json' \
            2>&1 | tee artifacts/asic/yosys-synthesis.log
          grep -Eq "Found and reported 0 problems|Number of problems: 0" artifacts/asic/yosys-synthesis.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asic-rtl-evidence
          path: artifacts/asic/
          if-no-files-found: warn
