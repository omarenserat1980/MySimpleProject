name: ASIC RTL validation and internal component health

on:
  pull_request:
    paths:
      - "brain_v12/asic/**"
      - "brain_v12/brain/asic_hardware_simulator.py"
      - "brain_v12/tests/test_asic_hardware_simulator.py"
      - ".github/workflows/asic-rtl-validation.yml"
  push:
    branches:
      - "feature/advanced-asic-prototype"
      - "brain-hybrid-asic"
      - "brain/hybrid-resource-fabric-*"
    paths:
      - "brain_v12/asic/**"
      - "brain_v12/brain/asic_hardware_simulator.py"
      - "brain_v12/tests/test_asic_hardware_simulator.py"
      - ".github/workflows/asic-rtl-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asic-internal-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source RTL toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install --disable-pip-version-check pytest
          iverilog -V
          vvp -V
          yosys -V

      - name: Run complete internal ASIC healthcheck
        run: bash brain_v12/asic/run_healthcheck.sh

      - name: Upload simulation, synthesis and health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asic-internal-health-evidence
          path: artifacts/asic/
          if-no-files-found: error
