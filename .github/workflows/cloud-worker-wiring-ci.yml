name: Cloud Worker Wiring Diagnostics
on:
  push:
    branches: [main, "feat/cloud-worker-wiring-diagnostics-20261011"]
    paths:
      - "tools/diagnose_cloud_worker_wiring.py"
      - "tools/test_diagnose_cloud_worker_wiring.py"
      - "tools/verify_cloud_worker_attestation_contract.py"
      - "tools/test_verify_cloud_worker_attestation_contract.py"
      - ".github/workflows/cloud-worker-wiring-ci.yml"
  pull_request:
    paths:
      - "tools/diagnose_cloud_worker_wiring.py"
      - "tools/test_diagnose_cloud_worker_wiring.py"
      - "tools/verify_cloud_worker_attestation_contract.py"
      - "tools/test_verify_cloud_worker_attestation_contract.py"
      - ".github/workflows/cloud-worker-wiring-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test read-only diagnostics
        run: |
          python -m unittest tools/test_diagnose_cloud_worker_wiring.py -v
          python -m unittest tools/test_verify_cloud_worker_attestation_contract.py -v
      - name: Compile diagnostics
        run: |
          python -m py_compile tools/diagnose_cloud_worker_wiring.py
          python -m py_compile tools/verify_cloud_worker_attestation_contract.py
