name: Brain Progress Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud/brain_progress.py"
      - "cloud/test_brain_progress.py"

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test progress contract
        run: python -m unittest cloud.test_brain_progress -v
      - name: Generate progress report
        run: python -m cloud.brain_progress | tee brain-progress.json
      - name: Publish progress evidence
        uses: actions/upload-artifact@v6
        with:
          name: brain-progress-evidence
          path: brain-progress.json
