name: Brain Pathway Engine Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/pathway_engine.py"
      - "brain_v12/tests/test_pathway_engine.py"
      - ".github/workflows/brain-pathway-engine-tests.yml"
  push:
    branches: [main, feat/brain-pathway-engine-v1]
    paths:
      - "brain_v12/brain/pathway_engine.py"
      - "brain_v12/tests/test_pathway_engine.py"
      - ".github/workflows/brain-pathway-engine-tests.yml"

permissions:
  contents: read

jobs:
  pathway-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence-gated pathways
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_pathway_engine -v
