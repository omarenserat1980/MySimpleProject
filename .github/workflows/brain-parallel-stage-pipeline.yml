name: Brain Parallel Stage Pipeline
on:
  push:
    paths:
      - "brain_v12/brain/parallel_stage_scheduler.py"
      - "brain_v12/tests/test_parallel_stage_scheduler.py"
      - ".github/workflows/brain-parallel-stage-pipeline.yml"
  pull_request:
    paths:
      - "brain_v12/brain/parallel_stage_scheduler.py"
      - "brain_v12/tests/test_parallel_stage_scheduler.py"
      - ".github/workflows/brain-parallel-stage-pipeline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q brain_v12/brain brain_v12/tests
      - name: Contract
        run: python -m unittest brain_v12.tests.test_parallel_stage_scheduler -v
      - name: Evidence
        run: |
          mkdir -p brain-artifacts
          printf '%s\n' "BRAIN_PARALLEL_STAGE_PIPELINE_VERIFIED" > brain-artifacts/PARALLEL_STAGE_PIPELINE_VERIFIED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: brain-parallel-stage-pipeline-verified
          path: brain-artifacts/PARALLEL_STAGE_PIPELINE_VERIFIED.txt
