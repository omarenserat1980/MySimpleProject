name: Brain Windows Integration Gate

on:
  push:
    branches:
      - brain-new-windows-integration-2026-10-13
  pull_request:
    branches:
      - main
    paths:
      - "brain_v12/brain/windows_contract_service.py"
      - "brain_v12/brain/fetch_windows_execution_contract.py"
      - "brain_v12/brain/windows_execution_contract_issuer.py"
      - "brain_v12/brain/owner_cryptographic_approval.py"
      - "brain_v12/brain/authority_signature.py"
      - "brain_v12/tests/test_windows_contract_service.py"
      - "brain_v12/tests/test_windows_contract_fetch.py"
      - "brain_v12/tests/test_windows_owner_approval_replay.py"
      - "brain_v12/tests/test_windows_execution_contract_issuer.py"
      - "brain_v12/tests/test_windows_contract_issuer_replay_integration.py"
      - "brain_v12/tests/test_windows_software_boot_gate.py"
      - "brain_v12/tests/test_software_resource_node.py"
      - ".github/workflows/brain-windows-real-boot.yml"

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check cryptography fastapi pytest
      - name: Compile Windows contract path
        run: |
          python -m py_compile             brain_v12/brain/windows_contract_service.py             brain_v12/brain/fetch_windows_execution_contract.py             brain_v12/brain/windows_execution_contract_issuer.py             brain_v12/brain/owner_cryptographic_approval.py             brain_v12/brain/authority_signature.py
      - name: Run contract security tests
        run: |
          python -m unittest             brain_v12.tests.test_windows_contract_service             brain_v12.tests.test_windows_contract_fetch             brain_v12.tests.test_windows_owner_approval_replay             brain_v12.tests.test_windows_execution_contract_issuer             brain_v12.tests.test_windows_contract_issuer_replay_integration
      - name: Run software execution and boot evidence gates
        run: |
          python -m pytest -q             brain_v12/tests/test_windows_software_boot_gate.py             brain_v12/tests/test_software_resource_node.py
      - name: Verify real-boot workflow remains fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/brain-windows-real-boot.yml")
          s = p.read_text(encoding="utf-8")
          required = [
              "windows-real-boot",
              "brain-cloud-executor",
              "BRAIN_AUTHORITY_PUBLIC_KEY_B64_PROTECTED",
              "BRAIN_WINDOWS_CONTROL_PLANE_URL_PROTECTED",
              "BRAIN_WINDOWS_CONTRACT_DELIVERY_KEY_PROTECTED",
              "/dev/kvm",
              "WINDOWS_BOOT_VERIFIED",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("REAL_BOOT_WORKFLOW_GUARD_MISSING=" + ",".join(missing))
          print("REAL_BOOT_WORKFLOW_GUARD=PASS")
          PY
