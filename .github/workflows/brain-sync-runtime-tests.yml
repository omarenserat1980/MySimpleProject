name: Brain Synchronization Runtime Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "brain_v12/brain/sync_engine.py"
      - "brain_v12/brain/sync_runtime.py"
      - "brain_v12/brain/task_sync_adapter.py"
      - "brain_v12/brain/device_sync_adapter.py"
      - "brain_v12/brain/sync_verification_gate.py"
      - "brain_v12/brain/device_bridge.py"
      - "brain_v12/tests/test_sync_engine.py"
      - "brain_v12/tests/test_sync_runtime.py"
      - "brain_v12/tests/test_task_sync_adapter.py"
      - "brain_v12/tests/test_sync_verification_gate.py"
      - "brain_v12/tests/test_device_sync_integration.py"
      - "brain_v12/self_healing/self_test_matrix.py"
      - ".github/workflows/brain-sync-runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/sync_engine.py"
      - "brain_v12/brain/sync_runtime.py"
      - "brain_v12/brain/task_sync_adapter.py"
      - "brain_v12/brain/device_sync_adapter.py"
      - "brain_v12/brain/sync_verification_gate.py"
      - "brain_v12/brain/device_bridge.py"
      - "brain_v12/tests/test_sync_engine.py"
      - "brain_v12/tests/test_sync_runtime.py"
      - "brain_v12/tests/test_task_sync_adapter.py"
      - "brain_v12/tests/test_sync_verification_gate.py"
      - "brain_v12/tests/test_device_sync_integration.py"
      - "brain_v12/self_healing/self_test_matrix.py"
      - ".github/workflows/brain-sync-runtime-tests.yml"

permissions:
  contents: read

jobs:
  sync-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile synchronization modules
        run: |
          python -m py_compile \
            brain_v12/brain/sync_engine.py \
            brain_v12/brain/sync_runtime.py \
            brain_v12/brain/task_sync_adapter.py \
            brain_v12/brain/device_sync_adapter.py \
            brain_v12/brain/sync_verification_gate.py \
            brain_v12/brain/device_bridge.py \
            brain_v12/tests/test_sync_engine.py \
            brain_v12/tests/test_sync_runtime.py \
            brain_v12/tests/test_task_sync_adapter.py \
            brain_v12/tests/test_sync_verification_gate.py \
            brain_v12/tests/test_device_sync_integration.py
      - name: Run synchronization tests
        run: |
          python -m unittest \
            brain_v12.tests.test_sync_engine \
            brain_v12.tests.test_sync_runtime \
            brain_v12.tests.test_task_sync_adapter \
            brain_v12.tests.test_sync_verification_gate \
            brain_v12.tests.test_device_sync_integration -v
      - name: Emit runtime gate evidence
        run: |
          echo "SYNC_RUNTIME_GATE=EXECUTED"
          echo "SYNC_RUNTIME_GATE_SEQUENCE=QUEUE->CLAIM->EXECUTE->EVIDENCE->RECONNECT->REPLAY->RECONCILE->DIGEST->VERIFIED"
          echo "SYNC_RUNTIME_GATE_FAIL_CLOSED=ENABLED"
