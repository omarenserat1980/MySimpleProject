name: Brain Mining Share Candidate Integration Test

on:
  pull_request:
    paths:
      - "brain_v12/brain/bitcoin_compact_target.py"
      - "brain_v12/brain/mining_share_candidate.py"
      - "brain_v12/brain/stratum_job_header.py"
      - "brain_v12/tests/test_mining_share_candidate_integration.py"
      - ".github/workflows/brain-mining-share-candidate-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mining-share-candidate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r cloud/requirements.txt
      - name: Run deterministic integration test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest brain_v12.tests.test_mining_share_candidate_integration -v
