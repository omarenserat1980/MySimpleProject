name: Device Bridge Source Checks

on:
  pull_request:
    paths:
      - "brain_v12/brain/device_bridge.py"
      - "brain_v12/app.py"
      - "brain_v12/tests/test_device_bridge_auth.py"
      - ".github/workflows/device-bridge-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile changed Python modules
        run: python -m py_compile brain_v12/brain/device_bridge.py brain_v12/app.py brain_v12/tests/test_device_bridge_auth.py
      - name: Run DeviceBridge authentication tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_device_bridge_auth -v
