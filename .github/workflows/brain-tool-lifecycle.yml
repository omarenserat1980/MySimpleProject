name: Brain Tool Lifecycle Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "brain_v12/tool_lifecycle.py"
      - "tests/test_tool_lifecycle.py"
      - ".github/workflows/brain-tool-lifecycle.yml"
  push:
    branches: ["feat/simulation-to-real-tool-lifecycle"]
    paths:
      - "brain_v12/tool_lifecycle.py"
      - "tests/test_tool_lifecycle.py"
      - ".github/workflows/brain-tool-lifecycle.yml"

permissions:
  contents: read

jobs:
  lifecycle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lifecycle unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_tool_lifecycle -v
