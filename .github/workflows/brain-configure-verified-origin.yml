name: Configure Verified Brain Origin

on:
  workflow_dispatch:
    inputs:
      brain_origin:
        description: "Existing public HTTPS Brain runtime origin (not a Cloudflare/static edge)"
        required: true
        type: string
      confirm:
        description: "Type VERIFY_AND_SAVE to validate the live runtime and save BRAIN_ORIGIN"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: configure-verified-brain-origin
  cancel-in-progress: false

jobs:
  verify-and-save:
    if: ${{ inputs.confirm == 'VERIFY_AND_SAVE' && github.repository == 'omarenserat1980/MySimpleProject' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate candidate origin and live Brain health
        id: verify
        env:
          CANDIDATE_ORIGIN: ${{ inputs.brain_origin }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import json
          import os
          import socket
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          value = os.environ["CANDIDATE_ORIGIN"].strip().rstrip("/")
          p = urlparse(value)
          if p.scheme != "https" or not p.hostname or p.username or p.password:
              raise SystemExit("BLOCKED: provide a valid HTTPS origin without credentials.")
          if p.path or p.query or p.fragment or p.port not in (None, 443):
              raise SystemExit("BLOCKED: provide an HTTPS origin only, without path/query/fragment or a custom port.")
          host = p.hostname.lower().rstrip(".")
          if host in {
              "brain-cloud-api.oenserat.workers.dev",
              "omarenserat1980.github.io",
              "brain.example.com",
              "render.com",
              "onrender.com",
          } or host.endswith((".onrender.com", ".render.com")):
              raise SystemExit("BLOCKED: edge/static/example or legacy Render origin; use the intended independent Brain runtime.")
          try:
              addresses = {item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}
          except OSError:
              raise SystemExit("BLOCKED: origin hostname did not resolve.")
          if not addresses:
              raise SystemExit("BLOCKED: origin hostname did not resolve.")
          for address in addresses:
              if not ipaddress.ip_address(address).is_global:
                  raise SystemExit("BLOCKED: origin resolves to a non-public IP address.")

          def get_json(path):
              req = Request(
                  value + path,
                  headers={"Accept": "application/json", "User-Agent": "Brain-Origin-Verification"},
              )
              try:
                  with urlopen(req, timeout=12) as response:
                      if response.status != 200:
                          return None
                      body = response.read(65537)
                      if len(body) > 65536:
                          return None
                      return json.loads(body.decode("utf-8"))
              except HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise SystemExit(f"BLOCKED: {path} returned HTTP {exc.code}.")
              except (URLError, TimeoutError, ValueError, OSError):
                  return None

          health = get_json("/healthz")
          ready = get_json("/readyz")
          standard_ok = isinstance(health, dict) and health.get("status") == "ok"
          standard_ready = isinstance(ready, dict) and ready.get("ready") is True

          if not (standard_ok and standard_ready):
              health_v14 = get_json("/health")
              supervisor = get_json("/api/supervisor/status")
              v14_ok = (
                  isinstance(health_v14, dict)
                  and health_v14.get("ok") is True
                  and health_v14.get("state") == "RUNNING"
              )
              v14_ready = (
                  isinstance(supervisor, dict)
                  and supervisor.get("ok") is True
                  and supervisor.get("supervisor") == "READY"
                  and supervisor.get("device_agnostic") is True
              )
              if not (v14_ok and v14_ready):
                  raise SystemExit("BLOCKED: neither supported Brain health/readiness contract passed; BRAIN_ORIGIN was not saved.")

          # General Brain readiness is not Cloud Executor issuer readiness.
          # Do not persist an origin until the redacted attestation status confirms
          # the issuer key, registry, executor enrollment, and trusted host binding.
          attestation = get_json("/api/cloud-executor/attestation/status")
          if not isinstance(attestation, dict):
              raise SystemExit("BLOCKED: attestation status endpoint missing or invalid; BRAIN_ORIGIN was not saved.")
          required = (
              attestation.get("control_plane_configured") is True
              and attestation.get("signing_key_present") is True
              and attestation.get("registry_configured") is True
              and isinstance(attestation.get("enrolled_executor_count"), int)
              and attestation.get("enrolled_executor_count", 0) > 0
              and isinstance(attestation.get("valid_host_binding_count"), int)
              and attestation.get("valid_host_binding_count", 0) > 0
          )
          if not required:
              raise SystemExit("BLOCKED: Cloud Executor attestation configuration is NOT_READY; BRAIN_ORIGIN was not saved.")
          
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("origin=" + value + "\n")
          print("BRAIN_RUNTIME_HEALTH=PASS")
          print("BRAIN_RUNTIME_READY=PASS")
          print("BRAIN_ATTESTATION_CONFIGURATION=PASS")
          print("BRAIN_LIVE_ATTESTATION_VERIFIED=NOT_CLAIMED")
          print("BRAIN_ORIGIN_NOT_PRINTED=true")
          PY

      - name: Create or update repository variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGIN: ${{ steps.verify.outputs.origin }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/variables/BRAIN_ORIGIN"
          if gh api --silent "$endpoint" >/dev/null 2>&1; then
            gh api --method PATCH "$endpoint" -f value="$ORIGIN" >/dev/null
            echo "BRAIN_ORIGIN_VARIABLE=UPDATED"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="BRAIN_ORIGIN" -f value="$ORIGIN" >/dev/null
            echo "BRAIN_ORIGIN_VARIABLE=CREATED"
          fi

      - name: Verify saved variable without printing its value
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/variables/BRAIN_ORIGIN" --jq '.name' | grep -Fx BRAIN_ORIGIN
          echo "BRAIN_ORIGIN_SETUP=PASS"
