name: Brain Micro-Executor Verification

on:
  pull_request:
    paths:
      - "brain_v12/tools/brain_micro_executor_doctor.py"
      - "brain_v12/tests/test_brain_micro_executor_doctor.py"
      - ".github/workflows/brain-micro-executor.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/tools/brain_micro_executor_doctor.py"
      - "brain_v12/tests/test_brain_micro_executor_doctor.py"
      - ".github/workflows/brain-micro-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-micro-executor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  doctor-contract:
    name: Read-only doctor contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile doctor and tests
        run: python -m py_compile brain_v12/tools/brain_micro_executor_doctor.py brain_v12/tests/test_brain_micro_executor_doctor.py
      - name: Run focused tests
        run: python -m pytest -q brain_v12/tests/test_brain_micro_executor_doctor.py
