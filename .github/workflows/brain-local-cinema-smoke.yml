name: BRAIN Local Cinema Smoke

on:
  push:
    paths:
      - 'brain_v12/machine_cinematic_factory.py'
      - 'brain_v12/visual_engine.py'
      - 'brain_v12/machine_raster_engine.py'
      - 'brain_v12/brain/device_bridge.py'
      - 'brain_v12/local_worker/brain_local_worker.py'
      - 'brain_v12/tools/brain_emulator_agent.py'
      - '.github/workflows/brain-local-cinema-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python compile
        run: |
          python -m py_compile brain_v12/machine_cinematic_factory.py brain_v12/visual_engine.py brain_v12/machine_raster_engine.py brain_v12/brain/device_bridge.py brain_v12/local_worker/brain_local_worker.py brain_v12/tools/brain_emulator_agent.py
      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Local painter smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          from brain_v12.visual_engine import compile_scene
          from brain_v12.machine_raster_engine import render_machine
          s=compile_scene("مدينة ليلية مع قناع أخضر ومطر", "green_mask")
          png,commands=render_machine(s)
          assert s["local"] is True
          assert s["external_api"] is False
          assert png.startswith(b"\x89PNG\r\n\x1a\n")
          assert len(png)>10000
          assert len(commands)>0
          print("BRAIN_LOCAL_PAINTER_SMOKE=VERIFIED")
          PY
      - name: End-to-end one-shot factory smoke
        env:
          BRAIN_FILM_PARTS: "1"
          BRAIN_FILM_PART_SECONDS: "5"
          BRAIN_FILM_FPS: "8"
          BRAIN_MACHINE_FILM_ROOT: "${{ runner.temp }}/brain-smoke"
        run: |
          PYTHONPATH=. python brain_v12/machine_cinematic_factory.py
          test -f "${BRAIN_MACHINE_FILM_ROOT}/final.mp4"
          test -f "${BRAIN_MACHINE_FILM_ROOT}/manifest.json"
          test -f "${BRAIN_MACHINE_FILM_ROOT}/cinematic_repair_manifest.json"
          test ! -f "${BRAIN_MACHINE_FILM_ROOT}/VERIFIED_COMPLETED"
          grep -q '"status": "REPAIR_REQUIRED"' "${BRAIN_MACHINE_FILM_ROOT}/manifest.json"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "${BRAIN_MACHINE_FILM_ROOT}/final.mp4"
          echo "BRAIN_FACTORY_END_TO_END_SMOKE=FAIL_CLOSED_REPAIR_REQUIRED"

      - name: Device task contract smoke
        run: |
          grep -q 'brain_machine_cinema_120m' brain_v12/brain/device_bridge.py
          grep -q 'brain_machine_cinema_120m' brain_v12/local_worker/brain_local_worker.py
          grep -q 'V12_POLL_SECONDS' brain_v12/tools/brain_emulator_agent.py
          echo "BRAIN_DEVICE_CONTRACT=VERIFIED"
