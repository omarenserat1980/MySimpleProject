name: BRAIN Windows Cloud Launch

on:
  workflow_dispatch:
    inputs:
      approve_apply:
        description: "Authorize creating/updating Azure resources after preflight"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: brain-windows-cloud-launch
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: brain-windows-production
    timeout-minutes: 90
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_admin_username: ${{ secrets.BRAIN_WINDOWS_ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.BRAIN_WINDOWS_ADMIN_PASSWORD }}
      TF_VAR_allowed_source_ip: "212.34.20.123/32"
      BRAIN_TFSTATE_ACCOUNT: ${{ vars.BRAIN_TFSTATE_ACCOUNT }}
      APPROVE_APPLY: ${{ inputs.approve_apply }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell without modifying apt repositories
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "This job requires Ubuntu x86_64; detected ${ID}/$(dpkg --print-architecture)." >&2
            exit 1
          fi
          command -v python3 >/dev/null
          command -v tar >/dev/null
          install_dir="$RUNNER_TEMP/pwsh"
          mkdir -p "$install_dir"
          asset_url="$(python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/PowerShell/PowerShell/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "ElectronicBrain-CI"}
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              release = json.load(response)
          assets = [a["browser_download_url"] for a in release.get("assets", [])
                    if a.get("name", "").endswith("-linux-x64.tar.gz")
                    and a.get("name", "").startswith("powershell-")]
          if not assets:
              raise SystemExit("No official Linux x64 PowerShell release archive found.")
          print(assets[0])
          PY
          )"
          echo "Downloading official PowerShell Linux x64 archive."
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 180 "$asset_url" -o "$install_dir/powershell.tar.gz"
          tar -xzf "$install_dir/powershell.tar.gz" -C "$install_dir"
          chmod +x "$install_dir/pwsh"
          "$install_dir/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap remote Terraform state and Azure providers
        if: ${{ inputs.approve_apply == true }}
        shell: pwsh
        run: ./scripts/windows-cloud/bootstrap-state.ps1 -Location westeurope -RegisterProviders

      - name: Preflight (no VM changes)
        shell: pwsh
        run: ./scripts/windows-cloud/preflight.ps1 -Location westeurope -VmSize Standard_B1s

      - name: Deploy and verify Windows Server 2025
        if: ${{ inputs.approve_apply == true }}
        shell: pwsh
        run: ./scripts/windows-cloud/deploy.ps1 -Apply -SkipConfirmation -Location westeurope -ResourceGroup brain-windows-rg -VmName brain-windows-2025 -VmSize Standard_B1s -AllowedSourceIp "$env:TF_VAR_allowed_source_ip"

      - name: Explain preflight-only run
        if: ${{ inputs.approve_apply != true }}
        shell: bash
        run: |
          echo "Preflight only. No state storage or VM resources were created."
          echo "Set approve_apply=true only when authorized to create the state store and deploy the VM."
