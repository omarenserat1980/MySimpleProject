name: BRAIN Hosted Windows Toolchain Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/brain-runner-preflight.yml"

permissions:
  contents: read

concurrency:
  group: brain-hosted-windows-toolchain-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify GitHub-hosted Windows identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") { throw "HOSTED_RUNNER_REQUIRED" }
          Write-Host "BRAIN_EXECUTION_MODE=GITHUB_HOSTED_SOFTWARE"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "RUNNER_ENVIRONMENT=$env:RUNNER_ENVIRONMENT"

      - name: Verify Azure CLI availability without credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $az = Get-Command az -ErrorAction Stop
          az version --output json
          Write-Host "AZURE_CLI_TOOLCHAIN=AVAILABLE"
          Write-Host "AZURE_AUTHENTICATION=NOT_ATTEMPTED"

      - name: Verify Terraform toolchain
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Verify Terraform availability
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          terraform version
          Write-Host "TERRAFORM_TOOLCHAIN=AVAILABLE"
          Write-Host "BRAIN_HARDWARE_DEPENDENCY=NONE"
