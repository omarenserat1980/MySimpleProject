name: Brain V12
on:
  push:
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-v12.yml"
  pull_request:
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-v12.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          echo "BRAIN_FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "BRAIN_FFPROBE_BIN=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - run: python -m pip install -r brain_v12/requirements.txt
      - run: python -m compileall -q brain_v12
      - run: python -m unittest discover -s brain_v12/tests -v
      - name: Verify GitHub CI identity
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          assert os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"]
          assert os.environ["GITHUB_RUN_ID"]
          print("GitHub-native CI identity verified:", os.environ["GITHUB_SHA"])
          PY
