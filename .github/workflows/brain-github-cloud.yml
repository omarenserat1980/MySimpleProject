name: Brain Internal Runtime - GitHub Control Plane

on:
  workflow_call:
    inputs:
      task:
        description: "Brain task to execute on the Brain-owned internal runner"
        required: false
        default: "health"
        type: string
  workflow_dispatch:
    inputs:
      task:
        description: "Brain task to execute on the Brain-owned internal runner"
        required: false
        default: "health"
        type: string

concurrency:
  group: brain-internal-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  revenue-conversion:
    if: ${{ inputs.task == 'revenue-tests' }}
    uses: ./.github/workflows/brain-revenue-conversion-tests.yml

  brain-internal:
    name: Brain Internal Runtime
    runs-on: [self-hosted, linux, x64, brain-internal, qemu, windows-real-boot]
    timeout-minutes: 60
    env:
      BRAIN_INTERNAL_RUNNER_FLAG: "1"
      BRAIN_CLOUD_MODE: brain-internal
      BRAIN_TASK: health
      BRAIN_FFMPEG_BIN: ffmpeg
      BRAIN_FFPROBE_BIN: ffprobe
    steps:
      - name: Checkout Brain source of truth
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fail-closed internal runner preflight
        run: |
          set -euo pipefail
          python -m brain_v12.brain.internal_runner_preflight
          python - <<'PY'
          from brain_v12.brain.internal_runner_preflight import verify_and_write
          evidence = verify_and_write("internal-runner-preflight.json")
          assert evidence["verified"] is True, evidence
          print("BRAIN_INTERNAL_RUNNER=VERIFIED")
          PY

      - name: Resolve Brain task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          task = os.environ.get("WORKFLOW_TASK", "").strip()
          if not task:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              task = (event.get("inputs") or {}).get("task") or "health"
          print("BRAIN_TASK=" + task)
          PY
          echo "BRAIN_TASK=$BRAIN_TASK"

      - name: Audit internal runtime
        run: |
          set -euo pipefail
          mkdir -p brain6_artifacts/internal_runtime
          {
            echo "state=RUNNER_READY"
            echo "mode=$BRAIN_CLOUD_MODE"
            echo "task=$BRAIN_TASK"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "os=$RUNNER_OS"
            echo "arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            echo "python=$(python --version)"
            echo "ffmpeg=$(ffmpeg -version | head -n 1)"
          } | tee brain6_artifacts/internal_runtime/runtime.txt

      - name: Compile Brain
        run: |
          set -euo pipefail
          python -m compileall -q brain_v12

      - name: Run Brain task
        run: |
          set -euo pipefail
          python brain_v12/ci/brain_runner.py

      - name: Run Brain tests
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q brain_v12/tests

      - name: Verify unified objective gate
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest brain_v12.tests.test_verification_gate -v

      - name: Write internal execution evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir -p brain6_artifacts/internal_runtime
          cat > brain6_artifacts/internal_runtime/evidence.json <<EOF
          {"state":"VERIFIED_INTERNAL_RUNNER_EXECUTION","mode":"brain-internal","task":"$BRAIN_TASK","run_id":"$GITHUB_RUN_ID","commit":"$GITHUB_SHA","runner_name":"$RUNNER_NAME","github_hosted_runtime":false}
          EOF

      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brain-internal-runtime-evidence
          path: |
            brain6_artifacts/internal_runtime/
            internal-runner-preflight.json
          retention-days: 7
