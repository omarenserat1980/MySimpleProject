name: Brain Hosted Software Runtime - GitHub Control Plane

on:
  workflow_call:
    inputs:
      task:
        description: "Allowlisted software task; supervisor is simulation-only"
        required: false
        default: "health"
        type: string
  workflow_dispatch:
    inputs:
      task:
        description: "Allowlisted software task"
        required: false
        default: "health"
        type: string

concurrency:
  group: brain-hosted-software-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  revenue-conversion:
    if: ${{ inputs.task == 'revenue-tests' }}
    uses: ./.github/workflows/brain-revenue-conversion-tests.yml

  brain-software:
    if: ${{ inputs.task != 'revenue-tests' }}
    name: Brain Allowlisted Software Task
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRAIN_EXECUTION_MODE: GITHUB_HOSTED_SOFTWARE
      BRAIN_CLOUD_MODE: github-hosted-software
      BRAIN_TASK: ${{ inputs.task || 'health' }}
      BRAIN_FFMPEG_BIN: ffmpeg
      BRAIN_FFPROBE_BIN: ffprobe
    steps:
      - name: Checkout Brain source of truth
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain_v12/requirements.txt

      - name: Verify hosted identity and read-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          echo "BRAIN_EXECUTION_MODE=$BRAIN_EXECUTION_MODE"
          echo "BRAIN_PHYSICAL_HARDWARE_REQUIRED=false"
          echo "BRAIN_EXTERNAL_SIDE_EFFECTS=NOT_AUTHORIZED"

      - name: Install declared Python dependencies
        run: python -m pip install --disable-pip-version-check -r brain_v12/requirements.txt

      - name: Install software media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Compile Brain
        run: python -m compileall -q brain_v12

      - name: Run allowlisted Brain task
        run: python brain_v12/ci/brain_runner.py

      - name: Run Brain test suite
        run: PYTHONPATH=. pytest -q brain_v12/tests

      - name: Verify unified objective gate
        run: PYTHONPATH=. python -m unittest brain_v12.tests.test_verification_gate -v

      - name: Write hosted software execution evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brain6_artifacts/hosted_software_runtime
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "state": "VERIFIED_HOSTED_SOFTWARE_EXECUTION",
              "mode": os.environ["BRAIN_CLOUD_MODE"],
              "execution_mode": os.environ["BRAIN_EXECUTION_MODE"],
              "task": os.environ["BRAIN_TASK"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "github_hosted_runtime": True,
              "physical_hardware_required": False,
              "external_side_effects_authorized": False,
          }
          Path("brain6_artifacts/hosted_software_runtime/evidence.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8"
          )
          print(json.dumps(data, indent=2))
          PY

      - name: Upload hosted software execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-hosted-software-runtime-evidence
          path: brain6_artifacts/hosted_software_runtime/
          if-no-files-found: warn
          retention-days: 14
