name: Brain GitHub Cloud - Free Linux Control Plane

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Brain task to execute"
        required: false
        default: "health"
        type: string
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-github-cloud.yml"
      - ".github/workflows/brain-github-supervisor.yml"
      - "PROJECT_MASTER_SPEC.md"
      - "PROJECT_ROADMAP.md"
      - "DECISIONS.md"

concurrency:
  group: brain-github-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  brain-cloud:
    name: Brain Cloud Linux Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_CLOUD_MODE: github-actions
      BRAIN_TASK: health
      BRAIN_FFMPEG_BIN: /usr/bin/ffmpeg
      BRAIN_FFPROBE_BIN: /usr/bin/ffprobe
    steps:
      - name: Checkout Brain source of truth
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare Linux runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install media toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Install Brain Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r brain_v12/requirements.txt

      - name: Resolve Brain task
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event=json.load(f)
          task=(event.get("inputs") or {}).get("task") or "health"
          print("BRAIN_TASK=" + task)
          PY
          echo "BRAIN_TASK=$BRAIN_TASK"

      - name: Audit runtime
        run: |
          set -euo pipefail
          mkdir -p brain6_artifacts/github_cloud
          {
            echo "state=RUNNER_READY"
            echo "mode=$BRAIN_CLOUD_MODE"
            echo "task=$BRAIN_TASK"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "os=$RUNNER_OS"
            echo "arch=$RUNNER_ARCH"
            echo "python=$(python --version)"
            echo "ffmpeg=$(ffmpeg -version | head -n 1)"
            echo "brain_ffmpeg=$BRAIN_FFMPEG_BIN"
            echo "brain_ffprobe=$BRAIN_FFPROBE_BIN"
          } | tee brain6_artifacts/github_cloud/runtime.txt
          git status --short
          git log -1 --oneline

      - name: Compile Brain
        run: |
          set -euo pipefail
          python -m compileall -q brain_v12

      - name: Verify GitHub capability registry
        run: |
          set -euo pipefail
          python - <<'PY'
          from brain_v12.github_capability_registry import GITHUB_TOOL_COUNT, GITHUB_TOOLS
          assert GITHUB_TOOL_COUNT == 90, GITHUB_TOOL_COUNT
          assert len(GITHUB_TOOLS) == 90, len(GITHUB_TOOLS)
          required = {"fetch_pr","fetch_workflow_job_logs","merge_pull_request","update_file","search_repositories","dispatch_workflow"}
          missing = sorted(required - set(GITHUB_TOOLS))
          assert not missing, missing
          print("github_capability_registry=PASS")
          PY

      - name: Run GitHub Agent tests
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q brain_v12/tests/test_github_*.py

      - name: Execute Brain task
        run: |
          set -euo pipefail
          python brain_v12/ci/brain_runner.py

      - name: Run Brain tests
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q brain_v12/tests

      - name: Verify task result evidence
        if: success()
        run: |
          set -euo pipefail
          test -f brain6_artifacts/github_cloud/task_result.json
          python - <<'PY'
          import json
          print(json.dumps(json.load(open("brain6_artifacts/github_cloud/task_result.json")), indent=2))
          PY

      - name: Verify toolchain
        if: success()
        run: |
          set -euo pipefail
          for tool in ffmpeg ffprobe git python; do command -v "$tool" >/dev/null || exit 1; done

      - name: Write evidence
        if: success()
        run: |
          set -euo pipefail
          cat > brain6_artifacts/github_cloud/evidence.json <<EOF
          {"state":"VERIFIED_RUNNER_READY","mode":"github-actions","task":"$BRAIN_TASK","run_id":"$GITHUB_RUN_ID","commit":"$GITHUB_SHA","github_capability_registry":89,"github_agent_tests":"PASS"}
          EOF
          cat brain6_artifacts/github_cloud/evidence.json

      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brain-github-cloud-evidence
          path: brain6_artifacts/github_cloud/
          retention-days: 1
