name: Brain Customer Communications Contract

on:
  push:
    paths:
      - 'cloud/customer_communications.py'
      - 'cloud/test_customer_communications.py'
      - 'BRAIN_CUSTOMER_COMMUNICATIONS_HUB.md'
      - '.github/workflows/customer-communications-contract.yml'
  pull_request:
    paths:
      - 'cloud/customer_communications.py'
      - 'cloud/test_customer_communications.py'
      - 'BRAIN_CUSTOMER_COMMUNICATIONS_HUB.md'
      - '.github/workflows/customer-communications-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r cloud/requirements.txt
      - name: Run communications contract
        run: python -m pytest -q cloud/test_customer_communications.py
