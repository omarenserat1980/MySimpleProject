name: Brain Android Executor Build

on:
  push:
    branches: ["main"]
    paths:
      - "android_executor/**"
      - ".github/workflows/brain-android-executor-build.yml"
  workflow_dispatch:

concurrency:
  group: brain-android-executor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_executor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-android-executor-debug-\${{ github.sha }}
          path: android_executor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
