name: Brain Commercial Cycle Smoke

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/business/**"
      - ".github/workflows/brain-commercial-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate commercial cycle
        run: |
          set -euo pipefail
          python -m py_compile brain_v12/business/*.py
          python -m pytest -q brain_v12/business/test_customer_governance.py brain_v12/business/test_revenue_ledger.py brain_v12/business/test_pipeline.py
          python - <<'PY'
          from brain_v12.business.pipeline import Opportunity
          from brain_v12.business.revenue_ledger import RevenueRecord
          from brain_v12.business.lead_discovery import LeadSignal, normalize

          lead=normalize(LeadSignal(
            source="market-research",
            customer_hint="Example SMB",
            problem="manual workflow consumes staff time",
            evidence_url="evidence://market-signal"
          ))
          assert lead["status"]=="READY_FOR_REVIEW"

          opp=Opportunity("OPP-000001","Example SMB",lead["problem"],"AI Workflow Automation")
          opp.transition("QUALIFIED","evidence://qualified-problem")
          opp.transition("OFFER_READY","evidence://offer-scope")
          opp.transition("HUMAN_APPROVED","human approval recorded")
          opp.transition("DELIVERED","delivery artifact recorded")
          opp.transition("PAYMENT_PENDING","evidence://payment/pending")
          opp.transition("PAYMENT_VERIFIED",{
            "transaction_id":"tx-commercial-001",
            "evidence_ref":"evidence://payment/tx-commercial-001"
          })
          opp.transition("REVENUE_REALIZED",{
            "delivery_evidence_ref":"evidence://delivery/OPP-000001",
            "reconciliation_ref":"evidence://reconciliation/tx-commercial-001"
          })

          ledger=RevenueRecord(opp.opportunity_id,"verified amount","USD")
          ledger.verify({
            "transaction_id":"tx-commercial-001",
            "evidence_ref":"evidence://payment/tx-commercial-001"
          })
          ledger.realize({
            "delivery_evidence_ref":"evidence://delivery/OPP-000001",
            "reconciliation_ref":"evidence://reconciliation/tx-commercial-001"
          })

          assert opp.stage=="REVENUE_REALIZED"
          assert ledger.status=="REVENUE_REALIZED"
          print("BRAIN_COMMERCIAL_CYCLE=PASS")
          print(opp.snapshot())
          print(ledger.snapshot())
          PY
