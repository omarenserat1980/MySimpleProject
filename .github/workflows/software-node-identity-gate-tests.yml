name: Software Node Identity Gate Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/software_node_identity_gate.py"
      - "brain_v12/tests/test_software_node_identity_gate.py"
      - ".github/workflows/software-node-identity-gate-tests.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run software node identity gate tests
        run: |
          python -m pip install pytest
          python -m pytest brain_v12/tests/test_software_node_identity_gate.py -q
