name: Brain V12 Image

on:
  push:
    branches:
      - main
    paths:
      - "brain_v12/**"
      - "brain_v7/**"
      - ".dockerignore"
      - ".github/workflows/brain-v12-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: brain-v12-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: brain_v12/requirements.txt

      - name: Verify build context
        run: |
          set -euo pipefail
          test -f brain_v12/Dockerfile
          test -f brain_v12/requirements.txt
          test -f brain_v12/app.py
          test -f brain_v12/tools/ci_preflight.py
          test -d brain_v12/brain
          test -d brain_v12/movie_summary_factory
          test -d brain_v7

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r brain_v12/requirements.txt

      - name: Run deterministic preflight
        env:
          BRAIN_V14_VERSION: "14.0"
          BRAIN_DB: /tmp/brain_v12-smoke.db
          BRAIN_LIVE_INCOME_SEARCH_ENABLED: "false"
          BRAIN_WORKFORCE_ENABLED: "false"
          BRAIN_RENDER_MONITOR_ENABLED: "false"
        run: |
          set -euo pipefail
          python -m brain_v12.tools.ci_preflight

      - name: Run V12 contract tests
        env:
          BRAIN_V14_VERSION: "14.0"
          BRAIN_DB: /tmp/brain_v12-tests.db
          BRAIN_LIVE_INCOME_SEARCH_ENABLED: "false"
          BRAIN_WORKFORCE_ENABLED: "false"
          BRAIN_RENDER_MONITOR_ENABLED: "false"
        run: |
          set -euo pipefail
          python -m compileall -q brain_v12
          python -m unittest discover -s brain_v12/tests -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./brain_v12/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:main

      - name: Pull immutable image for smoke test
        run: |
          set -euo pipefail
          docker pull ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}

      - name: Container health smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
        run: |
          set -euo pipefail
          cid="$(docker run -d             -e BRAIN_V14_VERSION=14.0             -e BRAIN_DB=/tmp/brain_v12-smoke.db             -e BRAIN_LIVE_INCOME_SEARCH_ENABLED=false             -e BRAIN_WORKFORCE_ENABLED=false             -e BRAIN_RENDER_MONITOR_ENABLED=false             -p 18012:10000             "$IMAGE")"
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if python - <<'PY'
          import json
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:18012/health", timeout=3) as response:
                  payload = json.load(response)
              if payload.get("ok") is True and payload.get("version") == "14.0":
                  print(json.dumps(payload))
                  raise SystemExit(0)
          except Exception:
              pass
          raise SystemExit(1)
          PY
            then
              echo "container health smoke passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy"
          docker inspect "$cid" --format '{{json .State.Health}}' || true
          exit 1
