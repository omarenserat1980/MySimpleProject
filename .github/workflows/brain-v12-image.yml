name: Brain V12 Image

on:
  push:
    branches:
      - main
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-v12-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify build context
        run: |
          test -f brain_v12/Dockerfile
          test -f brain_v12/requirements.txt
          test -f brain_v12/app.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./brain_v12/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:main
