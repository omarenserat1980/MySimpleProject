name: Brain V12 Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --platform linux/amd64 -f brain_v12/Dockerfile -t electronic-brain-v12:ci .

      - name: Run health smoke
        shell: bash
        run: |
          set -e
          docker run -d --name brain-v12-smoke -p 18012:10000             -e PORT=10000             -e BRAIN_V14_VERSION=14.0             -e BRAIN_DB=/tmp/brain-v12-smoke.db             -e BRAIN_LIVE_INCOME_SEARCH_ENABLED=false             -e BRAIN_WORKFORCE_ENABLED=false             electronic-brain-v12:ci
          trap 'docker logs brain-v12-smoke || true; docker rm -f brain-v12-smoke || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18012/health; then
              echo
              echo "BRAIN V12 image health: OK"
              exit 0
            fi
            sleep 2
          done
          echo "health timeout"
          exit 1
