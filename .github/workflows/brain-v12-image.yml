name: Brain V12 Image

on:
  push:
    branches: ["main"]
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-v12-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r brain_v12/requirements.txt
      - name: Run Brain V12 tests
        run: python -m unittest discover -s brain_v12/tests -v

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Brain V12 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./brain_v12/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:main

      - name: Trigger Render image deploy when configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST             --data-urlencode "imgURL=${IMAGE_URL}"             "${RENDER_DEPLOY_HOOK_URL}"
