name: Brain V12 Image

on:
  push:
    branches:
      - main
    paths:
      - "brain_v12/**"
      - "brain_v7/**"
      - ".github/workflows/brain-v12-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: brain-v12-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: brain_v12/requirements.txt

      - name: Verify build context
        run: |
          set -euo pipefail
          test -f brain_v12/Dockerfile
          test -f brain_v12/requirements.txt
          test -f brain_v12/app.py
          test -d brain_v12/brain
          test -d brain_v7

      - name: Install Python dependencies for preflight
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r brain_v12/requirements.txt

      - name: Compile and import smoke test
        env:
          BRAIN_V14_VERSION: "14.0"
          BRAIN_DB: /tmp/brain_v12-smoke.db
          BRAIN_LIVE_INCOME_SEARCH_ENABLED: "false"
          BRAIN_WORKFORCE_ENABLED: "false"
          BRAIN_RENDER_MONITOR_ENABLED: "false"
        run: |
          set -euo pipefail
          python -m compileall -q brain_v12
          python - <<'PY'
          from brain_v12.app import app
          routes = {getattr(route, "path", "") for route in app.routes}
          required = {"/health", "/api/system/readiness", "/api/deploy/verify"}
          missing = sorted(required - routes)
          if missing:
              raise SystemExit(f"Missing required routes: {missing}")
          print(f"import smoke passed; routes={len(routes)}")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./brain_v12/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:main

      - name: Pull immutable image for smoke test
        run: |
          set -euo pipefail
          docker pull ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}

      - name: Container health smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/electronic-brain-v12:${{ github.sha }}
        run: |
          set -euo pipefail
          cid="$(docker run -d             -e BRAIN_V14_VERSION=14.0             -e BRAIN_DB=/tmp/brain_v12-smoke.db             -e BRAIN_LIVE_INCOME_SEARCH_ENABLED=false             -e BRAIN_WORKFORCE_ENABLED=false             -e BRAIN_RENDER_MONITOR_ENABLED=false             -p 18012:10000             "$IMAGE")"
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18012/health >/tmp/brain-health.json; then
              cat /tmp/brain-health.json
              python - <<'PY'
          import json
          data = json.load(open("/tmp/brain-health.json", encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("version") == "14.0", data
          print("container health smoke passed")
          PY
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy"
          exit 1
