name: BRAIN 120 Minute Cinema
# Brain launch marker: 2-hour cinematic production
# Brain launch trigger: FULL_120_MINUTE_PRODUCTION
# BRAIN LAUNCH REQUEST: FULL_120_MINUTE_PRODUCTION
# Brain launch: FULL_120_MINUTE_PRODUCTION

on:
  push:
    paths:
      - 'brain_v12/machine_cinematic_factory.py'
      - 'brain_v12/visual_engine.py'
      - 'brain_v12/machine_raster_engine.py'
      - 'brain_v12/cinematic_master_qc.py'
      - 'brain_v12/gstreamer_backend.py'
      - '.github/workflows/brain-120-minute-cinema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 1, start: 1, end: 60}
          - {shard: 2, start: 61, end: 120}
          - {shard: 3, start: 121, end: 180}
          - {shard: 4, start: 181, end: 240}
    steps:
      - uses: actions/checkout@v4
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pil gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly ges1.0-tools
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          gst-launch-1.0 --version | head -n 1
          ges-launch-1.0 --version 2>&1 | head -n 1 || true
      - name: Verify Brain source
        run: |
          python -m py_compile brain_v12/machine_cinematic_factory.py brain_v12/visual_engine.py brain_v12/machine_raster_engine.py brain_v12/gstreamer_backend.py
      - name: Render shard
        env:
          BRAIN_FILM_TITLE: "BRAIN — الفيلم السينمائي الطويل"
          BRAIN_FILM_PARTS: "240"
          BRAIN_FILM_PART_SECONDS: "30"
          BRAIN_FILM_START: "${{ matrix.start }}"
          BRAIN_FILM_END: "${{ matrix.end }}"
          BRAIN_FILM_SHARD_ONLY: "1"
          BRAIN_MEDIA_BACKEND: "gstreamer"
        run: |
          PYTHONPATH=. python brain_v12/machine_cinematic_factory.py
          test -f brain6_artifacts/machine_films/manifest.json
          grep -q '"status": "SHARD_COMPLETED"' brain6_artifacts/machine_films/manifest.json
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: brain-cinema-shard-${{ matrix.shard }}
          path: brain6_artifacts/machine_films
          retention-days: 2

  assemble:
    name: Assemble and verify master
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly ges1.0-tools
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ges-launch-1.0 --version 2>&1 | head -n 1 || true
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: brain-cinema-shard-*
          path: shards
          merge-multiple: false
      - name: Assemble master
        run: |
          mkdir -p master/parts
          find shards -type f -name 'part-*.mp4' -print0 | sort -zV | xargs -0 -I{} cp "{}" master/parts/
          test "$(find master/parts -type f -name 'part-*.mp4' | wc -l)" -eq 240
          find master/parts -type f -name 'part-*.mp4' -printf '%f\n' | sort -V | awk '{print "file \x27parts/" $0 "\x27"}' > master/concat.txt
          test "$(wc -l < master/concat.txt)" -eq 240
          ffmpeg -y -f concat -safe 0 -i master/concat.txt -c copy master/final.mp4
      - name: Master QC
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,bit_rate -of json master/final.mp4 > master/qc.json
          python - <<'PY'
          import json
          q=json.load(open("master/qc.json"))
          duration=float(q["format"]["duration"])
          streams=q["streams"]
          video=[s for s in streams if s.get("codec_type")=="video"][0]
          audio=[s for s in streams if s.get("codec_type")=="audio"]
          assert 7190 <= duration <= 7210, duration
          assert video["width"]==1000 and video["height"]==650
          assert audio, "AUDIO_STREAM_MISSING"
          print("BRAIN_120_MINUTE_MASTER_QC=TECHNICALLY_VALID", duration)
          PY
      - name: Build content manifest
        run: |
          python - <<'PY'
          import json, pathlib
          manifests=sorted(pathlib.Path("shards").glob("*/manifest.json"))
          parts=[]
          for p in manifests:
              m=json.loads(p.read_text(encoding="utf-8"))
              parts.extend(m.get("parts_manifest", []))
          parts.sort(key=lambda x:int(x.get("part", 0)))
          assert len(parts)==240, len(parts)
          manifest={
              "status":"MASTER_QC",
              "title":"BRAIN — الفيلم السينمائي الطويل",
              "parts":240,
              "part_seconds":30,
              "target_seconds":7200,
              "parts_manifest":parts,
              "master_qc":json.load(open("master/qc.json")),
              "renderer":"Brain Machine Raster Painter",
              "external_api":False,
              "cinematic_contract":{
                  "text_overlay_policy":"deny",
                  "continuity_required":True,
                  "audio_classes_required":["voice","music","sfx"],
              },
          }
          pathlib.Path("master/manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: CINEMATIC_MASTER_QC
        run: |
          set +e
          python brain_v12/cinematic_master_qc.py             --video master/final.mp4             --manifest master/manifest.json             --output master/cinematic_master_qc.json
          rc=$?
          set -e
          test -f master/cinematic_master_qc.json
          test -f master/cinematic_repair_manifest.json
          python brain_v12/cinematic_repair_loop.py --qc master/cinematic_master_qc.json --output master/cinematic_repair_contract.json || true
          if [ "$rc" -ne 0 ]; then
            echo "CINEMATIC_QC_FAILED: REPAIR_REQUIRED"
            cat master/cinematic_repair_manifest.json
            exit "$rc"
          fi
      - name: Promote only after cinematic QC
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("master/manifest.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          qc=json.loads(pathlib.Path("master/cinematic_master_qc.json").read_text(encoding="utf-8"))
          assert qc["status"]=="CINEMATIC_QC_PASSED"
          m["cinematic_master_qc"]=qc
          m["status"]="VERIFIED_COMPLETED"
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2))
          pathlib.Path("master/VERIFIED_COMPLETED").write_text("BRAIN CINEMATIC MASTER VERIFIED — 120 MINUTES\n",encoding="utf-8")
          PY
      - name: Upload verified master
        uses: actions/upload-artifact@v4
        with:
          name: brain-120-minute-verified-master
          path: |
            master/final.mp4
            master/manifest.json
            master/qc.json
            master/cinematic_master_qc.json
            master/cinematic_repair_manifest.json
            master/cinematic_repair_contract.json
            master/VERIFIED_COMPLETED
          retention-days: 7
