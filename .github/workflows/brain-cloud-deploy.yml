name: Brain Cloud Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Brain Cloud Native"]
    types: [completed]

  push:
    paths:
      - ".github/workflows/brain-cloud-deploy.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: brain-cloud-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Brain Cloud to production host
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment configuration
        id: config
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          SSH_KEY: ${{ secrets.BRAIN_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SSH_HOST" ] || missing+=("BRAIN_CLOUD_SSH_HOST")
          [ -n "$SSH_USER" ] || missing+=("BRAIN_CLOUD_SSH_USER")
          [ -n "$SSH_KEY" ] || missing+=("BRAIN_CLOUD_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Brain Cloud production deployment is not configured. Missing GitHub Actions secrets: ${missing[*]}"
            echo "Deployment is fail-closed: SSH configuration cannot be skipped and reported as success."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.BRAIN_CLOUD_SSH_KEY }}
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s
' "$SSH_KEY" > ~/.ssh/brain_cloud_key
          chmod 600 ~/.ssh/brain_cloud_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" true

      - name: Upload compose
        if: steps.config.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key cloud/docker-compose.production.yml "$SSH_USER@$SSH_HOST:~/brain-cloud-compose.yml"

      - name: Deploy
        if: steps.config.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" 'mkdir -p ~/brain-cloud'
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "mv ~/brain-cloud-compose.yml ~/brain-cloud/docker-compose.yml && cd ~/brain-cloud && export BRAIN_IMAGE_TAG='$DEPLOY_SHA' && docker compose config -q && docker compose pull && docker compose up -d && docker compose ps"

      - name: Verify production health
        if: steps.config.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=1 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "set -e; cd ~/brain-cloud; export BRAIN_IMAGE_TAG='$DEPLOY_SHA'; docker compose ps; test \"\$(docker compose ps --status running --services | grep -c '^brain-cloud$')\" -eq 1; docker compose exec -T brain-cloud python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10).read()\"; docker compose exec -T brain-cloud python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=10).read()\"; docker compose images brain-cloud"
          echo "Brain Cloud production deployment, /healthz, /readyz, and image verification passed for ${DEPLOY_SHA}."
