name: Brain Ramulator Memory Trace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/brain-ramulator-brain-trace.yml"
      - "brain_v12/hardware/traces/brain_memory_smoke.trace"
      - "brain_v12/hardware/ramulator_brain_trace.py"

permissions:
  contents: read

concurrency:
  group: brain-ramulator-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-memory-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Checkout pinned upstream Ramulator
        uses: actions/checkout@v4
        with:
          repository: CMU-SAFARI/ramulator2
          ref: c6c7a5de0cef35935d6fad7369e6271406798865
          path: .evidence/upstream/ramulator2

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev python3-venv

      - name: Build pinned upstream Ramulator
        working-directory: .evidence/upstream/ramulator2
        run: |
          cmake -S . -B build -DRAMULATOR_PYTHON_BINDINGS=ON
          cmake --build build --parallel 2

      - name: Install Python bindings
        working-directory: .evidence/upstream/ramulator2
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Brain representative trace
        working-directory: .evidence/upstream/ramulator2
        env:
          BRAIN_RAMULATOR_TRACE: ${{ github.workspace }}/brain_v12/hardware/traces/brain_memory_smoke.trace
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/brain-ramulator"
          sha256sum "$BRAIN_RAMULATOR_TRACE" | tee "$GITHUB_WORKSPACE/artifacts/brain-ramulator/trace.sha256"
          python "$GITHUB_WORKSPACE/brain_v12/hardware/ramulator_brain_trace.py" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/brain-ramulator/run.log"
          grep -q "Evidence class: UPSTREAM_TOOL_EXECUTION_SIMULATION_ONLY" "$GITHUB_WORKSPACE/artifacts/brain-ramulator/run.log"
          grep -q "Physical RAM verified: false" "$GITHUB_WORKSPACE/artifacts/brain-ramulator/run.log"
          grep -Eq "Read requests: [1-9][0-9]*" "$GITHUB_WORKSPACE/artifacts/brain-ramulator/run.log"

      - name: Create evidence manifest
        if: always()
        env:
          UPSTREAM_REVISION: c6c7a5de0cef35935d6fad7369e6271406798865
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("artifacts/brain-ramulator")
          trace = pathlib.Path("brain_v12/hardware/traces/brain_memory_smoke.trace")
          script = pathlib.Path("brain_v12/hardware/ramulator_brain_trace.py")
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          evidence = {
              "schema_version": "1.0",
              "component": "ram-memory",
              "workload_id": "brain-memory-smoke-v1",
              "upstream_repository": "https://github.com/CMU-SAFARI/ramulator2",
              "upstream_revision": os.environ["UPSTREAM_REVISION"],
              "brain_commit": os.environ.get("GITHUB_SHA"),
              "trace_sha256": sha(trace),
              "runner_sha256": sha(script),
              "run_log_sha256": sha(root / "run.log"),
              "trace_record_count": sum(1 for line in trace.read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")),
              "evidence_class": "UPSTREAM_TOOL_EXECUTION_SIMULATION_ONLY",
              "physical_ram_verified": False,
              "accepted_as_physical_measurement": False,
              "limitations": ["Synthetic representative trace, not a captured production workload.", "DRAM simulator results do not measure physical RAM or host performance."]
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / "evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload Brain trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-ramulator-memory-trace
          path: artifacts/brain-ramulator/
          if-no-files-found: error
          retention-days: 30
