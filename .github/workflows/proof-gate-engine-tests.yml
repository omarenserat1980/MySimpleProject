name: Universal Proof Gate Engine Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/proof_gate_engine.py"
      - "brain_v12/brain/proof_registry.py"
      - "brain_v12/tests/test_proof_gate_engine.py"
      - "brain_v12/tests/test_proof_registry.py"
      - ".github/workflows/proof-gate-engine-tests.yml"
  push:
    branches:
      - "brain/universal-proof-gate-refresh-20261018"
    paths:
      - "brain_v12/brain/proof_gate_engine.py"
      - "brain_v12/brain/proof_registry.py"
      - "brain_v12/tests/test_proof_gate_engine.py"
      - "brain_v12/tests/test_proof_registry.py"
      - ".github/workflows/proof-gate-engine-tests.yml"

permissions:
  contents: read

jobs:
  proof-gate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile proof gate components
        run: python -m py_compile brain_v12/brain/proof_gate_engine.py brain_v12/brain/proof_registry.py
      - name: Run focused proof gate tests
        run: |
          python -m unittest brain_v12.tests.test_proof_gate_engine -v
          python -m unittest brain_v12.tests.test_proof_registry -v
