name: Arkan Unprivileged Import Test

on:
  push:
    branches:
      - diagnostics/arkan-permission-13-20261010
    paths:
      - .github/workflows/arkan-unprivileged-import-test.yml

permissions:
  contents: read

jobs:
  test:
    name: Import Brain as unprivileged brain user
    runs-on: [self-hosted, linux, x64, brain-internal]
    timeout-minutes: 8
    steps:
      - name: Inspect persistent paths and test import without root
        shell: bash
        run: |
          set +e
          R=/home/brain/linux-runner-new/_work/MySimpleProject/MySimpleProject
          PY=/home/brain/brain-runtime-venv/bin/python
          BASE=/home/brain/.brain/diagnostics/permission-13-as-brain
          echo "=== ROOT CAUSE CONFIRMATION ==="
          id
          systemctl show actions.runner.omarenserat1980-MySimpleProject.brain-internal-arkan.service -p User -p Group --no-pager
          echo "=== EXISTING PERSISTENT FILES (METADATA ONLY) ==="
          for p in \
            "$R/brain_v12/brain_v12.db" \
            "$R/brain_v12/.brain/state/sync_queue.jsonl" \
            "$R/brain_v12/brain_git_data" \
            "$R/brain_v12/brain6_artifacts/evidence/evidence.db" \
            /home/brain/.brain/brain_v12.db \
            /home/brain/.brain/state/sync_queue.jsonl; do
            if [ -e "$p" ]; then stat -c '%U:%G mode=%a size=%s type=%F path=%n' "$p"; else echo "MISSING $p"; fi
          done
          echo "=== CREATE USER-OWNED DIAGNOSTIC DIRS ==="
          runuser -u brain -- env HOME=/home/brain BASE="$BASE" bash -c 'mkdir -p "$BASE/media" "$BASE/state" "$BASE/git"'
          setup_status=$?
          echo "SETUP_EXIT=$setup_status"
          if [ "$setup_status" -ne 0 ]; then exit "$setup_status"; fi
          echo "=== IMPORT AS BRAIN USER ==="
          cd "$R"
          runuser -u brain -- env \
            HOME=/home/brain \
            BRAIN_MEDIA_ROOT="$BASE/media" \
            BRAIN_DB="$BASE/brain-test.sqlite3" \
            BRAIN_SYNC_QUEUE="$BASE/state/sync_queue.jsonl" \
            BRAIN_GIT_ROOT="$BASE/git" \
            BRAIN_EVIDENCE_DB="$BASE/evidence.db" \
            PYTHONPATH="$R" \
            "$PY" -c 'import brain_v12.app; print("BRAIN_APP_IMPORT_AS_BRAIN_OK")' 2>&1
          import_status=$?
          echo "IMPORT_AS_BRAIN_EXIT=$import_status"
          echo "=== PORT 8012 ==="
          ss -ltnp 2>/dev/null | grep ':8012' || echo PORT_8012_NOT_LISTENING
          exit "$import_status"
