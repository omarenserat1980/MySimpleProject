name: Brain Email Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: brain-email-watchdog
  cancel-in-progress: true

jobs:
  email-watchdog:
    runs-on: ubuntu-latest
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      BRAIN_ALERT_TO: ${{ secrets.BRAIN_ALERT_TO }}
      BRAIN_EMAIL_INBOX_ID: omar-enserat1985@agentmail.to
      BRAIN_NOTIFICATION_EVIDENCE: .brain_state/email_watchdog.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration
        run: |
          test -n "$AGENTMAIL_API_KEY"
          test -n "$BRAIN_ALERT_TO"

      - name: Test outbound email and write evidence
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from brain_v12.brain.notification_router import NotificationRouter

          path = Path(os.environ["BRAIN_NOTIFICATION_EVIDENCE"])
          router = NotificationRouter(evidence_path=path)
          result = router.notify(
              event_type="EMAIL_CHANNEL_HEALTH",
              source="brain-email-watchdog",
              severity="ERROR",
              subject="Brain email channel health check",
              text=(
                  "Brain email channel health check completed. "
                  "This is an operational connectivity probe."
              ),
              fingerprint=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%MZ"),
          )
          # A verified probe is evidence of connectivity. The watchdog itself
          # remains green only when the provider returns message/thread IDs.
          if result.status != "SENT_VERIFIED":
              raise SystemExit(f"EMAIL_CHANNEL_NOT_VERIFIED:{result.status}:{result.error}")
          print("EMAIL_CHANNEL=VERIFIED")
          print("MESSAGE_ID_PRESENT=", bool(result.message_id))
          print("THREAD_ID_PRESENT=", bool(result.thread_id))
          PY
