name: Brain Email Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: brain-email-watchdog
  cancel-in-progress: true

jobs:
  email-watchdog:
    runs-on: ubuntu-latest
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      BRAIN_ALERT_TO: ${{ secrets.BRAIN_ALERT_TO }}
      BRAIN_EMAIL_INBOX_ID: omar-enserat1985@agentmail.to
      BRAIN_NOTIFICATION_EVIDENCE: .brain_state/email_watchdog.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration
        run: |
          test -n "$AGENTMAIL_API_KEY"
          test -n "$BRAIN_ALERT_TO"

      - name: Probe AgentMail inbox without sending email
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          inbox = os.environ["BRAIN_EMAIL_INBOX_ID"]
          request = urllib.request.Request(
              f"https://api.agentmail.to/v0/inboxes/{inbox}",
              headers={"Authorization": f"Bearer {os.environ['AGENTMAIL_API_KEY']}"},
              method="GET",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))
          if data.get("inbox_id") != inbox:
              raise SystemExit("EMAIL_CHANNEL_NOT_VERIFIED:inbox_mismatch")
          print("EMAIL_CHANNEL=REACHABLE")
          print("INBOX_VERIFIED=1")
          PY
