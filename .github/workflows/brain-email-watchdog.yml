name: Brain Email Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: brain-email-watchdog
  cancel-in-progress: true

jobs:
  email-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      BRAIN_ALERT_TO: ${{ secrets.BRAIN_ALERT_TO }}
      BRAIN_EMAIL_INBOX_ID: omar-enserat1985@agentmail.to
      BRAIN_NOTIFICATION_EVIDENCE: .brain_state/email_watchdog.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTMAIL_API_KEY"
          test -n "$BRAIN_ALERT_TO"
          echo "CONFIGURATION=READY"

      - name: Probe AgentMail inbox and write redacted evidence
        id: probe
        shell: bash
        run: |
          set -u
          mkdir -p .brain_state
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          inbox = os.environ["BRAIN_EMAIL_INBOX_ID"]
          started = time.monotonic()
          evidence = {
              "schema": "brain.email_watchdog.v2",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "state": "FAILED",
              "check": "agentmail_inbox_read",
              "inbox_verified": False,
              "http_status": None,
              "duration_ms": None,
              "failure_class": None,
          }

          try:
              request = urllib.request.Request(
                  f"https://api.agentmail.to/v0/inboxes/{inbox}",
                  headers={"Authorization": f"Bearer {os.environ['AGENTMAIL_API_KEY']}"},
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  evidence["http_status"] = response.status
                  data = json.loads(response.read().decode("utf-8"))

              if data.get("inbox_id") != inbox:
                  evidence["failure_class"] = "INBOX_MISMATCH"
              else:
                  evidence["state"] = "HEALTHY"
                  evidence["inbox_verified"] = True
          except urllib.error.HTTPError as exc:
              evidence["http_status"] = exc.code
              evidence["failure_class"] = (
                  "AUTH_FAILED" if exc.code in (401, 403)
                  else "AGENTMAIL_HTTP_ERROR"
              )
          except urllib.error.URLError:
              evidence["failure_class"] = "AGENTMAIL_UNREACHABLE"
          except TimeoutError:
              evidence["failure_class"] = "PROBE_TIMEOUT"
          except Exception:
              evidence["failure_class"] = "PROBE_ERROR"
          finally:
              evidence["duration_ms"] = round((time.monotonic() - started) * 1000, 2)

          Path(os.environ["BRAIN_NOTIFICATION_EVIDENCE"]).write_text(
              json.dumps(evidence, sort_keys=True, indent=2),
              encoding="utf-8",
          )

          print(f"EMAIL_STATE={evidence['state']}")
          print(f"INBOX_VERIFIED={int(evidence['inbox_verified'])}")
          print(f"HTTP_STATUS={evidence['http_status']}")
          print(f"FAILURE_CLASS={evidence['failure_class']}")
          print(f"DURATION_MS={evidence['duration_ms']}")

          if evidence["state"] != "HEALTHY":
              raise SystemExit(1)
          PY

      - name: Upload redacted email health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-email-watchdog-${{ github.run_id }}
          path: .brain_state/email_watchdog.json
          if-no-files-found: error
          retention-days: 14
