name: Brain Flipbook Engine

on:
  push:
    branches: [main]
    paths:
      - "cloud/flipbook_renderer.py"
      - "cloud/test_flipbook_renderer.py"
      - "cloud/FLIPBOOK_ENGINE.md"
      - "cloud/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flipbook dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile renderer
        run: python -m py_compile cloud/flipbook_renderer.py
      - name: Run flipbook tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q cloud/test_flipbook_renderer.py
      - name: Render reference flipbook
        env:
          PYTHONPATH: .
        run: python -m cloud.flipbook_renderer --output /tmp/brain-flipbook --frames 12 --fps 12
      - name: Verify MP4 artifact
        run: test -s /tmp/brain-flipbook/flipbook.mp4
