name: Brain ASIC Evidence Gate

on:
  pull_request:
    paths:
      - 'brain_v12/tools/brain_asic_evidence_gate.py'
      - 'brain_v12/tools/tests/test_brain_asic_evidence_gate.py'
      - '.github/workflows/brain-asic-evidence-gate.yml'
  push:
    branches:
      - brain-asic-evidence-gate-20261013
    paths:
      - 'brain_v12/tools/brain_asic_evidence_gate.py'
      - 'brain_v12/tools/tests/test_brain_asic_evidence_gate.py'
      - '.github/workflows/brain-asic-evidence-gate.yml'

permissions:
  contents: read

concurrency:
  group: brain-asic-evidence-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evidence gate and tests
        run: python -m py_compile brain_v12/tools/brain_asic_evidence_gate.py brain_v12/tools/tests/test_brain_asic_evidence_gate.py
      - name: Run fail-closed unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s brain_v12/tools/tests -p 'test_brain_asic_evidence_gate.py' -v
