name: Brain Device Cloud Pool CI

on:
  push:
    branches:
      - brain-software-cloud-pool
  pull_request:
    paths:
      - 'brain_v12/brain/device_cloud_pool.py'
      - 'brain_v12/brain/device_cloud_pool_api.py'
      - 'brain_v12/brain/software_hardware_factory.py'
      - 'brain_v12/tests/test_device_cloud_pool.py'
      - 'brain_v12/tests/test_software_hardware_factory.py'
      - 'brain_v12/tests/test_cloud_pool_dashboard.py'
      - 'brain_v12/web/cloud-pool.html'
      - 'brain_v12/web/index.html'
      - 'brain_v12/app.py'
      - '.github/workflows/brain-device-cloud-pool.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test cloud-pool API and browser dashboard contracts
        run: python -m unittest brain_v12.tests.test_cloud_pool_dashboard -v
      - name: Test device-backed cloud pool
        run: python -m unittest brain_v12.tests.test_device_cloud_pool -v
      - name: Test software-defined hardware leases and execution probe
        run: python -m unittest brain_v12.tests.test_software_hardware_factory -v
