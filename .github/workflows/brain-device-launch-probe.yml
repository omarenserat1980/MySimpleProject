name: Brain Physical Device Launch Probe

on:
  push:
    branches:
      - brain-software-cloud-pool
    paths:
      - '.github/workflows/brain-device-launch-probe.yml'
      - 'brain_v12/tools/brain_device_link.py'
      - 'brain_v12/brain/device_cloud_pool.py'
      - 'brain_v12/brain/device_cloud_pool_api.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-physical-device-launch-probe
  cancel-in-progress: false

jobs:
  launch-arkan-linux-agent:
    # Prefer Brain's existing self-hosted Arkan runner; do not use a paid cloud host.
    runs-on: [self-hosted, brain-internal]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve configuration and send one authenticated heartbeat
        shell: bash
        env:
          # Keep repository-provided values separate so empty settings do not
          # shadow credentials intentionally configured in the self-hosted runner.
          BRAIN_GITHUB_URL: ${{ vars.BRAIN_CONTROL_PLANE_URL }}
          BRAIN_GITHUB_AGENT_ID: ${{ vars.BRAIN_LINUX_AGENT_ID }}
          BRAIN_GITHUB_AGENT_KEY: ${{ secrets.BRAIN_AGENT_KEY }}
        run: |
          set -euo pipefail
          resolved_url="${BRAIN_GITHUB_URL:-${BRAIN_URL:-https://brain-control-plane-main.onrender.com}}"
          resolved_id="${BRAIN_GITHUB_AGENT_ID:-${BRAIN_AGENT_ID:-}}"
          resolved_key="${BRAIN_GITHUB_AGENT_KEY:-${BRAIN_AGENT_KEY:-}}"
          if [ -z "$resolved_id" ]; then
            echo "BLOCKED: no BRAIN_LINUX_AGENT_ID repository variable or BRAIN_AGENT_ID configured on the Arkan runner"
            exit 2
          fi
          if [ -z "$resolved_key" ]; then
            echo "BLOCKED: no BRAIN_AGENT_KEY repository secret or runner-level BRAIN_AGENT_KEY is configured"
            exit 2
          fi
          case "$resolved_id" in
            linux-executor-*) ;;
            *) echo "BLOCKED: Linux runner agent ID must start with linux-executor-"; exit 2 ;;
          esac
          case "$resolved_url" in
            https://*) ;;
            *) echo "BLOCKED: Control Plane URL must use HTTPS"; exit 2 ;;
          esac
          export BRAIN_URL="$resolved_url"
          export BRAIN_AGENT_ID="$resolved_id"
          export BRAIN_AGENT_KEY="$resolved_key"
          echo "AGENT_CONFIGURATION=READY"
          echo "AGENT_ID_SOURCE=${BRAIN_GITHUB_AGENT_ID:+repository_variable}"
          if [ -z "${BRAIN_GITHUB_AGENT_ID:-}" ]; then echo "AGENT_ID_SOURCE=runner_environment"; fi
          if [ -n "${BRAIN_GITHUB_AGENT_KEY:-}" ]; then echo "AGENT_KEY_SOURCE=repository_secret"; else echo "AGENT_KEY_SOURCE=runner_environment"; fi
          python3 -m py_compile brain_v12/tools/brain_device_link.py
          python3 brain_v12/tools/brain_device_link.py --once
      - name: Report explicit launch result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PHYSICAL_AGENT_LAUNCH=HEARTBEAT_ACCEPTED"
          else
            echo "PHYSICAL_AGENT_LAUNCH=NOT_VERIFIED"
          fi
