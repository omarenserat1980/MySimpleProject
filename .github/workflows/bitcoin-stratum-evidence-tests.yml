name: Bitcoin Stratum Bridge and Evidence Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'brain_v12/brain/bitcoin_stratum_evidence.py'
      - 'brain_v12/tests/test_bitcoin_stratum_evidence.py'
      - 'brain_v12/brain/bitcoin_stratum_bridge.py'
      - 'brain_v12/tests/test_bitcoin_stratum_bridge.py'
      - '.github/workflows/bitcoin-stratum-evidence-tests.yml'
  push:
    branches: [brain-bitcoin-live-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stratum-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile bridge, validator and tests
        run: |
          python -m py_compile \
            brain_v12/brain/bitcoin_stratum_evidence.py \
            brain_v12/tests/test_bitcoin_stratum_evidence.py \
            brain_v12/brain/bitcoin_stratum_bridge.py \
            brain_v12/tests/test_bitcoin_stratum_bridge.py
      - name: Run fail-closed bridge and evidence tests
        run: |
          python -m pytest -q \
            brain_v12/tests/test_bitcoin_stratum_evidence.py \
            brain_v12/tests/test_bitcoin_stratum_bridge.py
