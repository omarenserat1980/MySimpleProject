name: Brain Home Server Tests

on:
  pull_request:
    paths:
      - "brain_v12/home_server.py"
      - "brain_v12/execution_proof.py"
      - "brain_v12/tests/test_execution_proof.py"
      - "brain_v12/tests/test_home_server.py"
      - "brain_v12/requirements.txt"
      - ".github/workflows/brain-home-server-tests.yml"
      - "brain_v12/brain/cloud_executor_gate.py"
      - "brain_v12/tests/test_cloud_executor_gate_modes.py"
  push:
    branches:
      - "brain-proof-of-execution"
      - "brain-tcg-diagnostic-lane"
    paths:
      - "brain_v12/home_server.py"
      - "brain_v12/execution_proof.py"
      - "brain_v12/tests/test_execution_proof.py"
      - "brain_v12/tests/test_home_server.py"
      - "brain_v12/requirements.txt"
      - ".github/workflows/brain-home-server-tests.yml"
      - "brain_v12/brain/cloud_executor_gate.py"
      - "brain_v12/tests/test_cloud_executor_gate_modes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install QEMU diagnostic runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Install runtime dependencies
        run: python -m pip install -r brain_v12/requirements.txt
      - name: Compile module and tests
        run: >-
          python -m py_compile
          brain_v12/home_server.py
          brain_v12/tests/test_home_server.py
          brain_v12/execution_proof.py
          brain_v12/tests/test_execution_proof.py
          brain_v12/brain/cloud_executor_gate.py
          brain_v12/tests/test_cloud_executor_gate_modes.py
      - name: Run Execution Proof tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_execution_proof -v
      - name: Run Home Server queue tests
        env:
          PYTHONPATH: .
          BRAIN_HOME_SERVER_DB: ${{ runner.temp }}/brain-home-server-test.sqlite3
        run: python -m unittest brain_v12.tests.test_home_server -v
      - name: Run Cloud Executor gate mode tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_cloud_executor_gate_modes -v
      - name: Run real QEMU TCG diagnostic gate
        env:
          PYTHONPATH: .
          BRAIN_EXECUTOR_ACCELERATOR: tcg-diagnostic
        run: >-
          python -m brain_v12.brain.cloud_executor_gate
          --output ${{ runner.temp }}/cloud-executor-tcg-diagnostic.json
      - name: Assert TCG is diagnostic-only
        env:
          EVIDENCE: ${{ runner.temp }}/cloud-executor-tcg-diagnostic.json
        run: |
          python - <<'PY'
          import json, os
          e = json.load(open(os.environ["EVIDENCE"], encoding="utf-8"))
          assert e["diagnostic_verified"] is True, e
          assert e["verified"] is False, e
          assert e["production_capability"] == "TCG-DIAGNOSTIC-ONLY", e
          print("TCG_DIAGNOSTIC_ONLY=VERIFIED")
          PY
