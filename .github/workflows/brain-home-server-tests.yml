name: Brain Home Server Tests

on:
  pull_request:
    paths:
      - "brain_v12/home_server.py"
      - "brain_v12/tests/test_home_server.py"
      - "brain_v12/requirements.txt"
      - ".github/workflows/brain-home-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r brain_v12/requirements.txt
      - name: Compile module and tests
        run: python -m py_compile brain_v12/home_server.py brain_v12/tests/test_home_server.py
      - name: Run Home Server queue tests
        env:
          PYTHONPATH: .
          BRAIN_HOME_SERVER_DB: ${{ runner.temp }}/brain-home-server-test.sqlite3
        run: python -m unittest brain_v12.tests.test_home_server -v
      - name: Compile Windows Server 2025 provider modules and tests
        run: >-
          python -m py_compile
          brain_v12/brain/windows_cloud_executor.py
          brain_v12/brain/windows_cloud_gate.py
          brain_v12/brain/terraform_windows_cloud_provider.py
          brain_v12/brain/opennebula_windows_cloud_provider.py
          brain_v12/brain/windows_cloud_provider_factory.py
          brain_v12/brain/windows_terraform_safety.py
          brain_v12/tests/test_windows_cloud_executor.py
          brain_v12/tests/test_terraform_windows_cloud_provider.py
          brain_v12/tests/test_windows_terraform_safety.py
          brain_v12/tests/test_windows_cloud_provider_factory.py
          brain_v12/tests/test_opennebula_windows_cloud_provider.py
      - name: Run Windows Server 2025 provider contract and safety tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          brain_v12/tests/test_windows_cloud_executor.py
          brain_v12/tests/test_terraform_windows_cloud_provider.py
          brain_v12/tests/test_windows_terraform_safety.py
          brain_v12/tests/test_windows_cloud_provider_factory.py
          brain_v12/tests/test_opennebula_windows_cloud_provider.py
