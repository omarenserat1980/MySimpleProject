name: Brain Opportunity Discovery

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

concurrency:
  group: brain-opportunity-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build ranked opportunity queue
        run: |
          python3 scripts/brain_opportunity_discovery.py

      - name: Verify safety gates
        run: |
          python3 - <<'PY'
          import json
          p=".brain_state/opportunity_queue.json"
          x=json.load(open(p))
          assert x["commercial_truth"] == "DISCOVERY_ONLY_UNTIL_PAYMENT_VERIFIED"
          assert x["gates"]["financial_side_effects_blocked"] is True
          assert x["gates"]["payment_verification_required"] is True
          assert x["gates"]["paid_external_disabled_by_default"] is True
          assert x["candidates"]
          print("OPPORTUNITY_DISCOVERY=VERIFIED")
          print("NEXT="+x["selected_next"])
          PY

      - name: Publish opportunity evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-opportunity-queue
          path: .brain_state/opportunity_queue.json
          retention-days: 14
