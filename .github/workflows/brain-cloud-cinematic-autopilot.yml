name: brain-cloud-cinematic-autopilot

# Brain Cloud cinematic pipeline: automatic push trigger enabled.
# v7 hardening: every renderer/test change triggers a fresh production run.

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: "Maximum automatic render/QC retries"
        required: true
        default: "3"
        type: string
  push:
    paths:
      - "brain_v12/cinematic_autopilot.py"
      - "brain_v12/movie_summary_factory/**"
      - "brain_v12/brain_ffmpeg.py"
      - ".github/workflows/brain-cloud-cinematic-autopilot.yml"
      - "cloud/film_reliability.py"
      - "cloud/runtime_orchestrator.py"
      - "cloud/capability_demonstrator.py"
      - "cloud/capability_film.py"
      - "cloud/test_film_reliability.py"
      - "cloud/nafs_engine.py"
      - "cloud/test_nafs_engine.py"

permissions:
  contents: read

concurrency:
  group: brain-cloud-cinematic-autopilot
  cancel-in-progress: false

jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      FACTORY_ALLOW_LOCAL_FALLBACK: "1"
      CINEMATIC_MAX_ATTEMPTS: ${{ inputs.max_attempts || '3' }}
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deterministic media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-noto-core build-essential pkg-config yasm nasm libx264-dev libfreetype6-dev libfontconfig1-dev

      - name: Bind CI media toolchain into Brain
        run: |
          set -euo pipefail
          mkdir -p brain_v12/bin
          FF=$(command -v ffmpeg)
          FP=$(command -v ffprobe)
          test -x "$FF"
          test -x "$FP"
          ln -sfn "$FF" brain_v12/bin/ffmpeg
          ln -sfn "$FP" brain_v12/bin/ffprobe
          test -x brain_v12/bin/ffmpeg
          test -x brain_v12/bin/ffprobe
          echo "BRAIN_FFMPEG=$(readlink -f brain_v12/bin/ffmpeg)"
          echo "BRAIN_FFPROBE=$(readlink -f brain_v12/bin/ffprobe)"
          brain_v12/bin/ffmpeg -version | head -n 1
          brain_v12/bin/ffprobe -version | head -n 1

      - name: Stage 7 self-healing repair
        run: |
          python brain_v12/movie_summary_factory/room13_stage7_repair.py

      - name: Brain preflight
        run: |
          python -m compileall -q brain_v12 cloud
          python -m unittest brain_v12.movie_summary_factory.test_room13_pipeline cloud.test_film_reliability cloud.test_nafs_engine -v
          python brain_v12/movie_summary_factory/room13_media_health.py
          python - <<'PY'
          from brain_v12.brain_ffmpeg import ffmpeg, ffprobe
          print("BRAIN_FFMPEG_RESOLVED=" + ffmpeg())
          print("BRAIN_FFPROBE_RESOLVED=" + ffprobe())
          PY

      - name: Reliability engine contract gate
        run: |
          python -m unittest cloud.test_film_reliability -v

      - name: Brain autonomously chooses its capability demonstration
        run: python -m cloud.capability_demonstrator


      - name: Show autopilot diagnostics
        if: always()
        run: |
          echo "=== cinematic autopilot state ==="
          if [ -f brain_v12/web/media/engine/cinematic-autopilot-state.json ]; then
            cat brain_v12/web/media/engine/cinematic-autopilot-state.json
          else
            echo "state file missing"
          fi
          echo "=== cinematic autopilot log (tail) ==="
          if [ -f cinematic_output/cinematic-autopilot.log ]; then
            tail -n 160 cinematic_output/cinematic-autopilot.log
          else
            echo "autopilot log missing"
          fi
          echo "=== media engine files ==="
          find brain_v12/web/media/engine -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Verify final MP4
        run: |
          test -s cinematic_output/final.mp4
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("cinematic_output/final.mp4")
          x=subprocess.run([
              "ffprobe","-v","error",
              "-show_entries","format=duration,size",
              "-show_entries","stream=codec_type,codec_name,width,height",
              "-of","json",str(p)
          ],check=True,text=True,capture_output=True)
          d=json.loads(x.stdout)
          assert float(d["format"]["duration"]) > 0
          assert int(d["format"]["size"]) >= 1024
          assert any(s.get("codec_type")=="video" and s.get("width")==1920 and s.get("height")==1080 for s in d["streams"])
          assert any(s.get("codec_type")=="audio" and s.get("codec_name")=="aac" for s in d["streams"])
          print("BRAIN_CINEMATIC_MASTER_QC=PASS")
          PY

      - name: Upload verified film
        uses: actions/upload-artifact@v6
        with:
          name: brain-cloud-cinematic-master
          path: |
            cinematic_output/final.mp4
            cinematic_output/film_manifest.json
            cinematic_output/cinematic-autopilot.log
            brain_v12/web/media/engine/cinematic-autopilot-state.json
            brain_v12/web/media/engine/room-13-qc.json
            STATE/capability_demo/decision.json
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: brain-cloud-cinematic-diagnostics
          path: |
            cinematic_output/cinematic-autopilot.log
            brain_v12/web/media/engine/cinematic-autopilot-state.json
            brain_v12/web/media/engine/room-13-progress.json
          if-no-files-found: ignore

      - name: Production summary
        if: always()
        run: |
          echo "## Brain Cloud Cinematic Autopilot" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cinematic_output/film_manifest.json ]; then
            cat cinematic_output/film_manifest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verified film manifest was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
