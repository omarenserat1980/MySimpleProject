name: Brain Git Platform Foundation

on:
  push:
    paths:
      - "brain_git_platform/**"
      - ".github/workflows/brain-git-platform-foundation.yml"
  pull_request:
    paths:
      - "brain_git_platform/**"
      - ".github/workflows/brain-git-platform-foundation.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Brain-native tests
        run: python -m unittest discover -s brain_git_platform -p 'test_*.py' -v
      - name: Assert GitHub is not a runtime dependency
        run: |
          if grep -RniE 'github\.com|api\.github\.com|PyGithub|GITHUB_TOKEN' brain_git_platform --exclude='*.md'; then
            echo "GitHub runtime dependency detected"
            exit 1
          fi
