name: Brain Cloudflare Deploy
# Evidence gate: cinema checkout + protected R2 stream
# Production Cloudflare writes are manual-only; emulator/CI is the default path.

on:
  # Live Cloudflare changes are never triggered automatically.
  # Default CI and emulator checks run in their own workflows.
  workflow_dispatch:
    inputs:
      real_cloudflare_deploy:
        description: "Explicitly authorize real Cloudflare resource writes and Worker deployment"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: brain-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_cloudflare_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Worker
        run: |
          set -euo pipefail
          test -f cloudflare/brain-api/wrangler.toml
          test -f cloudflare/brain-api/src/index.js
          test -f cloudflare/brain-api/migrations/0001_commercial.sql
          test -f cloudflare/brain-api/migrations/0007_cinema_entitlements.sql
          test -f cloudflare/brain-api/test/cinema_worker_static.test.js
          test -f cloudflare/brain-api/src/supervisor.js
          node --check cloudflare/brain-api/src/index.js
          (cd cloudflare/brain-api && node test/cloudflare_deploy_static.test.js)
          (cd cloudflare/brain-api && node test/commercial_worker_static.test.js)
          (cd cloudflare/brain-api && node test/cinema_worker_static.test.js)

      - name: Validate Cloudflare and PayTabs configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYTABS_SERVER_KEY: ${{ secrets.PAYTABS_SERVER_KEY }}
          PAYTABS_PROFILE_ID: ${{ vars.PAYTABS_PROFILE_ID || secrets.PAYTABS_PROFILE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYTABS_SERVER_KEY PAYTABS_PROFILE_ID; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error title=Missing deployment configuration::$name is not configured in GitHub Actions."
              missing=1
            else
              echo "$name=CONFIGURED"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "COMMERCIAL_DEPLOYMENT_BLOCKED=TRUE"
            echo "CONFIGURATION_ACTION_REQUIRED=TRUE"
            exit 1
          fi
          echo "COMMERCIAL_DEPLOYMENT_BLOCKED=FALSE"
          echo "CONFIGURATION_ACTION_REQUIRED=FALSE"
      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare/brain-api
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          name="brain-commercial"
          import os
          def run_wr(args):
              p=subprocess.run(args,capture_output=True,text=True)
              if p.returncode:
                  # Surface actionable Wrangler diagnostics without echoing credentials.
                  safe=(p.stderr or p.stdout or "No diagnostic text returned")
                  for secret_name in ("CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"):
                      secret=os.environ.get(secret_name,"")
                      if secret:
                          safe=safe.replace(secret,"[REDACTED]")
                  print("WRANGLER_COMMAND_FAILED=" + " ".join(args[:3]))
                  print("WRANGLER_DIAGNOSTIC_BEGIN")
                  print(safe[-6000:])
                  print("WRANGLER_DIAGNOSTIC_END")
                  raise SystemExit(p.returncode)
              return p
          name="brain-commercial"
          p=run_wr(["npx","wrangler","d1","list","--json"])
          try:
              rows=json.loads(p.stdout)
          except json.JSONDecodeError:
              raise SystemExit("D1_LIST_RETURNED_INVALID_JSON")
          found=next((x for x in rows if x.get("name")==name),None)
          if not found:
              run_wr(["npx","wrangler","d1","create",name])
              p=run_wr(["npx","wrangler","d1","list","--json"])
              try:
                  rows=json.loads(p.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("D1_LIST_RETURNED_INVALID_JSON_AFTER_CREATE")
              found=next((x for x in rows if x.get("name")==name),None)
          if not found or not found.get("uuid"):
              raise SystemExit("D1_DATABASE_ID_NOT_FOUND")
          with open("/tmp/d1_id","w") as f: f.write(found["uuid"])
          print("D1_DATABASE_READY=TRUE")
          PY
          echo "D1_DATABASE_ID=$(cat /tmp/d1_id)" >> "$GITHUB_ENV"

      - name: Bind D1 and migrate
        working-directory: cloudflare/brain-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sed -i "s/database_id = \"REPLACED_IN_CI\"/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          npx wrangler d1 migrations apply brain-commercial --remote
          echo "D1_MIGRATIONS=APPLIED"

      - name: Ensure private cinema R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare/brain-api
        run: |
          set -euo pipefail
          # Wrangler 4 supports bucket listing without a --json flag. Parse its table output.
          npx wrangler r2 bucket list
          if ! npx wrangler r2 bucket list | grep -Fq 'brain-cinema-media'; then
            npx wrangler r2 bucket create brain-cinema-media
          fi
          npx wrangler r2 bucket list | grep -Fq 'brain-cinema-media'
          echo "CINEMA_R2_BUCKET_READY=TRUE"

      - name: Acquire verified cinema master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve the newest successful Brain Factory run; never fall back to a missing public path.
          PRODUCTION_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow last-light-no-pay.yml --branch main --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$PRODUCTION_RUN_ID" ]; then
            echo "::error title=Missing verified film::No successful Brain Factory production run was found."
            exit 1
          fi
          echo "CINEMA_SOURCE_RUN_ID=$PRODUCTION_RUN_ID"
          mkdir -p /tmp/brain-cinema-master
          gh run download "$PRODUCTION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name brain-cinema-master-private --dir /tmp/brain-cinema-master
          MASTER="/tmp/brain-cinema-master/last_light_city.mp4"
          test -s "$MASTER"
          echo "CINEMA_MASTER_ACQUIRED=PASS"

      - name: Upload verified cinema master to private R2
        working-directory: cloudflare/brain-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MASTER="/tmp/brain-cinema-master/last_light_city.mp4"
          test -s "$MASTER"
          npx wrangler r2 object put brain-cinema-media/films/last_light_city.mp4 --file "$MASTER" --content-type video/mp4 --cache-control "private, no-store" --remote
          echo "CINEMA_MASTER_R2_UPLOAD=PASS"

      - name: Configure Brain control secret (optional)
        working-directory: cloudflare/brain-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.BRAIN_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_CONTROL_TOKEN:-}" ]; then
            echo "BRAIN_CONTROL_TOKEN_CONFIGURED=FALSE"
            echo "BRAIN_CONTROL_TOKEN_OPTIONAL=TRUE"
            exit 0
          fi
          printf '%s' "$BRAIN_CONTROL_TOKEN" | npx wrangler secret put BRAIN_CONTROL_TOKEN
          echo "BRAIN_CONTROL_TOKEN_CONFIGURED=TRUE"
      - name: Configure PayTabs Worker secret
        working-directory: cloudflare/brain-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYTABS_SERVER_KEY: ${{ secrets.PAYTABS_SERVER_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYTABS_SERVER_KEY" | npx wrangler secret put PAYTABS_SERVER_KEY
          echo "PAYTABS_SERVER_KEY_CONFIGURED=TRUE"

      - name: Deploy Worker
        working-directory: cloudflare/brain-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYTABS_PROFILE_ID: ${{ vars.PAYTABS_PROFILE_ID || secrets.PAYTABS_PROFILE_ID }}
          BRAIN_ORIGIN: ${{ vars.BRAIN_ORIGIN || secrets.BRAIN_ORIGIN }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.ndjson
        run: |
          set -euo pipefail
          rm -f /tmp/wrangler-output.ndjson
          npx wrangler deploy --var "PAYTABS_PROFILE_ID:$PAYTABS_PROFILE_ID" --var "BRAIN_ORIGIN:$BRAIN_ORIGIN" | tee /tmp/wrangler-deploy.log
          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)
          if [ -z "$WORKER_URL" ]; then echo "WORKER_URL_NOT_FOUND"; exit 1; fi
          echo "WORKER_URL=$WORKER_URL"
          echo "$WORKER_URL" > /tmp/worker_url

      - name: Wire public cinema page to deployed Worker
        env:
          WORKER_URL_FILE: /tmp/worker_url
        run: |
          set -euo pipefail
          WORKER_URL=$(cat "$WORKER_URL_FILE")
          python - <<'PY'
          from pathlib import Path
          p=Path("cinema.html")
          s=p.read_text()
          url=Path("/tmp/worker_url").read_text().strip()
          if "__BRAIN_CINEMA_API_URL__" not in s and "workers.dev" not in s:
              raise SystemExit("CINEMA_API_CONFIGURATION_MISSING")
          if "__BRAIN_CINEMA_API_URL__" in s:
            p.write_text(s.replace("__BRAIN_CINEMA_API_URL__", url))
          PY
          if git diff --quiet -- cinema.html; then
            echo "CINEMA_PAGE_ALREADY_WIRED=TRUE"
          else
            git config user.name "brain-cloud-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cinema.html
            git commit -m "chore: wire cinema page to deployed Brain API"
            git push origin HEAD:main
            echo "CINEMA_PAGE_WIRED=TRUE"
          fi

      - name: Smoke test deployed Worker HTTP API
        env:
          WORKER_URL_FILE: /tmp/worker_url
        run: |
          set -euo pipefail
          WORKER_URL="$(cat "$WORKER_URL_FILE")"
          response="$(curl --silent --show-error --fail-with-body --max-time 20 "$WORKER_URL/health")"
          printf '%s' "$response" | node -e '
            let data = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              let parsed;
              try { parsed = JSON.parse(data); } catch { console.error("API_HEALTH_INVALID_JSON"); process.exit(1); }
              if (parsed.ok !== true || parsed.service !== "brain-cloud-api" || parsed.d1 !== "CONFIGURED") {
                console.error("API_HEALTH_CHECK_FAILED");
                process.exit(1);
              }
              console.log("API_HTTP_HEALTH=PASS");
              console.log("API_D1_BINDING=PASS");
            });
          '

      - name: Smoke test syntax and config
        working-directory: cloudflare/brain-api
        run: |
          set -euo pipefail
          node --check src/index.js
          echo "WORKER_DEPLOYMENT_PIPELINE=READY"
# Trigger Cloudflare deploy on every validated workflow revision.
