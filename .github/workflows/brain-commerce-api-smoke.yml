name: BRAIN Commerce API Smoke

on:
  push:
    branches: ["feat/brain-digital-commerce"]
    paths:
      - "brain_v12/brain/commerce_api.py"
      - "brain_v12/tests/test_commerce_api.py"
      - "brain_v12/app.py"
  pull_request:
    paths:
      - "brain_v12/brain/commerce_api.py"
      - "brain_v12/tests/test_commerce_api.py"
      - "brain_v12/app.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Commerce API tests
        run: python -m unittest brain_v12.tests.test_commerce_api -v
