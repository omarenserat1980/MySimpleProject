name: Brain Temporary Software Execution Node

on:
  push:
    branches: [main, feat/software-resource-node]
    paths:
      - ".github/workflows/brain-temporary-software-executor.yml"
      - "brain_v12/brain/software_resource_node.py"
      - "brain_v12/brain/windows_software_boot_gate.py"
      - "brain_v12/tests/test_software_resource_node.py"
      - "brain_v12/tests/test_windows_software_boot_gate.py"
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: "Direct HTTPS Windows Server 2025 ISO URL from Microsoft Evaluation Center (optional)"
        required: false
        type: string
      trusted_iso_sha256:
        description: "Independently verified SHA-256 for that exact ISO (required if URL supplied)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: brain-temporary-software-executor
  cancel-in-progress: false

jobs:
  provision-software-node:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded software execution tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pytest
          qemu-system-x86_64 --version | head -n 1
          test -x "$(command -v qemu-system-x86_64)"
      - name: Detect actual host capabilities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil
          mem = None
          try:
              pages = os.sysconf("SC_PHYS_PAGES")
              size = os.sysconf("SC_PAGE_SIZE")
              mem = pages * size
          except (ValueError, OSError, AttributeError):
              pass
          kvm = pathlib.Path("/dev/kvm")
          report = {
              "schema": "brain.software-executor-capability.v1",
              "executor": "github-hosted-ubuntu",
              "architecture": os.uname().machine,
              "cpu_count": os.cpu_count(),
              "memory_bytes": mem,
              "qemu": shutil.which("qemu-system-x86_64") is not None,
              "kvm_device_exists": kvm.exists(),
              "kvm_readable": os.access(kvm, os.R_OK),
              "kvm_writable": os.access(kvm, os.W_OK),
              "accelerator": "kvm" if kvm.exists() and os.access(kvm, os.R_OK|os.W_OK) else "tcg",
              "windows_boot_verified": False,
              "status": "SOFTWARE_NODE_READY",
          }
          pathlib.Path("software-executor-capability.json").write_text(json.dumps(report, indent=2)+"\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Run Brain resource and evidence gates
        run: |
          set -euo pipefail
          python3 -m pytest -q brain_v12/tests/test_software_resource_node.py brain_v12/tests/test_windows_software_boot_gate.py
      - name: Download and verify Windows Server 2025 Evaluation ISO
        env:
          ISO_URL: ${{ inputs.windows_iso_url || 'https://software-static.download.prss.microsoft.com/dbazure/998969d5-f34g-4e03-ac9d-1f9786c66749/26100.32230.260111-0550.lt_release_svc_refresh_SERVER_EVAL_x64FRE_en-us.iso' }}
          TRUSTED_SHA256: ${{ inputs.trusted_iso_sha256 || '7b052573ba7894c9924e3e87ba732ccd354d18cb75a883efa9b900ea125bfd51' }}
        run: |
          set -euo pipefail
          case "$ISO_URL" in https://software-static.download.prss.microsoft.com/*) ;; *) echo "BLOCKED: URL must be a Microsoft software download host"; exit 2;; esac
          [[ "$TRUSTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "BLOCKED: SHA-256 is required"; exit 2; }
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 3 --connect-timeout 30 "$ISO_URL" -o windows-server-2025.iso
          actual="$(sha256sum windows-server-2025.iso | awk '{print $1}')"
          test "${actual,,}" = "${TRUSTED_SHA256,,}" || { echo "BLOCKED: ISO SHA-256 mismatch"; exit 2; }
          printf '{"iso":"Windows Server 2025 Evaluation x64 en-US","bytes":%s,"sha256":"%s","verified":true}\n' "$(stat -c %s windows-server-2025.iso)" "$actual" > windows-iso-verification.json
          echo "MICROSOFT_ISO_SHA256_VERIFIED=PASS"
      - name: Boot Windows Server installer under QEMU TCG
        run: |
          set -euo pipefail
          qemu-img create -f qcow2 windows-server-2025.qcow2 64G
          rm -f qemu-monitor.sock qemu.log
          qemu-system-x86_64 -machine q35,accel=tcg -cpu max -smp 2 -m 4096 -drive file=windows-server-2025.qcow2,format=qcow2,if=virtio -cdrom windows-server-2025.iso -boot order=d -display none -vnc 127.0.0.1:1 -monitor unix:qemu-monitor.sock,server,nowait -no-reboot -no-shutdown >qemu.log 2>&1 &
          qemu_pid=$!
          echo "$qemu_pid" > qemu.pid
          for i in $(seq 1 90); do if ! kill -0 "$qemu_pid" 2>/dev/null; then cat qemu.log; exit 1; fi; if [ -S qemu-monitor.sock ]; then break; fi; sleep 2; done
          test -S qemu-monitor.sock
          sleep 120
          printf 'screendump /tmp/windows-boot.ppm\n' | socat - UNIX-CONNECT:qemu-monitor.sock || true
          if [ -f /tmp/windows-boot.ppm ]; then
            python3 - <<'PY'
from PIL import Image
Image.open('/tmp/windows-boot.ppm').save('windows-boot-screen.png')
PY
          fi
          python3 - <<'PY'
          import json, socket, time
          s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); s.settimeout(5); s.connect('qemu-monitor.sock')
          time.sleep(1); banner=s.recv(4096).decode('utf-8','replace')
          s.sendall(b'info status\n'); time.sleep(1)
          try: status=s.recv(4096).decode('utf-8','replace')
          except Exception as e: status=str(e)
          report={'qemu_process_running': True, 'monitor_connected': True, 'monitor_banner': banner[-500:], 'guest_status': status[-1000:], 'iso_sha256_verified': True, 'windows_guest_boot_verified': False, 'note':'QEMU running with Windows installer ISO; guest installation and in-guest proof are not yet confirmed.'}
          open('windows-qemu-boot-evidence.json','w').write(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          s.sendall(b'quit\n'); s.close()
          PY
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-software-executor-evidence
          path: |
            software-executor-capability.json
            windows-iso-verification.json
            windows-qemu-boot-evidence.json
            windows-boot-screen.png
            qemu.log
          if-no-files-found: warn
          retention-days: 7
