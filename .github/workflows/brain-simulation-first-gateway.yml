name: Brain Simulation-First Gateway
on:
  pull_request:
    paths:
      - "brain_v12/brain/arkan_failover_gateway.py"
      - "brain_v12/brain/background_work_coordinator.py"
      - "brain_v12/app.py"
      - "brain_v12/tests/test_arkan_failover_gateway.py"
      - "brain_v12/tests/test_background_work_coordinator.py"
      - "brain_v12/tests/test_simulation_first_remote_api_contract.py"
      - ".github/workflows/brain-simulation-first-gateway.yml"
  push:
    branches: ["feat/simulation-first-remote-fabric-main"]
permissions:
  contents: read
jobs:
  simulation-first-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify simulation-first gateway contract
        run: python -m unittest brain_v12.tests.test_arkan_failover_gateway brain_v12.tests.test_simulation_first_remote_api_contract brain_v12.tests.test_background_work_coordinator -v
