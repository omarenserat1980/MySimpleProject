name: Brain Benchmark Self Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark and safety tests
        run: |
          python -m unittest             brain_v12.brain.test_security_guard             brain_v12.brain.test_company_operating_system             brain_v12.brain.test_competitive_evolution             brain_v12.brain.test_level_report             brain_v12.self_healing.test_future_evolution_executor -v
