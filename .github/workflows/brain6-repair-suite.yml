name: Brain 6 - Repair & Verification Suite

on:
  workflow_dispatch:
  push:
    paths:
      - "brain6_cpp/**"
      - "brain6_cs/**"
      - "brain6_tools/**"
      - "production/BRAIN6_168H.json"
      - ".github/workflows/brain6-168h-cloud.yml"
      - ".github/workflows/brain6-repair-suite.yml"

permissions:
  contents: read

concurrency:
  group: brain6-repair-suite
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ffmpeg

      - name: Preflight contract
        run: |
          python brain6_tools/preflight.py
          cat brain6_preflight_report.json

      - name: Python syntax verification
        run: |
          python -m compileall -q brain6_tools

      - name: C++ strict build
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic             brain6_cpp/main.cpp -o /tmp/brain6

      - name: C# restore and build
        run: |
          dotnet restore brain6_cs/Brain6.csproj
          dotnet build brain6_cs/Brain6.csproj -c Release --no-restore

      - name: Supervisor binary smoke check
        run: |
          test -x /tmp/brain6
          /tmp/brain6 >/tmp/brain6-smoke.log 2>&1 || code=$?
          test "${code:-0}" -eq 20
          grep -q "BRAIN6_STATE_MISSING" /tmp/brain6-smoke.log || true

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain6-repair-report
          path: |
            brain6_preflight_report.json
            /tmp/brain6-smoke.log
          if-no-files-found: ignore
          retention-days: 14
