name: Brain Cognitive Benchmark Lab

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud/cognitive_benchmark_registry.py"
      - "cloud/cognitive_benchmark_runner.py"
      - "cloud/human_like_benchmark.py"
      - ".github/workflows/brain-cognitive-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Brain-native benchmark plan
        run: python -m cloud.human_like_benchmark
      - name: Run configured benchmark adapters
        run: python -m cloud.cognitive_benchmark_runner
      - name: Upload evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: brain-cognitive-benchmark-evidence
          path: STATE/benchmarks/latest.json
          if-no-files-found: error
