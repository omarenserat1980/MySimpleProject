name: Brain AI Frontend

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/web/brain-chat/**"
      - "brain_v12/tests/test_brain_ai_frontend.py"
      - "brain_v12/tests/test_chat_session_api.py"
      - "brain_v12/tests/test_chat_session_api.py"
      - "brain_v12/tests/test_brain_ai_api.py"
      - "brain_v12/tests/test_brain_ai_product_smoke.py"
      - "brain_v12/app.py"
      - "brain_v12/brain/chat_session_store.py"
      - "brain_v12/brain/device_bridge.py"
      - "brain_v12/brain/evidence_store.py"
      - "brain_v12/brain/brain_ai_api.py"
      - "brain_v12/brain/chat_session_api.py"
      - "brain_v12/brain/brain_ai.py"
      - "brain_v12/tests/test_brain_ai.py"
      - "brain_v12/tests/test_brain_ai_product_smoke.py"
      - "brain_v12/app.py"
      - "brain_v12/brain/chat_session_store.py"
      - "brain_v12/brain/device_bridge.py"
      - "brain_v12/brain/evidence_store.py"
      - ".github/workflows/brain-ai-frontend.yml"
  pull_request:
    paths:
      - "brain_v12/web/brain-chat/**"
      - "brain_v12/tests/test_brain_ai_frontend.py"
      - "brain_v12/tests/test_chat_session_api.py"
      - "brain_v12/tests/test_brain_ai_api.py"
      - "brain_v12/brain/brain_ai_api.py"
      - "brain_v12/brain/chat_session_api.py"
      - ".github/workflows/brain-ai-frontend.yml"
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run browser-independent Brain Chat smoke checks"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: brain-ai-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Brain AI Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Brain AI frontend contract
        run: python -m unittest brain_v12.tests.test_brain_ai_frontend -v
      - name: Validate Brain AI session API and sync contract
        run: python -m unittest brain_v12.tests.test_chat_session_api -v
      - name: Run Brain product end-to-end verification gate
        run: python -m unittest brain_v12.tests.test_brain_ai_product_smoke -v
      - name: Python compile sanity
        run: python -m compileall -q brain_v12/brain brain_v12/tests
      - name: Node JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("brain_v12/web/brain-chat/index.html")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>", p.read_text(encoding="utf-8"), re.S|re.I)
          Path("/tmp/brain-chat.js").write_text("\n".join(scripts), encoding="utf-8")
          print("Extracted", len(scripts), "script block(s)")
          PY
          node --check /tmp/brain-chat.js
      - name: Static security and frontend contract sanity
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}" brain_v12/web/brain-chat; then
            echo "Potential credential-like token found in frontend" >&2
            exit 1
          fi
          grep -Fq "encodeURIComponent(sid)" brain_v12/web/brain-chat/index.html
          grep -Fq "evidenceView" brain_v12/web/brain-chat/index.html
          grep -Fq "/api/brain-chat/sessions" brain_v12/web/brain-chat/index.html
          grep -Fq "/messages" brain_v12/web/brain-chat/index.html
      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Brain AI Frontend CI"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Frontend contract: executed"
            echo "- Session API contract: executed"
            echo "- Brain AI HTTP API contract: executed"
            echo "- Python compile sanity: executed"
            echo "- JavaScript syntax: executed"
            echo "- Static security/contract sanity: executed"
            echo "- Verification status: see preceding steps"
          } >> "$GITHUB_STEP_SUMMARY"
