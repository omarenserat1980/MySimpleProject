name: Brain AI Frontend

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/web/brain-chat/**"
      - "brain_v12/tests/test_brain_ai_frontend.py"
      - ".github/workflows/brain-ai-frontend.yml"
  pull_request:
    paths:
      - "brain_v12/web/brain-chat/**"
      - "brain_v12/tests/test_brain_ai_frontend.py"
      - ".github/workflows/brain-ai-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Brain AI frontend
        run: python -m unittest brain_v12.tests.test_brain_ai_frontend -v
