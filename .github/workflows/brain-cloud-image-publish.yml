name: Brain Cloud Image Publish

on:
  pull_request:
    paths:
      - "cloud/**"
      - "brain_v12/requirements.txt"
      - "brain_v7/requirements.txt"
      - ".github/workflows/brain-cloud-image-publish.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "brain_v12/requirements.txt"
      - "brain_v7/requirements.txt"
      - ".github/workflows/brain-cloud-image-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-cloud-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.repository == 'omarenserat1980/MySimpleProject'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Brain Cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.repository == 'omarenserat1980/MySimpleProject' }}
          tags: |
            ghcr.io/omarenserat1980/mysimpleproject-brain-cloud:latest
            ghcr.io/omarenserat1980/mysimpleproject-brain-cloud:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
