name: Brain Watchdog Adversarial Policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial tests
        run: python -m pytest -q brain_v12/brain/workflow_watchdog_policy_test.py brain_v12/brain/workflow_watchdog_adversarial_test.py
