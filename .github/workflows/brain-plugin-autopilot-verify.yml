name: Brain Plugin Autopilot Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Brain tests
        run: python -m compileall -q brain_v12/tests

      - name: Plugin structure test
        run: python -m unittest brain_v12.tests.test_brain_autopilot_plugin -v

      - name: Manifest JSON validation
        run: python -c "import json; json.load(open('plugins/brain-autopilot/plugin.json', encoding='utf-8')); print('plugin.json: valid')"

      - name: Evidence gate
        run: |
          mkdir -p brain-artifacts
          printf '%s\n' "BRAIN_PLUGIN_AUTOPILOT_VERIFIED" > brain-artifacts/PLUGIN_VERIFIED.txt
          test -s brain-artifacts/PLUGIN_VERIFIED.txt

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-plugin-autopilot-verified
          path: brain-artifacts/PLUGIN_VERIFIED.txt
