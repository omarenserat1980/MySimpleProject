name: Portable Resource Orchestrator CI

on:
  pull_request:
    branches: [main]
    paths:
      - "brain_v12/brain/portable_resource_orchestrator.py"
      - "brain_v12/brain/executor_contract.py"
      - "brain_v12/brain/run_evidence_store.py"
      - "brain_v12/brain/bitcoin_north_star.py"
      - "brain_v12/brain/bitcoin_pool_evidence.py"
      - "brain_v12/brain/decision_engine.py"
      - "brain_v12/brain/cognitive_loop.py"
      - "brain_v12/brain/mining_controller.py"
      - "brain_v12/tests/test_mining_controller.py"
      - "brain_v12/tests/test_bitcoin_north_star.py"
      - "brain_v12/tests/test_bitcoin_pool_evidence.py"
      - "brain_v12/brain/android_executor_adapter.py"
      - "brain_v12/tests/test_portable_resource_orchestrator.py"
      - "brain_v12/tests/test_executor_contract.py"
      - "brain_v12/tests/test_run_evidence_store.py"
      - "brain_v12/tests/test_android_executor_adapter.py"
      - "brain_v12/tests/test_device_bridge_android_capacity.py"
      - "brain_v12/brain/asic_resource_adapter.py"
      - "brain_v12/brain/asic_hardware_simulator.py"
      - "brain_v12/brain/mining_engine.py"
      - "brain_v12/brain/bitcoin_mining_intelligence_api.py"
      - "brain_v12/tests/test_mining_engine.py"
      - "brain_v12/tests/test_bitcoin_mining_intelligence_api.py"
      - "brain_v12/tests/test_asic_resource_adapter.py"
      - "brain_v12/tests/test_asic_hardware_simulator.py"
      - "brain_v12/tests/test_asic_prototype_toolchain.py"
      - "brain_v12/brain/capability_registry.py"
      - "brain_v12/brain/health_probe.py"
      - "brain_v12/brain/task_engine.py"
      - "brain_v12/brain/worker_registry.py"
      - "brain_v12/brain/evidence_store.py"
      - "brain_v12/asic/**"
      - ".github/workflows/portable-resource-orchestrator-ci.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/asic/**"
      - ".github/workflows/portable-resource-orchestrator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-resource-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-evidence-tests:
    name: Policy, contract and evidence tests (no provisioning)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile execution components
        run: |
          python -m py_compile \
            brain_v12/brain/portable_resource_orchestrator.py \
            brain_v12/brain/executor_contract.py \
            brain_v12/brain/run_evidence_store.py \
            brain_v12/brain/bitcoin_north_star.py \
            brain_v12/brain/bitcoin_pool_evidence.py \
            brain_v12/brain/decision_engine.py \
            brain_v12/brain/cognitive_loop.py \
            brain_v12/brain/mining_controller.py \
            brain_v12/tests/test_mining_controller.py \
            brain_v12/tests/test_bitcoin_north_star.py \
            brain_v12/brain/android_executor_adapter.py \
            brain_v12/brain/asic_resource_adapter.py \
            brain_v12/brain/asic_hardware_simulator.py \
            brain_v12/brain/mining_engine.py \
            brain_v12/brain/bitcoin_mining_intelligence_api.py \
            brain_v12/asic/toolchain_probe.py

      - name: Install ASIC test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check fastapi pydantic

      - name: Run focused Bitcoin SHA-256d preflight tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            brain_v12/tests/test_mining_controller.py \
            brain_v12/tests/test_bitcoin_north_star.py

      - name: Run Bitcoin pool evidence gate tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_bitcoin_pool_evidence -v
      - name: Run mining economics and profit-gate tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p artifacts/asic
          python -m unittest \
            brain_v12.tests.test_mining_engine \
            brain_v12.tests.test_bitcoin_mining_intelligence_api \
            brain_v12.tests.test_bitcoin_north_star -v \
            2>&1 | tee artifacts/asic/mining-economics-tests.log

      - name: Prepare RTL evidence directory
        if: always()
        run: |
          mkdir -p artifacts/asic
          git rev-parse HEAD | tee artifacts/asic/git-commit.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee artifacts/asic/started-at-utc.txt

      - name: Install open-source RTL simulator
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/asic
          set +e
          # Bound package-manager waits so the acceptance gate cannot hang indefinitely.
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update > artifacts/asic/rtl-tool-install.log 2>&1
          update_rc=$?
          if [ "$update_rc" -eq 0 ]; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y iverilog yosys >> artifacts/asic/rtl-tool-install.log 2>&1
            install_rc=$?
          else
            install_rc=125
          fi
          printf 'apt_update_exit_code=%s\napt_install_exit_code=%s\n' "$update_rc" "$install_rc" > artifacts/asic/tool-install-status.txt
          if command -v iverilog >/dev/null 2>&1; then
            iverilog -V >> artifacts/asic/rtl-tool-install.log 2>&1
          fi
          if command -v yosys >/dev/null 2>&1; then
            yosys -V >> artifacts/asic/rtl-tool-install.log 2>&1
          fi
          # Do not hide installation failure: the mandatory simulation and final gate record BLOCKED/FAIL.

      - name: Run mandatory RTL simulation and record evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/asic
          commit="$(git rev-parse HEAD)"
          simulator="iverilog"
          compile_rc=127
          simulation_rc=127
          status="BLOCKED"
          {
            echo "RTL simulation evidence"
            echo "commit=$commit"
            echo "simulator=$simulator"
          } > artifacts/asic/rtl-simulation.log

          if ! command -v iverilog >/dev/null 2>&1 || ! command -v vvp >/dev/null 2>&1; then
            echo "RTL_SIMULATION_BLOCKED: iverilog/vvp unavailable" | tee -a artifacts/asic/rtl-simulation.log
          else
            iverilog -g2012 -Wall -s brain_asic_core_tb \
              -o artifacts/asic/brain_asic_core_tb.vvp \
              brain_v12/asic/rtl/brain_asic_core.sv \
              brain_v12/asic/rtl/brain_asic_core_tb.sv \
              > artifacts/asic/rtl-compile.log 2>&1
            compile_rc=$?
            cat artifacts/asic/rtl-compile.log >> artifacts/asic/rtl-simulation.log
            if [ "$compile_rc" -eq 0 ]; then
              vvp artifacts/asic/brain_asic_core_tb.vvp 2>&1 | tee -a artifacts/asic/rtl-simulation.log
              simulation_rc=${PIPESTATUS[0]}
              if [ "$simulation_rc" -eq 0 ] && grep -q "ASIC_RTL_TB_PASS" artifacts/asic/rtl-simulation.log; then
                status="PASS"
              else
                status="FAIL"
              fi
            else
              simulation_rc=125
              echo "RTL_COMPILE_FAILED" | tee -a artifacts/asic/rtl-simulation.log
              status="FAIL"
            fi
          fi

          printf 'commit=%s\nsimulator=%s\ncompile_exit_code=%s\nsimulation_exit_code=%s\nstatus=%s\n' \
            "$commit" "$simulator" "$compile_rc" "$simulation_rc" "$status" \
            > artifacts/asic/rtl-evidence.env
          python - <<'PY'
          import json, os
          fields = {}
          with open("artifacts/asic/rtl-evidence.env", encoding="utf-8") as f:
              for line in f:
                  key, value = line.rstrip("\n").split("=", 1)
                  fields[key] = value
          fields["evidence_schema"] = 1
          fields["testbench"] = "brain_v12/asic/rtl/brain_asic_core_tb.sv"
          fields["design"] = "brain_v12/asic/rtl/brain_asic_core.sv"
          with open("artifacts/asic/rtl-evidence.json", "w", encoding="utf-8") as f:
              json.dump(fields, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          test "$status" = "PASS"

      - name: Synthesize RTL with Yosys and save structural evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asic
          yosys -p 'read_verilog -sv brain_v12/asic/rtl/brain_asic_core.sv; hierarchy -top brain_asic_core; proc; opt; check; stat; write_json artifacts/asic/brain_asic_core_synth.json' \
            2>&1 | tee artifacts/asic/yosys-synthesis.log
          grep -Eq 'Found and reported 0 problems|Number of problems: 0' artifacts/asic/yosys-synthesis.log
          test -s artifacts/asic/brain_asic_core_synth.json
          echo "ASIC_YOSYS_SYNTHESIS_PASS"

      - name: Run ASIC simulator regression tests
        if: success()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q \
            brain_v12/tests/test_asic_hardware_simulator.py \
            brain_v12/tests/test_asic_resource_adapter.py \
            brain_v12/tests/test_asic_prototype_toolchain.py \
            | tee artifacts/asic/software-simulator-tests.log

      - name: Run focused tests
        if: success()
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            brain_v12.tests.test_portable_resource_orchestrator \
            brain_v12.tests.test_executor_contract \
            brain_v12.tests.test_run_evidence_store \
            brain_v12.tests.test_android_executor_adapter \
            brain_v12.tests.test_device_bridge_android_capacity -v \
            2>&1 | tee artifacts/asic/focused-tests.log

      - name: Upload RTL simulation evidence
        id: upload-rtl-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-simulation-evidence-${{ github.sha }}
          path: artifacts/asic/
          if-no-files-found: error
          retention-days: 90

      - name: Final ASIC acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.upload-rtl-evidence.outcome }}" = "success"
          test -s artifacts/asic/rtl-simulation.log
          test -s artifacts/asic/rtl-evidence.json
          test -s artifacts/asic/rtl-evidence.env
          grep -q '"status": "PASS"' artifacts/asic/rtl-evidence.json
          grep -q 'ASIC_RTL_TB_PASS' artifacts/asic/rtl-simulation.log
          test "$(grep '^commit=' artifacts/asic/rtl-evidence.env | cut -d= -f2)" = "$(git rev-parse HEAD)"
          # The acceptance marker must cover tool installation, synthesis, and every regression suite.
          grep -qx 'apt_update_exit_code=0' artifacts/asic/tool-install-status.txt
          grep -qx 'apt_install_exit_code=0' artifacts/asic/tool-install-status.txt
          test -s artifacts/asic/yosys-synthesis.log
          grep -Eq 'Found and reported 0 problems|Number of problems: 0' artifacts/asic/yosys-synthesis.log
          test -s artifacts/asic/brain_asic_core_synth.json
          test -s artifacts/asic/mining-economics-tests.log
          grep -qx 'OK' artifacts/asic/mining-economics-tests.log
          test -s artifacts/asic/software-simulator-tests.log
          grep -Eq '[0-9]+ passed' artifacts/asic/software-simulator-tests.log
          test -s artifacts/asic/focused-tests.log
          grep -qx 'OK' artifacts/asic/focused-tests.log
          echo "ASIC_ACCEPTANCE_GATE_PASS"
