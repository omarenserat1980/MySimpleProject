name: Executor Token Secret Audit Tool Validation
on:
  pull_request:
    paths:
      - 'tools/describe_executor_token_secret.sh'
      - 'tests/test_describe_executor_token_secret.sh'
      - '.github/workflows/describe-executor-token-secret-validation.yml'
  push:
    branches:
      - main
      - tool/describe-executor-token-secret
    paths:
      - 'tools/describe_executor_token_secret.sh'
      - 'tests/test_describe_executor_token_secret.sh'
      - '.github/workflows/describe-executor-token-secret-validation.yml'
permissions:
  contents: read
jobs:
  validate-audit-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax and safe audit behavior
        run: bash tests/test_describe_executor_token_secret.sh
