name: Brain Opportunity Ranking Smoke

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/**"
      - ".github/workflows/brain-opportunity-ranking-smoke.yml"
  workflow_dispatch:
concurrency:
  group: brain-brain-opportunity-ranking-smoke-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ranking and deduplication
        run: |
          set -euo pipefail
          python -m py_compile brain_v12/business/*.py
          python - <<'PY'
          from brain_v12.business.opportunity_report import build_report

          items=[
            {"customer_hint":"Team A","problem":"manual workflow automation","source":"public","evidence_url":"https://example.test/a","location":"global","offer_matches":["OFFER-AUTOMATION-001"]},
            {"customer_hint":"Team A","problem":"manual workflow automation","source":"public","evidence_url":"https://example.test/a","location":"global","offer_matches":["OFFER-AUTOMATION-001"]},
            {"customer_hint":"Unknown","problem":"","source":"weak"},
          ]
          report=build_report(items)
          assert report["total_input"]==3
          assert report["unique_opportunities"]==2
          assert report["ready_for_review"][0]["evidence_score"]>=60
          print("BRAIN_OPPORTUNITY_RANKING=PASS")
          print(report)
          PY
