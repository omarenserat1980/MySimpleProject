name: BRAIN Health Contract
on:
  push:
    branches: [main]
    paths:
      - "cloud/customer_feedback.py"
      - "cloud/test_customer_feedback.py"
      - "cloud/test_api_server.py"
      - "cloud/api_server.py"
      - "brain_v12/brain/task_engine.py"
      - "brain_v12/brain/diagnostic_evidence.py"
      - "brain_v12/brain/task_engine_test.py"
      - ".github/workflows/brain-health-contract.yml"
      - "BRAIN_HEALTH_AUDIT.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r cloud/requirements.txt
      - name: Compile
        run: python -m compileall -q cloud brain_v12/brain
      - name: Feedback contract
        run: python -m pytest -q cloud/test_customer_feedback.py cloud/test_api_server.py
      - name: TaskEngine evidence contract
        run: python -m pytest -q brain_v12/brain/task_engine_test.py
      - name: Release Gate contract
        run: python -m pytest -q cloud/test_release_gate_contract.py
      - name: Brain health contract manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          payload = {
              "contract": "brain-health",
              "checks": [
                  "customer_feedback",
                  "customer_api",
                  "feedback_task_bridge",
                  "task_engine_evidence",
                  "release_gate_contract",
              ],
          }
          out = Path(".brain_state/health_contract")
          out.mkdir(parents=True, exist_ok=True)
          (out / "manifest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Upload health contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-health-contract-evidence
          path: .brain_state/health_contract/manifest.json
      - name: Feedback task bridge contract
        run: python -m pytest -q cloud/test_customer_feedback.py -k bridge
      - name: API import and route uniqueness contract
        run: |
          python - <<'PY'
          from collections import Counter
          from cloud.api_server import app
          keys=[(getattr(r,'methods',None) and tuple(sorted(r.methods)) or (), r.path) for r in app.routes if r.path]
          duplicates=[k for k,c in Counter(keys).items() if c>1]
          assert not duplicates, f"duplicate API method/routes: {duplicates}"
          paths=[r.path for r in app.routes if r.path]
          assert "/v1/feedback" in paths
          assert "/v1/feedback/{feedback_id}" in paths
          assert "/v1/feedback/{feedback_id}/transition" in paths
          print("API routes verified")
          PY

# Contract trigger: ensure health verification follows API validation fixes.
