name: BRAIN Windows Cloud Provision

on:
  workflow_dispatch:
    inputs:
      bootstrap_state:
        description: "Authorize creation of Azure Storage resources for Terraform state; may incur charges"
        required: true
        type: boolean
        default: false
      approve_apply:
        description: "Explicitly authorize creation or modification of the Windows VM; may incur Azure charges"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: brain-windows-cloud-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: [self-hosted, brain-internal]
    timeout-minutes: 90
    environment: brain-windows-production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      BRAIN_WINDOWS_CLOUD_ALLOW_APPLY: "true"
      BRAIN_WINDOWS_CLOUD_PLAN_APPROVED: ${{ inputs.approve_apply == true }}
      ARM_USE_CLI: "true"
      TF_VAR_allowed_source_ip: "212.34.20.123/32"
      TF_VAR_resource_group_location: "westeurope"
      TF_VAR_vm_name: "brain-windows-2025"
      TF_VAR_resource_group_name: "brain-windows-rg"
      TF_VAR_vm_size: "Standard_B1s"
    defaults:
      run:
        working-directory: brain_v12/cloud/windows_terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            brain_v12/cloud/windows_terraform
            scripts/windows-cloud
          sparse-checkout-cone-mode: false

      - name: Verify Azure CLI session
        shell: cmd
        run: |
          az account show --query "{user:user.name,subscription:id,tenant:tenantId}" -o json

      - name: Terraform version
        shell: cmd
        run: terraform version

      - name: Require explicit state-backend authorization
        if: ${{ inputs.bootstrap_state != true }}
        shell: powershell
        run: |
          Write-Error "Blocked safely: Terraform Azure state backend is not configured. Re-run manually with bootstrap_state=true only after reviewing Azure storage costs and account/region."
          exit 1

      - name: Bootstrap approved Terraform state backend
        if: ${{ inputs.bootstrap_state == true }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts/windows-cloud/bootstrap-state.ps1"
          $state = & $scriptPath -Location "northeurope" -ResourceGroup "brain-tfstate-rg" | ConvertFrom-Json
          if (-not $state.storage_account -or -not $state.container -or -not $state.state_resource_group) { throw "State bootstrap did not return complete backend metadata." }
          "TF_STATE_RESOURCE_GROUP=$($state.state_resource_group)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TF_STATE_STORAGE_ACCOUNT=$($state.storage_account)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TF_STATE_CONTAINER=$($state.container)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TF_STATE_KEY=$($state.state_key)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Terraform init
        if: ${{ inputs.bootstrap_state == true }}
        shell: powershell
        run: |
          terraform init -upgrade -input=false \\
            -backend-config="resource_group_name=$env:TF_STATE_RESOURCE_GROUP" \\
            -backend-config="storage_account_name=$env:TF_STATE_STORAGE_ACCOUNT" \\
            -backend-config="container_name=$env:TF_STATE_CONTAINER" \\
            -backend-config="key=$env:TF_STATE_KEY" \\
            -backend-config="use_azuread_auth=true" \\
            -backend-config="use_cli=true"

      - name: Terraform fmt check
        shell: cmd
        run: terraform fmt -check -recursive

      - name: Terraform validate
        shell: cmd
        run: terraform validate

      - name: Terraform plan (safe preflight)
        shell: cmd
        run: terraform plan -input=false -out=brain.tfplan

      - name: Terraform apply (explicit approval only)
        if: ${{ inputs.approve_apply == true }}
        shell: cmd
        run: terraform apply -input=false brain.tfplan

      - name: Export infrastructure proof
        if: ${{ inputs.approve_apply == true }}
        shell: cmd
        run: terraform output -json > brain-terraform-outputs.json
