name: BRAIN Windows Cloud Provision

on:
  workflow_dispatch:
    inputs:
      approve_apply:
        description: "Explicitly authorize Terraform apply"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    if: ${{ inputs.approve_apply == true }}
    runs-on: [self-hosted, brain-internal]
    environment: brain-windows-production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      BRAIN_WINDOWS_CLOUD_ALLOW_APPLY: "true"
      BRAIN_WINDOWS_CLOUD_PLAN_APPROVED: "true"
      ARM_USE_CLI: "true"
      TF_VAR_allowed_source_ip: "212.34.20.123/32"
      TF_VAR_resource_group_location: "westeurope"
      TF_VAR_vm_name: "brain-windows-2025"
      TF_VAR_resource_group_name: "brain-windows-rg"
      TF_VAR_vm_size: "Standard_D4s_v5"
    defaults:
      run:
        working-directory: brain_v12/cloud/windows_terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=brain.tfplan

      - name: Terraform apply
        run: terraform apply -input=false brain.tfplan

      - name: Export infrastructure proof
        shell: pwsh
        run: |
          terraform output -json | Out-File -FilePath brain-terraform-outputs.json -Encoding utf8
          $d = Get-Content brain-terraform-outputs.json -Raw | ConvertFrom-Json
          $safe = @{}; $d.PSObject.Properties | Where-Object { name: BRAIN Windows Cloud Provision

