name: Brain Software-Only Node Verification

on:
  pull_request:
    paths:
      - "brain_v12/brain/family_policy_audit.py"
      - "brain_v12/brain/worker_registry.py"
      - "brain_v12/brain/workload_router.py"
      - "brain_v12/brain/workload_controller.py"
      - "brain_v12/test_workload_router.py"
      - "brain_v12/test_workload_integration.py"
      - "brain_v12/app.py"
      - "brain_v12/tools/ci_preflight.py"
      - "brain_v12/requirements.txt"
      - "brain_v12/test_worker_registry.py"
      - "brain_v12/brain/initial_software_node.py"
      - "brain_v12/brain/family_governance.py"
      - "brain_v12/brain/family_governed_tasks.py"
      - "brain_v12/brain/family_policy_audit.py"
      - "brain_v12/tests/test_family_governed_tasks.py"
      - "brain_v12/docs/FAMILY_GOVERNED_TASKS.md"
      - "brain_v12/docs/FAMILY_POLICY_AUDIT.md"
      - "brain_v12/tests/test_family_governance.py"
      - "brain_v12/docs/FAMILY_GOVERNANCE.md"
      - "brain_v12/brain/software_node_agent.py"
      - "brain_v12/tests/test_software_node_agent.py"
      - "brain_v12/docs/SOFTWARE_NODE_AGENT.md"
      - "brain_v12/brain/software_node_hardware.py"
      - "brain_v12/tests/test_initial_software_node.py"
      - "brain_v12/docs/INITIAL_SOFTWARE_NODE.md"
      - "brain_v12/docs/SOFTWARE_ONLY_NODES.md"
      - "brain_v12/cpp/**"
      - ".github/workflows/brain-software-only-nodes.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/family_policy_audit.py"
      - "brain_v12/brain/worker_registry.py"
      - "brain_v12/brain/workload_router.py"
      - "brain_v12/brain/workload_controller.py"
      - "brain_v12/test_workload_router.py"
      - "brain_v12/test_workload_integration.py"
      - "brain_v12/app.py"
      - "brain_v12/tools/ci_preflight.py"
      - "brain_v12/requirements.txt"
      - "brain_v12/test_worker_registry.py"
      - "brain_v12/brain/initial_software_node.py"
      - "brain_v12/brain/family_governance.py"
      - "brain_v12/brain/family_governed_tasks.py"
      - "brain_v12/brain/family_policy_audit.py"
      - "brain_v12/tests/test_family_governed_tasks.py"
      - "brain_v12/docs/FAMILY_GOVERNED_TASKS.md"
      - "brain_v12/docs/FAMILY_POLICY_AUDIT.md"
      - "brain_v12/tests/test_family_governance.py"
      - "brain_v12/docs/FAMILY_GOVERNANCE.md"
      - "brain_v12/brain/software_node_agent.py"
      - "brain_v12/tests/test_software_node_agent.py"
      - "brain_v12/docs/SOFTWARE_NODE_AGENT.md"
      - "brain_v12/brain/software_node_hardware.py"
      - "brain_v12/tests/test_initial_software_node.py"
      - "brain_v12/docs/INITIAL_SOFTWARE_NODE.md"
      - "brain_v12/docs/SOFTWARE_ONLY_NODES.md"
      - "brain_v12/cpp/**"
      - ".github/workflows/brain-software-only-nodes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-software-only-nodes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  software-node-contract:
    name: Software node contract (hardware-independent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      BRAIN_ENABLE_DEVICE_WORKERS: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r brain_v12/requirements.txt
      - name: Compile relevant modules
        run: python -m py_compile brain_v12/brain/worker_registry.py brain_v12/brain/workload_router.py brain_v12/brain/workload_controller.py brain_v12/app.py brain_v12/tools/ci_preflight.py brain_v12/brain/initial_software_node.py brain_v12/brain/software_node_hardware.py brain_v12/brain/software_node_agent.py brain_v12/brain/family_governance.py brain_v12/brain/family_governed_tasks.py brain_v12/brain/family_policy_audit.py
      - name: Run software-only node tests
        run: python -m pytest -q brain_v12/test_worker_registry.py brain_v12/test_workload_router.py brain_v12/test_workload_integration.py brain_v12/tests/test_initial_software_node.py brain_v12/tests/test_software_node_agent.py brain_v12/tests/test_family_governance.py brain_v12/tests/test_family_governed_tasks.py
      - name: Compile and test C++ family simulator
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic brain_v12/cpp/family_simulator.cpp brain_v12/cpp/test_family_simulator.cpp -o /tmp/family-simulator-test
          /tmp/family-simulator-test
      - name: Compile and test C++ birth thread
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread brain_v12/cpp/birth_thread.cpp brain_v12/cpp/test_birth_thread.cpp -o /tmp/birth-thread-test
          /tmp/birth-thread-test
      - name: Prove Brain Core starts without hardware configuration
        run: python brain_v12/tools/ci_preflight.py
