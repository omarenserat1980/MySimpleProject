name: electronic-brain-verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "verification/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r brain_v7/requirements.txt
      - name: Run verification
        id: verify
        continue-on-error: true
        run: python ci_verifier.py
      - name: Persist verification report
        if: always()
        run: |
          git config user.name "electronic-brain-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: persist verification report"
          git push
      - name: Fail workflow when verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
