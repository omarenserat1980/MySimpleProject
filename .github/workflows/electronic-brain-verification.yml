name: electronic-brain-verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "verification/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electronic-brain-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Electronic Brain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            brain_v7/requirements.txt
            brain_v12/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brain_v7/requirements.txt
          python -m pip install -r brain_v12/requirements.txt
          python -m pip check

      - name: Run repository verification
        id: verify
        continue-on-error: true
        run: python ci_verifier.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronic-brain-verification-${{ github.run_id }}
          path: verification/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when verification failed
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::Electronic Brain verification failed. See the verification artifact for command output."
          exit 1
