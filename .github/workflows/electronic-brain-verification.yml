name: electronic-brain-verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "verification/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r brain_v7/requirements.txt
      - name: Run verification
        id: verify
        continue-on-error: true
        run: python ci_verifier.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.run_id }}
          path: verification/latest.json
          if-no-files-found: warn
      - name: Fail workflow when verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
