name: Honda CONNECT Brain

on:
  workflow_dispatch:
    inputs:
      scan_path:
        description: Folder containing the vehicle USB export
        required: false
        default: honda_connect_manager/vehicle_export
        type: string

permissions:
  contents: read

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Brain tests
        run: |
          cd honda_connect_manager
          python3 -m unittest discover -s . -p 'test_*.py' -v

      - name: Scan vehicle export if present
        env:
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          if [ -d "$SCAN_PATH" ]; then
            python3 honda_connect_manager/brain.py --scan "$SCAN_PATH" | tee brain-report.json
          else
            echo '{"status":"waiting_for_vehicle_export","scan_path":"'"$SCAN_PATH"'"}' | tee brain-report.json
          fi

      - name: Upload Brain report
        uses: actions/upload-artifact@v4
        with:
          name: honda-connect-brain-report
          path: brain-report.json
