name: Brain Virtual Server Fabric

on:
  workflow_dispatch:
  push:
    branches:
      - feat/brain-virtual-server-fabric-v1
    paths:
      - "brain_v12/virtual_hardware/server_fabric.py"
      - "brain_v12/tests/test_virtual_server_fabric.py"
      - "docs/BRAIN_VIRTUAL_SERVER_FABRIC.md"
      - ".github/workflows/brain-virtual-server-fabric.yml"
  pull_request:
    branches:
      - main
    paths:
      - "brain_v12/virtual_hardware/server_fabric.py"
      - "brain_v12/tests/test_virtual_server_fabric.py"
      - "docs/BRAIN_VIRTUAL_SERVER_FABRIC.md"
      - ".github/workflows/brain-virtual-server-fabric.yml"

permissions:
  contents: read

jobs:
  virtual-server-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile server fabric
        run: python -m py_compile brain_v12/virtual_hardware/server_fabric.py
      - name: Run focused server fabric tests
        run: python -m unittest brain_v12.tests.test_virtual_server_fabric -v
      - name: Verify documentation contract
        run: |
          grep -q "ADMITTED_FOR_PLANNING" docs/BRAIN_VIRTUAL_SERVER_FABRIC.md
          grep -q "PHYSICALLY_CALIBRATED" docs/BRAIN_VIRTUAL_SERVER_FABRIC.md
