name: Brain Cloud Native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mysimpleproject-brain-cloud

jobs:
  verify:
    name: Verify Brain Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            brain_v12/requirements.txt
            brain_v7/requirements.txt
            cloud/requirements.txt

      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          echo "BRAIN_FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "BRAIN_FFPROBE_BIN=$(command -v ffprobe)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brain_v12/requirements.txt
          python -m pip install -r brain_v7/requirements.txt
          python -m pip install -r cloud/requirements.txt
          python -m pip install pytest

      - name: Compile Brain
        run: python -m compileall -q brain_v12 brain_v7 cloud

      - name: Run Brain tests
        run: python -m pytest -q brain_v12/tests

      - name: Validate cloud runtime
        run: |
          python -m py_compile cloud/brain_cloud.py cloud/api_server.py cloud/runtime_orchestrator.py cloud/youtube_executor.py
          python -m pytest -q cloud/test_runtime_orchestrator.py

  image:
    name: Build and publish Brain Cloud image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish image metadata
        run: |
          echo "Brain Cloud image: ${IMAGE_NAME}:${GITHUB_SHA}"
          echo "Brain Cloud latest: ${IMAGE_NAME}:latest"

  runtime-contract:
    name: Validate runtime contract
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cloud startup contract
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/Dockerfile
          test -f cloud/brain-cloud-start.sh
          test -f cloud/brain_cloud.py
          test -f cloud/api_server.py
          grep -q 'uvicorn cloud.api_server:app' cloud/Dockerfile
          grep -q 'python cloud/brain_cloud.py' cloud/Dockerfile
          grep -q 'uvicorn brain_v12.app:app' cloud/brain-cloud-start.sh
          echo "Brain Cloud runtime contract: OK"
