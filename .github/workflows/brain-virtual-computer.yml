name: Brain Virtual Computer

on:
  workflow_dispatch:
  push:
    paths:
      - "brain_v12/virtual_hardware/**"
      - "brain_v12/blade_server.py"
      - "brain_v12/brain/virtual_datacenter.py"
      - "brain_v12/test_blade_server.py"
      - "brain_v12/test_windows_server_vm.py"
      - "brain_v12/WINDOWS_SERVER_2025_ARCHITECTURE.md"
      - "brain_v12/WINDOWS_SERVER_2025_RUNBOOK.md"
      - "brain_v12/virtual_hardware/windows_server_backend.py"
      - "brain_v12/test_windows_server_backend.py"
      - "brain_v12/brain/resource_manager.py"
      - "brain_v12/brain/virtual_task_queue.py"
      - "brain_v12/brain/durable_task_store.py"
      - "brain_v12/brain/capability_registry.py"
      - "brain_v12/brain/executor_adapter.py"
      - "brain_v12/brain/failure_policy.py"
      - "brain_v12/brain/evidence_store.py"
      - "brain_v12/brain/verification_engine.py"
      - "brain_v12/test_durable_task_recovery.py"
      - "brain_v12/test_evidence_verification.py"
      - "brain_v12/test_resource_manager.py"
      - "brain_v12/app.py"
      - "brain_v12/test_supervisor_executor.py"
      - "brain_v12/brain/supervisor_executor.py"
      - "brain_v12/test_brain_execution_layers.py"
      - "brain_v12/brain/failure_policy.py"
      - "brain_v12/brain/executor_adapter.py"
      - "brain_v12/brain/capability_registry.py"
      - "brain_v12/test_durable_task_store.py"
      - "brain_v12/brain/durable_task_store.py"
      - "brain_v12/test_virtual_task_queue.py"
      - "brain_v12/brain/virtual_task_queue.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile virtual hardware
        run: |
          python -m py_compile brain_v12/virtual_hardware/*.py brain_v12/blade_server.py brain_v12/brain/virtual_datacenter.py
      - name: Run Blade Server evidence tests
        run: |
          python -m unittest brain_v12.test_blade_server brain_v12.test_virtual_system brain_v12.test_windows_server_vm brain_v12.test_windows_server_backend brain_v12.test_windows_completion_gate brain_v12.test_resource_manager brain_v12.test_virtual_task_queue brain_v12.test_durable_task_store brain_v12.test_durable_task_recovery brain_v12.test_evidence_verification brain_v12.test_brain_execution_layers brain_v12.test_supervisor_executor -v
      - name: Verify evidence contract
        run: |
          test -f brain_v12/VIRTUAL_COMPUTER_ARCHITECTURE.md
          test -f brain_v12/WINDOWS_SERVER_2025_ARCHITECTURE.md
          test -f brain_v12/WINDOWS_SERVER_2025_RUNBOOK.md
          python -m py_compile brain_v12/virtual_hardware/windows_server_backend.py brain_v12/brain/windows_completion_gate.py brain_v12/brain/resource_manager.py brain_v12/brain/durable_task_store.py brain_v12/brain/virtual_task_queue.py brain_v12/brain/evidence_store.py brain_v12/brain/verification_engine.py
          grep -q "X86_64CPU" brain_v12/WINDOWS_SERVER_2025_ARCHITECTURE.md
          grep -q "WINDOWS_BOOT_VERIFIED" brain_v12/WINDOWS_SERVER_2025_ARCHITECTURE.md
          grep -q "VirtualCPU" brain_v12/VIRTUAL_COMPUTER_ARCHITECTURE.md
          grep -q "BladeScheduler" brain_v12/VIRTUAL_COMPUTER_ARCHITECTURE.md
          python -m py_compile brain_v12/virtual_hardware/firmware.py brain_v12/virtual_hardware/kernel.py brain_v12/virtual_hardware/network.py
          echo "BRAIN_VIRTUAL_COMPUTER_CONTRACT=VERIFIED"
