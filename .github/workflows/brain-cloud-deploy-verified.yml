name: Brain Cloud Deploy Verified

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Brain Cloud Native"]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: brain-cloud-production-deploy-verified
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Brain Cloud after verified native build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          SSH_KEY: ${{ secrets.BRAIN_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ] || { echo "::error::Brain Cloud SSH deployment secrets are incomplete"; exit 1; }
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BRAIN_CLOUD_SSH_KEY }}
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/brain_cloud_key
          chmod 600 ~/.ssh/brain_cloud_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" true
      - name: Upload and deploy
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/brain_cloud_key cloud/docker-compose.production.yml "$SSH_USER@$SSH_HOST:~/brain-cloud-compose.yml"
          ssh -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" 'mkdir -p ~/brain-cloud'
          ssh -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "mv ~/brain-cloud-compose.yml ~/brain-cloud/docker-compose.yml && cd ~/brain-cloud && export BRAIN_IMAGE_TAG='$DEPLOY_SHA' && docker compose config -q && docker compose pull && docker compose up -d"
      - name: Verify production
        env:
          SSH_HOST: ${{ secrets.BRAIN_CLOUD_SSH_HOST }}
          SSH_USER: ${{ secrets.BRAIN_CLOUD_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/brain_cloud_key "$SSH_USER@$SSH_HOST" "cd ~/brain-cloud && export BRAIN_IMAGE_TAG='$DEPLOY_SHA' && docker compose ps && test \"\$(docker compose ps --status running --services | grep -c '^brain-cloud$')\" -eq 1 && docker compose exec -T brain-cloud python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10).read()\" && docker compose exec -T brain-cloud python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=10).read()\""
          echo "Verified Brain Cloud deployment for $DEPLOY_SHA"
