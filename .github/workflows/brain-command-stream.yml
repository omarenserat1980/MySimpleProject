name: Brain Command Stream

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud/brain_command_protocol.py"
      - "cloud/brain_command_stream.py"
      - "cloud/test_brain_command_protocol.py"
      - "cloud/test_brain_command_stream.py"

permissions:
  contents: read

jobs:
  command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate command protocol
        run: python -m unittest cloud.test_brain_command_protocol cloud.test_brain_command_stream -v
      - name: Brain issues next command
        run: python -m cloud.brain_command_stream | tee brain-command.json
      - name: Publish Brain command
        uses: actions/upload-artifact@v6
        with:
          name: brain-command-stream
          path: brain-command.json
