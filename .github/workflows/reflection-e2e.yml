name: Brain Reflection E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reflection-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Brain test runtime
        run: |
          python3 -m pip install --disable-pip-version-check -q httpx
      - name: Run reflection E2E
        run: |
          python3 -m brain_v12.self_healing.reflection_e2e_test
      - name: Run self-test
        run: |
          python3 -m brain_v12.self_healing.self_test
