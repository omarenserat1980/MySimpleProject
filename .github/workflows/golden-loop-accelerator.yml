name: Golden Loop Accelerator
on:
  pull_request:
    paths:
      - "brain_v12/tools/golden_loop_accelerator.py"
      - "brain_v12/tests/test_golden_loop_accelerator.py"
      - ".github/workflows/golden-loop-accelerator.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/tools/golden_loop_accelerator.py"
      - "brain_v12/tests/test_golden_loop_accelerator.py"
      - ".github/workflows/golden-loop-accelerator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused tests
        run: python -m unittest brain_v12.tests.test_golden_loop_accelerator -v
      - name: Prove missing evidence fails closed
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          set +e
          python -m brain_v12.tools.golden_loop_accelerator --root "$tmp" > "$tmp/report.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"status": "GOLDEN_LOOP_BLOCKED"' "$tmp/report.json"
