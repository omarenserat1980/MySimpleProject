name: Brain AI Tool Calling

on:
  push:
    branches: [brain-ai-tool-calling]
    paths:
      - "brain_v12/brain/brain_ai.py"
      - "brain_v12/brain/tool_protocol.py"
      - "brain_v12/tests/test_brain_ai.py"
      - "brain_v12/tests/test_tool_protocol.py"
      - "brain_v12/brain/brain_ai_api.py"
  pull_request:
    paths:
      - "brain_v12/brain/brain_ai.py"
      - "brain_v12/brain/tool_protocol.py"
      - "brain_v12/tests/test_brain_ai.py"
      - "brain_v12/tests/test_tool_protocol.py"
      - "brain_v12/brain/brain_ai_api.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tool protocol and Brain AI tests
        run: |
          python -m unittest discover -s brain_v12/tests -p 'test_tool_protocol.py' -v
          python -m unittest discover -s brain_v12/tests -p 'test_brain_ai.py' -v
