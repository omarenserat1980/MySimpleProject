name: Brain Three Films Factory
on:
  push:
    branches: [main]
    paths:
      - "brain_v12/media/three_film_factory.py"
      - "docs/films/**"
      - ".github/workflows/brain-three-films-factory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install renderer dependency
        run: python -m pip install pillow
      - name: Build three original masters
        run: |
          set -euo pipefail
          python brain_v12/media/three_film_factory.py room-13 --out /tmp/films
          python brain_v12/media/three_film_factory.py last-signal --out /tmp/films
          python brain_v12/media/three_film_factory.py zero-line --out /tmp/films
      - name: Technical QC
        run: |
          set -euo pipefail
          for f in /tmp/films/*/master.mp4; do
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json "$f" > "$f.ffprobe.json"
            test -s "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: brain-three-film-masters
          path: /tmp/films/*/master.mp4
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: brain-three-film-qc
          path: /tmp/films/*/master.mp4.ffprobe.json
          retention-days: 7
