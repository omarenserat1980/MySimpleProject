name: Brain Fabric Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required media test dependency
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg already available: $(command -v ffmpeg)"
          else
            echo "FFmpeg missing; use cached package metadata first."
            if ! apt-cache show ffmpeg >/dev/null 2>&1; then
              sudo timeout --signal=TERM --kill-after=10s 45s                 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
            fi
            sudo timeout --signal=TERM --kill-after=10s 45s               apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=10 ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -n 2
      - name: Install cloud test dependencies
        run: python -m pip install -r cloud/requirements.txt
      - name: Run Brain Fabric tests
        run: >-
          python -m pytest -q
          brain_v12/tests/test_secret_broker.py
          cloud/test_brain_fabric.py
          cloud/test_brain_node_security.py
          cloud/test_brain_fabric_integration.py
          cloud/test_brain_fabric_api.py
          cloud/test_brain_job_executor.py
