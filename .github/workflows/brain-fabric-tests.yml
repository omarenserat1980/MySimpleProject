name: Brain Fabric Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud test dependencies
        run: python -m pip install -r cloud/requirements.txt
      - name: Run Brain Fabric tests
        run: >-
          python -m pytest -q
          brain_v12/tests/test_secret_broker.py
          cloud/test_brain_fabric.py
          cloud/test_brain_node_security.py
          cloud/test_brain_fabric_integration.py
          cloud/test_brain_fabric_api.py\n          brain_v12/integration/test_cross_domain_contract.py\n          brain_v12/integration/test_mission_router.py\n          brain_v12/integration/test_mission_control.py\n          brain_v12/integration/test_api.py\n          brain_v12/integration/test_decision_evidence.py
