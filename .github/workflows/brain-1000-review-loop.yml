name: Brain Continuous Evolution Review

on:
  workflow_dispatch:
    inputs:
      loops:
        description: "Review loops per hosted run (1-100000000; hosted runtime remains time-bounded)"
        required: false
        default: "1000"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: brain-continuous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Install Brain Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Review and self-heal
        env:
          BRAIN_REVIEW_LOOPS: ${{ github.event.inputs.loops || '1000' }}
          BRAIN_REVIEW_TIMEOUT: "60"
          BRAIN_CODE_GENERATOR_COMMAND: ${{ vars.BRAIN_CODE_GENERATOR_COMMAND }}
          BRAIN_PROACTIVE_EVOLUTION: "0"
          BRAIN_REVIEW_PYTEST: "1"
          BRAIN_GATE_PYTEST: "1"
        run: |
          set -o pipefail
          python brain_v12/self_healing/verification_gate.py
          python brain_v12/self_healing/review_loop.py --loops "$BRAIN_REVIEW_LOOPS"

      - name: Save evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-continuous-evolution-evidence
          path: .brain/state/
          if-no-files-found: ignore
