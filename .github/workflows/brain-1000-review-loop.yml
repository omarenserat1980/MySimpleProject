name: Brain Continuous Evolution Review

on:
  push:
    paths:
      - ".github/workflows/brain-1000-review-loop.yml"
      - "brain_v12/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      loops:
        description: "Bounded review loops for this hosted run (1-10)"
        required: false
        default: "1"
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: read

# Isolate runs by ref and never cancel an active verification/evolution cycle.
# A newer run on this ref may wait as pending; evidence-producing gates are not interrupted.
concurrency:
  group: brain-continuous-evolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      # Record run identity before dependency installation, so cancellation during
      # setup can still leave minimal evidence without secrets.
      - name: Initialize evolution run evidence
        env:
          BRAIN_RUN_ID: ${{ github.run_id }}
          BRAIN_RUN_ATTEMPT: ${{ github.run_attempt }}
          BRAIN_COMMIT_SHA: ${{ github.sha }}
          BRAIN_REF: ${{ github.ref }}
          BRAIN_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p .brain/state
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "schema_version": 1,
              "run_id": os.environ["BRAIN_RUN_ID"],
              "run_attempt": os.environ["BRAIN_RUN_ATTEMPT"],
              "commit_sha": os.environ["BRAIN_COMMIT_SHA"],
              "ref": os.environ["BRAIN_REF"],
              "event_name": os.environ["BRAIN_EVENT_NAME"],
              "state": "STARTED",
              "verification_gate": "NOT_RUN",
              "review_and_self_heal": "NOT_RUN",
              "note": "Run context only; step outcomes and independent verification are required to claim success."
          }
          Path(".brain/state/evolution-run-context.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Brain Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Independent verification gate
        id: verification_gate
        env:
          BRAIN_GATE_PYTEST: "1"
          BRAIN_GATE_TIMEOUT: "120"
        run: |
          set -o pipefail
          python -m brain_v12.self_healing.verification_gate

      - name: Review and self-heal
        id: review_self_heal
        env:
          BRAIN_REVIEW_LOOPS: ${{ github.event.inputs.loops || '1' }}
          BRAIN_REVIEW_TIMEOUT: "60"
          BRAIN_CODE_GENERATOR_COMMAND: ${{ vars.BRAIN_CODE_GENERATOR_COMMAND }}
          BRAIN_PROACTIVE_EVOLUTION: "0"
          BRAIN_REVIEW_PYTEST: "1"
          BRAIN_GATE_PYTEST: "1"
          BRAIN_STOP_ON_UNRECOVERED_FAILURE: "1"
        run: |
          set -o pipefail
          python -m brain_v12.self_healing.review_loop --loops "$BRAIN_REVIEW_LOOPS" --timeout "$BRAIN_REVIEW_TIMEOUT"

      # Finalize run context from actual gate outcomes and machine-readable reports.
      # If this step never runs (for example, hard cancellation), STARTED remains honest.
      - name: Finalize evolution run evidence
        if: always()
        env:
          BRAIN_VERIFICATION_OUTCOME: ${{ steps.verification_gate.outcome }}
          BRAIN_REVIEW_OUTCOME: ${{ steps.review_self_heal.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          state_dir = Path(".brain/state")
          context_path = state_dir / "evolution-run-context.json"
          state_dir.mkdir(parents=True, exist_ok=True)
          context = json.loads(context_path.read_text(encoding="utf-8")) if context_path.exists() else {
              "schema_version": 1,
              "note": "Context reconstructed during finalization; missing startup context."
          }

          def report_status(filename, key="status"):
              path = state_dir / filename
              if not path.exists():
                  return "NOT_AVAILABLE"
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return str(value.get(key, "NOT_AVAILABLE"))
              except (OSError, ValueError, TypeError):
                  return "INVALID_REPORT"

          verification_report = report_status("verification_gate.json")
          review_report = report_status("review_loop_report.json")
          verification_outcome = os.environ.get("BRAIN_VERIFICATION_OUTCOME", "unknown")
          review_outcome = __import__("os").environ.get("BRAIN_REVIEW_OUTCOME", "unknown")
          verified = (
              verification_outcome == "success"
              and review_outcome == "success"
              and verification_report == "VERIFIED"
              and review_report == "VERIFIED_COMPLETED"
          )
          failed = "failure" in (verification_outcome, review_outcome) or "INVALID_REPORT" in (verification_report, review_report)
          context.update({
              "state": "VERIFIED_COMPLETED" if verified else ("FAILED" if failed else "INCOMPLETE"),
              "verification_gate": verification_report,
              "review_and_self_heal": review_report,
              "step_outcomes": {
                  "independent_verification_gate": verification_outcome,
                  "review_and_self_heal": review_outcome,
              },
              "finalized_at": datetime.now(timezone.utc).isoformat(),
              "note": "Final state reflects step outcomes and machine-readable reports; STARTED alone is never success."
          })
          context_path.write_text(json.dumps(context, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"state": context["state"], "verification_gate": verification_report, "review_and_self_heal": review_report}, sort_keys=True))
          PY

      - name: Save evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-continuous-evolution-evidence
          path: .brain/state/
          if-no-files-found: ignore
          include-hidden-files: true
