name: Brain Continuous Evolution Review

on:
  push:
    paths:
      - ".github/workflows/brain-1000-review-loop.yml"
      - "brain_v12/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      loops:
        description: "Bounded review loops for this hosted run (1-10)"
        required: false
        default: "1"
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: read

concurrency:
  group: brain-continuous-evolution
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Install system media dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg/ffprobe already available; skipping apt install"
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            timeout 300s sudo -n apt-get update -o DPkg::Lock::Timeout=60
            timeout 300s sudo -n apt-get install -y --no-install-recommends ffmpeg
            command -v ffmpeg
            command -v ffprobe
          fi

      - name: Install Brain Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Independent verification gate
        env:
          BRAIN_GATE_PYTEST: "1"
          BRAIN_GATE_TIMEOUT: "120"
        run: |
          set -o pipefail
          python -m brain_v12.self_healing.verification_gate

      - name: Review and self-heal
        env:
          BRAIN_REVIEW_LOOPS: ${{ github.event.inputs.loops || '1' }}
          BRAIN_REVIEW_TIMEOUT: "60"
          BRAIN_CODE_GENERATOR_COMMAND: ${{ vars.BRAIN_CODE_GENERATOR_COMMAND }}
          BRAIN_PROACTIVE_EVOLUTION: "0"
          BRAIN_REVIEW_PYTEST: "1"
          BRAIN_GATE_PYTEST: "1"
          BRAIN_STOP_ON_UNRECOVERED_FAILURE: "1"
        run: |
          set -o pipefail
          python -m brain_v12.self_healing.review_loop --loops "$BRAIN_REVIEW_LOOPS" --timeout "$BRAIN_REVIEW_TIMEOUT"

      - name: Save evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-continuous-evolution-evidence
          path: .brain/state/
          if-no-files-found: ignore
