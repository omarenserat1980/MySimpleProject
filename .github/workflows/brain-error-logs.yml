name: Brain Error Log Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/error_logs.py"
      - "brain_v12/tests/test_error_logs.py"
      - ".github/workflows/brain-error-logs.yml"
  push:
    branches:
      - main
      - "feat/brain-error-log-traceability"
    paths:
      - "brain_v12/brain/error_logs.py"
      - "brain_v12/tests/test_error_logs.py"
      - ".github/workflows/brain-error-logs.yml"

permissions:
  contents: read

jobs:
  error-log-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run durable error-log tests
        env:
          PYTHONPATH: .
        run: python -m pytest brain_v12/tests/test_error_logs.py -q
