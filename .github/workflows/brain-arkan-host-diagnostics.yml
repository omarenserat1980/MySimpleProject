name: Brain Arkan Read-only Host Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brain-arkan-host-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: brain-arkan-host-diagnostics
  cancel-in-progress: false

jobs:
  inspect_arkan:
    name: Inspect Arkan virtualization readiness
    # Intentionally targets the known Windows Arkan runner labels, not the
    # Linux-only executor used for the authorized Windows Server boot.
    runs-on: [self-hosted, windows, x64, brain-internal, qemu, windows-real-boot]
    timeout-minutes: 10
    steps:
      - name: Read-only host inspection
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $out = Join-Path $env:GITHUB_WORKSPACE "arkan-host-diagnostics.json"
          $checks = [ordered]@{}
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = @(Get-CimInstance Win32_Processor)
          $checks.host = [ordered]@{
            computer_name = $env:COMPUTERNAME
            os_caption = $os.Caption
            os_version = $os.Version
            total_memory_gib = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
            cpu_count = $cpu.Count
            logical_processors = ($cpu | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
            virtualization_firmware_enabled = [bool]($cpu | Where-Object { $_.VirtualizationFirmwareEnabled -eq $true })
            hypervisor_present = [bool]$cs.HypervisorPresent
          }

          $vmms = Get-Service vmms -ErrorAction SilentlyContinue
          $checks.hyper_v = [ordered]@{
            feature_cmdlet_available = [bool](Get-Command Get-VM -ErrorAction SilentlyContinue)
            vmms_service = if ($vmms) { [string]$vmms.Status } else { "not-installed-or-unavailable" }
            vm_inventory = @()
          }
          if (Get-Command Get-VM -ErrorAction SilentlyContinue) {
            try {
              $checks.hyper_v.vm_inventory = @(Get-VM | Select-Object Name, State, Status, MemoryStartup, Generation)
            } catch {
              $checks.hyper_v.vm_inventory_error = $_.Exception.Message
            }
          }

          $checks.tools = [ordered]@{}
          foreach ($tool in @("qemu-system-x86_64", "qemu-img", "wsl", "git", "gh")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            $checks.tools[$tool] = if ($cmd) { [string]$cmd.Source } else { $null }
          }
          foreach ($tool in @("qemu-system-x86_64", "qemu-img")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              try {
                $v = & $cmd.Source --version 2>&1 | Select-Object -First 1
                $checks.tools["${tool}_version"] = [string]$v
              } catch {
                $checks.tools["${tool}_version_error"] = $_.Exception.Message
              }
            }
          }

          $checks.wsl = [ordered]@{ available = [bool](Get-Command wsl -ErrorAction SilentlyContinue); status = $null; distributions = @() }
          if ($checks.wsl.available) {
            try { $checks.wsl.status = ((wsl --status 2>&1 | Out-String).Trim()) } catch { $checks.wsl.status = $_.Exception.Message }
            try { $checks.wsl.distributions = @(wsl --list --verbose 2>&1 | ForEach-Object { "$_" }) } catch { $checks.wsl.distributions = @($_.Exception.Message) }
          }

          $checks.disk = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID, @{Name="FreeGiB";Expression={[math]::Round($_.FreeSpace / 1GB, 2)}}, @{Name="SizeGiB";Expression={[math]::Round($_.Size / 1GB, 2)}}

          $blockers = [System.Collections.Generic.List[string]]::new()
          if (-not $checks.host.virtualization_firmware_enabled) { $blockers.Add("CPU virtualization firmware flag is not enabled or not exposed") }
          if ($checks.host.total_memory_gib -lt 6) { $blockers.Add("Host has less than 6 GiB RAM; Windows Server 2025 VM feasibility is constrained") }
          if (-not $checks.tools["qemu-system-x86_64"]) { $blockers.Add("qemu-system-x86_64 missing from PATH") }
          if (-not $checks.tools["qemu-img"]) { $blockers.Add("qemu-img missing from PATH") }
          if (-not $checks.tools["wsl"]) { $blockers.Add("WSL command missing from PATH") }
          $checks.blockers = @($blockers)
          $checks.status = if ($blockers.Count -eq 0) { "HOST_PREFLIGHT_PASS" } else { "HOST_PREFLIGHT_BLOCKED" }
          $checks.note = "Read-only diagnostics only. No VM was started, no secrets were read, and no settings were changed."
          $checks | ConvertTo-Json -Depth 8 | Set-Content -Path $out -Encoding UTF8
          $checks | ConvertTo-Json -Depth 8
          Write-Host "ARKAN_HOST_PREFLIGHT_STATUS=$($checks.status)"
          Write-Host "ARKAN_HOST_BLOCKER_COUNT=$($blockers.Count)"

      - name: Upload host diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-arkan-host-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: arkan-host-diagnostics.json
