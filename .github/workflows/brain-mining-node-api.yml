name: Brain Mining Node API

on:
  pull_request:
    paths:
      - "brain_v12/brain/mining_node_api.py"
      - "brain_v12/app.py"
      - "tests/test_brain_mining_node_api.py"
      - ".github/workflows/brain-mining-node-api.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/mining_node_api.py"
      - "brain_v12/app.py"
      - "tests/test_brain_mining_node_api.py"
      - ".github/workflows/brain-mining-node-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-mining-node-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mining-node-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run mining node contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_brain_mining_node_api.py
