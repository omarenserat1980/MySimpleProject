name: Brain Mining Node API

on:
  pull_request:
    paths:
      - "brain_v12/brain/mining_node_api.py"
      - "brain_v12/brain/brain_owned_mining_contract.py"
      - "brain_v12/brain/brain_owned_compute_runtime.py"
      - "brain_v12/brain/bitcoin_header.py"
      - "brain_v12/brain/stratum_v1_jobs.py"
      - "brain_v12/brain/stratum_candidate_pipeline.py"
      - "brain_v12/brain/stratum_v1_protocol.py"
      - "brain_v12/self_healing/completion_audit.py"
      - "brain_v12/tests/test_mining_node_api_software_only.py"
      - "brain_v12/tests/test_brain_owned_compute_runtime.py"
      - "brain_v12/tests/test_bitcoin_header.py"
      - "brain_v12/tests/test_stratum_v1_jobs.py"
      - "brain_v12/tests/test_stratum_candidate_pipeline.py"
      - "brain_v12/tests/test_stratum_v1_protocol.py"
      - "brain_v12/tests/test_completion_audit.py"
      - "brain_v12/app.py"
      - "tests/test_brain_mining_node_api.py"
      - ".github/workflows/brain-mining-node-api.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/mining_node_api.py"
      - "brain_v12/brain/brain_owned_mining_contract.py"
      - "brain_v12/brain/brain_owned_compute_runtime.py"
      - "brain_v12/brain/bitcoin_header.py"
      - "brain_v12/brain/stratum_v1_jobs.py"
      - "brain_v12/brain/stratum_candidate_pipeline.py"
      - "brain_v12/brain/stratum_v1_protocol.py"
      - "brain_v12/self_healing/completion_audit.py"
      - "brain_v12/tests/test_mining_node_api_software_only.py"
      - "brain_v12/tests/test_brain_owned_compute_runtime.py"
      - "brain_v12/tests/test_bitcoin_header.py"
      - "brain_v12/tests/test_stratum_v1_jobs.py"
      - "brain_v12/tests/test_stratum_candidate_pipeline.py"
      - "brain_v12/tests/test_stratum_v1_protocol.py"
      - "brain_v12/tests/test_completion_audit.py"
      - "brain_v12/app.py"
      - "tests/test_brain_mining_node_api.py"
      - ".github/workflows/brain-mining-node-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-mining-node-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mining-node-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi
      - name: Run mining node contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_brain_mining_node_api.py brain_v12/tests/test_mining_node_api_software_only.py
      - name: Validate fail-closed Stratum V1 response correlation
        run: python -m pytest -q brain_v12/tests/test_stratum_v1_protocol.py
      - name: Validate offline Stratum-to-header candidate pipeline
        run: python -m pytest -q brain_v12/tests/test_stratum_candidate_pipeline.py
      - name: Validate offline Stratum V1 job and share lifecycle primitives
        run: python -m pytest -q brain_v12/tests/test_stratum_v1_jobs.py
      - name: Validate bounded SHA256d proof-of-work primitive and Bitcoin header vectors
        run: python -m pytest -q brain_v12/tests/test_brain_owned_compute_runtime.py brain_v12/tests/test_bitcoin_header.py
      - name: Validate completion-audit fail-closed status recognition
        run: python -m pytest -q brain_v12/tests/test_completion_audit.py
