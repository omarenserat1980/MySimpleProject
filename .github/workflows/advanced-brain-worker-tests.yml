name: Advanced Brain Worker Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/advanced_worker.py"
      - "brain_v12/tests/test_advanced_worker.py"
      - "brain_v12/brain/suggestion_worker_policy.py"
      - "brain_v12/tests/test_suggestion_worker_policy.py"
      - "brain_v12/app.py"
      - "docs/ADVANCED_BRAIN_WORKER.md"
      - ".github/workflows/advanced-brain-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/advanced_worker.py"
      - "brain_v12/tests/test_advanced_worker.py"
      - "docs/ADVANCED_BRAIN_WORKER.md"
      - ".github/workflows/advanced-brain-worker-tests.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused worker tests
        run: |
          python -m pip install pytest
          python -m pytest brain_v12/tests/test_advanced_worker.py brain_v12/tests/test_suggestion_worker_policy.py -q
