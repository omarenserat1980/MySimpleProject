name: Brain GitHub Actions Runtime Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: brain-github-actions-runtime-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Brain runtime dependencies
        run: python -m pip install -r brain_v12/requirements.txt

      - name: Test critical-warning consumer and fail-closed behavior
        run: python -m unittest brain_v12.tests.test_github_actions_runtime_audit -v

      - name: Audit all workflows and recent runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m brain_v12.tools.github_actions_runtime_audit

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-github-actions-runtime-audit
          path: .brain/state/github_actions_runtime_audit.json
          if-no-files-found: warn
          retention-days: 14
