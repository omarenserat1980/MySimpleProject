name: Brain Continuous Self-Healing

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Brain command to run"
        required: false
        default: "python -m brain_v12.self_healing.self_test"
      max_attempts:
        description: "Maximum repair/verify cycles"
        required: false
        default: "5"
      continue_cycles:
        description: "Bounded autonomous cycles requested by the Brain command"
        required: false
        default: "3"
      brain_command:
        description: "Normalized Brain command from the human command contract"
        required: false
        default: "BRAIN_CONTINUE_AUTONOMOUSLY"
      auto_confirm:
        description: "Explicit workflow acknowledgement flag; never bypasses verification"
        required: false
        default: "false"
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "brain_v12/**"
      - "brain0/**"
      - ".github/workflows/brain-continuous-self-healing.yml"

permissions:
  contents: write

concurrency:
  group: brain-self-healing
  cancel-in-progress: false

jobs:
  heal:
    runs-on: [self-hosted, linux, x64, brain-internal, qemu, windows-real-boot]
    timeout-minutes: 15
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Fail-closed Brain internal runtime preflight
        run: |
          set -euo pipefail
          python -m brain_v12.brain.internal_runner_preflight
          python - <<'PY'
          from brain_v12.brain.internal_runner_preflight import verify_and_write
          e=verify_and_write("internal-runner-preflight.json")
          assert e["verified"] is True, e
          print("BRAIN_INTERNAL_RUNNER=VERIFIED")
          PY

      - name: Prepare Brain runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q httpx fastapi python-multipart google-api-python-client google-auth-oauthlib google-auth-httplib2
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p brain_v12/bin
          ln -sf "$(command -v ffmpeg)" brain_v12/bin/ffmpeg
          ln -sf "$(command -v ffprobe)" brain_v12/bin/ffprobe
          test -x brain_v12/bin/ffmpeg
          test -x brain_v12/bin/ffprobe
          python - <<'PY'
          import fastapi, httpx
          print("BRAIN_RUNTIME_DEPS=READY")
          print("FASTAPI="+fastapi.__version__)
          print("HTTPX="+httpx.__version__)
          PY

      - name: Validate Repair Knowledge
        run: python -m unittest brain_v12.brain.test_repair_knowledge -v

      - name: Validate Minute Watchdog
        run: python -m unittest brain_v12.brain.test_brain_minute_watchdog -v

      - name: Validate Self-Healing Contracts
        run: |
          set -euo pipefail
          python -m unittest brain_v12.self_healing.test_command_contract brain_v12.self_healing.test_generator_registry brain_v12.self_healing.test_improvement_eligibility brain_v12.self_healing.test_native_patch_generator brain_v12.self_healing.test_future_evolution -v

      - name: Run Brain Supervisor + Self-Healing
        env:
          BRAIN_MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '5' }}
          BRAIN_BACKOFF_SECONDS: "2"
          BRAIN_MAX_BACKOFF_SECONDS: "20"
          BRAIN_REPAIR_COMMAND: "python -m brain_v12.self_healing.repair"
          BRAIN_CODE_GENERATOR_COMMAND: "python -m brain_v12.self_healing.native_patch_generator"
          BRAIN_GATE_PYTEST: "1"
          BRAIN_COMMAND: ${{ github.event.inputs.brain_command || 'BRAIN_CONTINUE_AUTONOMOUSLY' }}
          BRAIN_AUTO_CONFIRM: ${{ github.event.inputs.auto_confirm || 'false' }}
        run: |
          set -euo pipefail
          python -m brain_v12.self_healing.continuous_evolution             --cycles "${{ github.event.inputs.continue_cycles || '3' }}"             --loops-per-cycle 1             --timeout 120             --pause 2

      - name: Report Applied Repair Evidence
        if: always()
        run: |
          set -euo pipefail
          if test -f .brain/state/last_applied_patch.diff; then
            echo "CODE_REPAIR_PATCH_PRESENT=true"
            git diff --check
            git diff --stat
            echo "CODE_REPAIR_PATCH_LINES=$(wc -l < .brain/state/last_applied_patch.diff)"
          else
            echo "CODE_REPAIR_PATCH_PRESENT=false"
          fi

      - name: Stage 7 - Self-Healing Gate
        if: always()
        env:
          BRAIN_GATE_PYTEST: "1"
        run: |
          set -euo pipefail
          python -m brain_v12.self_healing.verification_gate
          test -f .brain/state/verification_gate.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".brain/state/verification_gate.json").read_text(encoding="utf-8"))
          assert data["status"] == "VERIFIED", data
          assert data["verified_completed_allowed"] is True, data
          assert all(g["passed"] for g in data["gates"]), data
          print("STAGE_7_SELF_HEALING_GATE=PASS")
          print("VERIFIED_COMPLETED=AUTHORIZED")
          PY

      - name: Persist Verified Repair
        if: success()
        run: |
          set -euo pipefail
          if test ! -f .brain/state/last_applied_patch.diff; then
            echo "BRAIN_VERIFIED_REPAIR_COMMIT=SKIPPED_NO_PATCH"
            exit 0
          fi
          git diff --check
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              brain_v12/*|tests/*|scripts/*) ;;
              *) echo "BRAIN_REPAIR_COMMIT_FORBIDDEN_PATH=$path"; exit 2 ;;
            esac
          done <<< "$changed"
          git config user.name "brain-autonomous-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          if git diff --cached --quiet; then
            echo "BRAIN_VERIFIED_REPAIR_COMMIT=SKIPPED_NO_GIT_DIFF"
            exit 0
          fi
          git commit -m "brain: persist verified self-healing repair"
          git push origin HEAD:main
          echo "BRAIN_VERIFIED_REPAIR_COMMIT=PUSHED"

      - name: Publish healing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-self-healing-state
          path: .brain/state/
          if-no-files-found: ignore
