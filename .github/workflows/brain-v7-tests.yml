name: electronic-brain-v7-tests

on:
  push:
    paths:
      - "brain_v7/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "brain_v7/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: brain_v7/requirements.txt
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        working-directory: brain_v7
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Brain V7 Python sources
        env:
          PYTHONPATH: ${{ github.workspace }}
        working-directory: brain_v7
        run: python -m compileall -q .
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          FFMPEG_BIN: ffmpeg
          FFPROBE_BIN: ffprobe
          FACTORY_ALLOW_LOCAL_FALLBACK: "1"
        working-directory: brain_v7
        run: python -m pytest -q
