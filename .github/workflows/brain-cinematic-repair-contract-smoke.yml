name: Brain Cinematic Repair Contract Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'brain/cinematic-master-qc-v1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: |
          python -m py_compile             brain_v12/cinematic_master_qc.py             brain_v12/cinematic_repair_loop.py             brain_v12/machine_raster_engine.py             brain_v12/machine_cinematic_factory.py
      - name: Validate repair contract compiler
        run: |
          cat > /tmp/qc.json <<'JSON'
          {
            "repair_manifest": {
              "mandatory_requirements": [
                "INCREASE_DISTINCT_SCENE_COUNT",
                "GENERATE_MATERIALLY_DIVERSE_VISUALS",
                "REBUILD_DUPLICATE_SCENES",
                "REQUIRE_CAMERA_OR_ELEMENT_MOTION"
              ]
            }
          }
          JSON
          python brain_v12/cinematic_repair_loop.py --qc /tmp/qc.json --output /tmp/contract.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/contract.json"))
          assert c["status"]=="REPAIR_REQUIRED"
          assert c["min_distinct_scenes"]==24
          assert c["visual_diversity_required"] is True
          assert c["duplicate_scene_policy"]=="reject"
          assert c["motion_required"] is True
          print("REPAIR_CONTRACT_OK")
          PY
      - name: Render two materially different machine scenes
        run: |
          python - <<'PY'
          import hashlib
          from brain_v12.machine_raster_engine import render_machine
          a={"type":"landscape","palette":"default","scene_id":"smoke:1","variant":1,"objects":["sun","stars","tree"]}
          b={"type":"landscape","palette":"default","scene_id":"smoke:2","variant":17,"objects":["sun","stars","tree"]}
          pa,_=render_machine(a); pb,_=render_machine(b)
          assert hashlib.sha256(pa).hexdigest()!=hashlib.sha256(pb).hexdigest()
          print("VISUAL_VARIATION_OK")
          PY

      - name: Execute repaired audio render
        run: |
          sudo apt-get update -y
          sudo apt-get install -y espeak-ng
          cat > /tmp/repair-contract.json <<'JSON'
          {
            "status": "REPAIR_REQUIRED",
            "reject_on_missing_evidence": true,
            "mandatory_requirements": [
              "REQUIRE_VOICE_NARRATION_ASSETS",
              "REQUIRE_MUSIC_ASSETS",
              "REQUIRE_SFX_AMBIENCE_ASSETS",
              "REQUIRE_CAMERA_OR_ELEMENT_MOTION"
            ],
            "voice_required": true,
            "music_required": true,
            "sfx_required": true,
            "motion_required": true,
            "min_video_bitrate_bps": 800000
          }
          JSON
          rm -rf /tmp/brain-smoke
          BRAIN_MACHINE_FILM_ROOT=/tmp/brain-smoke           BRAIN_FILM_PARTS=2           BRAIN_FILM_START=1           BRAIN_FILM_END=2           BRAIN_FILM_PART_SECONDS=2           BRAIN_CINEMATIC_REPAIR_CONTRACT=/tmp/repair-contract.json           python brain_v12/machine_cinematic_factory.py > /tmp/factory-output.json
          test -s /tmp/brain-smoke/parts/001/voice.wav
          test -s /tmp/brain-smoke/parts/001/music.wav
          test -s /tmp/brain-smoke/parts/001/sfx.wav
          test -s /tmp/brain-smoke/parts/001/part-001.mp4
          ffprobe -v error -select_streams a -show_entries stream=codec_type             -of csv=p=0 /tmp/brain-smoke/parts/001/part-001.mp4 | grep -qx audio
          python - <<'PY'
          import json, os
          m=json.load(open("/tmp/brain-smoke/manifest.json"))
          a=m["parts_manifest"][0]["audio_assets"]
          assert all(a[k] and os.path.getsize(a[k]) > 0 for k in ("voice","music","sfx"))
          assert m["cinematic_master_qc"]["status"] == "CINEMATIC_QC_FAILED"
          assert m["timeline_transitions"]["type"] == "xfade"
          assert m["timeline_transitions"]["count"] == 1
          req=set(m["cinematic_master_qc"]["repair_manifest"]["mandatory_requirements"])
          assert "REQUIRE_REAL_SCENE_TRANSITIONS" not in req
          assert "REQUIRE_VOICE_NARRATION_ASSETS" not in req
          assert "REQUIRE_MUSIC_ASSETS" not in req
          assert "REQUIRE_SFX_AMBIENCE_ASSETS" not in req
          print("AUDIO_ASSET_MANIFEST_OK")
          print("CINEMATIC_GATE_EXECUTED_OK")
          PY
          echo "REPAIRED_AUDIO_RENDER_OK"
