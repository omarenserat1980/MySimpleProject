name: BRAIN Cinematic Quality Gate

on:
  concurrency: brain-cinematic-quality-gate
  workflow_dispatch:
  push:
    branches:
      - 'brain/cinematic-master-qc-v1'

jobs:
  cinematic-quality-gate:
    name: CINEMATIC QUALITY GATE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate gate source
        run: |
          python -m py_compile \
            brain_v12/cinematic_quality_gate.py \
            brain_v12/cinematic_master_qc.py \
            brain_v12/cinematic_repair_loop.py \
            brain_v12/machine_raster_engine.py \
            brain_v12/machine_cinematic_factory.py

      - name: Install FFmpeg and local voice generator
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          command -v ffmpeg
          command -v espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Execute unified Cinematic Quality Gate
        run: |
          set -euxo pipefail
          python brain_v12/cinematic_quality_gate.py

      - name: Publish gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-cinematic-quality-gate-evidence
          path: /tmp/brain-cinematic-quality-gate/
          if-no-files-found: warn
