name: Brain Revenue Conversion Tests

on:
  workflow_call:
  push:
    paths:
      - "brain_v12/brain/client_revenue_guardian.py"
      - "brain_v12/brain/income_lifecycle.py"
      - "brain_v12/brain/live_opportunity_researcher.py"
      - "brain_v12/brain/payment_gateway.py"
      - "brain_v12/brain/commerce_api.py"
      - "brain_v12/brain/economic_reconciliation.py"
      - "brain_v12/tests/test_client_revenue_guardian.py"
      - "brain_v12/tests/test_income_lifecycle.py"
      - "brain_v12/tests/test_live_opportunity_researcher.py"
      - "brain_v12/tests/test_payment_gateway.py"
      - "brain_v12/tests/test_commerce_api.py"
      - "brain_v12/tests/test_economic_reconciliation.py"
      - ".github/workflows/brain-revenue-conversion-tests.yml"
      - "brain_v12/ci/dispatch_workflow.py"
      - "cloudflare/brain-api/src/index.js"
      - "cloudflare/brain-api/test/commercial_worker_static.test.js"
      - "cloudflare/brain-api/test/delivery_concurrency_sqlite_test.py"
      - "cloudflare/brain-api/migrations/*.sql"
      - "cloudflare/brain-api/wrangler.toml"
  workflow_dispatch:

concurrency:
  group: brain-revenue-conversion-tests
  cancel-in-progress: true

jobs:
  revenue-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup Node for Cloudflare Worker checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare Worker syntax and commercial gates
        working-directory: cloudflare/brain-api
        run: |
          node --check src/index.js
          node test/commercial_worker_static.test.js

      - name: Test delivery/revenue SQL gates with SQLite
        run: python cloudflare/brain-api/test/delivery_concurrency_sqlite_test.py -v

      - name: Compile revenue and payment path
        run: python -m compileall -q brain_v12/brain/client_revenue_guardian.py brain_v12/brain/income_lifecycle.py brain_v12/brain/live_opportunity_researcher.py brain_v12/brain/payment_gateway.py brain_v12/brain/commerce_api.py brain_v12/brain/economic_reconciliation.py

      - name: Payment gateway tests
        run: python -m unittest brain_v12.tests.test_payment_gateway -v

      - name: Commerce financial gate tests
        run: python -m unittest brain_v12.tests.test_commerce_api -v

      - name: Revenue lifecycle tests
        run: python -m unittest brain_v12.tests.test_income_lifecycle -v

      - name: Economic reconciliation tests
        run: python -m unittest brain_v12.tests.test_economic_reconciliation -v

      - name: Revenue guardian tests
        run: python -m unittest brain_v12.tests.test_client_revenue_guardian -v

      - name: Live opportunity tests
        run: python -m unittest brain_v12.tests.test_live_opportunity_researcher -v
