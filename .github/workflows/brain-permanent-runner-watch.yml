name: Brain Legacy Hardware Runner Retirement Watch

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: brain-legacy-runner-retirement-watch
  cancel-in-progress: true

env:
  REPO: omarenserat1980/MySimpleProject
  REQUIRED_LABELS: '["brain-internal","linux","x64","qemu","windows-real-boot","brain-cloud-executor","self-hosted"]'

jobs:
  detect:
    name: Detect Runner State (external watcher)
    runs-on: ubuntu-latest
    outputs:
      runner_online: ${{ steps.inspect.outputs.runner_online }}
      runner_id: ${{ steps.inspect.outputs.runner_id }}
      runner_name: ${{ steps.inspect.outputs.runner_name }}
      runner_busy: ${{ steps.inspect.outputs.runner_busy }}
      runner_status: ${{ steps.inspect.outputs.runner_status }}
    steps:
      - name: Inspect registration, labels and online state
        id: inspect
        env:
          # Configure BRAIN_RUNNER_WATCH_TOKEN as a repository secret with permission
          # to read self-hosted runner administration data; github.token may return 403.
          GH_TOKEN: ${{ secrets.BRAIN_RUNNER_WATCH_TOKEN || github.token }}
          WATCH_TOKEN_CONFIGURED: ${{ secrets.BRAIN_RUNNER_WATCH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BRAIN_RUNNER_WATCH_TOKEN_CONFIGURED=${WATCH_TOKEN_CONFIGURED}"
          if [[ "${WATCH_TOKEN_CONFIGURED}" != "true" ]]; then
            echo "RUNNER_WATCH_AUTH_HINT=Repository secret BRAIN_RUNNER_WATCH_TOKEN is absent; github.token fallback may lack runner-admin read permission."
          fi
          mkdir -p .brain/state
          api_error=".brain/state/runner-watch-api.err"
          if ! json="$(gh api "/repos/${REPO}/actions/runners?per_page=100" 2>"${api_error}")"; then
            if grep -Eqi '403|Resource not accessible by integration|admin rights' "${api_error}"; then
              status="API_PERMISSION_DENIED"
            else
              status="API_QUERY_FAILED"
            fi
            online="false"
            id=""
            name=""
            busy="false"
            echo "RUNNER_WATCH_API_ERROR=${status}"
            tail -n 5 "${api_error}" || true
          else
            runner="$(printf '%s' "$json" | jq -c --argjson required "${REQUIRED_LABELS}" '
              .runners[]
              | select(([.labels[].name] | map(ascii_downcase)) as $labels
                | ($required | all(. as $x | ($labels | index($x)) != null)))
              | {id,name,status,busy,labels:[.labels[].name]}
            ' | head -n1 || true)"

            if [ -z "$runner" ]; then
              status="NOT_REGISTERED"
              online="false"
              id=""
              name=""
              busy="false"
            else
              status="$(jq -r '.status' <<<"$runner")"
              online="$(jq -r '(.status == "online")' <<<"$runner")"
              id="$(jq -r '.id' <<<"$runner")"
              name="$(jq -r '.name' <<<"$runner")"
              busy="$(jq -r '.busy' <<<"$runner")"
            fi
          fi

          cat > .brain/state/runner-watch.json <<EOF
          {
            "watch": "PERMANENT_RUNNER_SYSTEM_WATCH",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${REPO}",
            "status": "${status}",
            "online": ${online},
            "runner_id": "${id}",
            "runner_name": "${name}",
            "busy": ${busy},
            "required_labels": ${REQUIRED_LABELS}
          }
          EOF

          cat .brain/state/runner-watch.json
          echo "runner_online=${online}" >> "$GITHUB_OUTPUT"
          echo "runner_id=${id}" >> "$GITHUB_OUTPUT"
          echo "runner_name=${name}" >> "$GITHUB_OUTPUT"
          echo "runner_busy=${busy}" >> "$GITHUB_OUTPUT"
          echo "runner_status=${status}" >> "$GITHUB_OUTPUT"

  evidence:
    name: Evidence and Health Gate
    needs: detect
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Write final health evidence
        env:
          DETECT_ONLINE: ${{ needs.detect.outputs.runner_online }}
          RUNNER_ID: ${{ needs.detect.outputs.runner_id }}
          RUNNER_NAME: ${{ needs.detect.outputs.runner_name }}
          RUNNER_STATUS: ${{ needs.detect.outputs.runner_status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .brain/state
          # The legacy physical runner is not used by the software-only Brain.
          # This workflow observes registration only; it never schedules work on that runner.
          health="HARDWARE_EXECUTION_DISABLED_BY_POLICY"


          cat > .brain/state/runner-health.json <<EOF
          {
            "health": "${health}",
            "hardware_execution_policy": "DISABLED_BY_SOFTWARE_ONLY_POLICY",
            "registration_observation": "${RUNNER_STATUS}",
            "online": ${DETECT_ONLINE:-false},
            "runner_id": "${RUNNER_ID}",
            "runner_name": "${RUNNER_NAME}",
            "execution_probe": "NOT_RUN_BY_POLICY",
            "brain_core_requires_this_runner": false,
            "rule": "Legacy runner registration is observational only; core software tasks use GitHub-hosted runners",
            "next_action": "NO_HARDWARE_ACTION_REQUIRED"
          }
          EOF

          cat .brain/state/runner-health.json

          echo "HARDWARE_EXECUTION_POLICY=DISABLED_BY_SOFTWARE_ONLY_POLICY"
          echo "LEGACY_RUNNER_REGISTRATION_STATUS=${RUNNER_STATUS}"
          echo "BRAIN_CORE_HARDWARE_DEPENDENCY=NONE"

      - name: Upload hardware retirement evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-runner-health-${{ github.run_id }}
          path: .brain/state/runner-health.json
          retention-days: 14
