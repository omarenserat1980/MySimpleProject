name: Brain Component Contract Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "brain_v12/brain/**"
      - "brain_v12/tests/test_core.py"
      - "brain_v12/tests/test_memory_hierarchy.py"
      - "brain_v12/tests/test_orchestrator.py"
      - "brain_v12/tests/test_device_bridge.py"
      - "brain_v12/tests/test_brain_v13_evidence_lineage.py"
      - "brain_v12/tests/test_revenue_realization_gate.py"
      - "brain_v12/tests/test_media_engine.py"
      - "brain_v12/tests/test_asic_hardware_simulator.py"
      - "brain_v12/tests/test_software_node_discovery.py"
      - "brain_v12/tests/test_software_capability_gap_audit.py"
      - "brain_v12/tests/test_software_capability_candidate_catalog.py"
      - "brain_v12/tests/test_software_capability_promotion_gate.py"
      - ".github/workflows/brain-component-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/brain/**"
      - "brain_v12/tests/test_core.py"
      - "brain_v12/tests/test_memory_hierarchy.py"
      - "brain_v12/tests/test_orchestrator.py"
      - "brain_v12/tests/test_device_bridge.py"
      - "brain_v12/tests/test_brain_v13_evidence_lineage.py"
      - "brain_v12/tests/test_revenue_realization_gate.py"
      - "brain_v12/tests/test_media_engine.py"
      - "brain_v12/tests/test_asic_hardware_simulator.py"
      - "brain_v12/tests/test_software_node_discovery.py"
      - "brain_v12/tests/test_software_capability_gap_audit.py"
      - "brain_v12/tests/test_software_capability_candidate_catalog.py"
      - "brain_v12/tests/test_software_capability_promotion_gate.py"
      - ".github/workflows/brain-component-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: brain-component-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            test: brain_v12.tests.test_core
          - component: memory
            test: brain_v12.tests.test_memory_hierarchy
          - component: orchestrator
            test: brain_v12.tests.test_orchestrator
          - component: device_bridge
            test: brain_v12.tests.test_device_bridge
          - component: evidence_lineage
            test: brain_v12.tests.test_brain_v13_evidence_lineage
          - component: revenue_realization_gate
            test: brain_v12.tests.test_revenue_realization_gate
          - component: media_engine
            test: brain_v12.tests.test_media_engine
          - component: asic_software_simulator
            test: brain_v12.tests.test_asic_hardware_simulator
          - component: software_node_discovery
            test: brain_v12.tests.test_software_node_discovery
          - component: software_capability_gap_audit
            test: brain_v12.tests.test_software_capability_gap_audit
          - component: software_capability_candidate_catalog
            test: brain_v12.tests.test_software_capability_candidate_catalog
          - component: software_capability_promotion_gate
            test: brain_v12.tests.test_software_capability_promotion_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          if [ "${{ matrix.component }}" = "media_engine" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            ffmpeg -version
            ffprobe -version
          fi
      - name: Prepare component evidence
        run: mkdir -p "artifacts/component-contracts/${{ matrix.component }}"
      - name: Run component contract tests
        env:
          BRAIN_LIVE_INCOME_SEARCH_ENABLED: "false"
          BRAIN_WORKFORCE_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          case "${{ matrix.component }}" in
            revenue_realization_gate|asic_software_simulator)
              case "${{ matrix.component }}" in
                revenue_realization_gate) TEST_PATH="brain_v12/tests/test_revenue_realization_gate.py" ;;
                asic_software_simulator) TEST_PATH="brain_v12/tests/test_asic_hardware_simulator.py" ;;
              esac
              python -m pytest "$TEST_PATH" -q 2>&1 | tee "artifacts/component-contracts/${{ matrix.component }}/test.log"
              ;;
            *)
              python -m unittest "${{ matrix.test }}" -v 2>&1 | tee "artifacts/component-contracts/${{ matrix.component }}/test.log"
              ;;
          esac
      - name: Record component result
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
          TEST_MODULE: ${{ matrix.test }}
          TESTED_COMMIT: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib
          component = os.environ["COMPONENT"]
          root = pathlib.Path("artifacts/component-contracts") / component
          root.mkdir(parents=True, exist_ok=True)
          result = {
              "schema_version": "1.0",
              "component": component,
              "test_module": os.environ["TEST_MODULE"],
              "commit_sha": os.environ["TESTED_COMMIT"],
              "job_status": os.environ["JOB_STATUS"],
              "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "evidence": "test.log",
              "claim_boundary": "Unit/contract test evidence only; does not establish persistent deployment, physical ASIC fabrication, or real revenue settlement."
          }
          (root / "result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-component-contract-${{ matrix.component }}
          path: artifacts/component-contracts/${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30

  component-evidence-summary:
    if: always()
    needs: component-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download component evidence
        uses: actions/download-artifact@v4
        with:
          pattern: brain-component-contract-*
          path: artifacts/downloaded
          merge-multiple: false

      - name: Validate and summarize component evidence
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.component-contracts.result }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path("artifacts/downloaded")
          expected = {
              "core", "memory", "orchestrator", "device_bridge",
              "evidence_lineage", "revenue_realization_gate",
              "media_engine", "asic_software_simulator",
              "software_node_discovery", "software_capability_gap_audit",
              "software_capability_candidate_catalog", "software_capability_promotion_gate",
          }
          records = []
          errors = []
          found = set()
          for path in sorted(root.glob("**/result.json")):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON ({exc})")
                  continue
              component = item.get("component")
              if component in found:
                  errors.append(f"duplicate evidence for component: {component}")
                  continue
              found.add(component)
              if item.get("commit_sha") != os.environ["EXPECTED_COMMIT"]:
                  errors.append(f"{component}: commit SHA mismatch")
              if item.get("job_status") != "success":
                  errors.append(f"{component}: job status is {item.get('job_status')!r}")
              records.append(item)
          missing = sorted(expected - found)
          unexpected = sorted(found - expected)
          if missing:
              errors.append("missing components: " + ", ".join(missing))
          if unexpected:
              errors.append("unexpected components: " + ", ".join(unexpected))
          if os.environ["MATRIX_RESULT"] != "success":
              errors.append("matrix job result is " + os.environ["MATRIX_RESULT"])
          summary = {
              "schema_version": "1.0",
              "expected_commit": os.environ["EXPECTED_COMMIT"],
              "matrix_result": os.environ["MATRIX_RESULT"],
              "expected_components": sorted(expected),
              "found_components": sorted(found),
              "component_count": len(records),
              "passed": not errors,
              "errors": errors,
              "components": sorted(records, key=lambda x: str(x.get("component", ""))),
              "claim_boundary": "CI contract evidence only; not proof of persistent device deployment, physical ASIC fabrication, or actual revenue settlement."
          }
          out = pathlib.Path("artifacts/component-evidence-summary")
          out.mkdir(parents=True, exist_ok=True)
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\\n", encoding="utf-8")
          lines = [
              "# Brain component evidence summary",
              "",
              f"- Commit: `{summary['expected_commit']}`",
              f"- Matrix result: **{summary['matrix_result']}**",
              f"- Components with evidence: **{len(records)}/{len(expected)}**",
              f"- Summary verdict: **{'PASS' if summary['passed'] else 'FAIL'}**",
              "",
              "| Component | Job status | Commit matches |",
              "|---|---|---|",
          ]
          for item in sorted(records, key=lambda x: str(x.get("component", ""))):
              lines.append(f"| {item.get('component')} | {item.get('job_status')} | {'yes' if item.get('commit_sha') == summary['expected_commit'] else 'no'} |")
          if errors:
              lines.extend(["", "## Errors", *[f"- {e}" for e in errors]])
          lines.extend(["", summary["claim_boundary"]])
          report = "\\n".join(lines) + "\\n"
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(report, encoding="utf-8")
          (out / "summary.md").write_text(report, encoding="utf-8")
          print(json.dumps({"passed": summary["passed"], "component_count": len(records), "errors": errors}, indent=2))
          if errors:
              sys.exit(1)
          PY

      - name: Upload consolidated evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-component-evidence-summary
          path: artifacts/component-evidence-summary/
          if-no-files-found: error
          retention-days: 30
