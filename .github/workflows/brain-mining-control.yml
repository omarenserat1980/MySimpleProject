name: Brain Mining Control Plane

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test mining control plane
        run: |
          python -m unittest discover -s brain_v12/tests -p 'test_mining_controller.py' -v
      - name: Report safe status
        run: |
          python -m brain_v12.brain.mining_controller
          echo "GitHub Actions is a control/test plane only; mining execution is blocked."
