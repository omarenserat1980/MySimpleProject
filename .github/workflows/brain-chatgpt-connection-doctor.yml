name: Brain ChatGPT Connection Doctor

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Send one safe-mode diagnostic message after API probes (may call the configured model provider)"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "brain_v12/tools/brain_chatgpt_connection_doctor.py"
      - "brain_v12/tests/test_brain_chatgpt_connection_doctor.py"
      - ".github/workflows/brain-chatgpt-connection-doctor.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/tools/brain_chatgpt_connection_doctor.py"
      - "brain_v12/tests/test_brain_chatgpt_connection_doctor.py"
      - ".github/workflows/brain-chatgpt-connection-doctor.yml"

permissions:
  contents: read

concurrency:
  group: brain-chatgpt-connection-doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRAIN_API_ORIGIN: ${{ secrets.BRAIN_API_ORIGIN || vars.BRAIN_API_ORIGIN || secrets.BRAIN_ORIGIN || vars.BRAIN_ORIGIN || 'https://brain-control-plane-main.onrender.com' }}
      BRAIN_API_ORIGIN_SOURCE: ${{ secrets.BRAIN_API_ORIGIN != '' && 'secret:BRAIN_API_ORIGIN' || vars.BRAIN_API_ORIGIN != '' && 'var:BRAIN_API_ORIGIN' || secrets.BRAIN_ORIGIN != '' && 'secret:BRAIN_ORIGIN' || vars.BRAIN_ORIGIN != '' && 'var:BRAIN_ORIGIN' || 'existing-project-default' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backup evidence and run unit tests
        run: |
          set -euo pipefail
          mkdir -p brain-diagnostics
          python -m unittest brain_v12.tests.test_brain_chatgpt_connection_doctor -v
          echo "UNIT_TESTS=PASS"
      - name: Diagnose existing Brain API and ChatGPT emulator
        id: diagnose
        env:
          SEND_TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_message || false }}
        run: |
          set +e
          args=(--output brain-diagnostics/connection-report.json)
          if [ "${SEND_TEST_MESSAGE}" = "true" ]; then
            args+=(--send-test-message)
          fi
          python -m brain_v12.tools.brain_chatgpt_connection_doctor "${args[@]}"
          rc=$?
          set -e
          echo "doctor_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "CONNECTION_DOCTOR=PASS"
          else
            echo "CONNECTION_DOCTOR=BLOCKED (see JSON evidence artifact)"
          fi
      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-chatgpt-connection-doctor
          path: brain-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail run if connection is not verified
        if: steps.diagnose.outputs.doctor_exit_code != '0'
        run: |
          echo "::error::Brain ChatGPT connection is not verified. Inspect the artifact for the exact blocker; no secret values are logged."
          exit 1
