name: Windows Boot Proof Tool Tests

on:
  pull_request:
    paths:
      - "brain_v12/tools/windows_boot_proof.py"
      - "brain_v12/brain/windows_completion_gate.py"
      - "brain_v12/tests/test_windows_boot_proof.py"
      - ".github/workflows/windows-boot-proof-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/tools/windows_boot_proof.py"
      - "brain_v12/brain/windows_completion_gate.py"
      - "brain_v12/tests/test_windows_boot_proof.py"
      - ".github/workflows/windows-boot-proof-tests.yml"

permissions:
  contents: read

jobs:
  windows-boot-proof-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused fail-closed regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest brain_v12.tests.test_windows_boot_proof -v
