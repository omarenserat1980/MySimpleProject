name: Brain GitHub Actions Health
on:
  workflow_dispatch:
  push:
    paths:
      - 'brain_v12/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: brain-actions-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - name: Diagnostics
        uses: ./.github/actions/ci-repair
      - name: Python syntax
        run: python -m compileall -q brain_v12
      - name: Repair diagnostics
        run: python brain_v12/ci/github_actions_repair.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-ci-repair-report
          path: brain_v12/ci-reports
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          echo '## Brain GitHub Actions Health' >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
