name: Bitcoin Mining Intelligence Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'brain_v12/brain/bitcoin_mining_intelligence_api.py'
      - 'brain_v12/brain/mining_engine.py'
      - 'brain_v12/brain/bitcoin_hash_benchmark.py'
      - 'brain_v12/brain/stratum_v1_protocol.py'
      - 'brain_v12/brain/stratum_v1_jobs.py'
      - 'brain_v12/brain/stratum_candidate_pipeline.py'
      - 'brain_v12/brain/bitcoin_header.py'
      - 'brain_v12/brain/brain_owned_compute_runtime.py'
      - 'brain_v12/brain/brain_mcp.py'
      - 'brain_v12/brain/asic_resource_adapter.py'
      - 'brain_v12/brain/asic_simulator_api.py'
      - 'brain_v12/app.py'
      - 'brain_v12/brain/brain_owned_mining_contract.py'
      - 'brain_v12/asic/bitcoin_pow_simulator.py'
      - 'brain_v12/tests/test_bitcoin_mining_intelligence_api.py'
      - 'brain_v12/tests/test_mining_engine.py'
      - 'brain_v12/tests/test_bitcoin_hash_benchmark.py'
      - 'brain_v12/tests/test_stratum_v1_protocol.py'
      - 'brain_v12/tests/test_stratum_v1_jobs.py'
      - 'brain_v12/tests/test_stratum_candidate_pipeline.py'
      - 'brain_v12/tests/test_bitcoin_header.py'
      - 'brain_v12/tests/test_asic_resource_adapter.py'
      - 'brain_v12/tests/test_asic_simulator_api_sha256d.py'
      - 'brain_v12/tests/test_brain_owned_mining_contract.py'
      - 'brain_v12/tests/test_bitcoin_pow_simulator.py'
      - 'brain_v12/tests/test_bounded_pow_task_engine.py'
      - 'brain_v12/tests/test_sha256d_engine_consistency.py'
      - 'brain_v12/tests/test_brain_mcp_protocol.py'
      - '.github/workflows/bitcoin-mining-intelligence-tests.yml'
  push:
    branches: [brain-bitcoin-mining-intelligence, feat/brain-bitcoin-hash-benchmark, brain-sha256d-evidence-benchmark]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitcoin-mining-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip fastapi pydantic pytest httpx
      - name: Compile mining modules and tests
        run: |
          python -m py_compile \
            brain_v12/brain/bitcoin_mining_intelligence_api.py \
            brain_v12/brain/mining_engine.py \
            brain_v12/brain/bitcoin_hash_benchmark.py \
            brain_v12/brain/stratum_v1_protocol.py \
            brain_v12/brain/stratum_v1_jobs.py \
            brain_v12/brain/stratum_candidate_pipeline.py \
            brain_v12/brain/bitcoin_header.py \
            brain_v12/brain/brain_owned_compute_runtime.py \
            brain_v12/brain/brain_mcp.py \
            brain_v12/brain/asic_resource_adapter.py \
            brain_v12/brain/asic_simulator_api.py \
            brain_v12/app.py \
            brain_v12/brain/brain_owned_mining_contract.py \
            brain_v12/asic/bitcoin_pow_simulator.py \
            brain_v12/tests/test_bitcoin_mining_intelligence_api.py \
            brain_v12/tests/test_bitcoin_hash_benchmark.py \
            brain_v12/tests/test_stratum_v1_protocol.py \
            brain_v12/tests/test_stratum_v1_jobs.py \
            brain_v12/tests/test_stratum_candidate_pipeline.py \
            brain_v12/tests/test_bitcoin_header.py \
            brain_v12/tests/test_asic_resource_adapter.py \
            brain_v12/tests/test_asic_simulator_api_sha256d.py \
            brain_v12/tests/test_asic_simulator_api_sha256d.py \
            brain_v12/tests/test_brain_owned_mining_contract.py \
            brain_v12/tests/test_bitcoin_pow_simulator.py \
            brain_v12/tests/test_bounded_pow_task_engine.py \
            brain_v12/tests/test_sha256d_engine_consistency.py \
            brain_v12/tests/test_brain_mcp_protocol.py
      - name: Run mining integration and regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            brain_v12/tests/test_bitcoin_mining_intelligence_api.py \
            brain_v12/tests/test_mining_engine.py \
            brain_v12/tests/test_bitcoin_hash_benchmark.py \
            brain_v12/tests/test_stratum_v1_protocol.py \
            brain_v12/tests/test_stratum_v1_jobs.py \
            brain_v12/tests/test_stratum_candidate_pipeline.py \
            brain_v12/tests/test_bitcoin_header.py \
            brain_v12/tests/test_asic_resource_adapter.py \
            brain_v12/tests/test_brain_owned_mining_contract.py \
            brain_v12/tests/test_bitcoin_pow_simulator.py \
            brain_v12/tests/test_bounded_pow_task_engine.py \
            brain_v12/tests/test_sha256d_engine_consistency.py \
            brain_v12/tests/test_brain_mcp_protocol.py
      - name: Capture bounded CPU benchmark evidence
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts/sha256d-benchmark
          python - <<'PY'
          import json
          import pathlib
          import platform
          import subprocess
          from brain_v12.brain.bitcoin_hash_benchmark import benchmark_header_hashing

          result = benchmark_header_hashing(duration_seconds=0.25, max_hashes=100000)
          evidence = {
              **result,
              "runner": "github-hosted-ubuntu",
              "runner_os": platform.platform(),
              "python_version": platform.python_version(),
              "commit_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "claim_boundary": "GitHub-hosted CPU software benchmark only; not production, ASIC, pool, or revenue evidence",
          }
          path = pathlib.Path("artifacts/sha256d-benchmark/benchmark-evidence.json")
          path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2))
          if not result["ok"]:
              raise SystemExit("SHA256D_BENCHMARK_EVIDENCE_INVALID")
          PY
      - name: Upload bounded CPU benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256d-benchmark-evidence
          path: artifacts/sha256d-benchmark/benchmark-evidence.json
          if-no-files-found: error
          retention-days: 30
