name: Build Honda CONNECT Brain APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-honda-brain-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager is not available on PATH; installing command-line tools"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
            cp -R /tmp/android-cmdline-tools/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle and Android toolchain
        run: |
          java -version
          gradle --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0|platform-tools'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaConnectBrain-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
