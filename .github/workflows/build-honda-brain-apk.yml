name: Build Honda CONNECT Brain APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-honda-brain-apk.yml'

permissions:
  contents: read

concurrency:
  group: honda-connect-brain-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Honda CONNECT Brain
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed |
            grep -E 'platforms;android-35|build-tools;35.0.0|platform-tools'

      - name: Validate Gradle model
        run: gradle :app:tasks --all --no-daemon --stacktrace

      - name: Static Android regression checks
        shell: bash
        run: |
          set -euo pipefail
          SERVER="app/src/main/java/com/brain/hondaconnect/BrainServerService.java"
          TERMUX="app/src/main/java/com/brain/hondaconnect/BrainTermuxActivity.java"

          test -f "$SERVER"
          test -f "$TERMUX"

          # BrainServerService: accept() must remain inside a checked-exception handler.
          grep -Fq 'final Socket client = serverSocket.accept();' "$SERVER"

          # BrainTermuxActivity: View.getParent() returns ViewParent, not View.
          grep -Fq 'terminal.getParent() instanceof ScrollView' "$TERMUX"

          # Guard against reintroducing the exact compile-time regression from the failed run.
          if grep -Fq 'View p=terminal.getParent()' "$TERMUX"; then
            echo "ERROR: terminal.getParent() must not be assigned to View."
            exit 1
          fi

          echo "Android source regression checks passed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaConnectBrain-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
