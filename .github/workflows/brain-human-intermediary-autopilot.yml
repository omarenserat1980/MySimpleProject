name: Brain Human Intermediary Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - "brain_v12/self_healing/human_intermediary_predictor.py"
      - "brain_v12/self_healing/test_human_intermediary_predictor.py"
      - "PROJECT_ROADMAP.md"
      - ".github/workflows/brain-human-intermediary-autopilot.yml"

concurrency:
  group: brain-human-intermediary-autopilot
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  predict-and-advance:
    runs-on: [self-hosted, linux, x64, brain-internal, qemu, windows-real-boot]
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail-closed Brain internal runtime preflight
        run: |
          set -euo pipefail
          python -m brain_v12.brain.internal_runner_preflight
          python - <<'PY'
          from brain_v12.brain.internal_runner_preflight import verify_and_write
          e=verify_and_write("internal-runner-preflight.json")
          assert e["verified"] is True, e
          print("BRAIN_INTERNAL_RUNNER=VERIFIED")
          PY
      - name: Run predictor tests
        run: python -m unittest brain_v12.self_healing.test_human_intermediary_predictor -v
      - name: Predict current human-intermediary continuation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m brain_v12.self_healing.human_intermediary_predictor
      - name: Verify monotonic continuation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("brain_v12/state/human_intermediary_prediction.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["execution_contract"]["success_requires_evidence"] is True
          assert d["execution_contract"]["automatic_production_code_mutation"] is False
          assert d["execution_contract"]["automatic_prompt_mutation"] is False
          assert d["execution_contract"]["automatic_financial_or_external_side_effects"] is False
          assert d["anti_regression"]["policy"] == "monotonic_progress_only"
          print("HUMAN_INTERMEDIARY_AUTOPILOT=VERIFIED")
          print("FRONTIER=", d["current_frontier"])
          print("NEXT_ACTION=", d["next_safe_action"])
          PY
      - name: Commit only monotonic state/report changes
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          test -d "$repo"
          git -C "$repo" rev-parse --show-toplevel
          git -C "$repo" config user.name "brain-autopilot"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo" add brain_v12/state/human_intermediary_state.json brain_v12/state/human_intermediary_prediction.json
          if git -C "$repo" diff --cached --quiet; then
            echo "BRAIN_INTERMEDIARY_STATE=UNCHANGED"
          else
            git -C "$repo" commit -m "brain: persist human intermediary continuation state"
            git -C "$repo" push
          fi
      - name: Upload prediction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-human-intermediary-prediction-${{ github.run_id }}
          path: ${{ github.workspace }}/brain_v12/state/human_intermediary_prediction.json
          if-no-files-found: warn
          retention-days: 14
