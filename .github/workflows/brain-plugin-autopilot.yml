name: Brain Plugin Autopilot Verify

on:
  push:
    paths:
      - "plugins/brain-autopilot/**"
      - "brain_v12/tests/test_brain_autopilot_plugin.py"
      - ".github/workflows/brain-plugin-autopilot.yml"
  pull_request:
    paths:
      - "plugins/brain-autopilot/**"
      - "brain_v12/tests/test_brain_autopilot_plugin.py"
      - ".github/workflows/brain-plugin-autopilot.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile check
        run: python -m compileall -q brain_v12/tests
      - name: Plugin structure test
        run: python -m unittest brain_v12.tests.test_brain_autopilot_plugin -v
      - name: Manifest JSON validation
        run: python -c "import json; json.load(open('plugins/brain-autopilot/plugin.json', encoding='utf-8')); print('plugin.json: valid')"
