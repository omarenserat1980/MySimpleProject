name: Crypto Mining Payout Verification Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "brain_v12/business/crypto_mining_intelligence.py"
      - "brain_v12/business/crypto_mining_verification.py"
      - "brain_v12/business/revenue_ledger.py"
      - "brain_v12/business/test_crypto_mining_verification.py"
      - "brain_v12/business/test_revenue_ledger.py"
      - ".github/workflows/crypto-mining-verification-tests.yml"
  push:
    branches: [main]
    paths:
      - "brain_v12/business/crypto_mining_intelligence.py"
      - "brain_v12/business/crypto_mining_verification.py"
      - "brain_v12/business/test_crypto_mining_verification.py"
      - ".github/workflows/crypto-mining-verification-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payout-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile payout verification modules
        run: |
          python -m py_compile \
            brain_v12/business/crypto_mining_intelligence.py \
            brain_v12/business/crypto_mining_verification.py \
            brain_v12/business/revenue_ledger.py \
            brain_v12/business/test_crypto_mining_verification.py \
            brain_v12/business/test_revenue_ledger.py
      - name: Run payout verification regression tests
        run: python -m pytest -q brain_v12/business/test_crypto_mining_verification.py brain_v12/business/test_revenue_ledger.py
