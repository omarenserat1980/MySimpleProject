name: BRAIN Games Store Contract

on:
  push:
    branches: [main]
    paths:
      - "games-store.html"
      - "brain_v12/brain/games_store.py"
      - "brain_v12/tests/test_games_store.py"
      - ".github/workflows/brain-games-store.yml"
  pull_request:
    paths:
      - "games-store.html"
      - "brain_v12/brain/games_store.py"
      - "brain_v12/tests/test_games_store.py"
      - ".github/workflows/brain-games-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile store contract
        run: python -m py_compile brain_v12/brain/games_store.py
      - name: Run games store contract tests
        run: python -m unittest brain_v12.tests.test_games_store -v
      - name: Verify storefront
        run: |
          test -s games-store.html
          grep -q "BRAIN Games" games-store.html
          grep -q "localStorage" games-store.html
          grep -q "official" games-store.html
