name: Brain Cloud Executor Attestation Tests

on:
  pull_request:
    paths:
      - "brain_v12/brain/cloud_executor_attestation.py"
      - "brain_v12/brain/cloud_executor_attestation_issuer.py"
      - "brain_v12/tests/test_cloud_executor_attestation_issuer.py"
      - "tools/install_brain_executor_trust_anchor.sh"
      - "brain_v12/brain/cloud_executor_attestation_issuer.py"
      - "brain_v12/tests/test_cloud_executor_attestation_issuer.py"
      - "tools/install_brain_executor_trust_anchor.sh"
      - "brain_v12/brain/cloud_executor_gate.py"
      - "brain_v12/tests/test_cloud_executor_attestation.py"
      - "brain_v12/tests/test_cloud_executor_gate.py"
      - "tools/bootstrap_brain_cloud_executor.sh"
      - "brain_v12/CLOUD_EXECUTOR_RUNNER_CONTRACT.md"
      - ".github/workflows/cloud-executor-attestation-tests.yml"
  push:
    branches:
      - main
    paths:
      - "brain_v12/brain/cloud_executor_attestation.py"
      - "brain_v12/brain/cloud_executor_gate.py"
      - "brain_v12/tests/test_cloud_executor_attestation.py"
      - "brain_v12/tests/test_cloud_executor_gate.py"
      - "tools/bootstrap_brain_cloud_executor.sh"
      - "brain_v12/CLOUD_EXECUTOR_RUNNER_CONTRACT.md"
      - ".github/workflows/cloud-executor-attestation-tests.yml"

permissions:
  contents: read

jobs:
  attestation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check "cryptography>=42"
      - name: Run signed attestation rejection tests
        run: python -m unittest -v brain_v12.tests.test_cloud_executor_attestation brain_v12.tests.test_cloud_executor_attestation_issuer brain_v12.tests.test_cloud_executor_gate
      - name: Validate bootstrap shell syntax
        run: bash -n tools/bootstrap_brain_cloud_executor.sh tools/install_brain_executor_trust_anchor.sh
