name: Brain Cloud Mining Control Plane

# This validation workflow is read-only; it must never write or mutate main.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

concurrency:
  # Isolate pull-request validation from main-branch and scheduled runs.
  group: brain-cloud-mining-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Use the original Arkan self-hosted runner for trusted events only.
    # Pull requests stay on GitHub-hosted runners to avoid executing untrusted code on Arkan.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "brain-internal"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check cryptography
      - name: Validate economics API evidence truth boundary
        run: |
          python -m pytest -q brain_v12/economics/test_api.py
      - name: Validate commercial outcome gate
        run: |
          python -m pytest -q brain_v12/business/test_commercial_outcome_gate.py
      - name: Validate monetization registry
        run: |
          python -m pytest -q brain_v12/business/test_monetization_registry.py
      - name: Validate initial monetization catalog
        run: |
          python -m pytest -q brain_v12/business/test_initial_monetization_catalog.py
      - name: Validate commercial KPI report
        run: |
          python -m pytest -q brain_v12/business/test_commercial_kpi_report.py
      - name: Validate commercial acquisition and delivery case
        run: |
          python -m pytest -q brain_v12/business/test_commercial_case.py
      - name: Validate commercial operations dashboard
        run: |
          python -m pytest -q brain_v12/business/test_commercial_operations_dashboard.py
      - name: Validate commercial dashboard CLI
        run: |
          python -m pytest -q brain_v12/business/test_commercial_dashboard_cli.py
      - name: Validate commercial dashboard API
        run: |
          python -m pytest -q brain_v12/business/test_commercial_dashboard_api.py
      - name: Validate commercial case API
        run: |
          python -m pytest -q brain_v12/business/test_commercial_dashboard_api.py
      - name: Validate cloud control plane
        run: |
          python -m pytest -q brain_v12/tests/test_cloud_mining_control_plane.py
      - name: Validate ASIC resource integration
        run: |
          python -m pytest -q brain_v12/tests/test_asic_resource_adapter.py
          python -m pytest -q brain_v12/tests/test_brain_physical_asic_agent.py
          python -m pytest -q brain_v12/tests/test_physical_asic_api.py
      - name: Validate mining payout and blockchain proof gates
        run: |
          python -m pytest -q brain_v12/business/test_crypto_mining_verification.py
      - name: Validate revenue ledger mining gate
        run: |
          python -m pytest -q brain_v12/business/test_revenue_ledger.py
      - name: Validate worker-to-revenue integration gate
        run: |
          python -m pytest -q brain_v12/business/test_crypto_mining_end_to_end.py
      - name: Validate worker telemetry normalization gate
        run: |
          python -m pytest -q brain_v12/business/test_crypto_worker_telemetry.py
      - name: Validate live public mining market freshness gate
        run: |
          python -m pytest -q brain_v12/business/test_crypto_live_collector.py
      - name: Validate Braiins read-only adapter gate
        run: |
          python -m pytest -q brain_v12/business/test_braiins_readonly_adapter.py
      # Stratum tests are diagnostic only and must not gate downstream read-only
      # live-evidence collection. Their failures remain visible in step outcomes.
      - name: Diagnostic only — mocked TLS Stratum bridge
        id: stratum_bridge_diagnostic
        continue-on-error: true
        run: |
          python -m pytest -q brain_v12/tests/test_bitcoin_stratum_bridge.py
      - name: Diagnostic only — Stratum V1 jobs
        id: stratum_v1_jobs_diagnostic
        continue-on-error: true
        run: |
          python -m pytest -q brain_v12/tests/test_stratum_v1_jobs.py
      - name: Diagnostic only — Stratum V1 protocol
        id: stratum_v1_protocol_diagnostic
        continue-on-error: true
        run: |
          python -m pytest -q brain_v12/tests/test_stratum_v1_protocol.py
      - name: Report Stratum diagnostic status without gating CI
        if: always()
        env:
          STRATUM_BRIDGE_OUTCOME: ${{ steps.stratum_bridge_diagnostic.outcome }}
          STRATUM_V1_JOBS_OUTCOME: ${{ steps.stratum_v1_jobs_diagnostic.outcome }}
          STRATUM_V1_PROTOCOL_OUTCOME: ${{ steps.stratum_v1_protocol_diagnostic.outcome }}
        run: |
          {
            echo "## Stratum test status (diagnostic only)"
            echo
            echo "- Mocked TLS bridge tests: ${STRATUM_BRIDGE_OUTCOME:-unknown}"
            echo "- Stratum V1 jobs tests: ${STRATUM_V1_JOBS_OUTCOME:-unknown}"
            echo "- Stratum V1 protocol tests: ${STRATUM_V1_PROTOCOL_OUTCOME:-unknown}"
            echo "- These test outcomes do not gate this workflow."
            echo "- Live mining readiness, accepted shares, and revenue remain independently gated by evidence."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate mining economics gate
        run: |
          python -m pytest -q brain_v12/business/test_mining_economics_gate.py
      - name: Validate Mining Economics Engine
        run: |
          python -m pytest -q brain_v12/business/test_mining_economics_engine.py
      - name: Validate Mining Opportunity Intelligence
        run: |
          python -m pytest -q brain_v12/business/test_mining_opportunity_intelligence.py
      - name: Validate Mining Opportunity Audit Bridge
        run: |
          python -m pytest -q brain_v12/business/test_mining_opportunity_audit_bridge.py
      - name: Validate self-healing workflow dispatch safety
        run: |
          python -m pytest -q brain_v12/self_healing/test_supervisor.py
      - name: Validate self-healing completion evidence contract
        run: |
          python -m pytest -q brain_v12/self_healing/test_supervisor_evidence.py
      - name: Validate self-healing repair and independent verification cycle
        run: |
          python -m pytest -q brain_v12/self_healing/test_supervisor_repair_cycle.py
      - name: Validate self-healing main-branch write boundary
        run: |
          python -m pytest -q brain_v12/self_healing/test_main_branch_write_boundary.py
      - name: Validate self-healing failure boundaries
        run: |
          python -m pytest -q brain_v12/self_healing/test_supervisor_failure_boundaries.py
      - name: Validate Brain-owned software-only mining contract
        run: |
          python -m pytest -q brain_v12/tests/test_brain_owned_mining_contract.py
      - name: Validate Brain mining controller software-only gate
        run: |
          python -m pytest -q brain_v12/tests/test_mining_controller.py
      - name: Validate gateway-only mining-node preflight
        run: |
          python -m pytest -q brain_v12/tests/test_digital_mining_node.py
      - name: Validate software-only mining-node API
        run: |
          python -m pytest -q brain_v12/tests/test_mining_node_api_software_only.py
      - name: Validate mining-to-revenue fail-closed boundary
        run: |
          python -m pytest -q brain_v12/business/test_crypto_mining_end_to_end.py
      - name: Validate independent Bitcoin payout reconciliation
        run: |
          python -m pytest -q brain_v12/business/test_bitcoin_payout_reconciliation.py
      - name: Validate read-only live Bitcoin chain evidence collector
        run: |
          python -m pytest -q brain_v12/business/test_bitcoin_chain_readonly_collector.py
      - name: Validate Braiins live evidence probe safety contract
        run: |
          python -m pytest -q brain_v12/self_healing/test_braiins_probe_workflow_contract.py

      - name: Validate offline Stratum job-to-SHA256d integration contract
        run: |
          python -m pytest -q brain_v12/tests/test_offline_stratum_pow_protocol_integration.py

      - name: Emit cloud control snapshot
        run: |
          python -m brain_v12.brain.cloud_mining_control_plane
          echo "Cloud layer coordinates registered workers; it does not mine on GitHub Actions."

      - name: Report live-mining evidence separately from CI
        if: always()
        shell: bash
        run: |
          {
            echo "## Mining evidence status"
            echo
            echo "- CI validation result: ${{ job.status }}"
            echo "- Live worker evidence: NOT_CHECKED_BY_THIS_CI_RUN"
            echo "- Accepted pool shares: NOT_VERIFIED_BY_THIS_CI_RUN"
            echo "- Payout/revenue: NOT_VERIFIED_BY_THIS_CI_RUN"
            echo "- Mining execution on GitHub Actions: NOT_PERFORMED"
            echo
            echo "A green CI result means only that the configured software tests passed. It is not evidence of live Bitcoin mining, accepted shares, payout, or revenue."
          } >> "$GITHUB_STEP_SUMMARY"
