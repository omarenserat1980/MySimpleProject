name: Brain Cloud Mining Control Plane

on:
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cloud control plane
        run: |
          python -m unittest discover -s brain_v12/tests -p 'test_cloud_mining_control_plane.py' -v
      - name: Emit cloud control snapshot
        run: |
          python -m brain_v12.brain.cloud_mining_control_plane
          echo "Cloud layer coordinates registered workers; it does not mine on GitHub Actions."
