name: Brain Public Opportunity Scan

on:
  push:
    branches: [main]
    paths:
      - "brain_v12/business/**"
      - "brain_v12/brain/live_opportunity_researcher.py"
      - ".github/workflows/brain-public-opportunity-scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect public GitHub signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .brain/opportunities
          gh api --method GET search/issues \
            -f q='is:open is:issue (label:"good first issue" OR label:"help wanted") (automation OR "github actions" OR CI OR workflow OR AI OR Python)' \
            -f per_page=30 > .brain/opportunities/github_raw.json

      - name: Collect live public freelance signals
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from brain_v12.brain.live_opportunity_researcher import LiveOpportunityResearcher

          class Engine:
              def ingest_live_opportunities(self, items, max_age_hours=72):
                  return items

          class Store:
              def event(self, name, result):
                  print(name, json.dumps(result, ensure_ascii=False))

          result = LiveOpportunityResearcher(Engine(), Store()).run_once()
          with open(".brain/opportunities/live_scan.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
          print("BRAIN_LIVE_PUBLIC_SCAN=", "PASS" if result["ok"] else "DEGRADED")
          print("LIVE_RECEIVED=", result["received"])
          print("LIVE_ERRORS=", len(result["errors"]))
          PY

      - name: Normalize and rank GitHub signals
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from brain_v12.business.public_opportunity_collector import collect_from_search_payload
          from brain_v12.business.opportunity_report import build_report

          with open(".brain/opportunities/github_raw.json", encoding="utf-8") as f:
              payload=json.load(f)
          items=collect_from_search_payload(payload)
          report=build_report(items)
          with open(".brain/opportunities/report.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2,ensure_ascii=False)
          print("BRAIN_PUBLIC_OPPORTUNITY_SCAN=PASS")
          print("INPUT=",report["total_input"])
          print("UNIQUE=",report["unique_opportunities"])
          print("READY=",len(report["ready_for_review"]))
          PY

      - name: Upload opportunity evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-public-opportunities
          path: .brain/opportunities/
