name: Brain Cloud Direct Executor Readiness

on:
  push:
    branches:
      - brain-new-windows-integration-2026-10-13
    paths:
      - "brain_v12/brain/cloud_executor_gate.py"
      - "tools/request_cloud_executor_attestation.py"
      - ".github/workflows/brain-cloud-direct-executor-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-executor-readiness:
    runs-on:
      - self-hosted
      - linux
      - x64
      - brain-internal
      - qemu
      - windows-real-boot
      - brain-cloud-executor
    environment: windows-real-boot
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected executor inputs
        env:
          BRAIN_CLOUD_EXECUTOR_TOKEN: ${{ secrets.BRAIN_CLOUD_EXECUTOR_TOKEN_PROTECTED }}
          BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64: ${{ secrets.BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64_PROTECTED }}
        run: |
          test -n "${BRAIN_CLOUD_EXECUTOR_TOKEN:-}" || { echo "BLOCKED: executor token unavailable"; exit 2; }
          test -n "${BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64:-}" || { echo "BLOCKED: attestation verification key unavailable"; exit 2; }

      - name: Request fresh executor attestation
        env:
          BRAIN_CLOUD_EXECUTOR: "1"
          BRAIN_CLOUD_EXECUTOR_TOKEN: ${{ secrets.BRAIN_CLOUD_EXECUTOR_TOKEN_PROTECTED }}
          BRAIN_CLOUD_EXECUTOR_REGISTRY_URL: ${{ secrets.BRAIN_CLOUD_EXECUTOR_REGISTRY_URL_PROTECTED }}
          BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64: ${{ secrets.BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64_PROTECTED }}
        run: |
          export BRAIN_CLOUD_EXECUTOR_ID="brain-direct-${GITHUB_RUN_ID}"
          export BRAIN_CLOUD_EXECUTOR_ATTESTATION_FILE="${RUNNER_TEMP}/cloud-executor-attestation.json"
          python3 tools/request_cloud_executor_attestation.py --output "${BRAIN_CLOUD_EXECUTOR_ATTESTATION_FILE}"
          test -s "${BRAIN_CLOUD_EXECUTOR_ATTESTATION_FILE}"

      - name: Run signed cloud executor gate
        env:
          BRAIN_CLOUD_EXECUTOR: "1"
          BRAIN_CLOUD_EXECUTOR_ID: "brain-direct-${{ github.run_id }}"
          BRAIN_CLOUD_EXECUTOR_TOKEN: ${{ secrets.BRAIN_CLOUD_EXECUTOR_TOKEN_PROTECTED }}
          BRAIN_CLOUD_EXECUTOR_REGISTRY_URL: ${{ secrets.BRAIN_CLOUD_EXECUTOR_REGISTRY_URL_PROTECTED }}
          BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64: ${{ secrets.BRAIN_CLOUD_EXECUTOR_ATTESTATION_PUBLIC_KEY_B64_PROTECTED }}
        run: |
          export BRAIN_CLOUD_EXECUTOR_ATTESTATION_FILE="${RUNNER_TEMP}/cloud-executor-attestation.json"
          python3 tools/request_cloud_executor_attestation.py --output "${BRAIN_CLOUD_EXECUTOR_ATTESTATION_FILE}"
          python3 brain_v12/brain/cloud_executor_gate.py --output cloud-executor-gate.json

      - name: Require real KVM execution substrate
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open("cloud-executor-gate.json", encoding="utf-8"))
          if not e.get("verified"):
              raise SystemExit("CLOUD_EXECUTOR_GATE_BLOCKED")
          print("CLOUD_EXECUTOR_GATE=PASS")
          print("EXECUTOR_ID=" + str(e.get("executor_id", "")))
          print("KVM_RUNTIME=" + str(e.get("checks", {}).get("kvm_runtime", {}).get("value", "")))
          PY

      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-cloud-direct-executor-evidence
          path: cloud-executor-gate.json
          if-no-files-found: ignore
