<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN Original — Drift Circuit</title>
<style>html,body{margin:0;height:100%;background:#05070b;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,960px);aspect-ratio:16/9;border:1px solid #35405b;border-radius:18px;background:#10141b}.tip{position:fixed;bottom:15px;background:#000c;padding:9px 13px;border-radius:12px;color:#aeb7c9}</style></head>
<body><canvas id="c" width="960" height="540"></canvas><div class="tip">← → للتوجيه • ↑ للتسارع • ↓ للفرامل • أكمل 3 لفات</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),keys={};let car={x:480,y:420,v:0,a:0},lap=0,t=0,done=false;onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
function loop(){requestAnimationFrame(loop);t++;if(done){draw();return}if(keys.ArrowUp)car.v=Math.min(7,car.v+.08);else car.v*=.985;if(keys.ArrowDown)car.v=Math.max(0,car.v-.16);if(keys.ArrowLeft)car.a-=.045*(.4+car.v/7);if(keys.ArrowRight)car.a+=.045*(.4+car.v/7);car.x+=Math.sin(car.a)*car.v;car.y-=Math.cos(car.a)*car.v;if(car.x<230||car.x>730||car.y<90||car.y>490){car.v*=.92}if(car.y<110&&Math.abs(car.x-480)<120){lap=Math.min(3,Math.floor(t/420)+1)}if(lap>=3)done=true;draw()}
function draw(){x.fillStyle='#10141b';x.fillRect(0,0,960,540);x.strokeStyle='#4b556e';x.lineWidth=95;x.strokeRect(190,50,580,440);x.strokeStyle='#10141b';x.lineWidth=52;x.strokeRect(190,50,580,440);x.setLineDash([15,15]);x.strokeStyle='#e8e8e855';x.lineWidth=3;x.strokeRect(190,50,580,440);x.setLineDash([]);x.fillStyle='#ffcf4a';x.fillRect(455,70,50,50);x.save();x.translate(car.x,car.y);x.rotate(car.a);x.fillStyle='#35d0ff';x.fillRect(-14,-25,28,50);x.fillStyle='#111';x.fillRect(-11,-18,22,14);x.restore();x.fillStyle='#fff';x.font='bold 22px system-ui';x.fillText('اللفة: '+lap+'/3',24,35);x.fillText('السرعة: '+Math.round(car.v*20),24,64);if(done){x.fillStyle='#000b';x.fillRect(0,0,960,540);x.fillStyle='#fff';x.textAlign='center';x.font='bold 48px system-ui';x.fillText('فوز! Drift Circuit',480,250);x.font='22px system-ui';x.fillText('أكملت 3 لفات',480,292);x.textAlign='start'}}
loop();
</script></body></html>
