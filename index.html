<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيت المضخات والعدد والدهانات</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#075985,#0ea5e9);color:#fff;padding:45px 20px;text-align:center}h1{margin:0 0 10px}.container{max-width:1200px;margin:25px auto;padding:0 15px}.search{width:100%;padding:15px;border:1px solid #d5dce5;border-radius:12px;font-size:17px;margin-bottom:18px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px}.filters button{border:0;border-radius:20px;padding:10px 16px;background:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0001}.thumb{width:100%;display:block}.content{padding:16px}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#e0f2fe;color:#075985;font-size:13px}.watch{display:block;text-align:center;margin-top:15px;background:#075985;color:#fff;text-decoration:none;padding:11px;border-radius:9px}footer{text-align:center;background:#102033;color:#fff;padding:25px;margin-top:40px}</style></head><body><header><h1>💧 بيت المضخات والعدد والدهانات</h1><p>مكتبة فيديوهات المضخات والمعدات من YouTube</p></header><main class="container"><input id="search" class="search" placeholder="🔎 ابحث عن مضخة أو شركة..."><div class="filters"><button data-f="all">الكل</button><button data-f="Foras">Foras</button><button data-f="LEO">LEO</button><button data-f="Pedrollo">Pedrollo</button><button data-f="غاطسة">غاطسة</button><button data-f="ضغط">ضغط</button><button data-f="ري">ري</button><button data-f="صيانة">صيانة</button></div><section id="grid" class="grid"></section></main><footer>© بيت المضخات والعدد والدهانات</footer><script>const v=[["مضخة مياه Foras","1t_uMCT0enA","Foras"],["شرح مضخة Foras","SwwjYNSSXx4","Foras"],["مضخة Foras","9-wtyKhfMr0","Foras"],["مضخة LEO","a1lp8QG93LM","LEO"],["مضخة LEO","fllg1tyJ4H0","LEO"],["مضخة LEO","chiKB907-VU","LEO"],["مضخة Pedrollo","LmR1o3tUycg","Pedrollo"],["مضخة Pedrollo","0ZBQiKZkPlQ","Pedrollo"],["تركيب مضخة غاطسة","k0sD2wrGSVA","غاطسة"],["شرح مضخة غاطسة","Imvoe4rZKNM","غاطسة"],["مضخة ضغط مياه","JGRBC7pwerg","ضغط"],["مضخة ضغط مياه","VJS4eO4GF40","ضغط"],["مضخات الري","bGy-v122t80","ري"],["مضخات الري","9aCLR0Rly28","ري"],["صيانة مضخات المياه","mKXTsazANi0","صيانة"],["صيانة مضخة","x9vIinPX4qQ","صيانة"]];let f="all";function r(){let q=document.getElementById("search").value.toLowerCase(),g=document.getElementById("grid");g.innerHTML=v.filter(x=>(f=="all"||x[2]==f)&&(!q||(x[0]+" "+x[2]).toLowerCase().includes(q))).map(x=>`<article class="card"><img class="thumb" loading="lazy" src="https://img.youtube.com/vi/${x[1]}/hqdefault.jpg"><div class="content"><h3>${x[0]}</h3><span class="tag">${x[2]}</span><a class="watch" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${x[1]}">▶ مشاهدة الفيديو على YouTube</a></div></article>`).join("")}document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;r()});document.getElementById("search").oninput=r;r()</script></body></html>
