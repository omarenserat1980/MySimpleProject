services:
  brain:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - brain_output:/app/cinematic_output
      - brain_state:/app/.brain_state
    environment:
      FACTORY_ALLOW_PRODUCTION: "1"
      FACTORY_REQUIRE_REAL_MEDIA: "1"
      FACTORY_ONE_SHOT: "1"
      FACTORY_ALLOW_YOUTUBE_PUBLISH: "0"
      FACTORY_INTERVAL_SECONDS: "21600"
      BRAIN_GOAL_EXECUTE: "1"
      BRAIN_BLOCK_PRIVATE_NETWORKS: "1"
      BRAIN_HTTP_TIMEOUT: "30"
      BRAIN_STATE_DIR: "/app/.brain_state"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "uvicorn cloud.api_server:app --host 0.0.0.0 --port 8000 &
             exec python cloud/brain_cloud.py"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  brain_output:
  brain_state:
