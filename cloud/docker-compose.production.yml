services:
  brain-cloud:
    image: ghcr.io/omarenserat1980/mysimpleproject-brain-cloud:${BRAIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${BRAIN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      BRAIN_STATE_DIR: /data/brain_state
      FACTORY_OUTPUT_DIR: /data/cinematic_output
      LOCAL_MEDIA_DIR: /data/cinematic_output
      BRAIN_SLEEP_SECONDS: "${BRAIN_SLEEP_SECONDS:-60}"
      FACTORY_INTERVAL_SECONDS: "${FACTORY_INTERVAL_SECONDS:-21600}"
      FACTORY_ALLOW_PRODUCTION: "${FACTORY_ALLOW_PRODUCTION:-1}"
      FACTORY_ALLOW_YOUTUBE_PUBLISH: "${FACTORY_ALLOW_YOUTUBE_PUBLISH:-0}"
      FACTORY_REQUIRE_REAL_MEDIA: "${FACTORY_REQUIRE_REAL_MEDIA:-1}"
      BRAIN_RUNTIME_MODE: "${BRAIN_RUNTIME_MODE:-cloud_only}"
      BRAIN_DEVICE_EXECUTION_ENABLED: "${BRAIN_DEVICE_EXECUTION_ENABLED:-0}"
      BRAIN_TERMUX_REQUIRED: "${BRAIN_TERMUX_REQUIRED:-0}"
      BRAIN_QUEUE_POLL_SECONDS: "${BRAIN_QUEUE_POLL_SECONDS:-5}"
      BRAIN_FACTORY_TIMEOUT_SECONDS: "${BRAIN_FACTORY_TIMEOUT_SECONDS:-3600}"
      BRAIN_MEDIA_STORAGE: /data/cinematic_output
    volumes:
      - brain_state:/data/brain_state
      - brain_media:/data/cinematic_output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  brain_state:
  brain_media:
