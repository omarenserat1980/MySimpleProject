services:
  - type: web
    name: electronic-brain-relay
    runtime: python
    rootDir: brain_v7
    buildCommand: pip install -r relay_requirements.txt
    startCommand: uvicorn relay_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RELAY_TOKEN
        sync: false
