services:
  - type: web
    name: electronic-brain-v12
    runtime: python
    rootDir: .
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r brain_v12/requirements.txt
    startCommand: uvicorn brain_v12.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BRAIN_RENDER_MONITOR_ENABLED
        value: "true"
      - key: RENDER_LOG_POLL_SECONDS
        value: "60"
      - key: RENDER_SERVICE_ID
        value: "srv-dapmmp0473hc73c9ceog"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAIN_CONTROL_KEY
        sync: false


  - type: worker
    name: electronic-brain-v12-render-monitor
    runtime: python
    rootDir: .
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r brain_v12/requirements.txt
    startCommand: python -m brain_v12.render_monitor_worker
    autoDeploy: true
    envVars:
      - key: RENDER_LOG_POLL_SECONDS
        value: "60"
      - key: RENDER_SERVICE_ID
        value: "srv-dapmmp0473hc73c9ceog"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false

  - type: web
    name: brain-v7-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r brain_v7/requirements.txt
    startCommand: uvicorn brain_v7.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BRAIN_API_AUTH
        value: "true"
      - key: BRAIN_CODE_WRITE_ENABLED
        value: "false"
      - key: BRAIN_CODE_GITHUB_PUBLISH_ENABLED
        value: "false"
      - key: BRAIN_CODE_ROOT
        value: "/app"
      - key: BRAIN_API_KEY
        sync: false
      - key: BRAIN_API_SCOPES
        value: "brain:read,code:read,code:preview,code:verify,code:checkpoint,code:restore"
      - key: BRAIN_GITHUB_REPOSITORY
        value: "omarenserat1980/MySimpleProject"
      - key: BRAIN_GITHUB_BRANCH
        value: "main"
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: BRAIN_REMOTE_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: brain-v7-core
    runtime: docker
    dockerfilePath: ./brain_v7/Dockerfile.core
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BRAIN_SLEEP_SECONDS
        value: "60"
      - key: STOP_BRAIN
        value: "0"
      - key: BRAIN_GITHUB_REPOSITORY
        value: "omarenserat1980/MySimpleProject"
      - key: BRAIN_GITHUB_BRANCH
        value: "main"
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: BRAIN_REMOTE_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: brain-v7-autonomous
    runtime: docker
    dockerfilePath: ./brain_v7/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BRAIN_SLEEP_SECONDS
        value: "60"
      - key: FACTORY_INTERVAL_SECONDS
        value: "21600"
      - key: FACTORY_ALLOW_PRODUCTION
        value: "1"
      - key: FACTORY_ALLOW_YOUTUBE_PUBLISH
        value: "1"
      - key: STOP_BRAIN
        value: "0"
      # Configure these as Render Secrets/Environment Variables before enabling production.
      - key: BRAIN_GITHUB_REPOSITORY
        value: "omarenserat1980/MySimpleProject"
      - key: BRAIN_GITHUB_BRANCH
        value: "main"
      - key: GITHUB_TOKEN
        sync: false
      - key: FACTORY_TOPICS_JSON
        sync: false
      - key: MEDIA_RENDER_URL
        sync: false
      - key: MEDIA_RENDER_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_PRIVACY
        value: "public"
      - key: FACTORY_DURATION_SECONDS
        value: "60"
      - key: FACTORY_MIN_QUALITY
        value: "0.82"
