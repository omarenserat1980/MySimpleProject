services:
  - type: web
    name: electronic-brain-v12
    runtime: python
    rootDir: brain_v12
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health


  - type: worker
    name: brain-v7-core
    runtime: docker
    dockerfilePath: ./brain_v7/Dockerfile.core
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BRAIN_SLEEP_SECONDS
        value: "60"
      - key: STOP_BRAIN
        value: "0"
      - key: BRAIN_GITHUB_REPOSITORY
        value: "omarenserat1980/MySimpleProject"
      - key: BRAIN_GITHUB_BRANCH
        value: "main"
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: BRAIN_REMOTE_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: brain-v7-autonomous
    runtime: docker
    dockerfilePath: ./brain_v7/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BRAIN_SLEEP_SECONDS
        value: "60"
      - key: FACTORY_INTERVAL_SECONDS
        value: "21600"
      - key: FACTORY_ALLOW_PRODUCTION
        value: "1"
      - key: FACTORY_ALLOW_YOUTUBE_PUBLISH
        value: "1"
      - key: STOP_BRAIN
        value: "0"
      # Configure these as Render Secrets/Environment Variables before enabling production.
      - key: BRAIN_GITHUB_REPOSITORY
        value: "omarenserat1980/MySimpleProject"
      - key: BRAIN_GITHUB_BRANCH
        value: "main"
      - key: GITHUB_TOKEN
        sync: false
      - key: FACTORY_TOPICS_JSON
        sync: false
      - key: MEDIA_RENDER_URL
        sync: false
      - key: MEDIA_RENDER_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_PRIVACY
        value: "public"
      - key: FACTORY_DURATION_SECONDS
        value: "60"
      - key: FACTORY_MIN_QUALITY
        value: "0.82"
