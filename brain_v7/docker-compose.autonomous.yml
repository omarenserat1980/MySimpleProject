# Compatibility compose file: the service runs the canonical Brain V12 API.
services:
  brain-worker:
    build:
      context: ..
      dockerfile: brain_v7/Dockerfile
    container_name: electronic-brain-v12-compat
    restart: unless-stopped
    environment:
      PORT: "8012"
    ports:
      - "8012:8012"
    volumes:
      - brain_state:/app/runtime
    command: ["python", "-m", "brain_v12.app"]

volumes:
  brain_state:
