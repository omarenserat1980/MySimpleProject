<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN Code Hub</title>
<style>:root{--bg:#07101b;--p:#0d1827;--p2:#111f31;--line:#21364d;--t:#edf6ff;--m:#8fa6bc;--a:#55d6ff;--g:#43e0a1;--r:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#153451,#050b13 55%);color:var(--t);font-family:system-ui,sans-serif}button,input,textarea{font:inherit}button{background:#14283d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--a)}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{border-left:1px solid var(--line);padding:16px;background:#07111ddd}.brand b{font-size:22px}.muted{color:var(--m);font-size:12px}.repo{padding:12px;margin:12px 0;background:#0b1725;border:1px solid var(--line);border-radius:13px}.repos{display:grid;gap:7px;max-height:52vh;overflow:auto}.repoBtn{width:100%;text-align:right}.main{padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab.active{border-color:var(--a);box-shadow:0 0 14px #55d6ff22}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.card{background:linear-gradient(145deg,#0d1928,#09131f);border:1px solid var(--line);border-radius:17px;padding:15px}.list{display:grid;gap:7px;max-height:58vh;overflow:auto}.item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#08131f;cursor:pointer}.item:hover{border-color:#42617c}.code{width:100%;min-height:520px;background:#050b12;color:#dff6ff;border:1px solid var(--line);border-radius:12px;padding:14px;direction:ltr;text-align:left;font-family:ui-monospace,monospace;resize:vertical}.hidden{display:none}.stat{display:inline-block;padding:5px 9px;border-radius:999px;background:#0a1d2b;color:var(--m);font-size:11px;margin:3px}.success{color:var(--g)}.error{color:var(--r)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-left:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><aside class="side"><div class="brand">🧠 <b>BRAIN Code Hub</b><div class="muted">GitHub workspace داخل Electronic Brain</div></div><div class="repo"><div class="muted">المستودع الحالي</div><b id="current">جارٍ التحميل...</b></div><button onclick="loadRepos()">🔄 تحديث المستودعات</button><div id="repos" class="repos"></div></aside>
<main class="main"><div class="top"><div><h1>🧠 BRAIN Code Hub</h1><div style="display:flex;gap:7px;align-items:center;margin-top:8px"><input id="controlKey" type="password" placeholder="BRAIN_CONTROL_KEY للعمليات الكتابية" style="padding:8px;background:#07111d;color:#fff;border:1px solid var(--line);border-radius:9px;min-width:280px"></div><div id="status" class="muted">اتصال GitHub...</div></div><div><button onclick="location.href='/'">← العقل</button></div></div>
<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px"><button onclick="createRepo()">➕ مستودع</button><button onclick="createFile()">📄 ملف</button><button onclick="searchCode()">🔎 بحث</button><button onclick="deleteCurrentFile()">🗑️ حذف</button><button onclick="createBranch()">🌿 فرع</button><button onclick="createIssue()">🐛 قضية</button><button onclick="createPR()">🔀 Pull Request</button><button onclick="compareBranches()">📊 مقارنة</button></div><div class="tabs"><button class="tab active" onclick="show('files',this)">📁 الملفات</button><button class="tab" onclick="show('commits',this)">🧾 Commits</button><button class="tab" onclick="show('branches',this)">🌿 Branches</button><button class="tab" onclick="show('issues',this)">🐛 Issues</button><button class="tab" onclick="show('actions',this)">⚙️ Actions</button></div>
<section id="files"><div class="grid"><div class="card"><h3>📁 شجرة المستودع</h3><div id="tree" class="list"></div></div><div class="card"><h3 id="fileTitle">اختر ملفًا</h3><textarea id="code" class="code" readonly></textarea><div style="margin-top:8px"><button onclick="saveFile()">💾 حفظ Commit</button><input id="message" value="brain: update from BRAIN Code Hub" style="padding:9px;background:#07111d;color:#fff;border:1px solid var(--line);border-radius:9px;width:60%"></div></div></div></section>
<section id="commits" class="hidden card"><h3>🧾 Commits</h3><div id="commitsList" class="list"></div></section>
<section id="branches" class="hidden card"><h3>🌿 Branches</h3><div id="branchesList" class="list"></div><div id="branchResult" class="muted"></div></section>
<section id="issues" class="hidden card"><h3>🐛 Issues</h3><div id="issuesList" class="list"></div><div id="pullsList" class="list" style="margin-top:12px"></div></section>
<section id="actions" class="hidden card"><h3>⚙️ GitHub Actions</h3><div id="actionsList" class="list"></div></section></main></div>
<script>
let selected={owner:'',repo:'',branch:'main'},sha='',currentPath='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path){const r=await fetch(path,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.detail||'API_ERROR');return j}
async function post(path,body){const headers={'Content-Type':'application/json'};const key=$('controlKey')?.value?.trim();if(key)headers['X-Brain-Control-Key']=key;const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.detail||j.message||'API_ERROR');return j}
const repoBody=()=>({owner:selected.owner,repo:selected.repo});
function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='commits')loadCommits();if(id==='branches')loadBranches();if(id==='issues')loadIssues();if(id==='actions')loadActions()}
async function init(){try{const c=await api('/api/brain-hub/config');selected.repo=c.github.repository.split('/')[1];selected.owner=c.github.repository.split('/')[0];selected.branch=c.github.branch||'main';$('current').textContent=c.github.repository;$('status').textContent=c.github.configured?'🟢 GitHub متصل':'🟡 يحتاج BRAIN_GITHUB_TOKEN';await loadRepos();await loadTree()}catch(e){$('status').textContent='🔴 '+e.message}}
async function loadRepos(){try{const j=await api('/api/brain-hub/repositories');$('repos').innerHTML=j.repositories.map(x=>'<button class="repoBtn" onclick="selectRepo('+JSON.stringify(x.full_name)+','+JSON.stringify(x.default_branch)+')">📦 '+esc(x.full_name)+'<br><span class="muted">'+esc(x.description)+'</span></button>').join('')}catch(e){$('repos').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function selectRepo(full,branch){[selected.owner,selected.repo]=full.split('/');selected.branch=branch||'main';$('current').textContent=full;loadTree();loadBranches()}
async function loadTree(path=''){currentPath=path;try{const j=await api('/api/brain-hub/tree?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo)+'&branch='+encodeURIComponent(selected.branch)+'&path='+encodeURIComponent(path));$('tree').innerHTML=(path?'<button onclick="loadTree('+JSON.stringify(path.split('/').slice(0,-1).join('/'))+')">⬆️ مجلد أعلى</button>':'')+j.items.map(x=>'<div class="item" onclick="'+(x.type==='dir'?'loadTree('+JSON.stringify(x.path)+')':'openFile('+JSON.stringify(x.path)+')')+'">'+(x.type==='dir'?'📁':'📄')+' '+esc(x.name)+' <span class="muted">'+x.type+'</span></div>').join('')}catch(e){$('tree').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function openFile(path){try{const j=await api('/api/brain-hub/file?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo)+'&branch='+encodeURIComponent(selected.branch)+'&path='+encodeURIComponent(path));currentPath=path;sha=j.sha;$('fileTitle').textContent='📄 '+path;$('code').value=j.content;$('code').readOnly=false}catch(e){$('status').textContent='🔴 '+e.message}}
async function saveFile(){if(!currentPath)return;try{const headers={'Content-Type':'application/json'};const key=$('controlKey')?.value?.trim();if(key)headers['X-Brain-Control-Key']=key;const r=await fetch('/api/quick-editor/write',{method:'POST',headers,body:JSON.stringify({path:currentPath,content:$('code').value,branch:selected.branch,commit_message:$('message').value,expected_sha:sha,run_tests:true})});const j=await r.json();if(!r.ok)throw Error(j.detail||'SAVE_FAILED');$('status').textContent='🟢 تم إنشاء Commit: '+(j.commit_sha||'ok');await loadTree()}catch(e){$('status').textContent='🔴 '+e.message}}
async function loadCommits(){const j=await api('/api/brain-hub/commits?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo)+'&branch='+encodeURIComponent(selected.branch));$('commitsList').innerHTML=j.commits.map(x=>'<div class="item"><b>'+esc(x.message)+'</b><div class="muted">'+esc(x.author||'')+' · '+esc(x.date||'')+'</div><span class="stat">'+esc(x.sha.slice(0,8))+'</span></div>').join('')}
async function loadBranches(){const j=await api('/api/brain-hub/branches?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo));$('branchesList').innerHTML=j.branches.map(x=>'<div class="item" onclick="selectBranch('+JSON.stringify(x.name)+')">🌿 <b>'+esc(x.name)+'</b> <span class="stat">'+esc(x.sha.slice(0,8))+'</span> '+(x.protected?'🔒':'')+'</div>').join('')}
function selectBranch(name){selected.branch=name;$('status').textContent='🌿 الفرع: '+name;loadTree();loadCommits()}
async function createFile(){const path=prompt('مسار الملف الجديد:');if(!path)return;const content=prompt('محتوى الملف الأولي:','')??'';try{const j=await post('/api/brain-hub/file',{...repoBody(),path,content,message:'brain: create file from Code Hub',branch:selected.branch});$('status').textContent='🟢 تم إنشاء الملف '+path;await loadTree()}catch(e){$('status').textContent='🔴 '+e.message'}}
async function deleteCurrentFile(){if(!currentPath||!sha)return;if(!confirm('حذف '+currentPath+'؟'))return;try{const headers={};const key=$('controlKey')?.value?.trim();if(key)headers['X-Brain-Control-Key']=key;const r=await fetch('/api/brain-hub/file?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo)+'&path='+encodeURIComponent(currentPath)+'&branch='+encodeURIComponent(selected.branch)+'&sha='+encodeURIComponent(sha),{method:'DELETE',headers});const j=await r.json();if(!r.ok)throw Error(j.detail||'DELETE_FAILED');$('status').textContent='🟢 تم حذف '+currentPath;currentPath='';sha='';$('code').value='';$('fileTitle').textContent='اختر ملفًا';await loadTree()}catch(e){$('status').textContent='🔴 '+e.message}}
async function searchCode(){const q=prompt('ابحث داخل الكود:');if(!q)return;try{const j=await post('/api/brain-hub/search',{...repoBody(),query:q,branch:selected.branch});$('status').textContent='🔎 '+j.results.length+' نتيجة';$('tree').innerHTML=j.results.map(x=>'<div class="item" onclick="openFile('+JSON.stringify(x.path)+')">🔎 '+esc(x.path)+'</div>').join('')}catch(e){$('status').textContent='🔴 '+e.message}}
async function createRepo(){const name=prompt('اسم المستودع الجديد:');if(!name)return;const description=prompt('الوصف:')||'';const priv=confirm('مستودع خاص؟');try{const j=await post('/api/brain-hub/repositories',{name,description,private:priv,auto_init:true});$('status').textContent='🟢 تم إنشاء '+j.repository.full_name;await loadRepos()}catch(e){$('status').textContent='🔴 '+e.message}}
async function createBranch(){const name=prompt('اسم الفرع الجديد:');if(!name)return;try{const j=await post('/api/brain-hub/branches',{...repoBody(),name,from_ref:selected.branch});$('status').textContent='🟢 تم إنشاء الفرع '+j.branch;await loadBranches()}catch(e){$('status').textContent='🔴 '+e.message}}
async function createIssue(){const title=prompt('عنوان القضية:');if(!title)return;const body=prompt('وصف القضية:')||'';try{const j=await post('/api/brain-hub/issues',{...repoBody(),title,body,labels:[]});$('status').textContent='🟢 تم إنشاء Issue #'+j.issue.number;await loadIssues()}catch(e){$('status').textContent='🔴 '+e.message}}
async function createPR(){const title=prompt('عنوان Pull Request:');if(!title)return;const head=prompt('فرع المصدر:',selected.branch);if(!head)return;const base=prompt('فرع الهدف:','main');if(!base)return;const body=prompt('الوصف:')||'';try{const j=await post('/api/brain-hub/pulls',{...repoBody(),title,head,base,body});$('status').textContent='🟢 تم إنشاء PR #'+j.pull.number;await loadPulls()}catch(e){$('status').textContent='🔴 '+e.message}}
async function loadPulls(){try{const j=await api('/api/brain-hub/pulls?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo));$('pullsList').innerHTML='<h3>🔀 Pull Requests</h3>'+j.pulls.map(x=>'<div class="item">🔀 <b>#'+x.number+' '+esc(x.title)+'</b><div class="muted">'+esc(x.head||'')+' → '+esc(x.base||'')+' · '+esc(x.state)+'</div><button onclick="event.stopPropagation();mergePR('+x.number+')">✅ دمج</button></div>').join('')}catch(e){$('pullsList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function mergePR(number){if(!confirm('دمج Pull Request #'+number+'؟'))return;const method=prompt('طريقة الدمج: merge / squash / rebase','squash')||'squash';try{const j=await post('/api/brain-hub/pulls/'+number+'/merge',{...repoBody(),method});$('status').textContent=j.merged?'🟢 تم الدمج #'+number:'🟡 '+(j.message||'لم يتم الدمج');await loadPulls()}catch(e){$('status').textContent='🔴 '+e.message}}
async function compareBranches(){const base=prompt('الفرع الأساسي:', 'main');if(!base)return;const head=prompt('الفرع المقارن:',selected.branch);if(!head)return;try{const j=await api('/api/brain-hub/compare?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo)+'&base='+encodeURIComponent(base)+'&head='+encodeURIComponent(head));$('status').textContent='📊 '+j.status+' · ahead '+j.ahead_by+' · behind '+j.behind_by+' · files '+j.files.length;show('branches',document.querySelectorAll('.tab')[2]);$('branchResult').innerHTML=j.files.map(f=>'<div class="item">'+esc(f.filename)+' <span class="success">+'+f.additions+'</span> <span class="error">-'+f.deletions+'</span></div>').join('')}catch(e){$('status').textContent='🔴 '+e.message}}
async function loadIssues(){const j=await api('/api/brain-hub/issues?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo));$('issuesList').innerHTML=j.issues.map(x=>'<div class="item">🐛 <b>#'+x.number+' '+esc(x.title)+'</b><div class="muted">'+esc(x.state)+' · '+esc(x.user||'')+'</div></div>').join('');await loadPulls()}
async function loadActions(){const j=await api('/api/brain-hub/actions?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo));$('actionsList').innerHTML=j.runs.map(x=>'<div class="item">⚙️ <b>'+esc(x.name)+'</b><div class="muted">'+esc(x.status)+' / '+esc(x.conclusion||'running')+' · '+esc(x.branch||'')+'</div><span class="stat">'+esc((x.sha||'').slice(0,8))+'</span> <button onclick="event.stopPropagation();showJobs('+x.id)">🧩</button> <button onclick="event.stopPropagation();actionRun('+x.id+',\'rerun\')">🔁</button> <button onclick="event.stopPropagation();actionRun('+x.id+',\'cancel\')">⏹️</button></div>').join('')}
async function showJobs(id){try{const j=await api('/api/brain-hub/actions/'+id+'/jobs?owner='+encodeURIComponent(selected.owner)+'&repo='+encodeURIComponent(selected.repo));$('status').textContent='⚙️ '+j.jobs.length+' Jobs في التشغيل #'+id;$('actionsList').innerHTML=j.jobs.map(x=>'<div class="item">🧩 '+esc(x.name)+' · '+esc(x.status)+' / '+esc(x.conclusion||'running')+'</div>').join('')}catch(e){$('status').textContent='🔴 '+e.message}}
async function actionRun(id,action){try{const j=await post('/api/brain-hub/actions/'+id+'/'+action,repoBody());$('status').textContent='🟢 '+j.status;setTimeout(loadActions,1200)}catch(e){$('status').textContent='🔴 '+e.message}}
init();
</script></body></html>
