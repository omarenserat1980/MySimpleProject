<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN Movie Summary Factory</title><style>
body{margin:0;background:#050b14;color:#eef7ff;font-family:system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.hero,.card{background:#0b1625;border:1px solid #20364d;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 8px}.muted{color:#91a5bc}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.node{padding:14px;background:#07111d;border:1px solid #1b3046;border-radius:14px}.node b{display:block;margin-bottom:5px}.node span{color:#91a5bc;font-size:12px}.timeline{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.beat{min-width:130px;padding:12px;background:#07111d;border:1px solid #1b3046;border-radius:12px}.beat.live{border-color:#55d6ff;box-shadow:0 0 18px #55d6ff22}.bar{height:8px;background:#07111d;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#55d6ff,#a78bfa)}button,input,select{font:inherit}input,select{width:100%;box-sizing:border-box;background:#07111d;color:#fff;border:1px solid #20364d;border-radius:12px;padding:12px;margin:6px 0 12px}button{background:#14547a;color:#fff;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}.status{margin-top:12px;padding:12px;border-radius:12px;background:#07111d;border:1px solid #1b3046}.ok{color:#43e0a1}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<div class="hero"><h1>🎬 BRAIN — Movie Summary Factory</h1><div class="muted">نفس محرك الفيلم السينمائي، لكن مخصص لملخصات الأفلام.</div></div>
<div class="card"><label>اسم الفيلم</label><input id="title" placeholder="مثال: اكتب اسم الفيلم هنا"><label>المدة المستهدفة</label><select id="mins"><option>8</option><option selected>12</option><option>15</option><option>20</option><option>30</option></select><button onclick="plan()">ابنِ الخطة السينمائية</button><div id="status" class="status">جاهز.</div></div>
<div class="card"><h2>Pipeline</h2><div class="grid" id="grid"></div></div>
<div class="card"><h2>Timeline</h2><div class="timeline" id="timeline"></div><div class="bar"><div class="fill" id="fill"></div></div></div>
</div><script>
const stages=[['01','Story Extraction','استخراج الأحداث المحورية'],['02','Character Bible','تثبيت الشخصيات والاستمرارية'],['03','Event Graph','سبب ← حدث ← نتيجة'],['04','Cinematic Beats','تحويل السرد إلى beats'],['05','Shot Planner','تخطيط اللقطات والحركة'],['06','Audio Timeline','صوت + موسيقى + SFX'],['07','Continuity QC','فحص القصة والصورة والصوت والمدة']];
function plan(){const t=document.getElementById('title').value.trim()||'فيلم غير محدد';const m=+document.getElementById('mins').value;document.getElementById('grid').innerHTML=stages.map(s=>'<div class="node"><b>'+s[0]+' — '+s[1]+'</b><span>'+s[2]+'</span></div>').join('');const beats=['Hook','Setup','Inciting Event','Escalation','Midpoint','Crisis','Climax','Resolution'];document.getElementById('timeline').innerHTML=beats.map((b,i)=>'<div class="beat" id="b'+i+'"><b>'+b+'</b><br><span class="muted">'+Math.max(20,Math.round(m*60/beats.length))+'s</span></div>').join('');document.getElementById('status').innerHTML='<span class="ok">✓</span> تم إنشاء مخطط Movie Summary لـ <b>'+t.replace(/</g,'&lt;')+'</b> — '+m+' دقائق. هذه واجهة التخطيط؛ الإنتاج الفعلي يستخدم الـpipeline المركزي في Brain.';let i=0;clearInterval(window.tm);window.tm=setInterval(()=>{document.querySelectorAll('.beat').forEach(x=>x.classList.remove('live'));const el=document.getElementById('b'+i);if(el)el.classList.add('live');document.getElementById('fill').style.width=((i+1)/beats.length*100)+'%';i=(i+1)%beats.length},900);}</script></body></html>
