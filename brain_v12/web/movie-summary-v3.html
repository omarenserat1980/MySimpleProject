<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN — Cinematic V3 Pro</title><style>*{box-sizing:border-box}body{margin:0;background:#03060b;color:#eef5ff;font-family:system-ui,Tahoma,Arial}.wrap{max-width:1180px;margin:auto;padding:22px}.hero,.card{background:#091321;border:1px solid #1d3047;border-radius:20px;padding:22px;margin-bottom:14px}.hero h1{font-size:clamp(32px,6vw,68px);margin:0}.muted{color:#92a5bd}.row{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}input,select,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #2a425d}input,select{background:#050b14;color:#fff}button{background:#dce8ff;color:#07101c;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.node{padding:13px;background:#050b14;border:1px solid #1c3046;border-radius:12px}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shot{padding:11px;background:#070e18;border-radius:10px;border:1px solid #1c3046}.pass{color:#43e0a1}.fail{color:#ff758f}@media(max-width:750px){.row,.grid,.shots{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section class="hero"><div class="muted">BRAIN / MOVIE SUMMARY FACTORY</div><h1>CINEMATIC V3 PRO</h1><p class="muted">محرك إنتاج ملخص سينمائي: لقطات متعددة، كاميرا، صوت، موسيقى، SFX، ترجمة واستمرارية.</p></section><section class="card"><div class="row"><input id="title" value="Interstellar"><select id="mins"><option>8</option><option selected>12</option><option>15</option><option>20</option><option>30</option></select><button onclick="build()">BUILD V3</button></div><div id="status" class="muted" style="margin-top:12px">جاهز.</div></section><section class="card"><h2>Production Pipeline</h2><div id="beats" class="grid"></div></section><section class="card"><h2>Shot Planner</h2><div id="shots" class="shots"></div></section><section class="card"><h2>Quality Gates</h2><div id="qc"></div></section></main><script>
async function build(){status.textContent='جاري بناء V3...';try{let r=await fetch('/api/movie-summary/v3/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,target_minutes:+mins.value,language:'ar'})});let d=await r.json();if(!d.ok){status.textContent=d.error||'فشل';return}let p=d.plan,q=d.qc;beats.innerHTML=p.beats.map(b=>'<div class="node"><b>'+b.label+'</b><div class="muted">'+b.rhythm+'</div></div>').join('');shots.innerHTML=p.shots.slice(0,32).map(s=>'<div class="shot"><b>'+s.id+'</b><br>'+s.shot_type+'<br><span class="muted">'+s.camera+' • '+s.transition+'</span></div>').join('');qc.innerHTML=Object.entries(q.checks).map(([k,v])=>'<div class="'+(v?'pass':'fail')+'">'+(v?'✓ PASS':'✗ REJECT')+' — '+k+'</div>').join('');status.innerHTML='<b class="pass">V3 PLAN READY</b> — '+q.shot_count+' shots / '+q.beat_count+' beats';}catch(e){status.textContent='API غير متاح: '+e.message}}</script></body></html>
