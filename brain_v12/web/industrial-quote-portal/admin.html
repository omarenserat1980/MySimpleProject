<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial Quote Portal · Admin</title>
<style>body{margin:0;background:#07111f;color:#edf5ff;font-family:system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#0d1b2e;border:1px solid #203550;border-radius:18px;padding:18px;margin-top:18px}input{background:#081525;color:#fff;border:1px solid #29435e;border-radius:10px;padding:10px;width:320px}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #203550;vertical-align:top}small{color:#9eb0c6}@media(max-width:700px){input{width:100%}.bar{align-items:stretch;flex-direction:column}.card{overflow:auto}}</style></head>
<body><main class="wrap"><div class="bar"><h1>Quote Operations</h1><span>Protected admin view</span></div><div class="card"><input id="key" type="password" placeholder="BRAIN_CONTROL_KEY"><button id="load">Load inquiries</button><div id="msg"></div></div><div class="card"><div id="count">No data loaded.</div><table><thead><tr><th>ID</th><th>Company</th><th>Contact</th><th>Need</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>const msg=document.querySelector("#msg"),rows=document.querySelector("#rows"),count=document.querySelector("#count");document.querySelector("#load").onclick=async()=>{msg.textContent="Loading…";try{const r=await fetch("/api/industrial-quotes/admin/inquiries",{headers:{"X-BRAIN-CONTROL-KEY":document.querySelector("#key").value}});const d=await r.json();if(!r.ok)throw Error(d.detail||"FAILED");count.textContent=d.count+" inquiries";rows.innerHTML=d.items.map(x=>`<tr><td>${x.id}</td><td>${x.company}</td><td>${x.contact_name}<br><small>${x.email}</small></td><td>${x.category}<br>${x.product||""}<br>${x.message}</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join("");msg.textContent="Loaded."}catch(e){msg.textContent="Error: "+e.message}};</script></body></html>
