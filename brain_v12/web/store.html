<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalFlow — المتجر الرقمي</title><style>:root{--bg:#08101d;--p:#101a2b;--p2:#142238;--l:#263852;--t:#eef5ff;--m:#9fb0c8;--a:#6d5dfc;--ok:#39d98a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Arial}main{max-width:980px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0}.brand p,.status,.desc{color:var(--m)}button{font:inherit;border:0;border-radius:12px;padding:11px 15px;cursor:pointer;background:var(--a);color:#fff;font-weight:700}.secondary{background:var(--p2);border:1px solid var(--l)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:17px}.desc{min-height:50px;line-height:1.55}.price{font-size:20px;font-weight:800;margin:12px 0}.cart{margin-top:18px}.line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--l);padding:10px 0}.total{font-size:20px;font-weight:800;margin:14px 0}.checkout{display:none;margin-top:18px}.checkout input{width:100%;padding:13px;margin:6px 0;background:#0b1525;color:#fff;border:1px solid var(--l);border-radius:11px;font:inherit}.notice{padding:12px;border-radius:12px;background:#1b2334;color:var(--m);line-height:1.6;margin:10px 0}.ok{color:var(--ok)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="top"><div class="brand"><h1>🧠 DigitalFlow</h1><p>متجر المنتجات الرقمية</p></div><button id="cartBtn" class="secondary" type="button">السلة (0)</button></div><div id="brainStatus" class="status">فحص اتصال البرين…</div><section id="products" class="grid"></section><section class="card cart"><h2>🛒 السلة</h2><div id="cartLines"><div class="notice">السلة فارغة.</div></div><div id="total" class="total">الإجمالي: 0 JOD</div><button id="checkoutBtn" type="button" disabled>متابعة الطلب</button></section><section id="checkout" class="card checkout"><h2>بيانات الطلب</h2><div class="notice">الدفع الإلكتروني لم يُربط بعد. هذه الخطوة تجهّز الطلب فقط؛ لا تعتبر العملية مدفوعة ولا تُسلّم المنتج قبل وجود إثبات دفع.</div><input id="name" placeholder="الاسم"><input id="contact" placeholder="البريد أو وسيلة التواصل"><button id="place" type="button">إنشاء طلب</button><div id="result"></div></section></main><script>const P=[["p1","حزمة قوالب المحتوى",5,"قوالب رقمية جاهزة للاستخدام والتعديل."],["p2","حزمة Prompts للذكاء الاصطناعي",7,"أوامر منظمة لمهام المحتوى والإنتاج."],["p3","قوالب السوشيال ميديا",6,"قوالب عملية للمنشورات والحملات."],["p4","دليل الأتمتة الرقمية",9,"دليل عملي لسير العمل والأتمتة."],["p5","حزمة إنتاج الفيديو",8,"قوالب وخطط لإنتاج الفيديوهات القصيرة."],["p6","حزمة الأعمال الرقمية",12,"ملفات وأدوات لتنظيم العمل والمشاريع."]];let cart=[];const product=id=>P.find(x=>x[0]===id);function draw(){products.innerHTML=P.map(p=>'<article class="card"><h3>'+p[1]+'</h3><div class="desc">'+p[3]+'</div><div class="price">'+p[2]+' JOD</div><button type="button" data-add="'+p[0]+'">أضف للسلة</button></article>').join("");document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(!cart.includes(b.dataset.add))cart.push(b.dataset.add);drawCart()})}function drawCart(){const items=cart.map(product);cartBtn.textContent="السلة ("+items.length+")";checkoutBtn.disabled=!items.length;if(!items.length){cartLines.innerHTML='<div class="notice">السلة فارغة.</div>';total.textContent="الإجمالي: 0 JOD";return}cartLines.innerHTML=items.map(p=>'<div class="line"><span>'+p[1]+'</span><span>'+p[2]+' JOD <button class="secondary" type="button" data-remove="'+p[0]+'">حذف</button></span></div>').join("");document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x!==b.dataset.remove);drawCart()});total.textContent="الإجمالي: "+items.reduce((s,p)=>s+p[2],0)+" JOD"}async function brain(){try{const r=await fetch("/health",{cache:"no-store"}),d=await r.json();brainStatus.textContent=d.ok?"● اتصال البرين متاح — V12":"● البرين غير متاح حالياً"}catch(e){brainStatus.textContent="● المتجر يعمل، لكن تعذر التحقق من البرين."}}checkoutBtn.onclick=()=>checkout.style.display="block";cartBtn.onclick=()=>document.querySelector(".cart").scrollIntoView({behavior:"smooth"});place.onclick=()=>{if(!name.value.trim()||!contact.value.trim()){result.innerHTML='<div class="notice">أدخل الاسم ووسيلة التواصل.</div>';return}const id="DF-"+Date.now().toString(36).toUpperCase();result.innerHTML='<div class="notice ok">تم تجهيز الطلب '+id+'. لم يتم تسجيل دفع أو تسليم منتج. بانتظار ربط بوابة الدفع والتحقق.</div>'};draw();drawCart();brain();</script></body></html>
