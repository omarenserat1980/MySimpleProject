<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAIN Quick Editor</title>
<style>
:root{--bg:#07101b;--panel:#0d1928;--line:#20364c;--text:#eef8ff;--muted:#8da4ba;--accent:#55d6ff;--ok:#43e0a1;--bad:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#15324a,#07101b 55%);color:var(--text);font-family:system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);background:#07101bdd;position:sticky;top:0;z-index:5}.top h1{font-size:18px;margin:0 12px 0 0}.top input{background:#091522;border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px;min-width:280px}.top button,.actions button{background:#11263a;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px}.primary{background:linear-gradient(135deg,#147da6,#3565c4)!important;border:0!important}.status{margin-right:auto;color:var(--muted);font-size:12px}.main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px}.editorCard,.sideCard{background:#0a1624dd;border:1px solid var(--line);border-radius:15px;overflow:hidden}.editorHead{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line)}.editorHead span{color:var(--muted);font-size:12px}.editor{width:100%;height:calc(100vh - 150px);min-height:500px;resize:none;background:#050b12;color:#d9f6ff;border:0;outline:0;padding:16px;direction:ltr;text-align:left;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.side{padding:12px}.sideCard{padding:13px;margin-bottom:10px}.sideCard h3{font-size:13px;margin:0 0 9px}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff0a;font-size:12px}.kv span{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;direction:ltr;text-align:left}.good{color:var(--ok)}.bad{color:var(--bad)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}.note{color:var(--muted);font-size:11px;line-height:1.7}@media(max-width:850px){.main{grid-template-columns:1fr}.editor{height:60vh}.top{flex-wrap:wrap}.top input{min-width:0;flex:1}.status{width:100%;margin:0}}
</style></head>
<body><div class="app">
<header class="top"><b>🧠</b><h1>BRAIN Quick Editor</h1><input id="path" value="brain_v12/app.py" placeholder="مسار الملف"><input id="branch" value="main" style="max-width:110px"><button onclick="loadFile()">فتح</button><button onclick="validate()" >✓ تحقق</button><button class="primary" onclick="saveFile()">💾 حفظ GitHub</button><span id="status" class="status">جاهز</span></header>
<main class="main"><section class="editorCard"><div class="editorHead"><span id="fileLabel">brain_v12/app.py</span><span id="sha"></span></div><textarea id="editor" spellcheck="false" placeholder="افتح ملفًا من GitHub…"></textarea></section>
<aside class="side"><div class="sideCard"><h3>التحقق</h3><div id="validation">لم يتم التحقق بعد.</div></div>
<div class="sideCard"><h3>GitHub</h3><div class="kv"><span>المستودع</span><b>MySimpleProject</b></div><div class="kv"><span>الفرع</span><b id="branchLabel">main</b></div><div class="kv"><span>SHA</span><b id="shaSide">—</b></div></div>
<div class="sideCard"><h3>الإجراءات</h3><div class="actions"><button onclick="insertTab()">Tab</button><button onclick="formatJSON()">JSON</button><button onclick="openRaw()">Raw</button></div><p class="note">الحفظ البعيد يتطلب مفتاح التحكم الخاص بـ Brain. يتم التحقق من الكود قبل إرسال commit إلى GitHub، وGitHub Actions يتولى الاختبارات.</p></div>
<div class="sideCard"><h3>النتيجة</h3><pre id="result">—</pre></div></aside></main></div>
<script>
const $=id=>document.getElementById(id);
let currentSha="";
function setStatus(x,ok){$("status").textContent=x;$("status").style.color=ok?"var(--ok)":"var(--muted)"}
async function loadFile(){const path=$("path").value.trim(),branch=$("branch").value.trim()||"main";setStatus("جاري الفتح…");try{const r=await fetch("/api/quick-editor/read?path="+encodeURIComponent(path)+"&branch="+encodeURIComponent(branch));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.detail||d.error||"READ_FAILED");$("editor").value=d.content;currentSha=d.sha||"";$("sha").textContent=currentSha.slice(0,12);$("shaSide").textContent=currentSha.slice(0,12)||"—";$("branchLabel").textContent=branch;$("fileLabel").textContent=path;setStatus("تم الفتح",true);validate()}catch(e){setStatus("فشل الفتح: "+e.message);}}
async function validate(){const path=$("path").value.trim(),content=$("editor").value;try{const r=await fetch("/api/quick-editor/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,content})});const d=await r.json();$("validation").innerHTML=(d.ok?"<b class=good>✓ صالح</b>":"<b class=bad>✕ يحتاج إصلاح</b>")+"<pre>"+esc(JSON.stringify(d,null,2))+"</pre>";return d}catch(e){$("validation").textContent=e.message;return {ok:false}}}
async function saveFile(){const v=await validate();if(!v.ok)return;const path=$("path").value.trim(),branch=$("branch").value.trim()||"main";const msg=prompt("رسالة Commit","brain: quick editor update");if(!msg)return;setStatus("جاري الحفظ…");try{const r=await fetch("/api/quick-editor/write",{method:"POST",headers:{"Content-Type":"application/json","X-Brain-Control-Key":localStorage.getItem("brain_control_key")||""},body:JSON.stringify({path,branch,content:$("editor").value,commit_message:msg,expected_sha:currentSha,run_tests:true})});const d=await r.json();$("result").textContent=JSON.stringify(d,null,2);if(!r.ok||!d.ok)throw Error(d.detail||d.status||"WRITE_FAILED");currentSha=d.sha||currentSha;$("sha").textContent=currentSha.slice(0,12);$("shaSide").textContent=currentSha.slice(0,12);setStatus("تم Commit إلى GitHub ✓",true)}catch(e){setStatus("فشل الحفظ: "+e.message)}}
function insertTab(){const e=$("editor"),s=e.selectionStart;e.setRangeText("    ",s,e.selectionEnd,"end");e.focus()}
function formatJSON(){try{$("editor").value=JSON.stringify(JSON.parse($("editor").value),null,2);setStatus("تم تنسيق JSON",true)}catch(e){setStatus("المحتوى ليس JSON صالحًا")}}
function openRaw(){window.open("https://github.com/omarenserat1980/MySimpleProject/blob/"+encodeURIComponent($("branch").value||"main")+"/"+$("path").value,"_blank")}
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
$("editor").addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();insertTab()}if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();saveFile()}})
loadFile();
</script></body></html>
