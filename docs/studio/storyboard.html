<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN Storyboard</title><style>body{background:#080b12;color:#eee;font-family:system-ui;margin:0}header{padding:18px;border-bottom:1px solid #263044}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding:18px}.card{background:#111827;border:1px solid #2b3850;border-radius:14px;padding:14px}.shot{aspect-ratio:16/9;background:linear-gradient(135deg,#111827,#34445e);border-radius:10px;display:grid;place-items:center;color:#dbe5f5}.muted{color:#91a0b8}</style><header><b>🧠 BRAIN Storyboard</b><span class="muted">لوحة المشاهد الأصلية</span></header><main id="grid" class="grid"></main><script>const p=JSON.parse(localStorage.getItem("brain-studio-project")||'{"scenes":[]}');const g=document.querySelector("#grid");g.innerHTML=(p.scenes||[]).map((s,i)=>`<article class="card"><div class="shot">SHOT ${String(i+1).padStart(2,"0")}</div><h3>${s.title||"مشهد"}</h3><p class="muted">${s.description||"وصف المشهد غير مكتمل"}</p><small>${s.start||0}s → ${s.end||0}s</small></article>`).join("")||"<p>لا توجد مشاهد بعد.</p>";</script></main></html>
