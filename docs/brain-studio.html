<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN Studio</title><style>body{margin:0;background:#080b12;color:#eef;font-family:system-ui}header{padding:18px 24px;border-bottom:1px solid #263044}main{display:grid;grid-template-columns:280px 1fr 300px;min-height:calc(100vh - 70px)}aside,section{padding:20px;border-left:1px solid #20283a}button{background:#151d2e;color:#fff;border:1px solid #39445c;border-radius:10px;padding:10px;margin:5px;cursor:pointer}.stage{background:#111827;border:1px solid #303b52;min-height:520px;margin:20px;border-radius:16px;display:grid;place-items:center}.screen{width:min(82%,900px);aspect-ratio:16/9;background:linear-gradient(135deg,#111827,#263451);border-radius:10px;display:grid;place-items:center;font-size:28px}.row{padding:12px;border:1px solid #263044;border-radius:10px;margin:8px 0}.muted{color:#93a0b8}@media(max-width:900px){main{grid-template-columns:1fr}aside{border:0}}</style></head><body><header><strong>🧠 BRAIN Studio</strong> — مصنع الأفلام الأصلي</header><main><aside><h3>المشروع</h3><div class="row">الغرفة 13</div><div class="row">السيناريو</div><div class="row">الشخصيات</div><div class="row">المشاهد</div><div class="row">الصوت</div></aside><section><div class="stage"><div class="screen">مشهد 01 — المعاينة</div></div><div><button onclick="addScene()">+ مشهد</button><button onclick="render()">▶ رندر</button><button onclick="qc()">✓ فحص الجودة</button></div></section><aside><h3>خط الإنتاج</h3><div id="state">جاهز</div><div class="row">Story → Scenes → Audio → Render → QC</div><p class="muted">لا يصبح الفيلم قابلاً للبيع إلا بعد التحقق التجاري.</p></aside></main><script>const states=['STORY','SCENES','AUDIO','RENDER','QC','VERIFIED'];let i=0;function addScene(){document.getElementById('state').textContent='مشهد جديد مضاف';}function render(){i=Math.min(i+1,5);document.getElementById('state').textContent=states[i]+' — قيد التنفيذ';}function qc(){document.getElementById('state').textContent='QC: لا يوجد اعتماد تجاري حتى الآن';}</script></body></html>
