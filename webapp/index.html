<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json">
<title>Foras Ads</title>
<style>
body{font-family:Arial,sans-serif;max-width:620px;margin:auto;padding:18px;background:#f4f4f4;color:#111}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}h1{text-align:center}label{display:block;margin-top:14px;font-weight:bold}input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border-radius:10px;border:1px solid #ccc;font-size:16px}textarea{min-height:100px}button{border:0;background:#111;color:#fff;font-weight:bold;margin-top:18px}.secondary{background:#555}.status{margin-top:18px;padding:12px;border-radius:10px;background:#eee}.small{font-size:13px;color:#666}video{width:100%;margin-top:16px;border-radius:14px;display:none}.publish{display:none}
</style></head>
<body><div class="card">
<h1>🎬 Foras Ads</h1><p class="small">إنشاء إعلان فيديو من الهاتف</p>
<label>اسم المنتج</label><input id="product" value="مضخة مياه FORAS P100">
<label>السعر</label><input id="price" placeholder="مثال: 90 دينار">
<label>رقم التواصل</label><input id="contact" placeholder="واتساب / هاتف">
<label>صورة المنتج</label><input id="image" type="file" accept="image/*">
<label>نص الإعلان</label><textarea id="copy">حل عملي لضخ المياه. جودة واعتمادية للاستخدام اليومي.</textarea>
<button id="gen" onclick="generate()">🎬 إنشاء الفيديو</button>
<button class="secondary publish" id="pub" onclick="publish()">🚀 نشر على Facebook + YouTube</button>
<div id="status" class="status">جاهز.</div><video id="preview" controls playsinline></video>
</div>
<script>
let videoReady=false;
async function generate(){
 const image=document.getElementById('image').files[0];
 if(!image){document.getElementById('status').textContent='اختر صورة المنتج أولاً.';return;}
 const fd=new FormData();
 fd.append('image',image);fd.append('product',document.getElementById('product').value);fd.append('price',document.getElementById('price').value);fd.append('contact',document.getElementById('contact').value);fd.append('copy',document.getElementById('copy').value);
 document.getElementById('gen').disabled=true;document.getElementById('status').textContent='⏳ جاري إنشاء الفيديو...';
 try{const r=await fetch('/api/generate',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'حدث خطأ');
 const v=document.getElementById('preview');v.src=data.video+'?t='+Date.now();v.style.display='block';document.getElementById('pub').style.display='block';videoReady=true;document.getElementById('status').textContent='✅ تم إنشاء الفيديو. يمكنك معاينته الآن.';
 }catch(e){document.getElementById('status').textContent='❌ '+e.message;}finally{document.getElementById('gen').disabled=false;}
}
async function publish(){if(!videoReady)return;document.getElementById('status').textContent='🚀 النشر يحتاج إعداد حسابات Facebook وYouTube ومفاتيح OAuth على الخادم.';}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
